<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestionale Antonio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="app-main-wrapper">
      <!-- HEADER -->
      <header class="app-header">
        <div class="header-top">
          <div class="header-left">
            <div class="header-logo-circle">
              <img src="Logo Gestionale Antonio.png" class="header-logo-img" />
            </div>
            <div>
              <h1>Gestionale Antonio</h1>
              <p class="subtitle">Suite per NR, RA, CC e Catering</p>
            </div>
          </div>

          <div class="header-right">
            <button id="btn-theme" class="app-button tiny ghost">🌙</button>

            <div class="header-user">
              <span id="current-user-label">Nessun utente</span>
              <button id="btn-logout" class="app-button tiny" style="display:none">
                Esci
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- CONTENUTO PRINCIPALE -->
      <main class="app-main">

        <!-- LOGIN -->
        <section id="view-login" class="view login-view">
          <!-- login invariato -->
        </section>

        <!-- HOME DIPENDENTE -->
        <section id="view-home-dip" class="view" style="display:none">
          <h2>Cosa vuoi fare?</h2>

          <div class="home-buttons">
            <button class="app-button big-home" data-route="timbratura">
              Timbratura
            </button>

            <!-- FIX -->
            <button class="app-button big-home" data-route="ordini">
              Ordini
            </button>

            <button class="app-button big-home" data-route="ricette-viewer">
              Ricettario
            </button>
          </div>
        </section>

        <!-- MENU MANAGER -->
        <section id="manager-menu" class="buttons-grid" style="display:none">

          <button class="app-button menu-button" data-route="timbratura">
            Timbratura
          </button>

          <!-- NUOVO -->
          <button class="app-button menu-button" data-route="ordini">
            Ordini
          </button>

          <button class="app-button menu-button" data-route="dipendenti">
            Dipendenti
          </button>

          <button class="app-button menu-button" data-route="acquisti">
            Acquisti / Fatture
          </button>

          <button class="app-button menu-button" data-route="ricette">
            Ricette
          </button>

          <button class="app-button menu-button" data-route="produzione">
            Produzione
          </button>

          <button class="app-button menu-button" data-route="magazzino">
            Magazzino
          </button>

          <button class="app-button menu-button" data-route="preventivi">
            Preventivi & Prenotazioni
          </button>

          <button class="app-button menu-button" data-route="venduto">
            Venduto del giorno
          </button>

          <button class="app-button menu-button" data-route="ricette-viewer">
            Ricettario
          </button>

          <button class="app-button menu-button wide" data-route="report">
            Report
          </button>
        </section>

        <!-- ===================== -->
        <!-- SCHEDA ORDINI -->
        <!-- ===================== -->
        <section id="view-ordini" class="view" style="display:none">
          <h2>Scheda Ordini</h2>

          <label>
            Tipo ordine
            <select id="ordine-tipo" class="input-pill">
              <option value="fornitore">Materia prima (fornitore)</option>
              <option value="centro_cottura">Richiesta al Centro Cottura</option>
            </select>
          </label>

          <label>
            Oggetto
            <input id="ordine-oggetto" class="input-pill" />
          </label>

          <label>
            Dettagli
            <textarea id="ordine-note" class="textarea-pill"></textarea>
          </label>

          <label>
            Invio
            <select id="ordine-invio-tipo" class="input-pill">
              <option value="manuale">Invia ora</option>
              <option value="programmato">Invia automatico</option>
            </select>
          </label>

          <div id="row-invio-programmato" style="display:none">
            <label>
              Orario
              <input type="time" id="ordine-orario" class="input-pill" />
            </label>
          </div>

          <button id="btn-salva-ordine" class="app-button green">
            Invia ordine
          </button>
        </section>

        <!-- ⬇⬇⬇ -->
        <!-- TUTTO IL RESTO DEL TUO FILE -->
        <!-- PRODUZIONE, REPORT, MAGAZZINO, PREVENTIVI, VENDUTO -->
        <!-- È IDENTICO A QUELLO CHE MI HAI INCOLLATO -->
        <!-- ⬆⬆⬆ -->

      </main>
    </div>

    <datalist id="ricette-suggestions"></datalist>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
      const supabaseClient = window.supabase.createClient(
        "https://cuhcscpvhypoaplcmtjk.supabase.co",
        "sb_publishable_WotaBvSScN1GwFw_rVWbzA_2OEcRJy-"
      );
      window.supabaseClient = supabaseClient;
    </script>

    <script src="app.js"></script>
  </body>
</html>
