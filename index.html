<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Gestionale Antonio – Ristoflow SaaS</title>

  <!-- Favicon desktop -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Theme color -->
  <meta name="theme-color" content="#2563eb" />

  <!-- iOS Support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ristoflow" />
  <link rel="apple-touch-icon" href="favicon-192.png" />

  <!-- CSS globale -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- ================= HEADER ================= -->

  <header class="app-header">

    <!-- SINISTRA -->
    <div class="header-left">
      <button id="menu-toggle" class="menu-toggle" type="button">
        <div class="menu-icon">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="menu-label">Menù</div>
      </button>
    </div>

    <!-- CENTRO -->
    <div class="header-center">
      <img
        id="header-logo"
        class="header-logo"
        src="favicon-192.png?v=2"
        alt="Logo azienda"
      />
      <div id="header-azienda-nome" class="header-azienda-nome"></div>
    </div>

    <!-- DESTRA -->
    <div class="header-right">
      <div class="header-profile">
        <div class="profile-vertical">
          <div id="header-avatar" class="header-avatar"></div>
          <div id="header-user-name" class="header-user-name"></div>
        </div>
        <button id="logout-btn" class="logout-link" type="button">
          Esci
        </button>
      </div>
    </div>

  </header>

  <!-- ================= MENU LATERALE ================= -->

  <nav id="global-menu" class="global-menu"></nav>

  <!-- ================= ROOT SPA ================= -->

  <div id="app"></div>

  <!-- ================= SCRIPT GLOBALI ================= -->

  <script src="js/state.js"></script>
  <script src="js/stateActions.js"></script>
  <script src="js/ui-reparto.js"></script>

  <!-- ================= ROUTER (Modulo ES) ================= -->
  <script type="module" src="js/router.js"></script>

</body>
</html>
