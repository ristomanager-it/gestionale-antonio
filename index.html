<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestionale Antonio</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="app-header">
    <div class="header-logo-circle">
      <img src="Logo Gestionale Antonio.png" class="header-logo-img" />
    </div>
    <h1>Gestionale Antonio</h1>
  </header>

  <main class="app-main">

    <!-- LOGIN -->
    <section id="view-login" class="view login-view">
      <div class="login-card">
        <h2>Login</h2>

        <input id="login-nome" class="input-pill" placeholder="Nome" />
        <input id="login-pin" type="password" class="input-pill" placeholder="PIN" />

        <button id="btn-login" class="app-button login-button">
          Entra
        </button>
      </div>
    </section>

   <!-- SELEZIONE LOCALE -->
<section id="view-locale" class="view" style="display:none">
  <h2>Seleziona il locale</h2>

  <button class="app-button" data-locale="CP">
    Centro Produzione
  </button>

  <button class="app-button" data-locale="TA">
    Trattoria dell’Aquila
  </button>

  <button class="app-button" data-locale="AP">
    Da Antonio Pizza
  </button>

  <button class="app-button" data-locale="CR">
    Campo Antico Ristorante
  </button>

  <button class="app-button" data-locale="CC">
    Campo Antico Catering
  </button>
</section>

    <!-- HOME -->
    <section id="view-home" class="view" style="display:none">
      <h2>Home</h2>
      <p>Locale attivo: <strong id="current-locale"></strong></p>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
