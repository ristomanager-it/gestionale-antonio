<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestionale Antonio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="app-main-wrapper">
      <!-- HEADER -->
      <header class="app-header">
        <div class="header-top">
          <div class="header-left">
            <div class="header-logo-circle">
              <img src="Logo Gestionale Antonio.png" class="header-logo-img" />
            </div>
            <div>
              <h1>Gestionale Antonio</h1>
              <p class="subtitle">Suite per NR, RA, CC e Catering</p>
            </div>
          </div>

          <div class="header-right">
            <button id="btn-theme" class="app-button tiny ghost">🌙</button>

            <div class="header-user">
              <span id="current-user-label">Nessun utente</span>
              <button
                id="btn-logout"
                class="app-button tiny"
                style="display: none"
              >
                Esci
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- CONTENUTO PRINCIPALE -->
      <main class="app-main">

        <!-- LOGIN -->
        <section id="view-login" class="view login-view">
          <!-- ... LOGIN INVARIATO ... -->
        </section>

        <!-- HOME DIPENDENTE -->
        <section id="view-home-dip" class="view" style="display: none">
          <!-- ... INVARIATO ... -->
        </section>

        <!-- MENU MANAGER -->
        <section id="manager-menu" class="buttons-grid" style="display: none">
          <!-- ... INVARIATO ... -->
        </section>

        <!-- TIMBRATURA -->
        <section id="view-timbratura" class="view" style="display: none">
          <!-- ... INVARIATO ... -->
        </section>

        <!-- DIPENDENTI -->
        <section id="view-dipendenti" class="view" style="display: none">
          <!-- ... INVARIATO ... -->
        </section>

        <!-- ACQUISTI -->
        <section id="view-acquisti" class="view" style="display: none">
          <!-- ... INVARIATO ... -->
        </section>

        <!-- RICETTE (EDIT) -->
        <section id="view-ricette" class="view" style="display: none">
          <!-- ... INVARIATO ... -->
          <datalist id="ingredienti-suggestions"></datalist>
        </section>

        <!-- RICETTARIO -->
        <section id="view-ricette-viewer" class="view" style="display: none">
          <!-- ... INVARIATO ... -->
        </section>

        <!-- PRODUZIONE -->
        <section id="view-produzione" class="view" style="display: none">
          <!-- ... INVARIATO ... -->
        </section>

        <!-- REPORT -->
        <section id="view-report" class="view" style="display: none">
          <!-- ... INVARIATO ... -->
        </section>

        <!-- MAGAZZINO -->
        <section id="view-magazzino" class="view" style="display: none">
          <!-- ... INVARIATO ... -->
          <datalist id="magazzino-suggestions"></datalist>
        </section>

        <!-- PREVENTIVI -->
        <section id="view-preventivi" class="view" style="display: none">
          <!-- ... INVARIATO ... -->
        </section>

        <!-- VENDUTO -->
        <section id="view-venduto" class="view" style="display: none">
          <!-- ... INVARIATO ... -->
        </section>
      </main>
    </div>

    <!-- ✅ DATALIST GLOBALE RICETTE (UNICO, FONDAMENTALE) -->
    <datalist id="ricette-suggestions"></datalist>

    <!-- SUPABASE -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

      const supabaseClient = window.supabase.createClient(
        "https://cuhcscpvhypoaplcmtjk.supabase.co",
        "sb_publishable_WotaBvSScN1GwFw_rVWbzA_2OEcRJy-"
      );
      window.supabaseClient = supabaseClient;
    </script>

    <!-- SCRIPT APP -->
    <script src="app.js"></script>
  </body>
</html>
