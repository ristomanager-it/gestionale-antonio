<!DOCTYPE html>
<html lang="it">

<head>

  <base href="/" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Ristoflow - la ristorazione organizzata</title>

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=9" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png?v=9" />
  <link rel="apple-touch-icon" href="assets/favicon-192.png?v=9" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />

  <link rel="stylesheet" href="styles.css?v=13" />

</head>

<body>

  <!-- HEADER -->
  <header class="app-header">

    <div class="header-left">
      <button id="menu-toggle" class="menu-toggle" type="button">
        <div class="menu-icon">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </button>
    </div>

    <div class="header-center">
      <img id="header-logo" class="header-logo" src="assets/favicon-192.png" />
    </div>

    <div id="header-right" class="header-right"></div>

  </header>


  <!-- SOTTOHEADER -->
  <div id="topbar-azienda" class="topbar-azienda">

    <div class="topbar-row-1">
      <div id="azienda-nome" class="azienda-nome"></div>
    </div>

    <div class="topbar-row-2">

      <div class="sub-left">
        <span id="topbar-saluto"></span>
      </div>

      <div class="sub-center">
        <span id="topbar-sede"></span>
      </div>

      <div class="sub-right">
        <span id="topbar-data"></span>
      </div>

    </div>

  </div>


  <nav id="global-menu"></nav>
  <div class="menu-overlay"></div>

  <!-- CONTENUTO APP -->
  <main id="app"></main>

  <!-- FOOTER -->
  <footer id="footer-root"></footer>


  <!-- ================= SCRIPTS ================= -->

  <script src="js/state.js?v=9"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- SUPABASE -->
  <script>
    (function () {
      const { createClient } = window.supabase;

      const client = createClient(
        "https://cuhcscpvhypoaplcmtjk.supabase.co",
        "YOUR_KEY"
      );

      window.supabase = client;
      window.supabaseClient = client;
    })();
  </script>

  <script src="js/stateActions.js?v=9"></script>
  <script src="js/ui-reparto.js?v=9"></script>
  <script src="js/db.js?v=9"></script>
  <script src="js/config/permessi.js?v=1"></script>
  <script src="js/utils/notify.js?v=1"></script>

  <!-- UI AZIENDA + SEDE -->
  <script>
  function renderAziendaUI(){

    const azienda = window.state?.azienda
    const sede = window.state?.sedeAttiva
    const user = window.state?.user

    const nomeUser = user?.email?.split("@")[0] || "utente"

    // LOGO DINAMICO
    const logo = document.getElementById("header-logo")
    if(logo){
      const logoUrl = sede?.logo_url || azienda?.logo_url || "assets/favicon-192.png"
      logo.src = logoUrl + "?v=" + Date.now()
    }

    // NOME AZIENDA
    const nome = document.getElementById("azienda-nome")
    if(nome){
      nome.textContent = azienda?.nome || ""
    }

    // NOME SEDE
    const sedeEl = document.getElementById("topbar-sede")
    if(sedeEl){
      sedeEl.textContent = sede ? `📍 ${sede.nome}` : "⚠️ Nessuna sede"
    }

    // SALUTO
    const salutoEl = document.getElementById("topbar-saluto")
    if(salutoEl){
      const ora = new Date().getHours()

      let saluto = "Ciao"
      if(ora < 12) saluto = "Buongiorno"
      else if(ora < 18) saluto = "Buon pomeriggio"
      else saluto = "Buonasera"

      salutoEl.textContent = `${saluto}, ${nomeUser}`
    }

    // DATA
    const dataEl = document.getElementById("topbar-data")
    if(dataEl){
      const oggi = new Date()
      dataEl.textContent = oggi.toLocaleDateString("it-IT", {
        weekday:"short",
        day:"2-digit",
        month:"short"
      })
    }

    // METEO (se usi già funzione)
    const meteoEl = document.getElementById("topbar-weather")
    if(meteoEl && window.getWeather){
      window.getWeather().then(res => {
        meteoEl.innerHTML = res
      }).catch(() => {
        meteoEl.textContent = "☀️"
      })
    }

  }

  // refresh automatico UI
  setInterval(renderAziendaUI, 5000)
  renderAziendaUI()
  </script>

  <script type="module" src="js/router.js?v=11"></script>

</body>
</html>
