  <!-- HEADER UI -->
  <script>
    function renderHeaderUI() {
      try {

        const azienda = window.state?.azienda || null;
        const sede = window.state?.sedeAttiva || null;

        const logo = document.getElementById("header-logo");
        const nomeEl = document.getElementById("header-location-name");
        const metaEl = document.getElementById("header-location-meta");

        if (logo) {

          const logoUrl =
            sede?.logo_url ||
            azienda?.logo_url ||
            "assets/favicon-192.png";

          if (logo.getAttribute("src") !== logoUrl) {
            logo.src = logoUrl;
          }

        }

        if (nomeEl) {
          nomeEl.textContent =
            sede?.nome ||
            azienda?.nome ||
            "Ristoflow";
        }

        if (metaEl) {

          if (
            sede?.nome &&
            azienda?.nome &&
            sede.nome !== azienda.nome
          ) {

            metaEl.textContent = azienda.nome;

          } else {

            metaEl.textContent = "";

          }

        }

      } catch (e) {

        console.error("HEADER ERROR:", e);

      }
    }

    // ---- TENDINA CAMBIO SEDE ----
    function escapeHtmlHeader(str) {
      return String(str ?? "").replace(/[&<>"]'/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function positionSedeDropdown() {
      const dropdown = document.getElementById("sede-dropdown");
      const trigger = document.getElementById("header-sede-trigger");
      if (!dropdown || !trigger) return;

      const rect = trigger.getBoundingClientRect();
      const margin = 14;
      const maxWidth = window.innerWidth - (margin * 2);

      let left = rect.left;
      let width = Math.min(280, maxWidth);

      if (left + width > window.innerWidth - margin) {
        left = window.innerWidth - margin - width;
      }
      if (left < margin) {
        left = margin;
      }

      dropdown.style.left = left + "px";
      dropdown.style.top = (rect.bottom + 8) + "px";
      dropdown.style.width = width + "px";
    }

    function closeSedeDropdown() {
      const dropdown = document.getElementById("sede-dropdown");
      const overlay = document.getElementById("sede-dropdown-overlay");
      const trigger = document.getElementById("header-sede-trigger");
      if (dropdown) dropdown.classList.remove("open");
      if (overlay) overlay.classList.remove("open");
      if (trigger) trigger.setAttribute("aria-expanded", "false");
    }

    function openSedeDropdown() {
      const dropdown = document.getElementById("sede-dropdown");
      const overlay = document.getElementById("sede-dropdown-overlay");
      const trigger = document.getElementById("header-sede-trigger");
      positionSedeDropdown();
      if (dropdown) dropdown.classList.add("open");
      if (overlay) overlay.classList.add("open");
      if (trigger) trigger.setAttribute("aria-expanded", "true");
    }

    function renderSedeSelector() {
      const dropdown = document.getElementById("sede-dropdown");
      const caret = document.getElementById("header-sede-caret");
      const trigger = document.getElementById("header-sede-trigger");
      if (!dropdown) return;

      const sedi = window.state?.sedi || [];
      const sedeAttiva = window.state?.sedeAttiva || null;

      if (sedi.length <= 1) {
        if (caret) caret.hidden = true;
        if (trigger) trigger.style.cursor = "default";
        dropdown.innerHTML = "";
        closeSedeDropdown();
        return;
      }

      if (caret) caret.hidden = false;
      if (trigger) trigger.style.cursor = "pointer";

      dropdown.innerHTML = sedi.map((sede) => {
        const attiva = sedeAttiva && String(sede.id) === String(sedeAttiva.id);
        return `
          <button type="button" class="sede-dropdown-item${attiva ? " active" : ""}" data-sede-id="${escapeHtmlHeader(sede.id)}" role="option" aria-selected="${attiva}">
            <span class="sede-dropdown-item-name">${escapeHtmlHeader(sede.nome || "Sede")}</span>
            ${attiva ? '<span class="sede-dropdown-item-check">â</span>' : ""}
          </button>
        `;
      }).join("");

      dropdown.querySelectorAll(".sede-dropdown-item").forEach((btn) => {
        btn.onclick = () => {
          const sedeId = btn.getAttribute("data-sede-id");
          closeSedeDropdown();
          if (window.stateActions?.setSedeAttiva) {
            window.stateActions.setSedeAttiva(sedeId);
          }
          renderHeaderUI();
          if (window.router?.reloadCurrentRoute) {
            window.router.reloadCurrentRoute();
          }
        };
      });
    }

    window.uiActions = window.uiActions || {};
    window.uiActions.renderSedeSelector = renderSedeSelector;

    window.addEventListener("DOMContentLoaded", () => {

      renderHeaderUI();

      setInterval(renderHeaderUI, 3000);

      const trigger = document.getElementById("header-sede-trigger");
      const overlay = document.getElementById("sede-dropdown-overlay");

      if (trigger) {
        trigger.addEventListener("click", () => {
          const dropdown = document.getElementById("sede-dropdown");
          if (!window.state?.sedi || window.state.sedi.length <= 1) return;
          renderSedeSelector();
          if (dropdown && !dropdown.classList.contains("open")) {
            openSedeDropdown();
          } else {
            closeSedeDropdown();
          }
        });
      }

      if (overlay) {
        overlay.addEventListener("click", closeSedeDropdown);
      }

      // aggiorna la tendina periodicamente se le sedi vengono caricate dopo l'avvio
      setInterval(() => {
        const dropdown = document.getElementById("sede-dropdown");
        if (dropdown && !dropdown.classList.contains("open")) renderSedeSelector();
      }, 3000);

    });
  </script>
