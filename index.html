<!DOCTYPE html>
<html lang="it">
<head>

  <base href="/">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Ristoflow - la ristorazione organizzata</title>

  <!-- ================= ICONS ================= -->

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=3" />
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png?v=3" />
  <link rel="apple-touch-icon" href="favicon-192.png?v=3" />

  <!-- ================= PWA ================= -->

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ristoflow" />

  <!-- ================= CSS ================= -->

  <link rel="stylesheet" href="styles.css?v=3" />

</head>

<body>

  <!-- ================= HEADER ================= -->

  <header class="app-header">

    <div class="header-left">
      <button id="menu-toggle" class="menu-toggle" type="button">
        <div class="menu-icon">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="menu-label">Menù</div>
      </button>
    </div>

    <div class="header-center">
      <img
        id="header-logo"
        class="header-logo"
        src="favicon-192.png?v=3"
        alt="Logo azienda"
      />
      <div id="header-azienda-nome" class="header-azienda-nome"></div>
    </div>

    <div class="header-right">
      <div class="header-profile">
        <div class="profile-vertical">
          <div id="header-avatar" class="header-avatar"></div>
          <div id="header-user-name" class="header-user-name"></div>
        </div>
        <button id="logout-btn" class="logout-link" type="button">
          Esci
        </button>
      </div>
    </div>

  </header>

  <!-- ================= MENU ================= -->

  <nav id="global-menu" class="global-menu"></nav>

  <!-- ================= ROOT SPA ================= -->

  <div id="app"></div>

  <!-- ================= SCRIPT GLOBALI ================= -->

  <script src="js/state.js?v=3"></script>
  <script src="js/stateActions.js?v=3"></script>
  <script type="module" src="js/supabaseClient.js?v=3"></script>
  <script src="js/ui-reparto.js?v=3"></script>
  <script src="js/db.js?v=3"></script>

  <!-- ================= LIB STAMPA ETICHETTE ================= -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- ================= ROUTER ================= -->

  <script type="module" src="js/router.js?v=3"></script>

</body>
</html>
