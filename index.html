<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestionale Antonio</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
<div class="app-main-wrapper">

  <!-- HEADER -->
  <header class="app-header">
    <div class="header-top">
      <div class="header-left">
        <div class="header-logo-circle">
          <img src="Logo Gestionale Antonio.png" class="header-logo-img" />
        </div>
        <div>
          <h1>Gestionale Antonio</h1>
          <p class="subtitle">Suite per NR, RA, CC e Catering</p>
        </div>
      </div>

      <div class="header-right">
        <button id="btn-theme" class="app-button tiny ghost">🌙</button>
        <div class="header-user">
          <span id="current-user-label">Nessun utente</span>
          <button id="btn-logout" class="app-button tiny" style="display:none">
            Esci
          </button>
        </div>
      </div>
    </div>
  </header>
<section id="view-timbratura" class="view" style="display:none">
  <h2>Timbratura</h2>
</section>

<section id="view-dipendenti" class="view" style="display:none">
  <h2>Dipendenti</h2>
</section>

<section id="view-acquisti" class="view" style="display:none">
  <h2>Acquisti</h2>
</section>

<section id="view-ricette" class="view" style="display:none">
  <h2>Ricette</h2>
</section>

<section id="view-magazzino" class="view" style="display:none">
  <h2>Magazzino</h2>
</section>

<section id="view-preventivi" class="view" style="display:none">
  <h2>Preventivi</h2>
</section>

<section id="view-venduto" class="view" style="display:none">
  <h2>Venduto</h2>
</section>

<section id="view-report" class="view" style="display:none">
  <h2>Report</h2>
</section>

  <!-- MAIN -->
  <main class="app-main">

    <!-- LOGIN -->
    <section id="view-login" class="view login-view">
      <div class="login-wrapper">
        <div class="form-card login-card">
          <div class="login-logo">
            <img src="Logo Gestionale Antonio.png" class="login-logo-img" />
          </div>

          <h2>Benvenuto</h2>
          <p>Accedi con Nome + PIN personale</p>

          <input id="login-nome" class="input-pill" placeholder="Nome" />
          <input id="login-pin" type="password" class="input-pill" placeholder="PIN" />

          <button id="btn-login" class="app-button login-button">
            Entra
          </button>
        </div>
      </div>
    </section>

    <!-- MENU MANAGER -->
    <section id="manager-menu" class="buttons-grid" style="display:none">

      <!-- SUPER ADMIN -->
      <button class="app-button menu-button"
              data-route="aziende"
              data-superadmin-only="true">
        🏢 Aziende
      </button>

      <button class="app-button menu-button" data-route="timbratura">Timbratura</button>
      <button class="app-button menu-button" data-route="dipendenti">Dipendenti</button>
      <button class="app-button menu-button" data-route="acquisti">Acquisti</button>
      <button class="app-button menu-button" data-route="ricette">Ricette</button>
      <button class="app-button menu-button" data-route="magazzino">Magazzino</button>
      <button class="app-button menu-button" data-route="preventivi">Preventivi</button>
      <button class="app-button menu-button" data-route="venduto">Venduto</button>
      <button class="app-button menu-button wide" data-route="report">Report</button>

    </section>

    <!-- ✅ AZIENDE (UNA SOLA VOLTA) -->
    <section id="view-aziende" class="view" style="display:none">
      <h2>Gestione aziende</h2>

      <form id="azienda-form" onsubmit="return false">
        <input type="hidden" id="azienda-id" />

        <label>
          Codice azienda
          <input id="azienda-codice" class="input-pill" placeholder="CP" />
        </label>

        <label>
          Nome azienda
          <input id="azienda-nome" class="input-pill" placeholder="Centro Produzione" />
        </label>

        <label>
          Attiva
          <input type="checkbox" id="azienda-attiva" checked />
        </label>

        <h4>Funzioni abilitate</h4>

        <label><input type="checkbox" id="feat-dipendenti" checked /> Dipendenti</label>
        <label><input type="checkbox" id="feat-magazzino" checked /> Magazzino</label>
        <label><input type="checkbox" id="feat-ricette" checked /> Ricette</label>
        <label><input type="checkbox" id="feat-preventivi" /> Preventivi</label>
        <label><input type="checkbox" id="feat-report" /> Report</label>

        <button id="btn-azienda-salva" class="app-button green">
          Salva azienda
        </button>
      </form>

      <h3>Aziende registrate</h3>
      <table class="table-timbrature">
        <thead>
          <tr>
            <th>Codice</th>
            <th>Nome</th>
            <th>Attiva</th>
          </tr>
        </thead>
        <tbody id="aziende-lista"></tbody>
      </table>
    </section>

    <!-- LE ALTRE VIEW (timbratura, dipendenti, ecc.) RESTANO COME GIÀ LE HAI -->

  </main>
</div>

<script src="app.js"></script>
</body>
</html>
