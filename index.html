  <!-- HEADER UI -->
  <script>
    function renderHeaderUI() {
      try {

        const azienda = window.state?.azienda || null;
        const sede = window.state?.sedeAttiva || null;
        const user = window.state?.user || null;

        const logo = document.getElementById("header-logo");
        const nomeEl = document.getElementById("header-location-name");
        const metaEl = document.getElementById("header-location-meta");
        const salutoEl = document.getElementById("header-saluto");
        const dataEl = document.getElementById("header-data");
        const meteoEl = document.getElementById("header-meteo");

        if (logo) {

          const logoUrl =
            sede?.logo_url ||
            azienda?.logo_url ||
            "assets/favicon-192.png";

          if (logo.getAttribute("src") !== logoUrl) {
            logo.src = logoUrl;
          }

        }

        if (nomeEl) {
          nomeEl.textContent =
            sede?.nome ||
            azienda?.nome ||
            "Ristoflow";
        }

        if (metaEl) {

          if (
            sede?.nome &&
            azienda?.nome &&
            sede.nome !== azienda.nome
          ) {

            metaEl.textContent = azienda.nome;

          } else {

            metaEl.textContent = "";

          }

        }

        if (salutoEl) {

          if (user?.email) {

            const nomeUser =
              user.email.split("@")[0] || "utente";

            const ora = new Date().getHours();

            let saluto = "Ciao";

            if (ora < 12) {
              saluto = "Buongiorno";
            } else if (ora < 18) {
              saluto = "Buon pomeriggio";
            } else {
              saluto = "Buonasera";
            }

            salutoEl.textContent =
              `${saluto}, ${nomeUser}`;

          } else {

            salutoEl.textContent = "";

          }

        }

        if (dataEl) {

          const oggi = new Date();

          dataEl.textContent = oggi.toLocaleDateString(
            "it-IT",
            {
              weekday: "short",
              day: "2-digit",
              month: "short"
            }
          );

        }

        if (meteoEl) {

          if (typeof window.getWeather === "function") {

            window.getWeather()
              .then((res) => {
                meteoEl.innerHTML = res || "";
              })
              .catch(() => {
                meteoEl.textContent = "";
              });

          } else {

            meteoEl.textContent = "";

          }

        }

      } catch (e) {

        console.error("HEADER ERROR:", e);

      }
    }

    window.addEventListener("DOMContentLoaded", () => {

      renderHeaderUI();

      setInterval(renderHeaderUI, 3000);

    });
  </script>

  <!-- TAWK.TO LIVE CHAT -->
  <script type="text/javascript">
    // Carica Tawk dopo il login — passa nome e azienda automaticamente
    window.addEventListener("ristoflow:user-loaded", function () {
      var Tawk_API = Tawk_API || {};

      // Identifica l'utente loggato a Tawk
      Tawk_API.onLoad = function () {
        var user = window.state?.user;
        var azienda = window.state?.azienda;
        if (user?.email) {
          Tawk_API.setAttributes({
            name: user.email.split("@")[0],
            email: user.email,
            azienda: azienda?.nome || "—",
          }, function (error) {});
        }
      };

      // Inietta lo script Tawk solo una volta
      if (!document.getElementById("tawk-script")) {
        var Tawk_LoadStart = new Date();
        var s1 = document.createElement("script");
        var s0 = document.getElementsByTagName("script")[0];
        s1.id = "tawk-script";
        s1.async = true;
        s1.src = "https://embed.tawk.to/6a2a7b7c0514041c3544c5e9/1jqqv4occ";
        s1.charset = "UTF-8";
        s1.setAttribute("crossorigin", "*");
        s0.parentNode.insertBefore(s1, s0);
      }
    });
  </script>
