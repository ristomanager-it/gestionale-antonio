<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestionale Antonio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="app-main-wrapper">
      <!-- HEADER -->
      <header class="app-header">
        <div class="header-top">
          <div class="header-left">
            <div class="header-logo-circle">
              <img src="Logo Gestionale Antonio.png" class="header-logo-img" />
            </div>
            <div>
              <h1>Gestionale Antonio</h1>
              <p class="subtitle">Suite per NR, RA, CC e Catering</p>
            </div>
          </div>

          <div class="header-right">
            <button id="btn-theme" class="app-button tiny ghost">🌙</button>

            <div class="header-user">
              <span id="current-user-label">Nessun utente</span>
              <button
                id="btn-logout"
                class="app-button tiny"
                style="display: none"
              >
                Esci
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- CONTENUTO PRINCIPALE -->
      <main class="app-main">

        <!-- LOGIN -->
        <section id="view-login" class="view login-view">
          <div class="login-wrapper">
            <div class="form-card login-card">
              <div class="login-logo">
                <img src="Logo Gestionale Antonio.png" class="login-logo-img" />
              </div>

              <h2 class="login-title">Benvenuto</h2>
              <p class="login-subtitle">Accedi con Nome + PIN personale.</p>

              <form class="login-form" onsubmit="return false;">
                <div class="form-row">
                  <label for="login-nome" class="input-label">Nome</label>
                  <input
                    type="text"
                    id="login-nome"
                    class="input-pill"
                    placeholder="Es. Mario Rossi"
                    autocomplete="off"
                  />
                </div>

                <div class="form-row">
                  <label for="login-pin" class="input-label">PIN</label>
                  <input
                    type="password"
                    id="login-pin"
                    class="input-pill"
                    maxlength="10"
                    inputmode="numeric"
                    placeholder="PIN personale"
                  />
                </div>

                <div class="form-row form-row-inline">
                  <label class="checkbox-label">
                    <input type="checkbox" id="login-remember" />
                    <span>Ricordami su questo dispositivo</span>
                  </label>
                </div>

                <div class="form-row">
                  <button
                    type="button"
                    id="btn-login"
                    class="app-button login-button"
                  >
                    Entra
                  </button>
                </div>
              </form>
            </div>
          </div>
        </section>

        <!-- HOME DIPENDENTE -->
        <section id="view-home-dip" class="view" style="display: none">
          <h2>Cosa vuoi fare?</h2>

          <div class="home-buttons">
            <button class="app-button big-home" data-route="timbratura">
              Timbratura
            </button>

            <button class="app-button big-home" data-route="ordine">
              Ordine del giorno
            </button>

            <button
              class="app-button big-home"
              data-route="ricette-viewer"
            >
              Ricettario
            </button>
          </div>
        </section>

        <!-- MENU MANAGER -->
        <section id="manager-menu" class="buttons-grid" style="display: none">
          <button class="app-button menu-button" data-route="timbratura">
            Timbratura
          </button>
          <button class="app-button menu-button" data-route="dipendenti">
            Dipendenti
          </button>
          <button class="app-button menu-button" data-route="acquisti">
            Acquisti / Fatture
          </button>
          <button class="app-button menu-button" data-route="ricette">
            Ricette
          </button>
          <button class="app-button menu-button" data-route="produzione">
            Produzione
          </button>
          <button class="app-button menu-button" data-route="magazzino">
            Magazzino
          </button>
          <button class="app-button menu-button" data-route="preventivi">
            Preventivi & Prenotazioni
          </button>
          <button class="app-button menu-button" data-route="venduto">
            Venduto del giorno
          </button>
          <button
            class="app-button menu-button"
            data-route="ricette-viewer"
            data-manager-only="false"
          >
            Ricettario
          </button>
          <button class="app-button menu-button wide" data-route="report">
            Report
          </button>
        </section>

        <!-- RICETTE -->
        <section id="view-ricette" class="view" style="display: none">
          <h2>Ricette</h2>

          <form onsubmit="return false;">
            <label>
              Nome ricetta
              <input
                type="text"
                id="ricetta-nome"
                class="input-pill"
                list="ricette-suggestions"
                placeholder="Es. Flan di patate"
              />
            </label>
            <!-- resto invariato -->
          </form>
        </section>

        <!-- RICETTARIO -->
        <section id="view-ricette-viewer" class="view" style="display: none">
          <h2>Ricettario</h2>

          <input
            id="ricette-search"
            type="text"
            class="input-pill"
            list="ricette-suggestions"
            placeholder="Es. Flan di patate, Tiramisù..."
          />

          <div id="ricette-lista-viewer"></div>
        </section>

      </main>
    </div>

    <!-- ✅ DATALIST GLOBALE RICETTE -->
    <datalist id="ricette-suggestions"></datalist>

    <!-- SUPABASE -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
      const supabaseClient = window.supabase.createClient(
        "https://cuhcscpvhypoaplcmtjk.supabase.co",
        "sb_publishable_WotaBvSScN1GwFw_rVWbzA_2OEcRJy-"
      );
      window.supabaseClient = supabaseClient;
    </script>

    <!-- SCRIPT APP -->
    <script src="app.js"></script>
  </body>
</html>
