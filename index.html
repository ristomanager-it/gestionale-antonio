<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Gestionale Antonio – Ristoflow SaaS</title>

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />

  <link rel="stylesheet" href="styles.css" />
  <!-- Aggiungi il link per FontAwesome per le icone -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>

  <!-- HEADER GLOBALE -->
  <header class="app-header">
    <div class="header-top">
      <div class="header-left">
        <!-- 🔥 Titolo rimosso -->
      </div>

      <div class="header-right">
        <!-- Selettore Reparto -->
        <select
          id="header-reparto-select"
          class="input-pill"
          style="max-width:180px; display:none;"
        ></select>

        <div class="header-user">
          <span id="current-user-label"></span>
        </div>
      </div>
    </div>
  </header>

  <!-- APP ROOT SPA -->
  <div id="app">
    <div class="page">
      <div class="page-header">
        <h2>Timbrature</h2>
        <div style="opacity:.7; margin-top:4px;">Azienda: <span id="azienda-name"></span></div>
      </div>

      <div class="card" style="margin-top:12px;">
        <div id="tb-status" style="opacity:.75;">Caricamento stato...</div>

        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;">
          <!-- Pulsanti di Timbratura -->
          <button id="btn-primary" class="btn-timbratura btn-green">
            <i class="fa fa-play"></i> Entrata
          </button>
          <button id="btn-pausa" class="btn-timbratura btn-gray">
            <i class="fa fa-pause"></i> Pausa
          </button>
          <button id="btn-fine" class="btn-timbratura btn-red">
            <i class="fa fa-stop"></i> Fine Turno
          </button>
        </div>

        <div id="tb-last-geo" style="margin-top:12px; opacity:.75;"></div>
        <div id="tb-msg" style="margin-top:10px;"></div>
      </div>

      <div class="card" style="margin-top:12px;">
        <h3 style="margin:0 0 10px 0;">Ultime timbrature</h3>
        <div id="tb-list" style="opacity:.75;">Caricamento...</div>
      </div>
    </div>
  </div>

  <!-- STATE -->
  <script src="js/state.js"></script>
  <script src="js/stateActions.js"></script>

  <!-- UI REPARTO -->
  <script src="js/ui-reparto.js"></script>

  <!-- ROUTER (MODULE SPA) -->
  <script type="module" src="js/router.js"></script>

</body>
</html>
