<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Gestionale Antonio – Ristoflow SaaS</title>

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />

  <!-- CSS globale -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- HEADER GLOBALE -->
  <header class="app-header">

    <!-- SINISTRA -->
    <div class="header-left">
      <button id="menu-toggle" class="menu-toggle" type="button">
        <div class="menu-icon">☰</div>
        <div class="menu-label">Menù</div>
      </button>
    </div>

    <!-- CENTRO -->
    <div class="header-center">
      <img
        id="header-logo"
        class="header-logo"
        src=""
        alt="Logo azienda"
        style="display:none;"
      />
      <div id="header-azienda-nome" class="header-azienda-nome"></div>
    </div>

    <!-- DESTRA -->
    <div class="header-right">
      <div class="header-profile">
        <div id="header-user-name" class="header-user-name"></div>
        <button id="logout-btn" class="logout-link" type="button">
          Logout
        </button>
      </div>
    </div>

  </header>

  <!-- MENU GLOBALE LATERALE -->
  <nav id="global-menu" class="global-menu">
    <!-- Popolato dinamicamente via JS -->
  </nav>

  <!-- ROOT SPA -->
  <div id="app"></div>

  <!-- STATE -->
  <script src="js/state.js"></script>
  <script src="js/stateActions.js"></script>

  <!-- UI REPARTO -->
  <script src="js/ui-reparto.js"></script>

  <!-- ROUTER (SPA) -->
  <script type="module" src="js/router.js"></script>

</body>
</html>
