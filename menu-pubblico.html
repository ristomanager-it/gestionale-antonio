<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Menu</title>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#0E5A7A"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--brand:#0E5A7A;--brand-light:#e8f4f8;--sfondo:#f8fafc;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--sfondo);min-height:100vh;color:#111827;}

    /* LOADER */
    .page-loader{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;color:#64748b;}
    .spinner{width:44px;height:44px;border:4px solid var(--brand-light);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* HERO SOCIAL */
    .menu-cover{position:relative;width:100%;height:200px;background:var(--brand);overflow:hidden;flex-shrink:0;}
    .menu-cover img{width:100%;height:100%;object-fit:cover;display:block;}
    .menu-cover-slides{position:relative;width:100%;height:100%;}
    .cover-slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s ease;}
    .cover-slide.active{opacity:1;}
    .cover-dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3;}
    .cover-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);transition:all .2s;}
    .cover-dot.active{background:#fff;width:16px;border-radius:3px;}
    .menu-cover-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,0.4) 100%);}
    .menu-profile-row{display:flex;align-items:flex-end;gap:14px;padding:0 16px 16px;margin-top:-36px;position:relative;z-index:2;background:var(--sfondo);}
    .menu-logo-wrap{width:84px;height:84px;border-radius:50%;border:4px solid var(--sfondo);overflow:hidden;background:#e5e7eb;flex-shrink:0;box-shadow:0 2px 12px rgba(0,0,0,0.15);}
    .menu-logo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
    .menu-logo-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--brand-light);}
    .menu-info{padding-bottom:6px;flex:1;min-width:0;}
    .menu-locale-nome{font-size:22px;font-weight:800;color:#111827;line-height:1.3;word-break:break-word;}
    .menu-locale-sottotitolo{font-size:14px;font-weight:600;color:var(--brand);margin-top:1px;letter-spacing:.3px;}
    .menu-locale-desc{font-size:14px;color:#64748b;margin-top:2px;}

    /* NAV CATEGORIE — pillole scure + punti di paginazione, stile "social" */
    .cat-nav{background:var(--sfondo);border-bottom:none;position:sticky;top:0;z-index:20;overflow-x:auto;display:flex;gap:10px;padding:14px 14px 4px;scrollbar-width:none;}
    .cat-nav::-webkit-scrollbar{display:none;}
    .cat-nav-btn{padding:16px 22px;border:none;border-radius:14px;background:#2d3748;cursor:pointer;font-size:16px;font-weight:700;color:#fff;white-space:nowrap;transition:all .15s;flex-shrink:0;}
    .cat-nav-btn.active{background:var(--brand);}
    .cat-dots{display:flex;justify-content:center;gap:7px;padding:10px 0 4px;background:var(--sfondo);}
    .cat-dot{width:8px;height:8px;border-radius:50%;background:#d1d5db;transition:all .2s;}
    .cat-dot.active{background:#dc2626;width:9px;height:9px;}

    /* FILTRI */
    .filtri-bar{padding:10px 12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;background:#fff;border-bottom:1px solid #f3f4f6;}
    .filtri-bar::-webkit-scrollbar{display:none;}
    .filtro-chip{border:1.5px solid #e5e7eb;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;background:#fff;color:#374151;transition:all .15s;flex-shrink:0;}
    .filtro-chip.active{background:var(--brand);color:#fff;border-color:var(--brand);}

    /* SEZIONI CATEGORIA — accordion: chiuse, si aprono al click */
    .cat-accordion{margin:16px 0 0;background:transparent;}
    .cat-acc-header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#9ca3af;cursor:pointer;user-select:none;}
    .cat-acc-img{width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;}
    .cat-acc-img-empty{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
    .cat-acc-info{flex:1;min-width:0;}
    .cat-acc-nome{font-size:22px;font-weight:800;color:#fff;text-align:center;flex:1;}
    .cat-acc-desc{font-size:13px;color:rgba(255,255,255,.85);margin-top:1px;}
    .cat-acc-orario{font-size:12px;font-weight:700;color:#fff;margin-top:1px;}
    .cat-acc-right{display:flex;align-items:center;flex-shrink:0;}
    .cat-acc-arrow{font-size:20px;color:#fff;transition:transform .2s;display:inline-block;}
    .cat-acc-arrow.open{transform:rotate(180deg);}
    .cat-acc-body{display:none;padding:0;}
    .cat-acc-body.open{display:block;}
    .cat-acc-preview{width:100%;height:180px;object-fit:cover;display:block;cursor:pointer;}

    /* CARD PRODOTTO — foto grande a piena larghezza in alto */
    .prodotto-card{background:#fff;margin-bottom:0;overflow:hidden;display:flex;flex-direction:column;border-bottom:1px solid #e5e7eb;}
    .prodotto-card.non-disp{opacity:.5;}
    .prodotto-body{flex:1;padding:18px 16px;min-width:0;}
    .prodotto-nome{font-size:24px;font-weight:700;color:#111827;margin-bottom:8px;text-align:center;}
    .prodotto-desc{font-size:15px;color:#4b5563;line-height:1.5;margin-bottom:14px;text-align:center;}
    .prodotto-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;justify-content:center;}
    .prodotto-tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--brand-light);color:var(--brand);}
    .prodotto-tag.chef{background:#fef3c7;color:#92400e;}
    .prodotto-tag.non-disp-tag{background:#fee2e2;color:#dc2626;}
    .prodotto-riga-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #f1f5f9;padding-top:12px;margin-top:4px;}
    .prodotto-prezzo{font-size:22px;font-weight:800;color:#111827;}
    .prodotto-dettaglio-btn{background:#dc2626;color:#fff;border:none;border-radius:999px;padding:12px 24px;font-size:14px;font-weight:800;letter-spacing:.5px;cursor:pointer;text-transform:uppercase;}
    .prodotto-foto-wrap{width:100%;height:280px;flex-shrink:0;position:relative;}
    .prodotto-foto{width:100%;height:100%;object-fit:cover;display:block;}
    .prodotto-foto-empty{width:100%;height:100%;background:var(--brand-light);display:flex;align-items:center;justify-content:center;font-size:48px;}

    /* RACCOLTA DATI */
    .raccolta-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
    .raccolta-box{background:#fff;border-radius:24px 24px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
    .raccolta-handle{width:40px;height:4px;background:#d1d5db;border-radius:999px;margin:0 auto 16px;}
    .raccolta-title{font-size:18px;font-weight:800;margin-bottom:4px;}
    .raccolta-sub{font-size:13px;color:#64748b;margin-bottom:20px;line-height:1.5;}
    .raccolta-input{width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:15px;outline:none;margin-bottom:10px;font-family:inherit;}
    .raccolta-input:focus{border-color:var(--brand);}
    .raccolta-btn{width:100%;background:var(--brand);color:#fff;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;}

    /* FIDELITY BOX */
    .fidelity-promo{background:linear-gradient(135deg,#059669,#10b981);border-radius:18px;margin:12px 12px 0;padding:16px;color:#fff;display:flex;align-items:center;gap:14px;}
    .fidelity-promo-qr{width:72px;height:72px;border-radius:10px;border:2px solid rgba(255,255,255,.3);flex-shrink:0;}
    .fidelity-promo-title{font-size:15px;font-weight:800;margin-bottom:2px;}
    .fidelity-promo-sub{font-size:12px;opacity:.9;line-height:1.4;}

    /* LIGHTBOX */
    .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:300;display:none;align-items:center;justify-content:center;}
    .lightbox.open{display:flex;}
    .lightbox img{max-width:95vw;max-height:90vh;border-radius:12px;object-fit:contain;}
    .lightbox-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.2);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;}

    /* CARRELLO — barra flottante, drawer, checkout */
    .cart-bar{position:fixed;bottom:0;left:0;right:0;background:var(--brand);color:#fff;padding:14px 18px;display:none;align-items:center;justify-content:space-between;z-index:150;cursor:pointer;box-shadow:0 -4px 16px rgba(0,0,0,.15);}
    .cart-bar.show{display:flex;}
    .cart-bar-count{background:rgba(255,255,255,.25);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:800;}
    .cart-bar-tot{font-size:17px;font-weight:800;}
    .cart-qty-ctrl{display:flex;align-items:center;gap:10px;margin-top:8px;}
    .cart-qty-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--brand);background:#fff;color:var(--brand);font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .cart-qty-val{font-size:15px;font-weight:800;min-width:20px;text-align:center;}
    .cart-item-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f1f5f9;}
    .cart-item-nome{flex:1;font-size:14px;font-weight:700;}
    .cart-item-prezzo{font-size:13px;color:#64748b;}
    .cart-item-rm{color:#dc2626;font-size:18px;cursor:pointer;padding:4px;}
    .checkout-field{margin-bottom:12px;}
    .checkout-field label{font-size:12px;font-weight:700;color:#374151;display:block;margin-bottom:4px;}
    .menu-footer{text-align:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom));font-size:11px;color:#9ca3af;}
    .menu-footer a{color:var(--brand);text-decoration:none;}

    /* NON DISPONIBILE BADGE */
    .non-disp-badge{position:absolute;top:8px;right:8px;background:rgba(220,38,38,.85);color:#fff;border-radius:6px;padding:2px 6px;font-size:10px;font-weight:700;}

    @media(min-width:480px){
      body{display:flex;flex-direction:column;align-items:center;}
      .menu-cover,.menu-profile-row,.cat-nav,.filtri-bar,.cat-section,.fidelity-promo,.menu-footer{max-width:480px;width:100%;}
      .raccolta-box{border-radius:20px;}
    }

    /* PULSANTE STAMPA */
    .btn-stampa-menu{position:fixed;bottom:20px;right:20px;background:var(--brand);color:#fff;border:none;border-radius:999px;padding:14px 20px;font-size:14px;font-weight:800;box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:pointer;z-index:50;display:flex;align-items:center;gap:8px;}

    /* STAMPA — una pagina A4 per categoria, niente fronzoli */
    #stampa-output{ display:none; }

    @media print{
      @page{ size:A4; margin:12mm; }
      body{ background:#fff; }
      body > *:not(#stampa-output){ display:none!important; }
      #stampa-output{ display:block!important; }
      .stampa-pagina{ page-break-after:always; break-after:page; }
      .stampa-pagina:last-child{ page-break-after:auto; break-after:auto; }
      .stampa-header{ display:flex; align-items:center; gap:12px; border-bottom:2px solid var(--brand); padding-bottom:8px; margin-bottom:14px; }
      .stampa-logo{ width:40px; height:40px; border-radius:50%; object-fit:cover; }
      .stampa-titolo-cat{ font-size:22px; font-weight:800; color:var(--brand); }
      .stampa-locale{ font-size:11px; color:#64748b; margin-left:auto; }
      .stampa-riga{ display:flex; align-items:flex-start; gap:12px; padding:8px 0; border-bottom:1px solid #e5e7eb; }
      .stampa-riga-foto{ width:56px; height:56px; border-radius:8px; object-fit:cover; flex-shrink:0; }
      .stampa-riga-foto-vuota{ width:56px; height:56px; border-radius:8px; background:#f1f5f9; flex-shrink:0; }
      .stampa-riga-testo{ flex:1; min-width:0; }
      .stampa-riga-nome{ font-size:13px; font-weight:700; color:#111827; }
      .stampa-riga-desc{ font-size:10.5px; color:#6b7280; line-height:1.35; margin-top:2px; }
      .stampa-riga-prezzo{ font-size:14px; font-weight:800; color:#111827; white-space:nowrap; flex-shrink:0; padding-top:1px; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="page-loader"><div class="spinner"></div><div>Caricamento menu...</div></div>
  </div>
  <div id="stampa-output"></div>
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lb-close">✕</button>
    <img id="lb-img" src="" alt="">
  </div>

  <div class="raccolta-overlay" id="detail-overlay" style="display:none;">
    <div class="raccolta-box" id="detail-box">
      <div class="raccolta-handle"></div>
      <div id="detail-content"></div>
    </div>
  </div>

  <div class="cart-bar" id="cart-bar">
    <div><span class="cart-bar-count" id="cart-bar-count">0</span> nel carrello</div>
    <div class="cart-bar-tot" id="cart-bar-tot">0,00 €</div>
  </div>

  <div class="raccolta-overlay" id="cart-overlay" style="display:none;">
    <div class="raccolta-box" id="cart-box">
      <div class="raccolta-handle"></div>
      <div id="cart-content"></div>
    </div>
  </div>

  <div class="raccolta-overlay" id="checkout-overlay" style="display:none;">
    <div class="raccolta-box" id="checkout-box">
      <div class="raccolta-handle"></div>
      <div id="checkout-content"></div>
    </div>
  </div>

        }catch(e){

    // Tutta la lettura/scrittura passa da qui: la Edge Function usa la
    // service role e decide lei cosa è sicuro esporre — la pagina pubblica
    // non dipende più dalle RLS delle tabelle menu/menu_categorie/menu_voci.
    async function chiamaApi(payload) {
      // Content-Type "text/plain" invece di "application/json" e nessun header
      // custom (Authorization/apikey non servono, la funzione è pubblica):
      // così la richiesta resta "semplice" per il browser e NON scatena il
      // preflight OPTIONS, che sul gateway Supabase falliva a prescindere
      // dal toggle Verify JWT. Il corpo resta JSON valido, il server lo legge
      // comunque con req.json() indipendentemente dal Content-Type dichiarato.
      var res = await fetch(EDGE_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      });
      var testo = await res.text();
      var dati;
      try { dati = JSON.parse(testo); }
      catch (e) { throw new Error("Risposta non valida dal server (status " + res.status + "): " + testo.slice(0, 200)); }
      if (!res.ok && !dati.error) { throw new Error("Errore server (status " + res.status + ")"); }
      return dati;
    }

    // ── COVER SLIDESHOW ──────────────────────────────────────────────
    function initCoverSlideshow() {
      var slidesBox = document.getElementById("cover-slides");
      if (!slidesBox) return; // una sola foto o nessuna: niente da animare

      var slides = slidesBox.querySelectorAll(".cover-slide");
      var dots = document.querySelectorAll(".cover-dot");
      var idx = 0;

      function vaiA(n) {
        idx = (n + slides.length) % slides.length;
        slides.forEach(function(s, i) { s.classList.toggle("active", i === idx); });
        dots.forEach(function(d, i) { d.classList.toggle("active", i === idx); });
      }

      var timer = setInterval(function() { vaiA(idx + 1); }, 2000);

      // Tap su un pallino = vai a quella foto, e riparti il timer da lì
      dots.forEach(function(dot, i) {
        dot.addEventListener("click", function() {
          clearInterval(timer);
          vaiA(i);
          timer = setInterval(function() { vaiA(idx + 1); }, 2000);
        });
      });

      // Tap sulla cover stessa = avanti di una, comodo su mobile
      slidesBox.addEventListener("click", function() {
        clearInterval(timer);
        vaiA(idx + 1);
        timer = setInterval(function() { vaiA(idx + 1); }, 2000);
      });
    }

      document.querySelector(".cat-dot")?.classList.add("active");

      navBtns.forEach(function(btn) {
        btn.onclick = function() {
          var catId = btn.dataset.catId;
          evidenziaCategoria(catId);
          var el = document.getElementById("cat-" + catId);
          if (el) el.scrollIntoView({ behavior:"smooth", block:"start" });
        };
      });

      document.querySelectorAll(".cat-dot").forEach(function(dot) {
        dot.onclick = function() {
          var catId = dot.dataset.dotCat;
          evidenziaCategoria(catId);
          var el = document.getElementById("cat-" + catId);
          if (el) el.scrollIntoView({ behavior:"smooth", block:"start" });
        };
      });

      function evidenziaCategoria(catId) {
        document.querySelectorAll(".cat-nav-btn").forEach(function(btn){
          btn.classList.toggle("active", btn.dataset.catId === catId);
        });
        document.querySelectorAll(".cat-dot").forEach(function(dot){
          dot.classList.toggle("active", dot.dataset.dotCat === catId);
        });
      }

      // BIND FILTRI
      document.querySelectorAll(".filtro-chip").forEach(function(chip) {
        chip.onclick = function() {
          var f = chip.dataset.filtro;
          if (filtriAttivi.has(f)) { filtriAttivi.delete(f); chip.classList.remove("active"); }
          else { filtriAttivi.add(f); chip.classList.add("active"); }
          applicaFiltri();
        };
      });

      // BIND LIGHTBOX foto (ignora i pulsanti Dettaglio di piatti senza foto)
      document.querySelectorAll("[data-lb]").forEach(function(el) {
        if (!el.dataset.lb) return;
        el.onclick = function() {
          document.getElementById("lb-img").src = el.dataset.lb;
          document.getElementById("lightbox").classList.add("open");
        };
      });

      // BIND DETTAGLIO — apre la scheda del piatto (tag, descrizione estesa, prezzo)
      document.querySelectorAll(".prodotto-dettaglio-btn").forEach(function(btn) {
        btn.onclick = function() {
          var v = vociById[btn.dataset.detail];
          if (!v) return;
          apriDettaglio(v);
        };
      });

      // BIND CARRELLO (solo se il menu è ordinabile)
      if (menu.ordinabile) {
        document.querySelectorAll("[data-cart-inc]").forEach(function(btn) {
          btn.onclick = function() { modificaCarrello(btn.dataset.cartInc, 1); };
        });
        document.querySelectorAll("[data-cart-dec]").forEach(function(btn) {
          btn.onclick = function() { modificaCarrello(btn.dataset.cartDec, -1); };
        });
        document.getElementById("cart-bar").onclick = apriCarrello;
        aggiornaCarrelloUI();
      }

      // BIND ACCORDION — click header O foto apre/chiude la categoria (solo quella cliccata)
      document.querySelectorAll(".cat-acc-header, .cat-acc-preview").forEach(function(hdr) {
        hdr.onclick = function() {
          var catId = hdr.dataset.cat;
          var body = document.getElementById("body-" + catId);
          var arrow = document.querySelector(".cat-acc-header[data-cat='" + catId + "'] .cat-acc-arrow");
          var isOpen = body.classList.contains("open");
          if (isOpen) {
            body.classList.remove("open");
            if (arrow) arrow.classList.remove("open");
          } else {
            body.classList.add("open");
            if (arrow) arrow.classList.add("open");
            evidenziaCategoria(catId);
          }
        };
      });

      // Auto-stampa: SOLO se il link arriva dal pannello admin con ?print=1
      // (i clienti sulla pagina pubblica non hanno mai questo parametro né
      // vedono un pulsante di stampa — evita che tutti stampino per sbaglio).
      // Genera una lista compatta separata dalla grafica online — una
      // categoria per pagina A4, una riga per portata (foto piccola,
      // nome+descrizione, prezzo) invece delle card grandi da schermo.
      if (params.get("print") === "1") {
        generaStampaCompatta();
        setTimeout(function(){ window.print(); }, 300);
      }

      // SCROLL → aggiorna nav e punti in base a quale sezione è visibile
      window.addEventListener("scroll", aggiornaNavScroll, { passive:true });
    }

    function generaStampaCompatta() {
      var nomeLocale = (sede && sede.nome) || azienda.nome || "";
      var logoSrc = menu.logo_url || (sede && sede.logo_url) || azienda.logo_url || "";
      var html = "";
      categorie.forEach(function(cat) {
        var voci = tutteVoci[cat.id] || [];
        if (!voci.length) return;
        html += '<div class="stampa-pagina">';
        html += '<div class="stampa-header">';
        if (logoSrc) html += '<img class="stampa-logo" src="' + esc(logoSrc) + '">';
        html += '<div class="stampa-titolo-cat">' + esc(cat.nome) + '</div>';
        html += '<div class="stampa-locale">' + esc(nomeLocale) + '</div>';
        html += '</div>';
        voci.forEach(function(v) {
          if (v.disponibile === false) return;
          var prezzo = v.prezzo_override || v.prezzo || 0;
          html += '<div class="stampa-riga">';
          html += v.foto_url
            ? '<img class="stampa-riga-foto" src="' + esc(v.foto_url) + '">'
            : '<div class="stampa-riga-foto-vuota"></div>';
          html += '<div class="stampa-riga-testo">';
          html += '<div class="stampa-riga-nome">' + esc(tN(v)) + '</div>';
          var vDescS = tD(v); if (vDescS) html += '<div class="stampa-riga-desc">' + esc(vDescS) + '</div>';
          html += '</div>';
          html += '<div class="stampa-riga-prezzo">' + Number(prezzo).toFixed(2) + ' €</div>';
          html += '</div>';
        });
        html += '</div>';
      });
      document.getElementById("stampa-output").innerHTML = html;
    }

    function aggiornaNavScroll() {
      var scrollY = window.scrollY + 160;
      var attivo = null;
      categorie.forEach(function(c) {
        var el = document.getElementById("cat-" + c.id);
        if (el && el.offsetTop <= scrollY) attivo = c.id;
      });
      if (attivo) {
        document.querySelectorAll(".cat-nav-btn").forEach(function(btn) {
          btn.classList.toggle("active", btn.dataset.catId === attivo);
        });
        document.querySelectorAll(".cat-dot").forEach(function(dot) {
          dot.classList.toggle("active", dot.dataset.dotCat === attivo);
        });
      }
    }

    function applicaFiltri() {
      if (!filtriAttivi.size) {
        document.querySelectorAll(".prodotto-card").forEach(function(el){ el.style.display=""; });
        document.querySelectorAll(".cat-section").forEach(function(el){ el.style.display=""; });
        return;
      }
      categorie.forEach(function(cat) {
        var voci = tutteVoci[cat.id] || [];
        var visibili = 0;
        voci.forEach(function(v, i) {
          var cards = document.querySelectorAll("#cat-" + cat.id + " .prodotto-card");
          var card = cards[i];
          if (!card) return;
          var mostra = true;
          var tags = v.tags || [];
          filtriAttivi.forEach(function(f) {
            if (f === "chef") {
              if (!v.note_interne?.includes("chef")) mostra = false;
            } else if (!tags.includes(f)) {
              mostra = false;
            }
          });
          if (mostra) {
            card.style.display = "";
            visibili++;
          } else {
            card.style.display = "none";
          }
        });
        var sec = document.getElementById("cat-" + cat.id);
        if (sec) sec.style.display = visibili === 0 ? "none" : "";
      });
    }

    // LIGHTBOX
    document.getElementById("lb-close").onclick = function() {
      document.getElementById("lightbox").classList.remove("open");
    };
    document.getElementById("lightbox").onclick = function(e) {
      if (e.target === e.currentTarget) document.getElementById("lightbox").classList.remove("open");
    };

    // SCHEDA DETTAGLIO PRODOTTO
    function apriDettaglio(v) {
      var prezzo = v.prezzo_override || v.prezzo || 0;
      var tagsHtml = (v.tags && v.tags.length)
        ? '<div class="prodotto-tags" style="justify-content:flex-start;margin-bottom:14px;">' + v.tags.map(function(t){ return tTag(t) ? '<span class="prodotto-tag">' + tTag(t) + '</span>' : ''; }).join('') + '</div>'
        : '';
      var allergeniHtml = (v.allergeni && v.allergeni.length)
        ? '<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;margin-bottom:14px;">' +
          '<div style="font-size:11px;font-weight:700;color:#92400e;margin-bottom:6px;">' + UIT("allerg") + '</div>' +
          '<div style="display:flex;flex-wrap:wrap;gap:6px;">' +
          v.allergeni.map(function(a){ return tAll(a) ? '<span style="background:#fef3c7;color:#92400e;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;">' + tAll(a) + '</span>' : ''; }).join('') +
          '</div></div>'
        : '';
      var fotoHtml = v.foto_url
        ? '<img src="' + esc(v.foto_url) + '" alt="' + esc(tN(v)) + '" style="width:100%;height:180px;object-fit:cover;border-radius:12px;margin-bottom:16px;cursor:pointer;" id="detail-foto">'
        : '';
      document.getElementById("detail-content").innerHTML =
        fotoHtml +
        '<div class="raccolta-title">' + esc(tN(v)) + '</div>' +
        tagsHtml +
        allergeniHtml +
        (tD(v) ? '<div style="font-size:15px;color:#374151;line-height:1.6;margin-bottom:16px;">' + esc(tD(v)) + '</div>' : '<div style="font-size:14px;color:#94a3b8;margin-bottom:16px;">' + UIT("no_desc") + '</div>') +
        '<div style="font-size:26px;font-weight:800;color:#111827;text-align:right;">' + Number(prezzo).toFixed(2) + ' €</div>';

      var fotoEl = document.getElementById("detail-foto");
      if (fotoEl) fotoEl.onclick = function() {
        document.getElementById("lb-img").src = v.foto_url;
        document.getElementById("lightbox").classList.add("open");
      };

      document.getElementById("detail-overlay").style.display = "flex";
    }
    document.getElementById("detail-overlay").onclick = function(e) {
      if (e.target === e.currentTarget) document.getElementById("detail-overlay").style.display = "none";
    };

    // ── CARRELLO A RIGHE ─────────────────────────────────────────
    function chiaveLinea(voceId, opz) {
      return voceId + "|" + (opz || []).map(function(o){ return o.id; }).sort().join(",");
    }
    function prezzoVoce(v) { return Number(v.prezzo_override || v.prezzo || 0); }
    function prezzoLinea(l) {
      var v = vociById[l.voce_id];
      return prezzoVoce(v) + (l.opz || []).reduce(function(t,o){ return t + Number(o.prezzo||0); }, 0);
    }
    function testoOpzioni(opz) {
      return (opz || []).map(function(o) {
        return (o.tipo === "togli" ? "senza " : "con ") + o.nome.toLowerCase();
      }).join(" · ");
    }
    function haOpzioni(voceId) {
      var g = opzPerVoce[voceId];
      return Array.isArray(g) && g.length > 0;
    }
    function ricalcolaContatori() {
      carrello = {};
      linee.forEach(function(l) { carrello[l.voce_id] = (carrello[l.voce_id] || 0) + l.qta; });
    }
    function aggiungiLinea(voceId, qta, opz) {
      var k = chiaveLinea(voceId, opz);
      var e = linee.filter(function(l){ return l.k === k; })[0];
      if (e) e.qta += qta;
      else linee.push({ k: k, voce_id: voceId, qta: qta, opz: opz || [] });
      ricalcolaContatori(); aggiornaCarrelloUI();
    }
    function modificaLinea(k, delta) {
      var e = linee.filter(function(l){ return l.k === k; })[0];
      if (!e) return;
      e.qta += delta;
      if (e.qta <= 0) linee = linee.filter(function(l){ return l.k !== k; });
      ricalcolaContatori(); aggiornaCarrelloUI();
    }
    function togliLinea(k) {
      linee = linee.filter(function(l){ return l.k !== k; });
      ricalcolaContatori(); aggiornaCarrelloUI();
    }

    // Il + sulla scheda del piatto: se ci sono aggiunte si apre la scheda,
    // altrimenti entra dritto nel carrello come prima.
    function modificaCarrello(voceId, delta) {
      if (delta > 0 && haOpzioni(voceId)) { apriOpzioni(voceId); return; }
      if (delta > 0) { aggiungiLinea(voceId, 1, []); }
      else {
        var senza = linee.filter(function(l){ return l.voce_id === voceId && (!l.opz || !l.opz.length); })[0];
        var qualsiasi = linee.filter(function(l){ return l.voce_id === voceId; }).slice(-1)[0];
        var t = senza || qualsiasi;
        if (t) modificaLinea(t.k, -1);
      }
      var valEl = document.getElementById("qtyval-" + voceId);
      if (valEl) valEl.textContent = carrello[voceId] || 0;
    }

    function totaleCarrello() {
      var tot = 0, count = 0;
      linee.forEach(function(l) {
        if (!vociById[l.voce_id]) return;
        tot += prezzoLinea(l) * l.qta; count += l.qta;
      });
      return { tot: tot, count: count };
    }

    function aggiornaCarrelloUI() {
      var r = totaleCarrello();
      var bar = document.getElementById("cart-bar");
      if (r.count > 0) {
        bar.classList.add("show");
        document.getElementById("cart-bar-count").textContent = r.count;
        document.getElementById("cart-bar-tot").textContent = r.tot.toFixed(2).replace(".", ",") + " €";
      } else { bar.classList.remove("show"); }
      document.querySelectorAll("[id^='qtyval-']").forEach(function(el) {
        var id = el.id.replace("qtyval-", "");
        el.textContent = carrello[id] || 0;
      });
    }

    // ── SCHEDA DEL PIATTO CON LE AGGIUNTE ────────────────────────
    var opzScelte = {}, opzVoce = null, opzQta = 1, opzLineaK = null;

    function apriOpzioni(voceId, lineaK) {
      var v = vociById[voceId]; if (!v) return;
      opzVoce = voceId; opzScelte = {}; opzQta = 1; opzLineaK = lineaK || null;
      if (lineaK) {
        var l = linee.filter(function(x){ return x.k === lineaK; })[0];
        if (l) { opzQta = l.qta; (l.opz||[]).forEach(function(o){ opzScelte[o.id] = o; }); }
      }
      var ov = document.getElementById("opz-overlay");
      if (!ov) {
        ov = document.createElement("div");
        ov.id = "opz-overlay"; ov.className = "raccolta-overlay";
        ov.innerHTML = '<div class="raccolta-box"><div id="opz-content"></div></div>';
        document.body.appendChild(ov);
        ov.onclick = function(e) { if (e.target === ov) ov.style.display = "none"; };
      }
      disegnaOpzioni();
      ov.style.display = "flex";
    }

    function disegnaOpzioni() {
      var v = vociById[opzVoce];
      var gruppi = opzPerVoce[opzVoce] || [];
      var html = '<div style="display:flex;justify-content:flex-end;margin-bottom:2px;">' +
        '<button id="opz-chiudi" style="background:none;border:none;padding:4px;font-size:20px;color:#94a3b8;line-height:1;">✕</button></div>' +
        '<div class="raccolta-title">' + esc(v.nome) + '</div>';
      if (v.descrizione) html += '<div class="raccolta-sub">' + esc(v.descrizione) + '</div>';

      gruppi.forEach(function(g) {
        var regola = g.tipo === "singola" ? "una scelta" :
                     (g.max ? "fino a " + g.max : "quante vuoi");
        html += '<div style="margin-top:16px;">' +
          '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">' +
            '<b style="font-size:14px;">' + esc(g.nome) + '</b>' +
            '<span style="font-size:11.5px;color:#64748b;">' + (g.obbligatorio ? "obbligatorio · " : "") + regola + '</span>' +
          '</div>';
        (g.opzioni || []).forEach(function(o) {
          var on = !!opzScelte[o.id];
          html += '<label style="display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #f1f5f9;font-size:14.5px;cursor:pointer;">' +
            '<input type="' + (g.tipo === "singola" ? "radio" : "checkbox") + '" ' +
              'data-opz="' + o.id + '" data-gruppo="' + g.gruppo_id + '" data-tipo="' + esc(g.tipo) + '" ' +
              'name="g' + g.gruppo_id + '" ' + (on ? "checked" : "") + ' style="width:19px;height:19px;accent-color:var(--brand);">' +
            '<span style="flex:1;">' + esc(o.nome) + '</span>' +
            (Number(o.prezzo) > 0 ? '<span style="font-size:13.5px;color:#64748b;font-weight:700;">+' + Number(o.prezzo).toFixed(2).replace(".", ",") + ' €</span>' : '') +
          '</label>';
        });
        html += '</div>';
      });

      var tot = (prezzoVoce(v) + Object.keys(opzScelte).reduce(function(t,k){ return t + Number(opzScelte[k].prezzo||0); }, 0)) * opzQta;
      html += '<div id="opz-errore" style="color:#dc2626;font-size:13px;margin-top:10px;"></div>' +
        '<div style="display:flex;gap:10px;align-items:center;margin-top:14px;">' +
          '<div style="display:flex;align-items:center;gap:10px;">' +
            '<button class="cart-qty-btn" id="opz-meno">−</button>' +
            '<b id="opz-qta">' + opzQta + '</b>' +
            '<button class="cart-qty-btn" id="opz-piu">+</button>' +
          '</div>' +
          '<button class="raccolta-btn" id="opz-add" style="flex:1;margin:0;">' +
            (opzLineaK ? "Aggiorna" : "Aggiungi") + ' · ' + tot.toFixed(2).replace(".", ",") + ' €</button>' +
        '</div>';

      document.getElementById("opz-content").innerHTML = html;

      document.getElementById("opz-chiudi").onclick = function() {
        document.getElementById("opz-overlay").style.display = "none";
      };
      document.querySelectorAll("#opz-content [data-opz]").forEach(function(inp) {
        inp.onchange = function() {
          var gruppo = inp.dataset.gruppo, id = inp.dataset.opz, tipo = inp.dataset.tipo;
          var g = (opzPerVoce[opzVoce] || []).filter(function(x){ return x.gruppo_id === gruppo; })[0];
          var o = (g.opzioni || []).filter(function(x){ return x.id === id; })[0];
          if (tipo === "singola") {
            (g.opzioni || []).forEach(function(x){ delete opzScelte[x.id]; });
            opzScelte[id] = { id: o.id, nome: o.nome, prezzo: o.prezzo, gruppo: g.nome, tipo: g.tipo };
          } else if (inp.checked) {
            var quanti = (g.opzioni || []).filter(function(x){ return opzScelte[x.id]; }).length;
            if (g.max && quanti >= g.max) {
              inp.checked = false;
              document.getElementById("opz-errore").textContent = "Puoi scegliere al massimo " + g.max + " " + g.nome.toLowerCase() + ".";
              return;
            }
            opzScelte[id] = { id: o.id, nome: o.nome, prezzo: o.prezzo, gruppo: g.nome, tipo: g.tipo };
          } else { delete opzScelte[id]; }
          disegnaOpzioni();
        };
      });
      document.getElementById("opz-meno").onclick = function() { if (opzQta > 1) { opzQta--; disegnaOpzioni(); } };
      document.getElementById("opz-piu").onclick = function() { opzQta++; disegnaOpzioni(); };
      document.getElementById("opz-add").onclick = function() {
        var gruppi = opzPerVoce[opzVoce] || [];
        for (var i = 0; i < gruppi.length; i++) {
          var g = gruppi[i];
          var quanti = (g.opzioni || []).filter(function(x){ return opzScelte[x.id]; }).length;
          if (g.obbligatorio && quanti < Math.max(1, g.min || 1)) {
            document.getElementById("opz-errore").textContent = "Scegli " + g.nome.toLowerCase() + ".";
            return;
          }
        }
        var scelte = Object.keys(opzScelte).map(function(k){ return opzScelte[k]; });
        if (opzLineaK) togliLinea(opzLineaK);
        aggiungiLinea(opzVoce, opzQta, scelte);
        document.getElementById("opz-overlay").style.display = "none";
        if (document.getElementById("cart-overlay").style.display === "flex") apriCarrello();
      };
    }

    function apriCarrello() {
      var r = totaleCarrello();
      var righeHtml = linee.map(function(l) {
        var v = vociById[l.voce_id]; if (!v) return "";
        var p = prezzoLinea(l), t = testoOpzioni(l.opz);
        return '<div class="cart-item-row" style="align-items:flex-start;">' +
          '<div style="flex:1;min-width:0;">' +
            '<div class="cart-item-nome">' + esc(v.nome) + '</div>' +
            (t ? '<div style="font-size:12px;color:#7c2d12;background:#fff7ed;border-radius:6px;padding:2px 6px;display:inline-block;margin:3px 0;">' + esc(t) + '</div>' : '') +
            '<div class="cart-item-prezzo">' + p.toFixed(2).replace(".", ",") + ' € × ' + l.qta + ' = ' + (p * l.qta).toFixed(2).replace(".", ",") + ' €</div>' +
            (haOpzioni(l.voce_id) ? '<button data-mod="' + l.k + '" style="background:none;border:none;padding:0;margin-top:4px;font-size:12px;font-weight:700;color:var(--brand);">Modifica le aggiunte</button>' : '') +
          '</div>' +
          '<div class="cart-qty-ctrl" style="margin-top:0;">' +
            '<button class="cart-qty-btn" data-cart-dec="' + l.k + '">−</button>' +
            '<span class="cart-qty-val">' + l.qta + '</span>' +
            '<button class="cart-qty-btn" data-cart-inc="' + l.k + '">+</button>' +
          '</div>' +
          '<button data-cart-del="' + l.k + '" style="background:none;border:none;color:#b91c1c;font-size:16px;padding:4px;">🗑</button>' +
        '</div>';
      }).join("");

      document.getElementById("cart-content").innerHTML =
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">' +
          '<button id="cart-indietro" style="background:none;border:none;padding:6px 0;font-size:14px;font-weight:700;color:var(--brand);">← Torna al menu</button>' +
          '<button id="cart-chiudi" style="background:none;border:none;padding:6px;font-size:20px;color:#94a3b8;line-height:1;">✕</button>' +
        '</div>' +
        '<div class="raccolta-title">🛒 Il tuo ordine</div>' +
        '<div style="margin:12px 0;">' + (righeHtml || '<div style="color:#94a3b8;font-size:13px;text-align:center;padding:16px 0;">Il carrello è vuoto.<br>Torna al menu e aggiungi qualcosa.</div>') + '</div>' +
        '<div style="display:flex;justify-content:space-between;font-size:18px;font-weight:800;padding-top:12px;border-top:2px solid #111827;margin-bottom:16px;">' +
          '<span>Totale</span><span>' + r.tot.toFixed(2).replace(".", ",") + ' €</span>' +
        '</div>' +
        '<button class="raccolta-btn" id="btn-vai-checkout"' + (r.count === 0 ? ' disabled style="opacity:.5;"' : '') + '>Procedi all\'ordine →</button>';

      document.getElementById("cart-indietro").onclick = function() {
        document.getElementById("cart-overlay").style.display = "none";
      };
      document.getElementById("cart-chiudi").onclick = function() {
        document.getElementById("cart-overlay").style.display = "none";
      };

      document.querySelectorAll("#cart-content [data-cart-dec]").forEach(function(b) {

      });
      document.querySelectorAll("#cart-content [data-cart-del]").forEach(function(b) {
        b.onclick = function() { togliLinea(b.dataset.cartDel); apriCarrello(); };
      });
      document.querySelectorAll("#cart-content [data-mod]").forEach(function(b) {
        b.onclick = function() {
          var l = linee.filter(function(x){ return x.k === b.dataset.mod; })[0];
          if (l) apriOpzioni(l.voce_id, l.k);
        };
      });
      var btnCheckout = document.getElementById("btn-vai-checkout");
      if (btnCheckout) btnCheckout.onclick = function() {
        document.getElementById("cart-overlay").style.display = "none";
        apriCheckout();
      };
      document.getElementById("cart-overlay").style.display = "flex";

    document.getElementById("cart-overlay").onclick = function(e) {

    // ── CHECKOUT ─────────────────────────────────────────────────
    function apriCheckout() {
      var luogoLabel = menu.luogo_consegna_label || "Tavolo";
      var chiediOrario = menu.richiedi_orario_consegna !== false;
      var puoiConsegna = !!menu.consegna_attiva;
      var puoiAsporto = !!menu.ritiro_attivo;
      var puoiTavolo = menu.tavolo_attivo !== false;
      // un menu da solo asporto e consegne non deve mostrare "Tavolo"
      if (!puoiTavolo && tipoOrdine === "tavolo") tipoOrdine = puoiConsegna ? "domicilio" : "asporto";
      var mem = ricordato();
      if (mem && mem.tipo && !apriCheckout._giaScelto) {
        tipoOrdine = mem.tipo; apriCheckout._giaScelto = true;
      }
      if (!puoiConsegna && tipoOrdine === "domicilio") tipoOrdine = puoiTavolo ? "tavolo" : "asporto";
      if (!puoiAsporto && tipoOrdine === "asporto") tipoOrdine = puoiTavolo ? "tavolo" : "domicilio";

      var modi = "";
      if ((puoiConsegna || puoiAsporto) && [puoiTavolo, puoiAsporto, puoiConsegna].filter(Boolean).length > 1) {
        function bottoneModo(v, ic, testo) {
          var on = tipoOrdine === v;
          return '<button data-modo="' + v + '" style="flex:1;border:2px solid ' + (on ? "var(--brand)" : "#e2e8f0") +
            ';background:' + (on ? "var(--brand-light)" : "#fff") + ';color:' + (on ? "var(--brand)" : "#475569") +
            ';border-radius:14px;padding:10px 6px;font-size:12.5px;font-weight:700;">' +
            '<span style="display:block;font-size:20px;">' + ic + '</span>' + testo + '</button>';
        }
        modi = '<div style="display:flex;gap:8px;margin:6px 0 16px;">' +
          (puoiTavolo ? bottoneModo("tavolo", "🍽", esc(luogoLabel)) : "") +
          (puoiAsporto ? bottoneModo("asporto", "🛍", "Asporto") : "") +
          (puoiConsegna ? bottoneModo("domicilio", "🛵", "A casa") : "") +
          '</div>';
      }

      var campiLuogo = "";
      if (tipoOrdine === "tavolo") {
        campiLuogo = '<div class="checkout-field"><label>' + esc(luogoLabel) + ' *</label>' +
          '<input id="chk-luogo" class="raccolta-input" placeholder="Es. 12"></div>';
      } else if (tipoOrdine === "domicilio") {
        campiLuogo =
          '<button id="chk-gps" style="width:100%;border:1.5px solid var(--brand);background:#fff;color:var(--brand);border-radius:11px;padding:11px;font-size:14px;font-weight:700;margin-bottom:10px;">📍 Usa la mia posizione</button>' +
          '<div class="checkout-field"><label>Via *</label><input id="chk-via" class="raccolta-input" autocomplete="off" placeholder="Via Roma"><div id="chk-sugg"></div></div>' +
          '<div style="display:flex;gap:8px;">' +
            '<div class="checkout-field" style="flex:1;"><label>Civico *</label><input id="chk-civico" class="raccolta-input" placeholder="12"></div>' +
            '<div class="checkout-field" style="flex:1;"><label>CAP</label><input id="chk-cap" class="raccolta-input" inputmode="numeric" placeholder="01028"></div>' +
          '</div>' +
          '<div class="checkout-field"><label>Città</label><input id="chk-citta" class="raccolta-input" placeholder="Orte"></div>' +
          '<div style="display:flex;gap:8px;">' +
            '<div class="checkout-field" style="flex:1;"><label>Campanello</label><input id="chk-campanello" class="raccolta-input"></div>' +
            '<div class="checkout-field" style="flex:1;"><label>Piano</label><input id="chk-piano" class="raccolta-input"></div>' +
          '</div>' +
          '<div id="chk-mappa-wrap" style="display:none;margin-bottom:10px;">' +
            '<label style="font-size:12px;font-weight:700;color:#374151;display:block;margin-bottom:4px;">Sposta lo spillo sul portone</label>' +
            '<div id="chk-mappa" style="height:160px;border-radius:12px;overflow:hidden;border:1px solid #e2e8f0;"></div>' +
            '<div style="font-size:11.5px;color:#64748b;margin-top:4px;">Chi consegna apre questo punto sulle mappe.</div>' +
          '</div>' +
          '<div class="checkout-field"><label>Note per chi consegna</label><input id="chk-note-consegna" class="raccolta-input" placeholder="Cancello verde, citofono in basso"></div>';
      }

      document.getElementById("checkout-content").innerHTML =
        '<div style="display:flex;justify-content:space-between;align-items:center;margin:-24px -20px 10px;padding:14px 20px 10px;position:sticky;top:-24px;background:#fff;z-index:5;border-bottom:1px solid #f1f5f9;">' +
          '<button id="chk-indietro" style="background:none;border:none;padding:6px 0;font-size:14px;font-weight:700;color:var(--brand);">← Il tuo ordine</button>' +
          '<button id="chk-chiudi" style="background:none;border:none;padding:6px;font-size:20px;color:#94a3b8;line-height:1;">✕</button>' +
        '</div>' +
        '<div class="raccolta-title">I tuoi dati</div>' +
        modi +
        '<div class="checkout-field"><label>Nome e cognome *</label><input id="chk-nome" class="raccolta-input" placeholder="Mario Rossi"></div>' +
        '<div class="checkout-field"><label>Telefono *</label><input id="chk-tel" class="raccolta-input" type="tel" placeholder="333 1234567"></div>' +
        '<div class="checkout-field"><label>Email *</label><input id="chk-email" class="raccolta-input" type="email" placeholder="mario@email.it"></div>' +
        campiLuogo +
        (chiediOrario ? '<div class="checkout-field"><label>Quando lo vuoi</label><div id="chk-slot"></div>' +
          '<input id="chk-orario" class="raccolta-input" placeholder="Es. 20:30 oppure appena pronto"></div>' : '') +
        '<div class="checkout-field"><label>Allergie o intolleranze</label><textarea id="chk-allergie" class="raccolta-input" style="min-height:50px;resize:vertical;" placeholder="Se non ce ne sono lascia vuoto"></textarea></div>' +
        (tipoOrdine === "domicilio" ? '<div class="checkout-field"><label>Mancia per chi consegna</label><div id="chk-mancia"></div></div>' : '') +
        '<div id="chk-conto" style="background:#f8fafc;border-radius:12px;padding:12px 14px;font-size:14px;margin:12px 0;"></div>' +
        '<div id="chk-errore" style="color:#dc2626;font-size:13px;margin-bottom:10px;"></div>' +
        '<button class="raccolta-btn" id="btn-paga">💳 Paga con carta</button>' +
        '<button class="raccolta-btn" id="btn-consegna" style="background:#fff;color:var(--brand);border:1.5px solid #cbd5e1;margin-top:8px;">💶 Pago alla consegna</button>';

      document.getElementById("chk-indietro").onclick = function() {
        document.getElementById("checkout-overlay").style.display = "none";
        apriCarrello();
      };
      document.getElementById("chk-chiudi").onclick = function() {
        document.getElementById("checkout-overlay").style.display = "none";
      };
      document.querySelectorAll("#checkout-content [data-modo]").forEach(function(b) {
        b.onclick = function() { tipoOrdine = b.dataset.modo; consegna = { costo: 0, zona: null, errore: null }; apriCheckout(); };
      });
      document.getElementById("btn-paga").onclick = function() { inviaOrdine("carta"); };
      document.getElementById("btn-consegna").onclick = function() { inviaOrdine("alla_consegna"); };
      if (tipoOrdine === "domicilio") preparaIndirizzo();
      riempiRicordato();
      preparaRiconoscimento();
      disegnaMancia();
      caricaSlot();
      if (tipoOrdine === "domicilio" && pos.lat != null) { mostraMappa(); calcolaConsegna(); }
      disegnaConto();
      document.getElementById("checkout-overlay").style.display = "flex";

    // Le fasce orarie: se il locale le ha impostate, il campo libero sparisce e
    // si scegli fra quelle ancora aperte. Le piene non compaiono proprio.
    function caricaSlot() {
      var box = document.getElementById("chk-slot");
      var libero = document.getElementById("chk-orario");
      if (!box) return;
      var oggi = new Date();
      var giorni = [0, 1].map(function(d) {
        var x = new Date(oggi.getTime() + d * 86400000);
        return x.getFullYear() + "-" + ("0"+(x.getMonth()+1)).slice(-2) + "-" + ("0"+x.getDate()).slice(-2);
      });
      dataScelta = dataScelta || giorni[0];

      rpc("slot_disponibili", { p_menu: menu.id, p_data: dataScelta, p_tipo: tipoOrdine })
        .then(function(d) {
          if (!d || !d.ok || !d.slot || !d.slot.length) {
            slotDisponibili = [];
            box.innerHTML = "";
            if (libero) libero.style.display = "block";
            return;
          }
          slotDisponibili = d.slot;
          if (libero) { libero.style.display = "none"; libero.value = ""; }

          var etichette = [["Oggi", giorni[0]], ["Domani", giorni[1]]];
          var html = '<div style="display:flex;gap:8px;margin-bottom:8px;">' +
            etichette.map(function(e) {
              var on = dataScelta === e[1];
              return '<button data-giorno="' + e[1] + '" style="flex:1;border:1.5px solid ' + (on ? "var(--brand)" : "#e2e8f0") +
                ';background:' + (on ? "var(--brand-light)" : "#fff") + ';color:' + (on ? "var(--brand)" : "#475569") +
                ';border-radius:10px;padding:8px;font-size:13px;font-weight:700;">' + e[0] + '</button>';
            }).join("") + '</div>';

          html += '<div style="display:flex;flex-wrap:wrap;gap:6px;">' +
            d.slot.filter(function(s) { return !s.pieno; }).map(function(s) {
              var on = slotScelto === s.ora;
              return '<button data-slot="' + s.ora + '" style="border:1.5px solid ' + (on ? "var(--brand)" : "#e2e8f0") +
                ';background:' + (on ? "var(--brand-light)" : "#fff") + ';color:' + (on ? "var(--brand)" : "#334155") +
                ';border-radius:9px;padding:8px 12px;font-size:13.5px;font-weight:700;">' + s.ora + '</button>';
            }).join("") + '</div>';

          var pieni = d.slot.filter(function(s) { return s.pieno; }).length;
          if (pieni) html += '<div style="font-size:11.5px;color:#64748b;margin-top:6px;">' +
            pieni + (pieni === 1 ? ' fascia è al completo' : ' fasce sono al completo') + '.</div>';

          box.innerHTML = html;
          box.querySelectorAll("[data-giorno]").forEach(function(b) {
            b.onclick = function(e) { e.preventDefault(); dataScelta = b.dataset.giorno; slotScelto = null; caricaSlot(); };
          });
          box.querySelectorAll("[data-slot]").forEach(function(b) {
            b.onclick = function(e) { e.preventDefault(); slotScelto = b.dataset.slot; caricaSlot(); };
          });
        }).catch(function() {
          if (libero) libero.style.display = "block";
        });
    }

    // Se ha svuotato la memoria o cambiato telefono, il numero basta a
    // ritrovare i suoi dati: li cerca sull'ultimo ordine fatto in questo locale.
    function preparaRiconoscimento() {
      var tel = document.getElementById("chk-tel"); if (!tel) return;
      var avviso = document.createElement("div");
      avviso.id = "chk-riconosciuto";
      avviso.style.cssText = "font-size:12.5px;margin-top:5px;";
      tel.parentNode.appendChild(avviso);

      var timer = null;
      tel.oninput = function() {
        clearTimeout(timer);
        var n = tel.value.replace(/\D/g, "");
        if (n.length < 8) { avviso.innerHTML = ""; return; }
        timer = setTimeout(function() { cercaCliente(n, avviso); }, 700);
      };
    }

    function cercaCliente(numero, avviso) {
      // se i campi sono gia' pieni non si disturba nessuno
      var via = document.getElementById("chk-via");
      var nome = document.getElementById("chk-nome");
      if (nome && nome.value && (!via || via.value)) return;

      avviso.innerHTML = '<span style="color:#94a3b8;">Cerco i tuoi dati…</span>';
      rpc("cliente_ricorda", { p_menu: menu.id, p_telefono: numero }).then(function(d) {
        if (!d || !d.ok) { avviso.innerHTML = ""; return; }
        avviso.innerHTML = '<span style="color:var(--brand);font-weight:700;">Bentornato' +
          (d.nome ? " " + esc(d.nome.split(" ")[0]) : "") + '!</span> ' +
          '<button id="chk-usa-dati" style="background:none;border:none;padding:0;color:var(--brand);font-weight:700;font-size:12.5px;text-decoration:underline;">Usa i dati dell\'ultima volta</button>';
        document.getElementById("chk-usa-dati").onclick = function(e) {
          e.preventDefault();
          [["chk-nome","nome"],["chk-email","email"],["chk-via","indirizzo"],["chk-civico","civico"],
           ["chk-cap","cap"],["chk-citta","citta"],["chk-campanello","campanello"],
           ["chk-piano","piano"],["chk-note-consegna","note_consegna"]].forEach(function(x) {
            var el = document.getElementById(x[0]);
            if (el && d[x[1]]) el.value = d[x[1]];
          });
          if (d.lat) { pos = { lat: Number(d.lat), lng: Number(d.lng), gps: false }; mostraMappa(); }
          ricorda();
          calcolaConsegna();
          avviso.innerHTML = '<span style="color:#15803d;font-weight:700;">Dati compilati ✓</span>';
        };
      }).catch(function() { avviso.innerHTML = ""; });
    }

    // La mancia e' del rider, non del locale: si sceglie qui e si vede a parte.
    function disegnaMancia() {
      var box = document.getElementById("chk-mancia"); if (!box) return;
      var voci = [0, 1, 2, 3, 5];
      box.innerHTML = '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
        voci.map(function(v) {
          var on = mancia === v;
          return '<button data-mancia="' + v + '" style="flex:1;min-width:62px;border:1.5px solid ' +
            (on ? "var(--brand)" : "#e2e8f0") + ';background:' + (on ? "var(--brand-light)" : "#fff") +
            ';color:' + (on ? "var(--brand)" : "#475569") +
            ';border-radius:10px;padding:9px 6px;font-size:13.5px;font-weight:700;">' +
            (v === 0 ? "No" : v + " €") + '</button>';
        }).join("") + '</div>' +
        '<div style="font-size:11.5px;color:#64748b;margin-top:5px;">Va tutta a chi porta l\'ordine.</div>';
      box.querySelectorAll("[data-mancia]").forEach(function(b) {
        b.onclick = function(e) { e.preventDefault(); mancia = Number(b.dataset.mancia); disegnaMancia(); disegnaConto(); };
      });
    }

    function disegnaConto() {
      var box = document.getElementById("chk-conto"); if (!box) return;
      var r = totaleCarrello();
      var html = '<div style="display:flex;justify-content:space-between;padding:3px 0;"><span>Piatti</span><span>' +
        r.tot.toFixed(2).replace(".", ",") + ' €</span></div>';
      if (tipoOrdine === "domicilio") {
        if (consegna.errore) {
          html += '<div style="color:#b91c1c;font-size:13px;padding:6px 0;">' + esc(consegna.errore) + '</div>';
        } else {
          html += '<div style="display:flex;justify-content:space-between;padding:3px 0;"><span>Consegna' +
            (consegna.zona ? ' · ' + esc(consegna.zona) : '') + '</span><span>' +
            (consegna.costo > 0 ? consegna.costo.toFixed(2).replace(".", ",") + ' €' : '<b style="color:#15803d;">gratis</b>') +
            '</span></div>';
        }
      }
      if (tipoOrdine === "domicilio" && mancia > 0) {
        html += '<div style="display:flex;justify-content:space-between;padding:3px 0;"><span>Mancia al rider</span><span>' +
          mancia.toFixed(2).replace(".", ",") + ' €</span></div>';
      }
      html += '<div style="display:flex;justify-content:space-between;border-top:1px solid #e2e8f0;margin-top:6px;padding-top:8px;font-weight:800;font-size:16px;">' +
        '<span>Totale</span><span>' + (r.tot + (tipoOrdine === "domicilio" ? consegna.costo + mancia : 0)).toFixed(2).replace(".", ",") + ' €</span></div>';
      box.innerHTML = html;
    }

    // ── INDIRIZZO, POSIZIONE, MAPPA ──────────────────────────────
    var mappa = null, spillo = null, timerSugg = null;

    function preparaIndirizzo() {
      document.getElementById("chk-gps").onclick = function(e) {
        e.preventDefault();
        var b = e.currentTarget; b.textContent = "📍 Cerco la posizione…";
        if (!navigator.geolocation) { b.textContent = "📍 Posizione non disponibile"; return; }
        navigator.geolocation.getCurrentPosition(function(p) {
          pos = { lat: p.coords.latitude, lng: p.coords.longitude, gps: true };
          b.textContent = "📍 Posizione presa";
          indirizzoDaPosizione(pos.lat, pos.lng);
          mostraMappa();
          calcolaConsegna();
        }, function() {
          b.textContent = "📍 Non riesco: scrivi l'indirizzo";
        }, { enableHighAccuracy: true, timeout: 10000 });
      };

      var via = document.getElementById("chk-via");
      via.oninput = function() {
        clearTimeout(timerSugg);
        var q = via.value.trim();
        if (q.length < 4) { document.getElementById("chk-sugg").innerHTML = ""; return; }
        timerSugg = setTimeout(function() { cercaIndirizzo(q); }, 500);
      };
      ["chk-cap", "chk-civico"].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.onchange = calcolaConsegna;
      });
    }

    // Suggerimenti: Google se il locale ha messo la chiave, altrimenti
    // OpenStreetMap che non costa niente e in centro basta.
    function cercaIndirizzo(q) {
      var citta = (document.getElementById("chk-citta").value || (sede && sede.citta) || "").trim();
      var url = "https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=it&q=" +
        encodeURIComponent(q + (citta ? " " + citta : ""));
      fetch(url, { headers: { "Accept-Language": "it" } })
        .then(function(r) { return r.json(); })
        .then(function(lista) {
          document.getElementById("chk-sugg").innerHTML = (lista || []).map(function(x, i) {
            return '<button data-sugg="' + i + '" style="display:block;width:100%;text-align:left;background:#f8fafc;border:1px solid #e2e8f0;border-radius:9px;padding:8px 10px;margin-top:4px;font-size:13px;">' +
              esc(x.display_name.split(",").slice(0, 3).join(",")) + '</button>';
          }).join("");
          document.querySelectorAll("#chk-sugg [data-sugg]").forEach(function(b) {
            b.onclick = function(e) {
              e.preventDefault();
              var x = lista[Number(b.dataset.sugg)];
              var a = x.address || {};
              document.getElementById("chk-via").value = a.road || x.display_name.split(",")[0];
              if (a.house_number) document.getElementById("chk-civico").value = a.house_number;
              if (a.postcode) document.getElementById("chk-cap").value = a.postcode;
              if (a.city || a.town || a.village) document.getElementById("chk-citta").value = a.city || a.town || a.village;
              pos = { lat: Number(x.lat), lng: Number(x.lon), gps: false };
              document.getElementById("chk-sugg").innerHTML = "";
              mostraMappa(); calcolaConsegna();
            };
          });
        }).catch(function(){});
    }

    function indirizzoDaPosizione(lat, lng) {
      fetch("https://nominatim.openstreetmap.org/reverse?format=json&lat=" + lat + "&lon=" + lng,
        { headers: { "Accept-Language": "it" } })
        .then(function(r) { return r.json(); })
        .then(function(x) {
          var a = (x && x.address) || {};
          if (a.road) document.getElementById("chk-via").value = a.road;
          if (a.house_number) document.getElementById("chk-civico").value = a.house_number;
          if (a.postcode) document.getElementById("chk-cap").value = a.postcode;
          if (a.city || a.town || a.village) document.getElementById("chk-citta").value = a.city || a.town || a.village;
          calcolaConsegna();
        }).catch(function(){});
    }

    function mostraMappa() {
      if (pos.lat == null) return;
      var wrap = document.getElementById("chk-mappa-wrap");
      if (!wrap) return;
      wrap.style.display = "block";
      if (!window.L) {
        var css = document.createElement("link"); css.rel = "stylesheet";
        css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
        document.head.appendChild(css);
        var js = document.createElement("script");
        js.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
        js.onload = disegnaMappa;
        document.head.appendChild(js);
      } else { disegnaMappa(); }
    }

    function disegnaMappa() {
      if (!window.L || pos.lat == null) return;
      if (!mappa) {
        mappa = L.map("chk-mappa").setView([pos.lat, pos.lng], 17);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19, attribution: "© OpenStreetMap"
        }).addTo(mappa);
        spillo = L.marker([pos.lat, pos.lng], { draggable: true }).addTo(mappa);
        spillo.on("dragend", function() {
          var p = spillo.getLatLng();
          pos = { lat: p.lat, lng: p.lng, gps: false };
          indirizzoDaPosizione(p.lat, p.lng);   // via e civico si riempiono da soli
          calcolaConsegna();
        });
      } else {
        mappa.setView([pos.lat, pos.lng], 17);
        spillo.setLatLng([pos.lat, pos.lng]);
      }
      setTimeout(function() { mappa.invalidateSize(); }, 200);
    }

    function calcolaConsegna() {
      if (tipoOrdine !== "domicilio") return;
      var r = totaleCarrello();
      var cap = (document.getElementById("chk-cap") || {}).value || "";
      fetch(ORDINI_EDGE_URL, {
        method: "POST", headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ azione: "costo_consegna", menu_id: menu.id,
          subtotale: r.tot, cap: cap.trim(), lat: pos.lat, lng: pos.lng })
      }).then(function(x) { return x.json(); })
        .then(function(d) {
          if (d && d.ok) consegna = { costo: Number(d.costo) || 0, zona: d.zona || null, errore: null };
          else consegna = { costo: 0, zona: null, errore: (d && d.errore) || "Consegna non disponibile" };
          disegnaConto();
        }).catch(function(){});
    }

    async function inviaOrdine(modo) {
      var nome = document.getElementById("chk-nome").value.trim();
      var tel = document.getElementById("chk-tel").value.trim();
      var email = document.getElementById("chk-email").value.trim();
      var orarioEl = document.getElementById("chk-orario");
      var orario = orarioEl ? orarioEl.value.trim() : "";
      var allergie = document.getElementById("chk-allergie").value.trim();
      var erroreBox = document.getElementById("chk-errore");
      erroreBox.textContent = "";

      if (!nome || !tel || !email) { erroreBox.textContent = "Compila nome, telefono ed email."; return; }
      if (slotDisponibili.length && !slotScelto) { erroreBox.textContent = "Scegli a che ora lo vuoi."; return; }

      var dati = {
        azione: "crea_ordine", menu_id: menu.id, tipo_consegna: tipoOrdine,
        cliente_nome: nome, cliente_telefono: tel, cliente_email: email,
        orario_consegna: slotScelto || orario, allergie_note: allergie,
        data_consegna: slotScelto ? dataScelta : null, slot_inizio: slotScelto || null,
        pagamento: modo === "alla_consegna" ? "alla_consegna" : "carta",
        mancia: tipoOrdine === "domicilio" ? mancia : 0,
        righe: linee.map(function(l) {
          return { menu_voce_id: l.voce_id, quantita: l.qta,
                   opzioni: (l.opz || []).map(function(o){ return o.id; }) };
        }),
        success_url: window.location.href.split("?")[0] + "?slug=" + slug + "&ordine=ok",
        cancel_url: window.location.href
      };
      if (!dati.righe.length) { erroreBox.textContent = "Il carrello è vuoto."; return; }

      if (tipoOrdine === "tavolo") {
        var luogo = document.getElementById("chk-luogo").value.trim();
        if (!luogo) { erroreBox.textContent = "Manca il numero del " + (menu.luogo_consegna_label || "tavolo").toLowerCase() + "."; return; }
        dati.luogo_consegna_label = menu.luogo_consegna_label || "Tavolo";
        dati.luogo_consegna_valore = luogo;
      } else if (tipoOrdine === "domicilio") {
        dati.indirizzo = document.getElementById("chk-via").value.trim();
        dati.civico = document.getElementById("chk-civico").value.trim();
        dati.cap = document.getElementById("chk-cap").value.trim();
        dati.citta = document.getElementById("chk-citta").value.trim();
        dati.campanello = document.getElementById("chk-campanello").value.trim();
        dati.piano = document.getElementById("chk-piano").value.trim();
        dati.note_consegna = document.getElementById("chk-note-consegna").value.trim();
        dati.lat = pos.lat; dati.lng = pos.lng; dati.posizione_da_gps = pos.gps;
        if (!dati.indirizzo && pos.lat == null) {
          erroreBox.textContent = "Scrivi la via oppure metti lo spillo sulla mappa.";
          return;
        }
        if (!dati.indirizzo) dati.indirizzo = "Punto sulla mappa";
        if (consegna.errore) { erroreBox.textContent = consegna.errore; return; }
      }

      ricorda();
      var btn = document.getElementById(modo === "alla_consegna" ? "btn-consegna" : "btn-paga");
      var testoBtn = btn.textContent;
      btn.disabled = true; btn.textContent = "⏳ Un attimo…";

      try {
        var res = await fetch(ORDINI_EDGE_URL, {
          method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(dati)
        });
        var testo = await res.text();
        var out;
        try { out = JSON.parse(testo); } catch (e) { throw new Error("Risposta non leggibile dal server"); }
        if (!out.success) throw new Error(out.error || "Errore nella creazione dell'ordine");
        if (out.checkout_url) { window.location.href = out.checkout_url; return; }
        // pagamento alla consegna: si va alla pagina di stato dell'ordine
        window.location.href = "/ordine.html?t=" + encodeURIComponent(out.token);
      } catch (err) {
        erroreBox.textContent = "Errore: " + err.message;
        btn.disabled = false; btn.textContent = testoBtn;
      }
    }

    function showError(title, sub) {
      root.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px;text-align:center;gap:12px;"><div style="font-size:56px;">😕</div><div style="font-size:20px;font-weight:800;">' + esc(title) + '</div><div style="font-size:13px;color:#64748b;">' + esc(sub) + '</div></div>';
    }

    function esc(v) {
      return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
  })();
  </script>
</body>
</html>
