<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Menu</title>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#0E5A7A"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--brand:#0E5A7A;--brand-light:#e8f4f8;--sfondo:#f8fafc;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--sfondo);min-height:100vh;color:#111827;}

    /* LOADER */
    .page-loader{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;color:#64748b;}
    .spinner{width:44px;height:44px;border:4px solid var(--brand-light);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* HERO SOCIAL */
    .menu-cover{position:relative;width:100%;height:200px;background:var(--brand);overflow:hidden;flex-shrink:0;}
    .menu-cover img{width:100%;height:100%;object-fit:cover;display:block;}
    .menu-cover-slides{position:relative;width:100%;height:100%;}
    .cover-slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s ease;}
    .cover-slide.active{opacity:1;}
    .cover-dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3;}
    .cover-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);transition:all .2s;}
    .cover-dot.active{background:#fff;width:16px;border-radius:3px;}
    .menu-cover-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,0.4) 100%);}
    .menu-profile-row{display:flex;align-items:flex-end;gap:14px;padding:0 16px 16px;margin-top:-36px;position:relative;z-index:2;background:var(--sfondo);}
    .menu-logo-wrap{width:84px;height:84px;border-radius:50%;border:4px solid var(--sfondo);overflow:hidden;background:#e5e7eb;flex-shrink:0;box-shadow:0 2px 12px rgba(0,0,0,0.15);}
    .menu-logo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
    .menu-logo-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--brand-light);}
    .menu-info{padding-bottom:6px;flex:1;min-width:0;}
    .menu-locale-nome{font-size:22px;font-weight:800;color:#111827;line-height:1.3;word-break:break-word;}
    .menu-locale-sottotitolo{font-size:14px;font-weight:600;color:var(--brand);margin-top:1px;letter-spacing:.3px;}
    .menu-locale-desc{font-size:14px;color:#64748b;margin-top:2px;}

    /* NAV CATEGORIE — pillole scure + punti di paginazione, stile "social" */
    .cat-nav{background:var(--sfondo);border-bottom:none;position:sticky;top:0;z-index:20;overflow-x:auto;display:flex;gap:10px;padding:14px 14px 4px;scrollbar-width:none;}
    .cat-nav::-webkit-scrollbar{display:none;}
    .cat-nav-btn{padding:16px 22px;border:none;border-radius:14px;background:#2d3748;cursor:pointer;font-size:16px;font-weight:700;color:#fff;white-space:nowrap;transition:all .15s;flex-shrink:0;}
    .cat-nav-btn.active{background:var(--brand);}
    .cat-dots{display:flex;justify-content:center;gap:7px;padding:10px 0 4px;background:var(--sfondo);}
    .cat-dot{width:8px;height:8px;border-radius:50%;background:#d1d5db;transition:all .2s;}
    .cat-dot.active{background:#dc2626;width:9px;height:9px;}

    /* FILTRI */
    .filtri-bar{padding:10px 12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;background:#fff;border-bottom:1px solid #f3f4f6;}
    .filtri-bar::-webkit-scrollbar{display:none;}
    .filtro-chip{border:1.5px solid #e5e7eb;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;background:#fff;color:#374151;transition:all .15s;flex-shrink:0;}
    .filtro-chip.active{background:var(--brand);color:#fff;border-color:var(--brand);}

    /* SEZIONI CATEGORIA — accordion: chiuse, si aprono al click */
    .cat-accordion{margin:16px 0 0;background:transparent;}
    .cat-acc-header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#9ca3af;cursor:pointer;user-select:none;}
    .cat-acc-img{width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;}
    .cat-acc-img-empty{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
    .cat-acc-info{flex:1;min-width:0;}
    .cat-acc-nome{font-size:22px;font-weight:800;color:#fff;text-align:center;flex:1;}
    .cat-acc-desc{font-size:13px;color:rgba(255,255,255,.85);margin-top:1px;}
    .cat-acc-orario{font-size:12px;font-weight:700;color:#fff;margin-top:1px;}
    .cat-acc-right{display:flex;align-items:center;flex-shrink:0;}
    .cat-acc-arrow{font-size:20px;color:#fff;transition:transform .2s;display:inline-block;}
    .cat-acc-arrow.open{transform:rotate(180deg);}
    .cat-acc-body{display:none;padding:0;}
    .cat-acc-body.open{display:block;}
    .cat-acc-preview{width:100%;height:180px;object-fit:cover;display:block;cursor:pointer;}

    /* CARD PRODOTTO — foto grande a piena larghezza in alto */
    .prodotto-card{background:#fff;margin-bottom:0;overflow:hidden;display:flex;flex-direction:column;border-bottom:1px solid #e5e7eb;}
    .prodotto-card.non-disp{opacity:.5;}
    .prodotto-body{flex:1;padding:18px 16px;min-width:0;}
    .prodotto-nome{font-size:24px;font-weight:700;color:#111827;margin-bottom:8px;text-align:center;}
    .prodotto-desc{font-size:15px;color:#4b5563;line-height:1.5;margin-bottom:14px;text-align:center;}
    .prodotto-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;justify-content:center;}
    .prodotto-tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--brand-light);color:var(--brand);}
    .prodotto-tag.chef{background:#fef3c7;color:#92400e;}
    .prodotto-tag.non-disp-tag{background:#fee2e2;color:#dc2626;}
    .prodotto-riga-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #f1f5f9;padding-top:12px;margin-top:4px;}
    .prodotto-prezzo{font-size:22px;font-weight:800;color:#111827;}
    .prodotto-dettaglio-btn{background:#dc2626;color:#fff;border:none;border-radius:999px;padding:12px 24px;font-size:14px;font-weight:800;letter-spacing:.5px;cursor:pointer;text-transform:uppercase;}
    .prodotto-foto-wrap{width:100%;height:280px;flex-shrink:0;position:relative;}
    .prodotto-foto{width:100%;height:100%;object-fit:cover;display:block;}
    .prodotto-foto-empty{width:100%;height:100%;background:var(--brand-light);display:flex;align-items:center;justify-content:center;font-size:48px;}

    /* RACCOLTA DATI */
    .raccolta-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
    .raccolta-box{background:#fff;border-radius:24px 24px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
    .raccolta-handle{width:40px;height:4px;background:#d1d5db;border-radius:999px;margin:0 auto 16px;}
    .raccolta-title{font-size:18px;font-weight:800;margin-bottom:4px;}
    .raccolta-sub{font-size:13px;color:#64748b;margin-bottom:20px;line-height:1.5;}
    .raccolta-input{width:100%;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:15px;outline:none;margin-bottom:10px;font-family:inherit;}
    .raccolta-input:focus{border-color:var(--brand);}
    .raccolta-btn{width:100%;background:var(--brand);color:#fff;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;}

    /* FIDELITY BOX */
    .fidelity-promo{background:linear-gradient(135deg,#059669,#10b981);border-radius:18px;margin:12px 12px 0;padding:16px;color:#fff;display:flex;align-items:center;gap:14px;}
    .fidelity-promo-qr{width:72px;height:72px;border-radius:10px;border:2px solid rgba(255,255,255,.3);flex-shrink:0;}
    .fidelity-promo-title{font-size:15px;font-weight:800;margin-bottom:2px;}
    .fidelity-promo-sub{font-size:12px;opacity:.9;line-height:1.4;}

    /* LIGHTBOX */
    .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:300;display:none;align-items:center;justify-content:center;}
    .lightbox.open{display:flex;}
    .lightbox img{max-width:95vw;max-height:90vh;border-radius:12px;object-fit:contain;}
    .lightbox-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.2);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;}

    /* FOOTER */
    .menu-footer{text-align:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom));font-size:11px;color:#9ca3af;}
    .menu-footer a{color:var(--brand);text-decoration:none;}

    /* NON DISPONIBILE BADGE */
    .non-disp-badge{position:absolute;top:8px;right:8px;background:rgba(220,38,38,.85);color:#fff;border-radius:6px;padding:2px 6px;font-size:10px;font-weight:700;}

    @media(min-width:480px){
      body{display:flex;flex-direction:column;align-items:center;}
      .menu-cover,.menu-profile-row,.cat-nav,.filtri-bar,.cat-section,.fidelity-promo,.menu-footer{max-width:480px;width:100%;}
      .raccolta-box{border-radius:20px;}
    }

    /* PULSANTE STAMPA */
    .btn-stampa-menu{position:fixed;bottom:20px;right:20px;background:var(--brand);color:#fff;border:none;border-radius:999px;padding:14px 20px;font-size:14px;font-weight:800;box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:pointer;z-index:50;display:flex;align-items:center;gap:8px;}

    /* STAMPA — una pagina A4 per categoria, niente fronzoli */
    #stampa-output{ display:none; }

    @media print{
      @page{ size:A4; margin:12mm; }
      body{ background:#fff; }
      body > *:not(#stampa-output){ display:none!important; }
      #stampa-output{ display:block!important; }
      .stampa-pagina{ page-break-after:always; break-after:page; }
      .stampa-pagina:last-child{ page-break-after:auto; break-after:auto; }
      .stampa-header{ display:flex; align-items:center; gap:12px; border-bottom:2px solid var(--brand); padding-bottom:8px; margin-bottom:14px; }
      .stampa-logo{ width:40px; height:40px; border-radius:50%; object-fit:cover; }
      .stampa-titolo-cat{ font-size:22px; font-weight:800; color:var(--brand); }
      .stampa-locale{ font-size:11px; color:#64748b; margin-left:auto; }
      .stampa-riga{ display:flex; align-items:flex-start; gap:12px; padding:8px 0; border-bottom:1px solid #e5e7eb; }
      .stampa-riga-foto{ width:56px; height:56px; border-radius:8px; object-fit:cover; flex-shrink:0; }
      .stampa-riga-foto-vuota{ width:56px; height:56px; border-radius:8px; background:#f1f5f9; flex-shrink:0; }
      .stampa-riga-testo{ flex:1; min-width:0; }
      .stampa-riga-nome{ font-size:13px; font-weight:700; color:#111827; }
      .stampa-riga-desc{ font-size:10.5px; color:#6b7280; line-height:1.35; margin-top:2px; }
      .stampa-riga-prezzo{ font-size:14px; font-weight:800; color:#111827; white-space:nowrap; flex-shrink:0; padding-top:1px; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="page-loader"><div class="spinner"></div><div>Caricamento menu...</div></div>
  </div>
  <div id="stampa-output"></div>
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lb-close">✕</button>
    <img id="lb-img" src="" alt="">
  </div>

  <div class="raccolta-overlay" id="detail-overlay" style="display:none;">
    <div class="raccolta-box" id="detail-box">
      <div class="raccolta-handle"></div>
      <div id="detail-content"></div>
    </div>
  </div>

  <script>
  (function() {
    var EDGE_URL = "https://cuhcscpvhypoaplcmtjk.supabase.co/functions/v1/Menu-pubblico-api-index";
    var SUPA_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1aGNzY3B2aHlwb2FwbGNtdGprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4MjY4MjgsImV4cCI6MjA3OTQwMjgyOH0.q9zAs0oh8F1-whtORHBIORF5jIn1NTS3LvSMWleP0a0";
    var root = document.getElementById("root");
    var params = new URLSearchParams(window.location.search);
    var slug = params.get("slug");

    if (!slug) { showError("Menu non trovato", "Il link non è valido."); return; }

    var menu = null, azienda = null, categorie = [], tutteVoci = {}, filtriAttivi = new Set(), sede = null, vociById = {};
    var TAG_LABELS = {
      vegetariano: "🌱 Vegetariano", vegano: "🥦 Vegano", senza_glutine: "🌾 Senza glutine",
      senza_lattosio: "🥛 Senza lattosio", piccante: "🌶️ Piccante", chef: "⭐ Consiglio dello chef"
    };

    // Tutta la lettura/scrittura passa da qui: la Edge Function usa la
    // service role e decide lei cosa è sicuro esporre — la pagina pubblica
    // non dipende più dalle RLS delle tabelle menu/menu_categorie/menu_voci.
    async function chiamaApi(payload) {
      // Content-Type "text/plain" invece di "application/json" e nessun header
      // custom (Authorization/apikey non servono, la funzione è pubblica):
      // così la richiesta resta "semplice" per il browser e NON scatena il
      // preflight OPTIONS, che sul gateway Supabase falliva a prescindere
      // dal toggle Verify JWT. Il corpo resta JSON valido, il server lo legge
      // comunque con req.json() indipendentemente dal Content-Type dichiarato.
      var res = await fetch(EDGE_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      });
      var testo = await res.text();
      var dati;
      try { dati = JSON.parse(testo); }
      catch (e) { throw new Error("Risposta non valida dal server (status " + res.status + "): " + testo.slice(0, 200)); }
      if (!res.ok && !dati.error) { throw new Error("Errore server (status " + res.status + ")"); }
      return dati;
    }

    init().catch(function(err) {
      console.error("ERRORE CARICAMENTO MENU:", err);
      showError("Errore di caricamento", err.message || "Qualcosa è andato storto. Riprova tra poco.");
    });

    async function init() {
      var r = await chiamaApi({ azione: "carica", slug: slug });
      if (!r.success) { showError("Menu non disponibile", r.error || "Questo menu non è attivo o non esiste."); return; }

      menu = r.menu;
      azienda = r.azienda || {};
      sede = r.sede || null;
      categorie = r.categorie || [];
      tutteVoci = {};
      (r.voci || []).forEach(function(v) {
        if (!tutteVoci[v.categoria_id]) tutteVoci[v.categoria_id] = [];
        tutteVoci[v.categoria_id].push(v);
      });

      // Applica brand
      if (azienda.colore_brand) {
        document.documentElement.style.setProperty("--brand", azienda.colore_brand);
        document.documentElement.style.setProperty("--brand-light", azienda.colore_brand + "1a");
      }
      if (menu.colore_sfondo) document.documentElement.style.setProperty("--sfondo", menu.colore_sfondo);
      if (azienda.font_family || menu.font_family) {
        var ff = menu.font_family || azienda.font_family;
        document.body.style.fontFamily = ff;
        var fn = ff.replace(/['"]/g,"").split(",")[0].trim().replace(/ /g,"+");
        var lnk = document.createElement("link"); lnk.rel = "stylesheet";
        lnk.href = "https://fonts.googleapis.com/css2?family=" + fn + ":wght@400;700;800&display=swap";
        document.head.appendChild(lnk);
      }

      // Tracking visita (la Edge Function controlla lei se tracking_attivo è vero)
      chiamaApi({ azione: "track", slug: slug, tipo: "visita" }).catch(function(){});

      // Raccolta dati?
      if (menu.raccolta_dati) {
        var campi = menu.raccolta_campi || ["nome","telefono"];
        mostraRaccoltaDati(campi, function() { finalizzaRender(); });
      } else {
        finalizzaRender();
      }
    }

    function finalizzaRender() {
      if (!categorie.length) { showError("Menu vuoto", "Nessuna categoria disponibile in questo momento."); return; }
      renderMenu();
    }

    // ── RACCOLTA DATI ──────────────────────────────────────────────
    function mostraRaccoltaDati(campi, onDone) {
      var labelMap = {
        nome:"Nome *", cognome:"Cognome", telefono:"Telefono *",
        email:"Email", tavolo:"Numero tavolo", data_nascita:"Data di nascita",
        cap:"CAP", citta:"Città", note:"Note", consenso_marketing:"Consenso marketing"
      };

      var overlay = document.createElement("div");
      overlay.className = "raccolta-overlay";
      overlay.innerHTML =
        '<div class="raccolta-box">' +
          '<div class="raccolta-handle"></div>' +
          (azienda.logo_url ? '<img src="'+esc(azienda.logo_url)+'" style="width:48px;height:48px;border-radius:12px;object-fit:cover;margin-bottom:12px;">' : '') +
          '<div class="raccolta-title">Benvenuto da ' + esc(azienda.nome||"noi") + '!</div>' +
          '<div class="raccolta-sub">Prima di sfogliare il menu, lasciaci qualche informazione. Ci aiuta a migliorare il servizio.</div>' +
          campi.filter(function(c){return c!=="consenso_marketing";}).map(function(c) {
            var t = c==="data_nascita"?"date":c==="email"?"email":c==="telefono"?"tel":"text";
            return '<input class="raccolta-input" id="rd-'+c+'" type="'+t+'" placeholder="'+esc(labelMap[c]||c)+'">';
          }).join("") +
          (campi.includes("consenso_marketing") ? '<label style="display:flex;align-items:flex-start;gap:8px;margin-bottom:16px;font-size:12px;color:#64748b;"><input type="checkbox" id="rd-mkt" style="margin-top:2px;accent-color:var(--brand);flex-shrink:0;"> Acconsento a ricevere comunicazioni promozionali</label>' : '') +
          '<button class="raccolta-btn" id="rd-btn">Entra nel menu →</button>' +
          '<div id="rd-msg" style="margin-top:8px;font-size:12px;text-align:center;color:#dc2626;"></div>' +
        '</div>';

      document.body.appendChild(overlay);

      document.getElementById("rd-btn").onclick = async function() {
        var nome = campi.includes("nome") ? (document.getElementById("rd-nome")?.value||"").trim() : null;
        var tel  = campi.includes("telefono") ? (document.getElementById("rd-telefono")?.value||"").trim() : null;
        var msg  = document.getElementById("rd-msg");

        if (campi.includes("nome") && !nome) { msg.textContent="Nome obbligatorio"; return; }
        if (campi.includes("telefono") && !tel) { msg.textContent="Telefono obbligatorio"; return; }

        // Salva risposta tracking
        var dati = {};
        campi.forEach(function(c) {
          var el = document.getElementById("rd-"+c);
          if (el && el.type!=="checkbox") dati[c] = el.value;
        });
        if (document.getElementById("rd-mkt")) dati.consenso_marketing = document.getElementById("rd-mkt").checked;

        await chiamaApi({ azione: "track", slug: slug, tipo: "raccolta_dati", dati: dati });

        document.body.removeChild(overlay);
        onDone();
      };
    }

    // ── COVER SLIDESHOW ──────────────────────────────────────────────
    function initCoverSlideshow() {
      var slidesBox = document.getElementById("cover-slides");
      if (!slidesBox) return; // una sola foto o nessuna: niente da animare

      var slides = slidesBox.querySelectorAll(".cover-slide");
      var dots = document.querySelectorAll(".cover-dot");
      var idx = 0;

      function vaiA(n) {
        idx = (n + slides.length) % slides.length;
        slides.forEach(function(s, i) { s.classList.toggle("active", i === idx); });
        dots.forEach(function(d, i) { d.classList.toggle("active", i === idx); });
      }

      var timer = setInterval(function() { vaiA(idx + 1); }, 2000);

      // Tap su un pallino = vai a quella foto, e riparti il timer da lì
      dots.forEach(function(dot, i) {
        dot.addEventListener("click", function() {
          clearInterval(timer);
          vaiA(i);
          timer = setInterval(function() { vaiA(idx + 1); }, 2000);
        });
      });

      // Tap sulla cover stessa = avanti di una, comodo su mobile
      slidesBox.addEventListener("click", function() {
        clearInterval(timer);
        vaiA(idx + 1);
        timer = setInterval(function() { vaiA(idx + 1); }, 2000);
      });
    }

    // ── RENDER MENU ────────────────────────────────────────────────
    function renderMenu() {
      var colore = azienda.colore_brand || menu.colore_primario || "#0E5A7A";
      var linkFidelity = "https://app.ristoflow-ai.com/fidelity.html?a=" + menu.azienda_id;
      var qrFidelity = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + encodeURIComponent(linkFidelity);

      var html = "";

      // COVER + LOGO — slideshow se ci sono più foto, immagine singola/fallback altrimenti
      var coverUrls = (Array.isArray(menu.cover_urls) && menu.cover_urls.length)
        ? menu.cover_urls
        : [menu.cover_url || (sede && sede.cover_url) || azienda.cover_url || null].filter(Boolean);

      html += '<div class="menu-cover">';
      if (coverUrls.length > 1) {
        html += '<div class="menu-cover-slides" id="cover-slides">';
        coverUrls.forEach(function(src, i) {
          html += '<img src="' + esc(src) + '" alt="Cover" class="cover-slide' + (i === 0 ? ' active' : '') + '" data-slide="' + i + '">';
        });
        html += '</div>';
        html += '<div class="cover-dots" id="cover-dots">';
        coverUrls.forEach(function(_, i) {
          html += '<span class="cover-dot' + (i === 0 ? ' active' : '') + '" data-dot="' + i + '"></span>';
        });
        html += '</div>';
      } else if (coverUrls.length === 1) {
        html += '<img src="' + esc(coverUrls[0]) + '" alt="Cover">';
      } else {
        html += '<div style="width:100%;height:100%;background:' + esc(colore) + ';display:flex;align-items:center;justify-content:center;font-size:56px;">🍽️</div>';
      }
      html += '<div class="menu-cover-overlay"></div></div>';

      html += '<div class="menu-profile-row">';
      html += '<div class="menu-logo-wrap">';
      var logoSrc = menu.logo_url || (sede && sede.logo_url) || azienda.logo_url || null;
      if (logoSrc) {
        html += '<img src="' + esc(logoSrc) + '" alt="Logo">';
      } else {
        html += '<div class="menu-logo-empty">🍽️</div>';
      }
      html += '</div>';
      html += '<div class="menu-info">';
      // Titolo = nome del locale (non il nome interno del menu, che è solo
      // un'etichetta di lavoro per chi lo gestisce). Sotto: la descrizione
      // del menu se impostata, altrimenti un saluto di benvenuto generico.
      var nomeLocale = (sede && sede.nome) || azienda.nome || menu.nome || "";
      var payoff = menu.descrizione || "Benvenuti! Scoprite il nostro menù 🍽️";
      html += '<div class="menu-locale-nome">' + esc(nomeLocale) + '</div>';
      html += '<div class="menu-locale-desc">' + esc(payoff) + '</div>';
      html += '</div></div>';

      // NAV CATEGORIE
      html += '<div class="cat-nav" id="cat-nav">';
      categorie.forEach(function(c) {
        html += '<button class="cat-nav-btn" data-cat-id="' + c.id + '">' + esc(c.nome) + '</button>';
      });
      html += '</div>';
      if (categorie.length > 1) {
        html += '<div class="cat-dots" id="cat-dots">';
        categorie.forEach(function(c, i) {
          html += '<span class="cat-dot' + (i===0?" active":"") + '" data-dot-cat="' + c.id + '"></span>';
        });
        html += '</div>';
      }

      // FILTRI ALLERGENI
      html += '<div class="filtri-bar">';
      html += '<span style="font-size:11px;font-weight:700;color:#94a3b8;padding:5px 4px;flex-shrink:0;">Filtri:</span>';
      [
        {id:"vegetariano",label:"🌱 Veg"},
        {id:"vegano",label:"🥦 Vegano"},
        {id:"senza_glutine",label:"🌾 Senza glutine"},
        {id:"senza_lattosio",label:"🥛 Senza lattosio"},
        {id:"chef",label:"⭐ Chef consiglia"}
      ].forEach(function(f) {
        html += '<button class="filtro-chip" data-filtro="' + f.id + '">' + f.label + '</button>';
      });
      html += '</div>';

      // CATEGORIE — accordion, chiuse di default, stile "social" con foto grandi
      html += '<div id="menu-body" style="padding-bottom:8px;">';
      categorie.forEach(function(cat, idx) {
        var voci = tutteVoci[cat.id] || [];
        html += '<div class="cat-accordion" id="cat-' + cat.id + '">';
        // HEADER categoria (cliccabile per aprire/chiudere)
        html += '<div class="cat-acc-header" data-cat="' + cat.id + '">';
        html += '<div class="cat-acc-nome">' + esc(cat.nome) + '</div>';
        html += '<div class="cat-acc-right"><span class="cat-acc-arrow">▼</span></div>';
        html += '</div>';
        if (cat.immagine_url) {
          html += '<img src="' + esc(cat.immagine_url) + '" alt="' + esc(cat.nome) + '" class="cat-acc-preview" data-cat="' + cat.id + '">';
        }
        if (cat.descrizione || cat.ora_inizio) {
          html += '<div style="text-align:center;padding:6px 12px;background:#9ca3af;">';
          if (cat.descrizione) html += '<div class="cat-acc-desc">' + esc(cat.descrizione) + '</div>';
          if (cat.ora_inizio) html += '<div class="cat-acc-orario">⏰ ' + cat.ora_inizio + ' – ' + cat.ora_fine + '</div>';
          html += '</div>';
        }
        // BODY — chiuso di default
        html += '<div class="cat-acc-body" id="body-' + cat.id + '">';
        if (!voci.length) {
          html += '<div style="color:#94a3b8;font-size:14px;padding:16px;text-align:center;">Nessuna portata disponibile</div>';
        } else {
          voci.forEach(function(v) {
            vociById[v.id] = v;
            var isNonDisp = v.disponibile === false;
            var prezzo = v.prezzo_override || v.prezzo || 0;
            html += '<div class="prodotto-card' + (isNonDisp?" non-disp":"") + '">';
            if (v.foto_url) {
              html += '<div class="prodotto-foto-wrap" data-lb="' + esc(v.foto_url) + '" style="cursor:pointer;">';
              html += '<img class="prodotto-foto" src="' + esc(v.foto_url) + '" alt="' + esc(v.nome) + '" loading="lazy">';
              if (isNonDisp) html += '<div class="non-disp-badge">Non disp.</div>';
              html += '</div>';
            } else {
              html += '<div class="prodotto-foto-wrap"><div class="prodotto-foto-empty">🍽️</div></div>';
            }
            html += '<div class="prodotto-body">';
            html += '<div class="prodotto-nome">' + esc(v.nome) + '</div>';
            if (v.descrizione) html += '<div class="prodotto-desc">' + esc(v.descrizione) + '</div>';
            if (v.tags && v.tags.length) {
              html += '<div class="prodotto-tags">' + v.tags.map(function(t){ return TAG_LABELS[t] ? '<span class="prodotto-tag">' + TAG_LABELS[t] + '</span>' : ''; }).join('') + '</div>';
            }
            if (isNonDisp) html += '<div style="text-align:center;margin-bottom:8px;"><span class="prodotto-tag non-disp-tag">Non disponibile</span></div>';
            html += '<div class="prodotto-riga-bottom">';
            html += '<div class="prodotto-prezzo">' + Number(prezzo).toFixed(2) + ' €</div>';
            html += '<button class="prodotto-dettaglio-btn" data-detail="' + v.id + '">Dettaglio</button>';
            html += '</div>';
            html += '</div>';
            html += '</div>';
          });
        }
        html += '</div>';
        html += '</div>';
      });
      html += '</div>';

      // FIDELITY PROMO
      html += '<div class="fidelity-promo">';
      html += '<img class="fidelity-promo-qr" src="' + qrFidelity + '" alt="QR Fidelity">';
      html += '<div>';
      html += '<div class="fidelity-promo-title">🎁 Hai la tessera fidelity?</div>';
      html += '<div class="fidelity-promo-sub">Scansiona il QR e iscriviti per accumulare punti e ottenere sconti immediati.</div>';
      html += '</div></div>';

      html += '<div class="menu-footer">Menu digitale by <a href="https://ristoflow-ai.com">Ristoflow.Ai</a></div>';

      root.innerHTML = html;

      initCoverSlideshow();

      // BIND NAV — click scrolla alla sezione corrispondente (sempre aperta, niente accordion)
      var navBtns = document.querySelectorAll(".cat-nav-btn");
      navBtns[0]?.classList.add("active");
      document.querySelector(".cat-dot")?.classList.add("active");

      navBtns.forEach(function(btn) {
        btn.onclick = function() {
          var catId = btn.dataset.catId;
          evidenziaCategoria(catId);
          var el = document.getElementById("cat-" + catId);
          if (el) el.scrollIntoView({ behavior:"smooth", block:"start" });
        };
      });

      document.querySelectorAll(".cat-dot").forEach(function(dot) {
        dot.onclick = function() {
          var catId = dot.dataset.dotCat;
          evidenziaCategoria(catId);
          var el = document.getElementById("cat-" + catId);
          if (el) el.scrollIntoView({ behavior:"smooth", block:"start" });
        };
      });

      function evidenziaCategoria(catId) {
        document.querySelectorAll(".cat-nav-btn").forEach(function(btn){
          btn.classList.toggle("active", btn.dataset.catId === catId);
        });
        document.querySelectorAll(".cat-dot").forEach(function(dot){
          dot.classList.toggle("active", dot.dataset.dotCat === catId);
        });
      }

      // BIND FILTRI
      document.querySelectorAll(".filtro-chip").forEach(function(chip) {
        chip.onclick = function() {
          var f = chip.dataset.filtro;
          if (filtriAttivi.has(f)) { filtriAttivi.delete(f); chip.classList.remove("active"); }
          else { filtriAttivi.add(f); chip.classList.add("active"); }
          applicaFiltri();
        };
      });

      // BIND LIGHTBOX foto (ignora i pulsanti Dettaglio di piatti senza foto)
      document.querySelectorAll("[data-lb]").forEach(function(el) {
        if (!el.dataset.lb) return;
        el.onclick = function() {
          document.getElementById("lb-img").src = el.dataset.lb;
          document.getElementById("lightbox").classList.add("open");
        };
      });

      // BIND DETTAGLIO — apre la scheda del piatto (tag, descrizione estesa, prezzo)
      document.querySelectorAll(".prodotto-dettaglio-btn").forEach(function(btn) {
        btn.onclick = function() {
          var v = vociById[btn.dataset.detail];
          if (!v) return;
          apriDettaglio(v);
        };
      });

      // BIND ACCORDION — click header O foto apre/chiude la categoria (solo quella cliccata)
      document.querySelectorAll(".cat-acc-header, .cat-acc-preview").forEach(function(hdr) {
        hdr.onclick = function() {
          var catId = hdr.dataset.cat;
          var body = document.getElementById("body-" + catId);
          var arrow = document.querySelector(".cat-acc-header[data-cat='" + catId + "'] .cat-acc-arrow");
          var isOpen = body.classList.contains("open");
          if (isOpen) {
            body.classList.remove("open");
            if (arrow) arrow.classList.remove("open");
          } else {
            body.classList.add("open");
            if (arrow) arrow.classList.add("open");
            evidenziaCategoria(catId);
          }
        };
      });

      // Auto-stampa: SOLO se il link arriva dal pannello admin con ?print=1
      // (i clienti sulla pagina pubblica non hanno mai questo parametro né
      // vedono un pulsante di stampa — evita che tutti stampino per sbaglio).
      // Genera una lista compatta separata dalla grafica online — una
      // categoria per pagina A4, una riga per portata (foto piccola,
      // nome+descrizione, prezzo) invece delle card grandi da schermo.
      if (params.get("print") === "1") {
        generaStampaCompatta();
        setTimeout(function(){ window.print(); }, 300);
      }

      // SCROLL → aggiorna nav e punti in base a quale sezione è visibile
      window.addEventListener("scroll", aggiornaNavScroll, { passive:true });
    }

    function generaStampaCompatta() {
      var nomeLocale = (sede && sede.nome) || azienda.nome || "";
      var logoSrc = menu.logo_url || (sede && sede.logo_url) || azienda.logo_url || "";
      var html = "";
      categorie.forEach(function(cat) {
        var voci = tutteVoci[cat.id] || [];
        if (!voci.length) return;
        html += '<div class="stampa-pagina">';
        html += '<div class="stampa-header">';
        if (logoSrc) html += '<img class="stampa-logo" src="' + esc(logoSrc) + '">';
        html += '<div class="stampa-titolo-cat">' + esc(cat.nome) + '</div>';
        html += '<div class="stampa-locale">' + esc(nomeLocale) + '</div>';
        html += '</div>';
        voci.forEach(function(v) {
          if (v.disponibile === false) return;
          var prezzo = v.prezzo_override || v.prezzo || 0;
          html += '<div class="stampa-riga">';
          html += v.foto_url
            ? '<img class="stampa-riga-foto" src="' + esc(v.foto_url) + '">'
            : '<div class="stampa-riga-foto-vuota"></div>';
          html += '<div class="stampa-riga-testo">';
          html += '<div class="stampa-riga-nome">' + esc(v.nome) + '</div>';
          if (v.descrizione) html += '<div class="stampa-riga-desc">' + esc(v.descrizione) + '</div>';
          html += '</div>';
          html += '<div class="stampa-riga-prezzo">' + Number(prezzo).toFixed(2) + ' €</div>';
          html += '</div>';
        });
        html += '</div>';
      });
      document.getElementById("stampa-output").innerHTML = html;
    }

    function aggiornaNavScroll() {
      var scrollY = window.scrollY + 160;
      var attivo = null;
      categorie.forEach(function(c) {
        var el = document.getElementById("cat-" + c.id);
        if (el && el.offsetTop <= scrollY) attivo = c.id;
      });
      if (attivo) {
        document.querySelectorAll(".cat-nav-btn").forEach(function(btn) {
          btn.classList.toggle("active", btn.dataset.catId === attivo);
        });
        document.querySelectorAll(".cat-dot").forEach(function(dot) {
          dot.classList.toggle("active", dot.dataset.dotCat === attivo);
        });
      }
    }

    function applicaFiltri() {
      if (!filtriAttivi.size) {
        document.querySelectorAll(".prodotto-card").forEach(function(el){ el.style.display=""; });
        document.querySelectorAll(".cat-section").forEach(function(el){ el.style.display=""; });
        return;
      }
      categorie.forEach(function(cat) {
        var voci = tutteVoci[cat.id] || [];
        var visibili = 0;
        voci.forEach(function(v, i) {
          var cards = document.querySelectorAll("#cat-" + cat.id + " .prodotto-card");
          var card = cards[i];
          if (!card) return;
          var mostra = true;
          if (filtriAttivi.has("chef") && !v.note_interne?.includes("chef")) mostra = false;
          // Altri filtri basati su descrizione
          if (mostra) {
            card.style.display = "";
            visibili++;
          } else {
            card.style.display = "none";
          }
        });
        var sec = document.getElementById("cat-" + cat.id);
        if (sec) sec.style.display = visibili === 0 ? "none" : "";
      });
    }

    // LIGHTBOX
    document.getElementById("lb-close").onclick = function() {
      document.getElementById("lightbox").classList.remove("open");
    };
    document.getElementById("lightbox").onclick = function(e) {
      if (e.target === e.currentTarget) document.getElementById("lightbox").classList.remove("open");
    };

    // SCHEDA DETTAGLIO PRODOTTO
    function apriDettaglio(v) {
      var prezzo = v.prezzo_override || v.prezzo || 0;
      var tagsHtml = (v.tags && v.tags.length)
        ? '<div class="prodotto-tags" style="justify-content:flex-start;margin-bottom:14px;">' + v.tags.map(function(t){ return TAG_LABELS[t] ? '<span class="prodotto-tag">' + TAG_LABELS[t] + '</span>' : ''; }).join('') + '</div>'
        : '';
      var fotoHtml = v.foto_url
        ? '<img src="' + esc(v.foto_url) + '" alt="' + esc(v.nome) + '" style="width:100%;height:180px;object-fit:cover;border-radius:12px;margin-bottom:16px;cursor:pointer;" id="detail-foto">'
        : '';
      document.getElementById("detail-content").innerHTML =
        fotoHtml +
        '<div class="raccolta-title">' + esc(v.nome) + '</div>' +
        tagsHtml +
        (v.descrizione ? '<div style="font-size:15px;color:#374151;line-height:1.6;margin-bottom:16px;">' + esc(v.descrizione) + '</div>' : '<div style="font-size:14px;color:#94a3b8;margin-bottom:16px;">Nessuna descrizione disponibile.</div>') +
        '<div style="font-size:26px;font-weight:800;color:#111827;text-align:right;">' + Number(prezzo).toFixed(2) + ' €</div>';

      var fotoEl = document.getElementById("detail-foto");
      if (fotoEl) fotoEl.onclick = function() {
        document.getElementById("lb-img").src = v.foto_url;
        document.getElementById("lightbox").classList.add("open");
      };

      document.getElementById("detail-overlay").style.display = "flex";
    }
    document.getElementById("detail-overlay").onclick = function(e) {
      if (e.target === e.currentTarget) document.getElementById("detail-overlay").style.display = "none";
    };

    function showError(title, sub) {
      root.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px;text-align:center;gap:12px;"><div style="font-size:56px;">😕</div><div style="font-size:20px;font-weight:800;">' + esc(title) + '</div><div style="font-size:13px;color:#64748b;">' + esc(sub) + '</div></div>';
    }

    function esc(v) {
      return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
  })();
  </script>
</body>
</html>
