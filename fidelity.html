<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Tessera Fidelity</title>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#12302C"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <link rel="apple-touch-icon" href="/assets/favicon-192.png"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;600;700;800&display=swap"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--brand:#0E5A7A;--brand-light:#e8f4f8;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f0f6fa;min-height:100vh;color:#111827;}
    .spinner{width:48px;height:48px;border:4px solid var(--brand-light);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .page-loader{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;color:#64748b;font-size:14px;font-weight:600;}

    /* CARD TESSERA */
    .tessera-card{
      background:linear-gradient(135deg,var(--brand),#1a8fb5);
      border-radius:24px;margin:20px 16px 0;padding:24px;
      color:#fff;position:relative;overflow:hidden;
      box-shadow:0 8px 32px rgba(14,90,122,0.3);
    }
    .tessera-card::before{
      content:"";position:absolute;top:-40px;right:-40px;
      width:180px;height:180px;border-radius:50%;
      background:rgba(255,255,255,0.08);
    }
    .tessera-card::after{
      content:"";position:absolute;bottom:-60px;left:-20px;
      width:200px;height:200px;border-radius:50%;
      background:rgba(255,255,255,0.05);
    }
    .tessera-logo{width:52px;height:52px;border-radius:14px;object-fit:cover;border:2px solid rgba(255,255,255,.3);margin-bottom:12px;}
    .tessera-locale{font-size:13px;font-weight:700;opacity:.8;margin-bottom:2px;}
    .tessera-nome{font-size:22px;font-weight:800;margin-bottom:16px;}
    .tessera-punti-label{font-size:11px;font-weight:700;opacity:.7;text-transform:uppercase;letter-spacing:.06em;}
    .tessera-punti{font-size:42px;font-weight:800;line-height:1;}
    .tessera-punti-sub{font-size:12px;opacity:.7;margin-top:4px;}
    .tessera-livello{
      position:absolute;top:20px;right:20px;
      background:rgba(255,255,255,.2);border-radius:999px;
      padding:6px 14px;font-size:12px;font-weight:800;
    }
    .tessera-network{
      position:absolute;bottom:20px;right:20px;
      font-size:10px;font-weight:700;opacity:.6;
    }

    /* SEZIONI */
    .section{background:#fff;border-radius:18px;margin:12px 16px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,0.04);}
    .section-title{font-size:13px;font-weight:800;color:#374151;margin-bottom:12px;display:flex;align-items:center;gap:6px;}

    /* LIVELLI */
    .livelli-bar{display:flex;gap:6px;margin-bottom:10px;}
    .livello-step{flex:1;height:6px;border-radius:999px;background:#e5e7eb;}
    .livello-step.active{background:var(--brand);}
    .livelli-labels{display:flex;justify-content:space-between;font-size:10px;color:#94a3b8;font-weight:700;}

    /* OFFERTE NETWORK */
    .offerta-card{border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;}
    .offerta-badge{background:var(--brand);color:#fff;border-radius:10px;padding:8px 10px;font-size:16px;font-weight:800;flex-shrink:0;min-width:48px;text-align:center;}
    .offerta-nome{font-size:14px;font-weight:800;color:#111827;}
    .offerta-desc{font-size:12px;color:#64748b;margin-top:2px;}
    .offerta-locale{font-size:11px;color:var(--brand);font-weight:700;margin-top:4px;}
    .offerta-dist{font-size:11px;color:#94a3b8;}

    /* STORICO */
    .mov-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f3f4f6;}
    .mov-row:last-child{border-bottom:none;}
    .mov-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
    .mov-text{flex:1;min-width:0;}
    .mov-label{font-size:13px;font-weight:700;color:#111827;}
    .mov-date{font-size:11px;color:#94a3b8;}
    .mov-punti{font-size:15px;font-weight:800;}

    /* MAPPA */
    .map-container{border-radius:14px;overflow:hidden;height:220px;background:#e5e7eb;margin-bottom:10px;}

    /* BTN */
    .btn-full{width:100%;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;}
    .btn-primary{background:var(--brand);color:#fff;}
    .btn-sec{background:#f3f4f6;color:#374151;margin-top:8px;}
    .btn-install{background:linear-gradient(135deg,#059669,#10b981);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;}

    /* FORM ISCRIZIONE */
    .form-card{background:#fff;border-radius:24px;margin:20px 16px;padding:24px;box-shadow:0 8px 32px rgba(0,0,0,0.1);}
    .form-title{font-size:20px;font-weight:800;color:#111827;margin-bottom:4px;}
    .form-sub{font-size:13px;color:#64748b;margin-bottom:20px;line-height:1.5;}
    .form-input{width:100%;box-sizing:border-box;padding:12px 16px;border:1.5px solid #e2e8f0;border-radius:14px;font-size:15px;outline:none;margin-bottom:12px;font-family:inherit;}
    .form-input:focus{border-color:var(--brand);}
    .promo-box{background:linear-gradient(135deg,#059669,#10b981);border-radius:14px;padding:14px;margin-bottom:16px;color:#fff;text-align:center;}
    .promo-box-title{font-size:22px;font-weight:800;}
    .promo-box-sub{font-size:13px;opacity:.9;margin-top:2px;}

    /* ACCORDION */
    .accordion-item{border-bottom:1px solid #f3f4f6;}
    .accordion-item:last-child{border-bottom:none;}
    .accordion-btn{width:100%;text-align:left;background:none;border:none;padding:12px 0;font-size:13px;font-weight:700;color:#374151;cursor:pointer;}
    .accordion-btn:hover{color:var(--brand);}
    .accordion-body{font-size:12px;color:#64748b;line-height:1.6;padding-bottom:12px;}
    /* FOOTER */
    .fidelity-footer{text-align:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom));font-size:11px;color:#9ca3af;}
    .fidelity-footer a{color:var(--brand);text-decoration:none;}

    /* ERROR */
    .error-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px;text-align:center;gap:12px;}
    .error-icon{font-size:56px;}
    .error-title{font-size:20px;font-weight:800;}
    .error-sub{font-size:13px;color:#64748b;max-width:280px;}

    @media(min-width:480px){
      .tessera-card,.section,.form-card{max-width:480px;margin-left:auto;margin-right:auto;width:100%;}
      body{display:flex;flex-direction:column;align-items:center;}
    }

    /* ══════════ RISTOFLOWBOOK — app del cliente (22/11/2026) ══════════
       Palette fissa RistoflowBook: il nome del locale sta in testata, i colori restano quelli dell'app,
       cosi' passando da un locale all'altro il cliente non si perde. */
    :root{
      --rb-carta:#FBF8F2; --rb-scuro:#12302C; --rb-accento:#C9832E; --rb-accento-testo:#8A5414;
      --rb-bordo:#E8E1D4; --rb-testo:#1D2422; --rb-testo2:#5D635F; --rb-oro:#e9d3a3;
      --rb-serif:'Fraunces',Georgia,serif; --rb-sans:'Manrope',system-ui,-apple-system,sans-serif;
    }
    body.rb-on{background:var(--rb-carta);font-family:var(--rb-sans);font-size:16px;color:var(--rb-testo);display:block;}
    .rb{max-width:520px;margin:0 auto;min-height:100vh;background:var(--rb-carta);padding-bottom:calc(110px + env(safe-area-inset-bottom));position:relative;}
    .rb button{font-family:inherit;}
    /* testata */
    .rb-top{position:sticky;top:0;z-index:60;background:rgba(251,248,242,.96);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px 18px;}
    .rb-top .nome{font:700 25px/1.15 var(--rb-serif);color:var(--rb-scuro);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .rb-top .interna{display:flex;align-items:center;gap:6px;flex:1;min-width:0;font:700 22px var(--rb-serif);color:var(--rb-scuro);margin-left:-10px;}
    .rb-ico{width:48px;height:48px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:12px;border:none;background:transparent;cursor:pointer;color:var(--rb-scuro);}
    .rb-ico svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
    /* storie */
    .rb-storie{display:flex;gap:14px;overflow-x:auto;padding:6px 16px 14px;scrollbar-width:none;}
    .rb-storie::-webkit-scrollbar{display:none;}
    .rb-storia{flex:none;width:72px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;position:relative;background:none;border:none;padding:0;}
    .rb-anello{width:68px;height:68px;border-radius:50%;padding:3px;background:conic-gradient(var(--rb-accento),#e3b36a,var(--rb-scuro),var(--rb-accento));}
    .rb-anello.visto{background:#cfc8bb;}
    .rb-anello.mia{background:var(--rb-bordo);}
    .rb-anello img,.rb-anello .vuoto{width:100%;height:100%;border-radius:50%;border:3px solid var(--rb-carta);object-fit:cover;display:block;background:#ddd5c6;}
    .rb-storia .lbl{font-size:13px;color:var(--rb-testo2);width:74px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .rb-storia .piu{position:absolute;right:2px;top:46px;width:24px;height:24px;border-radius:50%;background:var(--rb-accento);color:var(--rb-testo);font-weight:800;font-size:18px;line-height:20px;text-align:center;border:2px solid var(--rb-carta);}
    /* copertina */
    .rb-cover{aspect-ratio:16/9;width:100%;background:linear-gradient(160deg,#6d5a3f,#a8834f 45%,#2c3b33);position:relative;overflow:hidden;}
    .rb-cover img{width:100%;height:100%;object-fit:cover;display:block;}
    .rb-prof{display:flex;align-items:flex-start;gap:12px;padding:0 18px;margin-top:-46px;position:relative;}
    .rb-logo{width:92px;height:92px;flex:none;border-radius:50%;border:4px solid var(--rb-carta);background:radial-gradient(circle at 35% 35%,#2d5a52,var(--rb-scuro));color:var(--rb-oro);font:700 32px var(--rb-serif);display:flex;align-items:center;justify-content:center;overflow:hidden;}
    .rb-logo img{width:100%;height:100%;object-fit:cover;background:#fff;}
    .rb-prof .info{padding-top:52px;min-width:0;}
    .rb-prof h2{font:700 22px/1.2 var(--rb-serif);color:var(--rb-scuro);}
    .rb-prof p{font-size:15px;color:var(--rb-testo2);}
    .rb-azioni{display:flex;gap:10px;padding:14px 18px 4px;}
    .rb-btn{min-height:48px;border-radius:14px;border:1px solid var(--rb-bordo);background:#fff;font:700 16px var(--rb-sans);color:var(--rb-scuro);padding:0 18px;display:flex;align-items:center;justify-content:center;gap:8px;flex:1;cursor:pointer;text-decoration:none;text-align:center;}
    .rb-btn.pieno{background:var(--rb-accento);border-color:var(--rb-accento);color:var(--rb-testo);}
    .rb-btn.scuro{background:var(--rb-scuro);border-color:var(--rb-scuro);color:#fff;}
    .rb-btn:disabled{opacity:.6;}
    .rb-btn.full{width:100%;flex:none;}
    /* striscia tessera */
    .rb-tess{margin:12px 18px 0;border-radius:18px;background:var(--rb-scuro);color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;border:none;width:calc(100% - 36px);text-align:left;}
    .rb-tess .pt{font:700 30px/1 var(--rb-serif);color:var(--rb-oro);}
    .rb-tess small{display:block;font-size:15px;opacity:.85;margin-top:5px;}
    .rb-tess .liv{font-size:14px;font-weight:800;border:1px solid rgba(233,211,163,.5);color:var(--rb-oro);border-radius:999px;padding:7px 12px;white-space:nowrap;}
    /* card in evidenza */
    .rb-evid{margin:16px 18px 0;border:1px solid var(--rb-bordo);border-radius:18px;background:#fff;overflow:hidden;}
    .rb-evid .bd{padding:16px;}
    .rb-et{font:800 12px var(--rb-sans);letter-spacing:.08em;color:var(--rb-accento-testo);text-transform:uppercase;}
    .rb-evid h3{font:700 21px/1.25 var(--rb-serif);color:var(--rb-scuro);margin:5px 0 6px;}
    .rb-evid p{font-size:16px;color:var(--rb-testo2);margin-bottom:12px;line-height:1.45;}
    /* feed */
    .rb-post{margin-top:18px;background:#fff;border-top:1px solid var(--rb-bordo);border-bottom:1px solid var(--rb-bordo);}
    .rb-post .hd{display:flex;align-items:center;gap:10px;padding:12px 16px;}
    .rb-av{width:42px;height:42px;flex:none;border-radius:50%;background:#7d8f84;color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;}
    .rb-av.loc{background:var(--rb-scuro);color:var(--rb-oro);}
    .rb-post .hd b{font-size:16px;}
    .rb-post .hd span{display:block;font-size:14px;color:var(--rb-testo2);}
    .rb-verif{color:var(--rb-accento-testo);font-size:14px;font-weight:700;}
    .rb-post .foto{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#efe8da;}
    .rb-post .tx{padding:10px 16px 4px;font-size:16px;line-height:1.5;white-space:pre-line;}
    .rb-stelle{color:var(--rb-accento);letter-spacing:2px;font-size:18px;padding:10px 16px 0;}
    .rb-reaz{display:flex;gap:8px;padding:10px 12px 14px;}
    .rb-reaz button{min-height:46px;min-width:64px;border-radius:23px;border:1px solid var(--rb-bordo);background:var(--rb-carta);font-size:16px;font-weight:700;color:var(--rb-testo);cursor:pointer;}
    .rb-reaz button.fatta{background:#f3e4cd;border-color:var(--rb-accento);}
    .rb-vuoto{text-align:center;padding:40px 30px;color:var(--rb-testo2);font-size:16px;}
    /* barra in basso */
    .rb-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:496px;height:72px;border-radius:26px;background:var(--rb-scuro);display:flex;align-items:center;justify-content:space-around;padding:0 4px;z-index:70;box-shadow:0 8px 28px rgba(18,48,44,.35);}
    .rb-bar button{display:flex;flex-direction:column;align-items:center;gap:3px;color:#c9d3cf;font-size:12px;font-weight:700;width:64px;min-height:56px;justify-content:center;background:none;border:none;cursor:pointer;position:relative;}
    .rb-bar button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
    .rb-bar button.on{color:#fff;}
    .rb-bar button.on::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--rb-accento);position:absolute;bottom:-2px;}
    .rb-bar .centrale{width:68px;height:68px;border-radius:50%;background:var(--rb-accento);margin-top:-34px;border:5px solid var(--rb-carta);color:var(--rb-testo);min-height:0;}
    .rb-bar .centrale svg{width:30px;height:30px;stroke-width:2.6;}
    .rb-bar .centrale.on::after{display:none;}
    /* menu laterale */
    .rb-velo{position:fixed;inset:0;background:rgba(18,48,44,.45);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;}
    .rb-drawer{position:fixed;top:0;right:0;bottom:0;width:min(84vw,380px);background:var(--rb-carta);z-index:81;transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) 0 30px;box-shadow:-8px 0 30px rgba(0,0,0,.2);}
    .rb-menu-aperto .rb-velo{opacity:1;pointer-events:auto;}
    .rb-menu-aperto .rb-drawer{transform:none;}
    .rb-drawer .tt{display:flex;justify-content:space-between;align-items:center;padding:0 8px 6px 22px;font:700 21px var(--rb-serif);color:var(--rb-scuro);}
    .rb-gr{font:800 12px var(--rb-sans);letter-spacing:.1em;color:var(--rb-testo2);text-transform:uppercase;padding:16px 22px 6px;}
    .rb-voce{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 22px;font:600 17px var(--rb-sans);color:var(--rb-testo);background:none;border:none;text-align:left;cursor:pointer;text-decoration:none;}
    .rb-voce.on{background:#efe8da;color:var(--rb-scuro);font-weight:800;border-left:4px solid var(--rb-accento);padding-left:18px;}
    .rb-voce .mini{width:32px;height:32px;flex:none;border-radius:50%;background:var(--rb-scuro);overflow:hidden;}
    .rb-voce .mini img{width:100%;height:100%;object-fit:cover;}
    .rb-voce .mini.tutti{background:conic-gradient(var(--rb-scuro) 0 50%,var(--rb-accento) 0);}
    /* pagine interne */
    .rb-sez{padding:6px 18px 10px;}
    .rb-lab{font:800 12px var(--rb-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--rb-testo2);margin:18px 0 8px;}
    .rb-campo{width:100%;min-height:52px;border:1px solid var(--rb-bordo);border-radius:14px;background:#fff;padding:13px 14px;font:16px var(--rb-sans);color:var(--rb-testo);outline:none;}
    .rb-campo:focus{border-color:var(--rb-accento);}
    textarea.rb-campo{resize:vertical;}
    .rb-foto-box{width:100%;aspect-ratio:1/1;border-radius:18px;border:2px dashed #cfc8bb;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--rb-testo2);font-size:17px;font-weight:700;cursor:pointer;overflow:hidden;padding:0;}
    .rb-foto-box img{width:100%;height:100%;object-fit:cover;}
    .rb-foto-box svg{width:44px;height:44px;stroke:var(--rb-testo2);fill:none;stroke-width:1.8;}
    .rb-stelle-sel{display:flex;gap:4px;}
    .rb-stelle-sel button{width:52px;height:52px;border:none;background:none;font-size:38px;color:#d8d0c1;cursor:pointer;padding:0;}
    .rb-stelle-sel button.on{color:var(--rb-accento);}
    .rb-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
    .rb-chips::-webkit-scrollbar{display:none;}
    .rb-chips.a-capo{flex-wrap:wrap;overflow:visible;}
    .rb-chip{flex:none;min-width:64px;height:66px;border-radius:14px;border:1px solid var(--rb-bordo);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;color:var(--rb-testo2);cursor:pointer;}
    .rb-chip b{font-size:20px;color:var(--rb-testo);}
    .rb-chip.ora{height:50px;min-width:80px;font-size:17px;font-weight:700;color:var(--rb-testo);}
    .rb-chip.on{background:var(--rb-scuro);border-color:var(--rb-scuro);color:#cfd8d4;}
    .rb-chip.on b,.rb-chip.ora.on{color:#fff;}
    .rb-conta{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--rb-bordo);border-radius:14px;background:#fff;padding:6px;}
    .rb-conta b{font:700 26px var(--rb-serif);}
    .rb-conta button{width:52px;height:52px;border-radius:12px;border:none;background:#efe8da;font-size:26px;color:var(--rb-scuro);cursor:pointer;}
    .rb-msg{text-align:center;font-size:16px;min-height:22px;margin-top:10px;font-weight:600;}
    .rb-nota{font-size:15px;color:var(--rb-accento-testo);font-weight:700;margin-top:12px;}
    .rb-riga{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--rb-bordo);font-size:16px;}
    .rb-riga:last-child{border:none;}
    .rb-box{border:1px solid var(--rb-bordo);border-radius:16px;background:#fff;padding:4px 16px;margin-top:8px;}
    .rb-ist h4{font:700 20px var(--rb-serif);color:var(--rb-scuro);margin:22px 0 6px;}
    .rb-ist p{font-size:16px;line-height:1.55;}
    .rb-nov b{display:block;font-size:14px;color:var(--rb-accento-testo);}
    .rb-loc{margin:14px 18px 0;border:1px solid var(--rb-bordo);border-radius:18px;background:#fff;overflow:hidden;}
    .rb-loc .cv{aspect-ratio:16/9;width:100%;object-fit:cover;display:block;background:linear-gradient(135deg,#2c3b33,#a8834f);}
    .rb-loc .bd{padding:14px 16px;display:flex;gap:12px;align-items:center;}
    .rb-loc h3{font:700 19px var(--rb-serif);color:var(--rb-scuro);}
    .rb-loc p{font-size:15px;color:var(--rb-testo2);}

<body>
  <div id="root">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function() {
    var SUPABASE_URL  = "https://cuhcscpvhypoaplcmtjk.supabase.co";
    var SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1aGNzY3B2aHlwb2FwbGNtdGprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4MjY4MjgsImV4cCI6MjA3OTQwMjgyOH0.q9zAs0oh8F1-whtORHBIORF5jIn1NTS3LvSMWleP0a0";
    var supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    var root = document.getElementById("root");
    var params = new URLSearchParams(window.location.search);
    var qrToken = params.get("t");
    var aziendaId = params.get("a");  // azienda che ha emesso il QR
    var sedeId = params.get("s");     // sede (opzionale): se presente, nome/logo della sede
    var _brandSede = null;            // { nome, logo_url } della sede, se disponibile
    var deferredInstall = null;

    // Carica il brand della sede (nome + logo) per personalizzare rispetto alla sede
    function caricaBrandSede(cb) {
      if (!sedeId) { cb(); return; }
      supa.from("sedi").select("nome,logo_url").eq("id", sedeId).maybeSingle().then(function(res) {
        if (res.data) _brandSede = res.data;
        cb();
      }).catch(function(){ cb(); });
    }

    // Cattura evento installazione PWA
    window.addEventListener("beforeinstallprompt", function(e) {
      e.preventDefault();
      deferredInstall = e;
    });

    if (!aziendaId) { showError("Link non valido", "Manca il riferimento al locale."); return; }

    var FIDELITY_API = "https://cuhcscpvhypoaplcmtjk.supabase.co/functions/v1/fidelity-api";

    // PWA: service worker (serve per l'installazione da Chrome/Android)
    if ("serviceWorker" in navigator) {
      try { navigator.serviceWorker.register("/sw.js"); } catch(e) {}
    }

    // Manifest dinamico: l'icona in home apre LA TESSERA del cliente, non il gestionale
    function impostaManifestTessera(nomeLocale, brand, logoUrl) {
      if (!qrToken) return;
      try {
        var startUrl = window.location.origin + "/fidelity.html?t=" + encodeURIComponent(qrToken) +
          "&a=" + encodeURIComponent(aziendaId) + (sedeId ? "&s=" + encodeURIComponent(sedeId) : "");
        // Icona home: logo del LOCALE (sede o azienda); fallback icona Ristoflow
        var icona = logoUrl || (window.location.origin + "/favicon-192.png");
        // iOS legge apple-touch-icon al momento dell'aggiunta: lo aggiorno col logo
        if (logoUrl) {
          var ati = document.querySelector('link[rel="apple-touch-icon"]');
          if (!ati) { ati = document.createElement("link"); ati.rel = "apple-touch-icon"; document.head.appendChild(ati); }
          ati.href = logoUrl;
        }
        var man = {
          name: "Tessera " + (nomeLocale || "Fidelity"),
          short_name: (nomeLocale || "Tessera").slice(0, 12),
          start_url: startUrl,
          scope: window.location.origin + "/",
          display: "standalone",
          background_color: "#FBF8F2",
          theme_color: "#12302C",
          icons: [
            { src: icona, sizes: "192x192", type: "image/png", purpose: "any" },
            { src: icona, sizes: "512x512", type: "image/png", purpose: "any maskable" }
          ]
        };
        var blob = new Blob([JSON.stringify(man)], { type: "application/json" });
        var link = document.querySelector('link[rel="manifest"]');
        if (!link) { link = document.createElement("link"); link.rel = "manifest"; document.head.appendChild(link); }
        link.href = URL.createObjectURL(blob);
      } catch(e) { /* fallback: manifest statico */ }
    }

    // ══════════ RISTOFLOWBOOK: testata + menu ☰ + barra in basso (22/11/2026) ══════════
    // Struttura fissa di ogni pagina: testata col nome del locale, menu laterale, barra in basso.
    // Le spiegazioni stanno tutte in "Istruzioni" (menu), non dentro le pagine.
    var S = { cliente: null, tessera: null, azienda: {}, cfg: {}, movimenti: [], offerte: [],
              locali: [], miei: [], sede: null, posts: [], stories: [], feedOk: false };
    var NOVITA = [
      { data: "22 novembre 2026", testo: "Nuova app: bacheca con le storie, menu laterale, Prenota e Pubblica sempre in basso." },
      { data: "19 luglio 2026", testo: "La tessera si salva sul telefono come un'app." }
    ];
    var ICO = {
      menu: '<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
      x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
      indietro: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
      home: '<svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>',
      prenota: '<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
      piu: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
      locale: '<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
      tessera: '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>',
      foto: '<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>'
    };

    function linkSede(id) {
      return "fidelity.html?t=" + encodeURIComponent(qrToken) + "&a=" + encodeURIComponent(aziendaId) + (id ? "&s=" + encodeURIComponent(id) : "");
    }
    function nomeContesto() {
      if (S.sede) return S.sede.nome;
      if (_brandSede && _brandSede.nome) return _brandSede.nome;
      return S.miei.length > 1 ? "Tutti i locali" : (S.miei[0] ? S.miei[0].nome : (S.azienda.nome || "Il locale"));
    }
    function logoContesto() { return (S.sede && S.sede.logo_url) || (_brandSede && _brandSede.logo_url) || S.azienda.logo_url || ""; }

    function montaApp(d) {
      S.cliente = d.cliente; S.tessera = d.tessera; S.azienda = d.azienda || {}; S.cfg = d.cfg || {};
      S.movimenti = d.movimenti || []; S.offerte = d.offerte || [];
      _fidCliente = d.cliente; _fidAzienda = S.azienda;
      document.body.classList.add("rb-on");
      document.body.style.fontFamily = ""; document.body.style.fontSize = "";
      root.innerHTML =
        '<div class="rb">' +
          '<header class="rb-top" id="rb-top"></header>' +
          '<main id="rb-main"></main>' +
        '</div>' +
        '<nav class="rb-bar" id="rb-bar">' +
          '<button data-v="home">' + ICO.home + 'Home</button>' +
          '<button data-v="prenota">' + ICO.prenota + 'Prenota</button>' +
          '<button data-v="pubblica" class="centrale" aria-label="Pubblica">' + ICO.piu + '</button>' +
          '<button data-v="locale">' + ICO.locale + 'Locale</button>' +
          '<button data-v="tessera">' + ICO.tessera + 'Tessera</button>' +
        '</nav>' +
        '<div class="rb-velo" id="rb-velo"></div><aside class="rb-drawer" id="rb-drawer"></aside>';
      document.querySelectorAll("#rb-bar button").forEach(function(b){
        b.onclick = function(){ vai(b.dataset.v); };
      });
      document.getElementById("rb-velo").onclick = chiudiMenu;
      window.addEventListener("hashchange", function(){ mostra(vistaDaHash()); });
      // locali del circuito: mi servono per "I miei locali", copertina e logo della sede
      fetch(SUPABASE_URL + "/functions/v1/fidelity-social", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ azione: "locali" }) })
        .then(function(r){ return r.json(); })
        .then(function(j){
          S.locali = j.locali || [];
          S.miei = S.locali.filter(function(l){ return l.azienda_id === aziendaId; });
          S.sede = sedeId ? (S.locali.filter(function(l){ return l.id === sedeId; })[0] || null) : null;
          mostra(vistaDaHash());
        }).catch(function(){ mostra(vistaDaHash()); });
      mostra(vistaDaHash());
    }

    function vistaDaHash() { return (location.hash || "").replace("#", "") || "home"; }
    function vai(v) {
      if (v === "home") { if (location.hash) location.hash = ""; else mostra("home"); return; }
      if (vistaDaHash() === v) mostra(v); else location.hash = v;
    }

    var TITOLI = { prenota: "Prenota", pubblica: "Pubblica", locale: "Info e orari", tessera: "La tua tessera",
                   locali: "Scopri locali", istruzioni: "Istruzioni" };
    function mostra(v) {
      if (!TITOLI[v]) v = "home";
      chiudiMenu();
      var top = document.getElementById("rb-top");
      if (v === "home") {
        top.innerHTML = '<div class="nome">' + esc(nomeContesto()) + '</div><button class="rb-ico" id="rb-apri-menu" aria-label="Menu">' + ICO.menu + '</button>';
      } else {
        top.innerHTML = '<div class="interna"><button class="rb-ico" id="rb-indietro" aria-label="Indietro">' + ICO.indietro + '</button>' + TITOLI[v] + '</div>' +
          '<button class="rb-ico" id="rb-apri-menu" aria-label="Menu">' + ICO.menu + '</button>';
        document.getElementById("rb-indietro").onclick = function(){ vai("home"); };
      }
      document.getElementById("rb-apri-menu").onclick = apriMenu;
      document.querySelectorAll("#rb-bar button").forEach(function(b){ b.classList.toggle("on", b.dataset.v === v); });
      var main = document.getElementById("rb-main");
      if (v === "home") vistaHome(main);
      else if (v === "prenota") vistaPrenota(main);
      else if (v === "pubblica") vistaPubblica(main);
      else if (v === "locale") vistaLocale(main);
      else if (v === "tessera") vistaTessera(main);
      else if (v === "locali") vistaLocali(main);
      else if (v === "istruzioni") vistaIstruzioni(main);
      window.scrollTo(0, 0);
    }

    // ── MENU ☰ ──
    function apriMenu() {
      var dr = document.getElementById("rb-drawer");
      var nome = (S.cliente && S.cliente.nome) || "";
      var h = '<div class="tt"><span>Ciao' + (nome ? ", " + esc(nome) : "") + '</span><button class="rb-ico" id="rb-chiudi" aria-label="Chiudi">' + ICO.x + '</button></div>';
      if (S.miei.length > 1) {
        h += '<div class="rb-gr">I miei locali</div>';
        S.miei.forEach(function(l){
          h += '<a class="rb-voce' + (sedeId === l.id ? " on" : "") + '" href="' + linkSede(l.id) + '"><span class="mini">' + (l.logo_url ? '<img src="' + esc(l.logo_url) + '" alt="">' : '') + '</span>' + esc(l.nome) + '</a>';
        });
        h += '<a class="rb-voce' + (!sedeId ? " on" : "") + '" href="' + linkSede(null) + '"><span class="mini tutti"></span>Tutti insieme</a>';
      }
      h += '<div class="rb-gr">RistoflowBook</div>' +
        '<button class="rb-voce" data-v="home">Bacheca</button>' +
        '<button class="rb-voce" data-v="locali">Scopri locali</button>' +
        '<button class="rb-voce" data-v="locale">Info e orari</button>' +
        '<div class="rb-gr">Le mie cose</div>' +
        '<button class="rb-voce" data-v="tessera">Tessera e punti</button>' +
        '<button class="rb-voce" data-v="prenota">Prenota un tavolo</button>' +
        '<div class="rb-gr">Il mio account</div>' +
        '<button class="rb-voce" id="rb-installa">Salva sul telefono</button>' +
        '<button class="rb-voce" id="rb-invita">Invita un amico</button>' +
        '<button class="rb-voce" data-v="istruzioni">Istruzioni</button>';
      dr.innerHTML = h;
      dr.querySelectorAll("[data-v]").forEach(function(b){ b.onclick = function(){ vai(b.dataset.v); chiudiMenu(); }; });
      document.getElementById("rb-chiudi").onclick = chiudiMenu;
      document.getElementById("rb-installa").onclick = installa;
      document.getElementById("rb-invita").onclick = invita;
      document.body.classList.add("rb-menu-aperto");
    }
    function chiudiMenu() { document.body.classList.remove("rb-menu-aperto"); }

    function installa() {
      if (deferredInstall) {
        deferredInstall.prompt();
        deferredInstall.userChoice.then(function(){ deferredInstall = null; });
      } else {
        alert("Su iPhone: tocca Condividi (□↑) e poi \"Aggiungi a schermata Home\".\n\nSu Android: tocca i tre puntini e poi \"Aggiungi a schermata Home\".");
      }
    }
    function invita() {
      // link di iscrizione del locale (non la tessera personale)
      var url = window.location.origin + "/fidelity.html?a=" + encodeURIComponent(aziendaId) + (sedeId ? "&s=" + encodeURIComponent(sedeId) : "") + "&utm_source=invito";
      var testo = "Ti invito da " + nomeContesto() + ": iscriviti alla tessera e hai subito lo sconto.";
      if (navigator.share) navigator.share({ title: nomeContesto(), text: testo, url: url }).catch(function(){});
      else if (navigator.clipboard) navigator.clipboard.writeText(url).then(function(){ alert("Link copiato"); });
    }

    // ── HOME (bacheca) ──
    function vistaHome(main) {
      var punti = (S.tessera && S.tessera.punti_locali) || 0;
      var liv = getLivello(punti, S.cfg), pross = getProssimaSoglia(punti, S.cfg);
      var cover = (S.sede && S.sede.cover_url) || "";
      var logo = logoContesto();
      var sotto = S.sede ? (S.sede.citta || "") : (S.miei.length > 1 ? S.miei.length + " locali" : (S.azienda.citta || ""));
      var h = '<div class="rb-storie" id="rb-storie"></div>' +
        '<div class="rb-cover" id="rb-cover">' + (cover ? '<img src="' + esc(cover) + '" alt="">' : '') + '</div>' +
        '<div class="rb-prof"><div class="rb-logo">' + (logo ? '<img src="' + esc(logo) + '" alt="">' : esc(inizialiDi(nomeContesto()).slice(0,1))) + '</div>' +
          '<div class="info"><h2>' + esc(nomeContesto()) + '</h2>' + (sotto ? '<p>' + esc(sotto) + '</p>' : '') + '</div></div>' +
        '<div class="rb-azioni"><button class="rb-btn" data-v="locale">Info e orari</button><button class="rb-btn" id="rb-invita2">+ Invita</button></div>' +
        '<button class="rb-tess" data-v="tessera"><div><div class="pt">' + punti.toLocaleString("it") + ' punti</div>' +
          '<small>' + (pross ? "Ancora " + (pross - punti) + " punti al livello successivo" : "Livello massimo raggiunto") + '</small></div>' +
          '<span class="liv">' + liv.nome + '</span></button>';
      // card in evidenza: l'offerta della settimana, altrimenti l'invito a raccontare la serata
      var o = S.offerte[0];
      if (o) {
        var val = o.tipo === "sconto_perc" ? "−" + o.valore + "%" : o.tipo === "sconto_fisso" ? "−" + Number(o.valore).toFixed(2).replace(".", ",") + " €" : "Omaggio";
        h += '<div class="rb-evid"><div class="bd"><div class="rb-et">Questa settimana · ' + esc(val) + '</div><h3>' + esc(o.titolo || "") + '</h3>' +
          (o.descrizione ? '<p>' + esc(o.descrizione) + '</p>' : '') +
          '<button class="rb-btn pieno full" data-v="prenota">Prenota il tuo tavolo</button></div></div>';
      } else {
        h += '<div class="rb-evid"><div class="bd"><div class="rb-et">Per te</div><h3>Racconta la tua serata</h3>' +
          '<p>Una foto e il tuo voto: il locale può regalarti punti.</p>' +
          '<button class="rb-btn pieno full" data-v="pubblica">Pubblica</button></div></div>';
      }
      h += '<div id="rb-feed"></div>';
      main.innerHTML = h;
      main.querySelectorAll("[data-v]").forEach(function(b){ b.onclick = function(){ vai(b.dataset.v); }; });
      document.getElementById("rb-invita2").onclick = invita;
      if (!cover) {
        // senza copertina della sede uso la prima foto della libreria del locale
        fetch(SUPABASE_URL + "/functions/v1/landing-media?a=" + aziendaId + (sedeId ? "&s=" + sedeId : "") + "&limit=1")
          .then(function(r){ return r.json(); })
          .then(function(j){
            var im = (j.images || []).filter(function(x){ return x.url; })[0];
            var c = document.getElementById("rb-cover");
            if (im && c) c.innerHTML = '<img src="' + esc(im.url) + '" alt="">';
          }).catch(function(){});
      }
      if (S.feedOk) disegnaFeed(); else caricaFeed();
    }

    async function caricaFeed() {
      var f = document.getElementById("rb-feed");
      if (f) f.innerHTML = '<div class="rb-vuoto">Caricamento…</div>';
      try {
        var r = await fetch(SUPABASE_URL + "/functions/v1/fidelity-social", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ azione: "feed", azienda_id: aziendaId, sede_id: sedeId }) });
        var j = await r.json();
        S.posts = j.posts || []; S.stories = j.stories || []; S.feedOk = true;
      } catch(e) { S.posts = []; S.stories = []; }
      disegnaFeed();
    }

    function nomeAutore(p) {
      return p.tipo_autore !== "cliente" ? (p.nome_locale || ((S.sede || S.miei.length < 2) ? nomeContesto() : "Il locale")) : (p.autore_nome || "Un ospite");
    }

    function disegnaFeed() {
      var st = document.getElementById("rb-storie"), f = document.getElementById("rb-feed");
      if (!st || !f) return;
      st.innerHTML = '<button class="rb-storia" id="rb-mia-storia"><div class="rb-anello mia"><div class="vuoto"></div></div><span class="piu">+</span><span class="lbl">La tua storia</span></button>' +
        S.stories.map(function(s, i){
          var visto = localStorage.getItem("rb_visto_" + s.id) ? " visto" : "";
          return '<button class="rb-storia" data-i="' + i + '"><div class="rb-anello' + visto + '"><img src="' + esc(s.media_url) + '" alt=""></div><span class="lbl">' + esc(nomeAutore(s).split(" ")[0]) + '</span></button>';
        }).join("");
      document.getElementById("rb-mia-storia").onclick = function(){ _modoStoria = true; vai("pubblica"); };
      st.querySelectorAll("[data-i]").forEach(function(b){ b.onclick = function(){ apriStoria(parseInt(b.dataset.i)); }; });

      var posts = S.posts.filter(function(p){ return (p.testo && p.testo.trim()) || p.media_url || p.voto; });
      if (!posts.length) { f.innerHTML = '<div class="rb-vuoto">Ancora nessun post. Pubblica il primo ricordo.</div>'; return; }
      f.innerHTML = posts.map(function(p){
        var loc = p.tipo_autore !== "cliente", nome = nomeAutore(p);
        var gia = localStorage.getItem("fid_reaz_" + p.id);
        var bt = function(e, em, n){ return '<button data-e="' + e + '" class="' + (gia === e ? "fatta" : "") + '">' + em + ' <span>' + (n || 0) + '</span></button>'; };
        return '<article class="rb-post" data-id="' + p.id + '">' +
          '<div class="hd"><div class="rb-av' + (loc ? " loc" : "") + '">' + esc(inizialiDi(nome)) + '</div><div><b>' + esc(nome) + '</b>' + (loc ? ' <span class="rb-verif" style="display:inline">✓</span>' : '') +
            '<span>' + (p.voto ? "Recensione · " : "") + tempoFa(p.created_at) + '</span></div></div>' +
          (p.media_url ? '<img class="foto" src="' + esc(p.media_url) + '" loading="lazy" alt="" onerror="this.remove()">' : '') +

    var _fotoBase64 = null, _fotoTipo = null, _votoSel = 0, _modoStoria = false;
    function vistaPubblica(main) {
      _fotoBase64 = null; _fotoTipo = null; _votoSel = 0;
      var storia = _modoStoria; _modoStoria = false;

        '<button class="rb-foto-box" id="pb-foto">' + ICO.foto + '<span>Scatta o scegli una foto</span></button>' +

      document.getElementById("pb-foto").onclick = function(){ fileIn.click(); };
      fileIn.onchange = function(){
        var f = fileIn.files && fileIn.files[0]; if (!f) return;
        var img = new Image();
        img.onload = function(){
          var max = 1280, w = img.width, h = img.height;
          if (w > max || h > max) { var k = Math.min(max/w, max/h); w = Math.round(w*k); h = Math.round(h*k); }
          var cv = document.createElement("canvas"); cv.width = w; cv.height = h;
          cv.getContext("2d").drawImage(img, 0, 0, w, h);
          _fotoBase64 = cv.toDataURL("image/jpeg", 0.82); _fotoTipo = "image/jpeg";
          document.getElementById("pb-foto").innerHTML = '<img src="' + _fotoBase64 + '" alt="">';
        };
        img.src = URL.createObjectURL(f);
      };
      var sb = document.getElementById("pb-stelle");
      sb.querySelectorAll("button").forEach(function(b){
        b.onclick = function(){
          _votoSel = parseInt(b.dataset.v);
          sb.querySelectorAll("button").forEach(function(x){ x.classList.toggle("on", parseInt(x.dataset.v) <= _votoSel); });
        };
      });
      document.getElementById("pb-storia").onclick = function(){ invia(true, this); };
      document.getElementById("pb-pubblica").onclick = function(){ invia(false, this); };
      if (storia) fileIn.click();

      async function invia(comeStoria, btn) {
        var msg = document.getElementById("pb-msg");
        var testo = document.getElementById("pb-testo").value.trim();
        if (comeStoria && !_fotoBase64) { msg.textContent = "Per la storia serve una foto."; msg.style.color = "#8A5414"; return; }
        if (!comeStoria && !testo && !_fotoBase64 && !_votoSel) { msg.textContent = "Aggiungi una foto, un voto o due righe."; msg.style.color = "#8A5414"; return; }
        var testoBtn = btn.textContent;
        btn.disabled = true; btn.textContent = "Pubblico…";
        try {
          var r = await fetch(SUPABASE_URL + "/functions/v1/fidelity-social", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ azione: "posta", qr_token: qrToken, azienda_id: aziendaId, sede_id: sedeId,
              testo: testo, voto: comeStoria ? null : (_votoSel || null), storia: comeStoria,
              foto_base64: _fotoBase64, foto_tipo: _fotoTipo }) });
          var j = await r.json();
          if (!j.success) throw new Error(j.error || "Errore");
          S.feedOk = false; vai("home");
        } catch(e) {
          msg.textContent = "Non pubblicato: " + e.message; msg.style.color = "#b91c1c";
          btn.disabled = false; btn.textContent = testoBtn;
        }
      }
    }

      var sel = { sede: sedeId || (S.miei.length === 1 ? S.miei[0].id : null), giorno: iso(giorni[0]), persone: 2, ora: null };

        '<div class="rb-msg" id="pr-msg"></div></div>';
      main.innerHTML = h;
      var btn = document.getElementById("pr-invia");
      function riepilogo() {
        var d = new Date(sel.giorno + "T12:00:00");
        if (!sel.sede && S.miei.length > 1) { btn.textContent = "Scegli il locale"; return; }
        if (!sel.ora) { btn.textContent = "Scegli l'orario"; return; }
        btn.textContent = "Conferma per " + sel.persone + " · " + GG[d.getDay()] + " " + d.getDate() + " · " + sel.ora;
      }
      function scegli(box, attr, cb) {
        var el = document.getElementById(box); if (!el) return;
        el.querySelectorAll("button").forEach(function(b){
          b.onclick = function(){ el.querySelectorAll("button").forEach(function(x){ x.classList.remove("on"); }); b.classList.add("on"); cb(b.getAttribute(attr)); riepilogo(); };

        '<h4>La bacheca</h4><p>In Home vedi le foto, le novità e le recensioni del locale scelto. Dal menu ☰ passi a un altro locale o a "Tutti insieme".</p>' +
        '<h4>Le storie</h4><p>I cerchi in alto sono le storie delle ultime 24 ore. Il cerchio colorato vuol dire che non l\'hai ancora vista. Toccalo per aprirla: tocca a destra per andare avanti, a sinistra per tornare indietro.</p>' +
        '<h4>Pubblicare</h4><p>Tocca il + al centro della barra in basso. Scegli una foto, dai il tuo voto e scrivi due righe. "Solo storia" la mostra nel cerchio per 24 ore. Il locale può regalarti punti per quello che pubblichi.</p>' +
        '<h4>Prenotare</h4><p>Tocca Prenota nella barra in basso: scegli giorno, persone e orario. Il locale ti conferma la prenotazione.</p>' +
        '<h4>Tessera e punti</h4><p>Ti iscrivi e hai subito il ' + sc + '% di sconto. Poi guadagni ' + ppe + ' punto per ogni euro speso. Con i punti sali di livello: Bronzo, Argento, Oro. Mostra la tessera alla cassa.</p>' +
        '<h4>Locali Ristoflow</h4><p>La tessera vale anche per le offerte dei locali del circuito Ristoflow: le trovi in "Scopri locali" e nella pagina della tessera.</p>' +
        '<h4>Salvare sul telefono</h4><p>Su iPhone: tocca Condividi (□↑) e poi "Aggiungi a schermata Home". Su Android: tocca i tre puntini e poi "Aggiungi a schermata Home". Non serve scaricare app.</p>' +
        '<h4>Privacy</h4><p>I tuoi dati sono trattati secondo il GDPR (Reg. UE 2016/679) e usati solo per la tessera. Puoi chiederne la cancellazione al locale in cui ti sei iscritto.</p>' +
        '<p style="margin-top:24px;color:var(--rb-testo2);font-size:14px;text-align:center">RistoflowBook · <a href="https://ristoflow-ai.com" style="color:var(--rb-accento-testo)">Ristoflow.Ai</a></p>' +
      '</div>';
    }

    // ── utilità comuni ──
    var _fidCliente = null, _fidAzienda = null;
    function tempoFa(iso) {
      var s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
      if (s < 3600) return Math.max(1, Math.floor(s/60)) + " min fa";
      if (s < 86400) return Math.floor(s/3600) + " ore fa";
      var g = Math.floor(s/86400);
      if (g < 7) return g === 1 ? "ieri" : g + " giorni fa";
      return formatData(iso);
    }
    function stelleHtml(v) { var o=""; for (var i=1;i<=5;i++) o += (i<=v?"★":"☆"); return o; }
    function inizialiDi(nome) { return String(nome||"?").split(" ").map(function(x){return x[0]||"";}).join("").slice(0,2).toUpperCase(); }

    caricaBrandSede(function(){ init(); });

    async function init() {
      // Tutto passa dalla fidelity-api (service role): le tabelle sono chiuse via RLS
      var apiRes, d;
      try {
        apiRes = await fetch(FIDELITY_API, { method: "POST", headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ azione: "carica", azienda_id: aziendaId, qr_token: qrToken || null }) });
        d = await apiRes.json();
      } catch (e) { showError("Errore di rete", "Controlla la connessione e riprova."); return; }
      if (!d.success) { showError("Errore", d.error || "Riprova più tardi."); return; }
      var azienda = d.azienda || {};

      var cfg = d.cfg || { punti_per_euro: 1, sconto_benvenuto_perc: 10, bonus_benvenuto_punti: 50, soglia_argento: 500, soglia_oro: 1500 };

      if (!qrToken) {
        // Nessun token → form iscrizione (qui resta il colore e il carattere del locale)
      // Applica colore brand
      if (azienda.colore_brand) {
        document.documentElement.style.setProperty("--brand", azienda.colore_brand);
        document.documentElement.style.setProperty("--brand-light", azienda.colore_brand + "1a");
      }
      if (azienda.font_family) {
        document.body.style.fontFamily = azienda.font_family;
        var fn = azienda.font_family.replace(/['"]/g,"").split(",")[0].trim().replace(/ /g,"+");
        var lnk = document.createElement("link"); lnk.rel="stylesheet";
        lnk.href = "https://fonts.googleapis.com/css2?family="+fn+":wght@400;700;800&display=swap";
        document.head.appendChild(lnk);
      }
      var fsSz = {small:"13px",medium:"15px",large:"17px",xlarge:"19px"};
      if (azienda.font_size) document.body.style.fontSize = fsSz[azienda.font_size]||"15px";

        renderFormIscrizione(azienda, cfg);
        return;
      }

      if (!d.cliente) {
        showError("Tessera non trovata", "Il QR code non è valido o è scaduto.");
        return;
      }

      impostaManifestTessera((_brandSede && _brandSede.nome) || azienda.nome, azienda.colore_brand, (_brandSede && _brandSede.logo_url) || azienda.logo_url || null);
      d.cfg = cfg;
      montaApp(d);
    }

    // ── FORM ISCRIZIONE ──────────────────────────────────────────
    function renderFormIscrizione(azienda, cfg) {
      // ── Mini-sito fidelity: hero fotografico, vantaggi, galleria, riprove sociali, form elegante ──
      var nomeMostra = (_brandSede && _brandSede.nome) ? _brandSede.nome : (azienda.nome || "noi");
      var logoMostra = (_brandSede && _brandSede.logo_url) ? _brandSede.logo_url : azienda.logo_url;
      var sconto = cfg.sconto_benvenuto_perc || 10;
      var bonus = cfg.bonus_benvenuto_punti || 50;
      var ppe = cfg.punti_per_euro || 1;

      // Font serif per i titoli (stile sito)
      if (!document.getElementById("fid-serif")) {
        var lk = document.createElement("link"); lk.id = "fid-serif"; lk.rel = "stylesheet";
        lk.href = "https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap";
        document.head.appendChild(lk);
      }

      root.innerHTML =
        '<div style="max-width:520px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 50px rgba(0,0,0,.06);">' +

        // HERO
        '<div id="fid-hero" style="position:relative;min-height:300px;display:flex;align-items:flex-end;overflow:hidden;background:linear-gradient(135deg,var(--brand,#0E5A7A),#1c2430);">' +
          '<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,20,.12),rgba(10,14,20,.72));"></div>' +
          '<div style="position:relative;width:100%;padding:28px 22px;text-align:center;color:#fff;">' +
            (logoMostra ? '<img src="' + esc(logoMostra) + '" style="width:54px;height:54px;border-radius:14px;object-fit:cover;margin-bottom:10px;border:2px solid rgba(255,255,255,.4);">' : '') +
            '<div style="font-family:\'Playfair Display\',Georgia,serif;font-style:italic;font-size:13px;letter-spacing:2px;opacity:.92;margin-bottom:6px;">Il club di casa</div>' +
            '<div style="font-family:\'Playfair Display\',Georgia,serif;font-size:30px;line-height:1.15;font-weight:700;text-shadow:0 2px 16px rgba(0,0,0,.4);">' + esc(nomeMostra) + '</div>' +
            '<div style="display:inline-block;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 20px;font-size:17px;font-weight:800;margin-top:12px;">−' + sconto + '% sul conto di oggi</div>' +
          '</div>' +
        '</div>' +

        // GALLERIA (riempita async)
        '<div id="fid-galleria"></div>' +

        // VANTAGGI
        '<div style="display:flex;gap:8px;padding:16px;">' +
          '<div style="flex:1;text-align:center;background:#faf9f7;border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:13px 6px;"><div style="font-size:22px;margin-bottom:5px;">🎁</div><div style="font-size:11px;font-weight:700;line-height:1.35;">−' + sconto + '% subito<br>+ ' + bonus + ' punti</div></div>' +
          '<div style="flex:1;text-align:center;background:#faf9f7;border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:13px 6px;"><div style="font-size:22px;margin-bottom:5px;">⭐</div><div style="font-size:11px;font-weight:700;line-height:1.35;">' + ppe + ' punto per<br>ogni euro speso</div></div>' +
          '<div style="flex:1;text-align:center;background:#faf9f7;border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:13px 6px;"><div style="font-size:22px;margin-bottom:5px;">🏆</div><div style="font-size:11px;font-weight:700;line-height:1.35;">Livelli e premi<br>riservati ai soci</div></div>' +
        '</div>' +

        // RIPROVE SOCIALI
        '<div style="padding:2px 16px 6px;">' +
          '<div style="display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 0 12px;">' +
            '<span style="font-family:\'Playfair Display\',Georgia,serif;font-size:27px;font-weight:700;">4,8</span>' +
            '<span><span style="color:#e0a93e;letter-spacing:1px;font-size:15px;">★★★★★</span><div style="font-size:11px;color:#98a1ae;">dalle recensioni dei nostri ospiti</div></span>' +
          '</div>' +
          '<div style="background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:13px 15px;margin-bottom:9px;box-shadow:0 2px 8px rgba(0,0,0,.03);">' +
            '<div style="display:flex;align-items:center;gap:9px;margin-bottom:6px;"><div style="width:32px;height:32px;border-radius:50%;background:#1f2733;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;">MB</div><div><div style="font-size:12.5px;font-weight:700;">Marco B.</div><div style="color:#e0a93e;font-size:11px;letter-spacing:1px;">★★★★★</div></div></div>' +
            '<div style="font-size:12.5px;line-height:1.6;color:#4a5361;font-style:italic;">"Con la tessera lo sconto arriva subito e i punti si accumulano da soli a ogni cena. Semplice e conveniente."</div>' +
          '</div>' +
          '<div style="background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:13px 15px;margin-bottom:4px;box-shadow:0 2px 8px rgba(0,0,0,.03);">' +
            '<div style="display:flex;align-items:center;gap:9px;margin-bottom:6px;"><div style="width:32px;height:32px;border-radius:50%;background:#1f2733;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;">EV</div><div><div style="font-size:12.5px;font-weight:700;">Elena V.</div><div style="color:#e0a93e;font-size:11px;letter-spacing:1px;">★★★★☆</div></div></div>' +
            '<div style="font-size:12.5px;line-height:1.6;color:#4a5361;font-style:italic;">"La tessera è sul telefono, niente carte da portare. E il pensiero per il compleanno è stato una bella sorpresa."</div>' +
          '</div>' +
        '</div>' +

        // FORM
        '<div style="margin:12px 16px 8px;background:#faf9f7;border:1px solid rgba(0,0,0,.08);border-radius:16px;padding:20px;" id="fid-form">' +
          '<div style="font-family:\'Playfair Display\',Georgia,serif;font-size:19px;font-weight:700;margin-bottom:4px;">Entra nel club</div>' +
          '<div style="font-size:12.5px;color:#7a8494;margin-bottom:14px;">Gratis, in 30 secondi. Lo sconto si applica al conto di oggi.</div>' +
          '<input id="reg-nome" class="form-input" placeholder="Nome *">' +
          '<input id="reg-cognome" class="form-input" placeholder="Cognome">' +
          '<input id="reg-telefono" class="form-input" type="tel" placeholder="Telefono *">' +
          '<input id="reg-email" class="form-input" type="email" placeholder="Email (opzionale)">' +
          '<label style="display:block;font-size:11px;font-weight:700;color:#7a8494;margin:2px 0 4px 2px;">DATA DI NASCITA <span style="font-weight:400;">(per il regalo di compleanno 🎂)</span></label>' +
          '<input id="reg-nascita" class="form-input" type="date">' +
          '<label style="display:flex;align-items:flex-start;gap:8px;margin:6px 0 14px;font-size:11.5px;color:#7a8494;line-height:1.5;">' +
            '<input type="checkbox" id="reg-privacy" style="margin-top:2px;accent-color:var(--brand);flex-shrink:0;">' +
            'Accetto il trattamento dei dati personali per il programma fidelity (GDPR). *' +
          '</label>' +
          '<button id="btn-iscriviti" style="width:100%;background:var(--brand,#0E5A7A);color:#fff;border:none;border-radius:999px;padding:13px 22px;font-size:14.5px;font-weight:700;letter-spacing:.4px;cursor:pointer;box-shadow:0 3px 14px rgba(0,0,0,.2);">Iscriviti — lo sconto è subito tuo</button>' +
          '<div style="text-align:center;font-size:11px;color:#98a1ae;margin-top:8px;">Gratis · senza impegno · tessera digitale immediata</div>' +
          '<div id="reg-msg" style="margin-top:10px;font-size:13px;text-align:center;"></div>' +
        '</div>' +

        '<div class="fidelity-footer" style="padding-bottom:18px;">Powered by <a href="https://ristoflow-ai.com">Ristoflow.Ai</a></div>' +
        '</div>';

      document.getElementById("btn-iscriviti").onclick = function() {
        doIscrizione(azienda, cfg);
      };

      // Hero + galleria dalla libreria media del locale
      fetch(SUPABASE_URL + "/functions/v1/landing-media?a=" + aziendaId + (sedeId ? "&s=" + sedeId : "") + "&limit=7")
        .then(function(r){ return r.json(); })
        .then(function(j){
          var imgs = (j.images || []).filter(function(x){ return x.url; });
          if (imgs[0]) {
            var im = document.createElement("img");
            im.src = imgs[0].url; im.alt = "";
            im.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:cover;";
            var hero = document.getElementById("fid-hero");
            if (hero) hero.insertBefore(im, hero.firstChild);
          }
          var resto = imgs.slice(1, 7);
          if (resto.length >= 3) {
            var g = document.getElementById("fid-galleria");
            if (g) g.innerHTML = '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;">' +
              resto.map(function(x){ return '<img src="' + esc(x.url) + '" alt="" loading="lazy" decoding="async" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;">'; }).join('') + '</div>';
          }
        }).catch(function(){ /* la galleria e' un plus */ });
    }

    async function doIscrizione(azienda, cfg) {
      var nome = (document.getElementById("reg-nome").value || "").trim();
      var cognome = (document.getElementById("reg-cognome").value || "").trim();
      var telefono = (document.getElementById("reg-telefono").value || "").trim();
      var email = (document.getElementById("reg-email").value || "").trim();
      var nascita = (document.getElementById("reg-nascita").value || "").trim();
      var privacy = document.getElementById("reg-privacy").checked;
      var msg = document.getElementById("reg-msg");

      if (!nome) { msg.innerHTML = '<span style="color:#dc2626;">Nome obbligatorio</span>'; return; }
      if (!telefono) { msg.innerHTML = '<span style="color:#dc2626;">Telefono obbligatorio</span>'; return; }
      if (!privacy) { msg.innerHTML = '<span style="color:#dc2626;">Accetta la privacy per continuare</span>'; return; }

      var btn = document.getElementById("btn-iscriviti");
      btn.disabled = true; btn.textContent = "Iscrizione in corso...";

      // Iscrizione via fidelity-api (dedupe, tessera, movimento e WA li fa il server)
      var apiRes, d;
      try {
        apiRes = await fetch(FIDELITY_API, { method: "POST", headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ azione: "iscrivi", azienda_id: aziendaId,
            nome: nome, cognome: cognome, telefono: telefono, email: email, data_nascita: nascita }) });
        d = await apiRes.json();
      } catch (e) { d = { success: false, error: "Errore di rete, riprova." }; }

      if (!d.success || !d.qr_token) {
        msg.innerHTML = '<span style="color:#dc2626;">' + esc(d.error || "Errore durante l'iscrizione.") + '</span>';
        btn.disabled = false; btn.textContent = "✅ Iscriviti e applica sconto";
        return;
      }

      // Redirect alla tessera
      window.location.href = "fidelity.html?t=" + d.qr_token + "&a=" + aziendaId + (sedeId ? "&s=" + sedeId : "");
    }

    // ── HELPERS ───────────────────────────────────────────────────
    function getLivello(punti, cfg) {
      if (punti >= (cfg.soglia_oro||1500)) return { nome:"Oro", emoji:"🥇" };
      if (punti >= (cfg.soglia_argento||500)) return { nome:"Argento", emoji:"🥈" };
      return { nome:"Bronzo", emoji:"🥉" };
    }

    function getProssimaSoglia(punti, cfg) {
      if (punti < (cfg.soglia_argento||500)) return cfg.soglia_argento||500;
      if (punti < (cfg.soglia_oro||1500)) return cfg.soglia_oro||1500;
      return null;
    }

    function formatData(ts) {
      if (!ts) return "";
      var d = new Date(ts);
      return d.toLocaleDateString("it-IT", { day:"2-digit", month:"short", year:"numeric" });
    }

    function formatDataBreve(s) {
      if (!s) return "";
      var p = s.split("-");
      return p[2] + "/" + p[1] + "/" + p[0];
    }

    function showError(title, sub) {
      root.innerHTML = '<div class="error-page"><div class="error-icon">😕</div><div class="error-title">' + esc(title) + '</div><div class="error-sub">' + esc(sub) + '</div></div>';
    }

    function esc(v) {
      return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
  })();
  </script>
