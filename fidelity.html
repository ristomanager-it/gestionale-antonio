<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Tessera Fidelity</title>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#0E5A7A"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <link rel="apple-touch-icon" href="/assets/favicon-192.png"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--brand:#0E5A7A;--brand-light:#e8f4f8;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f0f6fa;min-height:100vh;color:#111827;}
    .spinner{width:48px;height:48px;border:4px solid var(--brand-light);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .page-loader{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;color:#64748b;font-size:14px;font-weight:600;}

    /* CARD TESSERA */
    .tessera-card{
      background:linear-gradient(135deg,var(--brand),#1a8fb5);
      border-radius:24px;margin:20px 16px 0;padding:24px;
      color:#fff;position:relative;overflow:hidden;
      box-shadow:0 8px 32px rgba(14,90,122,0.3);
    }
    .tessera-card::before{
      content:"";position:absolute;top:-40px;right:-40px;
      width:180px;height:180px;border-radius:50%;
      background:rgba(255,255,255,0.08);
    }
    .tessera-card::after{
      content:"";position:absolute;bottom:-60px;left:-20px;
      width:200px;height:200px;border-radius:50%;
      background:rgba(255,255,255,0.05);
    }
    .tessera-logo{width:52px;height:52px;border-radius:14px;object-fit:cover;border:2px solid rgba(255,255,255,.3);margin-bottom:12px;}
    .tessera-locale{font-size:13px;font-weight:700;opacity:.8;margin-bottom:2px;}
    .tessera-nome{font-size:22px;font-weight:800;margin-bottom:16px;}
    .tessera-punti-label{font-size:11px;font-weight:700;opacity:.7;text-transform:uppercase;letter-spacing:.06em;}
    .tessera-punti{font-size:42px;font-weight:800;line-height:1;}
    .tessera-punti-sub{font-size:12px;opacity:.7;margin-top:4px;}
    .tessera-livello{
      position:absolute;top:20px;right:20px;
      background:rgba(255,255,255,.2);border-radius:999px;
      padding:6px 14px;font-size:12px;font-weight:800;
    }
    .tessera-network{
      position:absolute;bottom:20px;right:20px;
      font-size:10px;font-weight:700;opacity:.6;
    }

    /* SEZIONI */
    .section{background:#fff;border-radius:18px;margin:12px 16px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,0.04);}
    .section-title{font-size:13px;font-weight:800;color:#374151;margin-bottom:12px;display:flex;align-items:center;gap:6px;}

    /* LIVELLI */
    .livelli-bar{display:flex;gap:6px;margin-bottom:10px;}
    .livello-step{flex:1;height:6px;border-radius:999px;background:#e5e7eb;}
    .livello-step.active{background:var(--brand);}
    .livelli-labels{display:flex;justify-content:space-between;font-size:10px;color:#94a3b8;font-weight:700;}

    /* OFFERTE NETWORK */
    .offerta-card{border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;}
    .offerta-badge{background:var(--brand);color:#fff;border-radius:10px;padding:8px 10px;font-size:16px;font-weight:800;flex-shrink:0;min-width:48px;text-align:center;}
    .offerta-nome{font-size:14px;font-weight:800;color:#111827;}
    .offerta-desc{font-size:12px;color:#64748b;margin-top:2px;}
    .offerta-locale{font-size:11px;color:var(--brand);font-weight:700;margin-top:4px;}
    .offerta-dist{font-size:11px;color:#94a3b8;}

    /* STORICO */
    .mov-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f3f4f6;}
    .mov-row:last-child{border-bottom:none;}
    .mov-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
    .mov-text{flex:1;min-width:0;}
    .mov-label{font-size:13px;font-weight:700;color:#111827;}
    .mov-date{font-size:11px;color:#94a3b8;}
    .mov-punti{font-size:15px;font-weight:800;}

    /* MAPPA */
    .map-container{border-radius:14px;overflow:hidden;height:220px;background:#e5e7eb;margin-bottom:10px;}

    /* BTN */
    .btn-full{width:100%;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;}
    .btn-primary{background:var(--brand);color:#fff;}
    .btn-sec{background:#f3f4f6;color:#374151;margin-top:8px;}
    .btn-install{background:linear-gradient(135deg,#059669,#10b981);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;}

    /* FORM ISCRIZIONE */
    .form-card{background:#fff;border-radius:24px;margin:20px 16px;padding:24px;box-shadow:0 8px 32px rgba(0,0,0,0.1);}
    .form-title{font-size:20px;font-weight:800;color:#111827;margin-bottom:4px;}
    .form-sub{font-size:13px;color:#64748b;margin-bottom:20px;line-height:1.5;}
    .form-input{width:100%;box-sizing:border-box;padding:12px 16px;border:1.5px solid #e2e8f0;border-radius:14px;font-size:15px;outline:none;margin-bottom:12px;font-family:inherit;}
    .form-input:focus{border-color:var(--brand);}
    .promo-box{background:linear-gradient(135deg,#059669,#10b981);border-radius:14px;padding:14px;margin-bottom:16px;color:#fff;text-align:center;}
    .promo-box-title{font-size:22px;font-weight:800;}
    .promo-box-sub{font-size:13px;opacity:.9;margin-top:2px;}

    /* ACCORDION */
    .accordion-item{border-bottom:1px solid #f3f4f6;}
    .accordion-item:last-child{border-bottom:none;}
    .accordion-btn{width:100%;text-align:left;background:none;border:none;padding:12px 0;font-size:13px;font-weight:700;color:#374151;cursor:pointer;}
    .accordion-btn:hover{color:var(--brand);}
    .accordion-body{font-size:12px;color:#64748b;line-height:1.6;padding-bottom:12px;}
    /* FOOTER */
    .fidelity-footer{text-align:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom));font-size:11px;color:#9ca3af;}
    .fidelity-footer a{color:var(--brand);text-decoration:none;}

    /* ERROR */
    .error-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px;text-align:center;gap:12px;}
    .error-icon{font-size:56px;}
    .error-title{font-size:20px;font-weight:800;}
    .error-sub{font-size:13px;color:#64748b;max-width:280px;}

    @media(min-width:480px){
      .tessera-card,.section,.form-card{max-width:480px;margin-left:auto;margin-right:auto;width:100%;}
      body{display:flex;flex-direction:column;align-items:center;}
    }

    /* ── RESTYLE PREMIUM TESSERA (stile sito) ─────────────────── */
    body{background:#f6f5f2;}
    .tessera-card{
      background:linear-gradient(140deg,#161d27,#243040 60%,#2b3950);
      border:1px solid rgba(201,163,90,.35);
      box-shadow:0 14px 40px rgba(20,26,35,.35);
    }
    .tessera-card::before{background:rgba(201,163,90,.08);}
    .tessera-card::after{background:rgba(255,255,255,.04);}
    .tessera-livello{background:rgba(201,163,90,.22);border:1px solid rgba(201,163,90,.5);color:#e9d3a3;}
    .tessera-locale{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:600;opacity:.85;letter-spacing:.5px;}
    .tessera-nome{font-family:'Playfair Display',Georgia,serif;font-weight:700;}
    .tessera-punti{font-family:'Playfair Display',Georgia,serif;font-weight:700;color:#e9d3a3;}
    .tessera-network{color:#e9d3a3;opacity:.5;}
    .section{border:1px solid rgba(0,0,0,.07);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.04);}
    .btn-full{border-radius:999px;font-weight:700;font-size:14.5px;letter-spacing:.3px;}
    .btn-install{background:#1f2733;color:#e9d3a3;box-shadow:0 3px 14px rgba(31,39,51,.3);}
    .livello-step.active{background:#c9a35a;}
    .offerta-badge{border-radius:999px;}

    /* ── MINI-APP: ICONE + PANNELLI + SOCIAL ── */
    .icone-app{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 16px 8px;}
    .icona-app{border:none;background:#fff;border-radius:16px;padding:14px 6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid rgba(0,0,0,.07);box-shadow:0 2px 10px rgba(0,0,0,.04);}
    .icona-app .ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--brand-light);}
    .icona-app .lb{font-size:10.5px;font-weight:800;color:#374151;}
    .pane-head{position:sticky;top:0;z-index:50;background:rgba(246,245,242,.94);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid rgba(0,0,0,.06);}
    .pane-head button{border:none;background:#fff;border-radius:999px;width:34px;height:34px;font-size:16px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08);}
    .pane-head .tt{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:700;}
    .tab-pane{display:none;}
    .tab-pane.attivo{display:block;}
    /* stories */
    .stories-row{display:flex;gap:12px;overflow-x:auto;padding:14px 16px 6px;scrollbar-width:none;}
    .stories-row::-webkit-scrollbar{display:none;}
    .story-c{flex:0 0 auto;width:64px;text-align:center;cursor:pointer;}
    .story-c .cerchio{width:60px;height:60px;border-radius:50%;padding:2.5px;background:linear-gradient(45deg,#f0a13c,#e0577b,#a44fd0);}
    .story-c .cerchio.mia{background:#d1d5db;}
    .story-c img,.story-c .plus{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #fff;display:block;background:#fff;}
    .story-c .plus{display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--brand);font-weight:800;}
    .story-c .nm{font-size:9.5px;font-weight:700;color:#374151;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .invito-card{margin:10px 16px;background:linear-gradient(135deg,var(--brand),#1c2430);border-radius:16px;padding:16px;color:#fff;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.18);}
    .invito-card .em{font-size:28px;}
    .invito-card b{font-size:14.5px;display:block;}
    .invito-card span{font-size:12px;opacity:.85;}
    /* feed (come prima) */
    .feed-card{background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:16px;margin:12px 16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.04);}
    .feed-head{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;}
    .feed-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;background:#1f2733;flex-shrink:0;}
    .feed-av.locale{background:var(--brand);}
    .feed-nome{font-size:13.5px;font-weight:800;color:#111827;}
    .feed-sub{font-size:11px;color:#94a3b8;}
    .feed-media{width:100%;max-height:440px;object-fit:cover;display:block;background:#f1f5f9;}
    .feed-testo{padding:10px 14px 4px;font-size:13.5px;line-height:1.55;color:#1f2733;}
    .feed-stelle{color:#e0a93e;font-size:14px;letter-spacing:1px;padding:8px 14px 0;}
    .feed-azioni{display:flex;gap:14px;padding:10px 14px 12px;align-items:center;}
    .feed-reaz{border:none;background:#f8fafc;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:700;color:#374151;}
    .feed-reaz.fatta{background:var(--brand-light);color:var(--brand);}
    .stelle-sel{display:flex;gap:6px;font-size:26px;cursor:pointer;user-select:none;}
    .stelle-sel span{color:#d1d5db;transition:color .1s;}
    .stelle-sel span.on{color:#e0a93e;}
    /* trip */
    .trip-card{background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:16px;margin:12px 16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.04);}
    .trip-cover{width:100%;height:140px;object-fit:cover;display:block;background:linear-gradient(135deg,#243447,#0E5A7A);}
    .trip-body{padding:12px 14px;display:flex;gap:10px;align-items:flex-start;}
    .trip-logo{width:44px;height:44px;border-radius:12px;object-fit:cover;border:1px solid rgba(0,0,0,.08);flex-shrink:0;background:#f1f5f9;}
    .trip-nome{font-family:'Playfair Display',Georgia,serif;font-size:16.5px;font-weight:700;}
    .trip-sub{font-size:11.5px;color:#7a8494;margin-top:1px;}
    .trip-voto{font-size:12.5px;margin-top:5px;color:#374151;}
    .trip-voto .st{color:#e0a93e;letter-spacing:1px;}
    /* story viewer */
    .story-view{position:fixed;inset:0;background:#000;z-index:990;display:flex;align-items:center;justify-content:center;}
    .story-view img{max-width:100%;max-height:100%;}
    .story-view .sv-head{position:absolute;top:0;left:0;right:0;padding:16px;color:#fff;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);}
  </style>
</head>
<body>
  <div id="root">
    <div class="page-loader"><div class="spinner"></div>Caricamento tessera...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function() {
    var SUPABASE_URL  = "https://cuhcscpvhypoaplcmtjk.supabase.co";
    var SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1aGNzY3B2aHlwb2FwbGNtdGprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4MjY4MjgsImV4cCI6MjA3OTQwMjgyOH0.q9zAs0oh8F1-whtORHBIORF5jIn1NTS3LvSMWleP0a0";
    var supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    var root = document.getElementById("root");
    var params = new URLSearchParams(window.location.search);
    var qrToken = params.get("t");
    var aziendaId = params.get("a");  // azienda che ha emesso il QR
    var sedeId = params.get("s");     // sede (opzionale): se presente, nome/logo della sede
    var _brandSede = null;            // { nome, logo_url } della sede, se disponibile
    var deferredInstall = null;

    // Carica il brand della sede (nome + logo) per personalizzare rispetto alla sede
    function caricaBrandSede(cb) {
      if (!sedeId) { cb(); return; }
      supa.from("sedi").select("nome,logo_url").eq("id", sedeId).maybeSingle().then(function(res) {
        if (res.data) _brandSede = res.data;
        cb();
      }).catch(function(){ cb(); });
    }

    // Cattura evento installazione PWA
    window.addEventListener("beforeinstallprompt", function(e) {
      e.preventDefault();
      deferredInstall = e;
    });

    if (!aziendaId) { showError("Link non valido", "Manca il riferimento al locale."); return; }

    var FIDELITY_API = "https://cuhcscpvhypoaplcmtjk.supabase.co/functions/v1/fidelity-api";

    // PWA: service worker (serve per l'installazione da Chrome/Android)
    if ("serviceWorker" in navigator) {
      try { navigator.serviceWorker.register("/sw.js"); } catch(e) {}
    }

    // Manifest dinamico: l'icona in home apre LA TESSERA del cliente, non il gestionale
    function impostaManifestTessera(nomeLocale, brand, logoUrl) {
      if (!qrToken) return;
      try {
        var startUrl = window.location.origin + "/fidelity.html?t=" + encodeURIComponent(qrToken) +
          "&a=" + encodeURIComponent(aziendaId) + (sedeId ? "&s=" + encodeURIComponent(sedeId) : "");
        // Icona home: logo del LOCALE (sede o azienda); fallback icona Ristoflow
        var icona = logoUrl || (window.location.origin + "/favicon-192.png");
        // iOS legge apple-touch-icon al momento dell'aggiunta: lo aggiorno col logo
        if (logoUrl) {
          var ati = document.querySelector('link[rel="apple-touch-icon"]');
          if (!ati) { ati = document.createElement("link"); ati.rel = "apple-touch-icon"; document.head.appendChild(ati); }
          ati.href = logoUrl;
        }
        var man = {
          name: "Tessera " + (nomeLocale || "Fidelity"),
          short_name: (nomeLocale || "Tessera").slice(0, 12),
          start_url: startUrl,
          scope: window.location.origin + "/",
          display: "standalone",
          background_color: "#161d27",
          theme_color: brand || "#0E5A7A",
          icons: [
            { src: icona, sizes: "192x192", type: "image/png", purpose: "any" },
            { src: icona, sizes: "512x512", type: "image/png", purpose: "any maskable" }
          ]
        };
        var blob = new Blob([JSON.stringify(man)], { type: "application/json" });
        var link = document.querySelector('link[rel="manifest"]');
        if (!link) { link = document.createElement("link"); link.rel = "manifest"; document.head.appendChild(link); }
        link.href = URL.createObjectURL(blob);
      } catch(e) { /* fallback: manifest statico */ }
    }

    // ══════════ MINI-APP: TESSERA HOME + ICONE + SOCIAL IG + TRIP ══════════
    var _fidCliente = null, _fidAzienda = null;
    var _feedCaricato = false, _localeCaricato = false, _prenotaMontato = false, _tripCaricato = false;

    function montaMiniApp(cliente, azienda, cfg) {
      _fidCliente = cliente; _fidAzienda = azienda;
      if (document.getElementById("fid-icone")) return;
      // 1) impacchetto la tessera nel pannello home
      var home = document.createElement("div"); home.id = "tab-tessera"; home.className = "tab-pane attivo";
      while (root.firstChild) home.appendChild(root.firstChild);
      root.appendChild(home);
      // 2) icone-app sotto la tessera
      var grid = document.createElement("div"); grid.className = "icone-app"; grid.id = "fid-icone";
      grid.innerHTML =
        '<button data-p="social"><span class="ic">📸</span><span class="lb">Social</span></button>' +
        '<button data-p="trip"><span class="ic">🌍</span><span class="lb">Locali</span></button>' +
        '<button data-p="prenota"><span class="ic">📅</span><span class="lb">Prenota</span></button>' +
        '<button data-p="locale"><span class="ic">📍</span><span class="lb">Il locale</span></button>';
      grid.querySelectorAll("button").forEach(function(b){ b.className = "icona-app"; });
      // le inserisco subito dopo la card tessera (primo figlio del pannello)
      var card = home.querySelector(".tessera-card");
      if (card && card.nextSibling) home.insertBefore(grid, card.nextSibling); else home.appendChild(grid);
      // 3) pannelli
      var titoli = { social: "Novità e recensioni", trip: "Locali Ristoflow", prenota: "Prenota un tavolo", locale: "Il locale" };
      ["social","trip","prenota","locale"].forEach(function(t){
        var d = document.createElement("div"); d.id = "pane-" + t; d.className = "tab-pane";
        d.innerHTML = '<div class="pane-head"><button data-back="1">←</button><div class="tt">' + titoli[t] + '</div></div><div id="pane-' + t + '-body"></div>';
        d.querySelector("[data-back]").onclick = function(){ apriPannello(null); };
        root.appendChild(d);
      });
      grid.querySelectorAll(".icona-app").forEach(function(b){
        b.onclick = function(){ apriPannello(b.dataset.p); };
      });
    }

    function apriPannello(p) {
      document.querySelectorAll(".tab-pane").forEach(function(x){ x.classList.remove("attivo"); });
      if (!p) { document.getElementById("tab-tessera").classList.add("attivo"); window.scrollTo(0,0); return; }
      document.getElementById("pane-" + p).classList.add("attivo");
      if (p === "social" && !_feedCaricato) caricaSocial();
      if (p === "trip" && !_tripCaricato) caricaTrip();
      if (p === "prenota" && !_prenotaMontato) montaPrenota();
      if (p === "locale" && !_localeCaricato) caricaLocale();
      window.scrollTo(0,0);
    }

    // ── SOCIAL (stile IG: storie + invito + feed) ──
    function tempoFa(iso) {
      var s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
      if (s < 3600) return Math.max(1, Math.floor(s/60)) + " min fa";
      if (s < 86400) return Math.floor(s/3600) + " h fa";
      return Math.floor(s/86400) + " g fa";
    }
    function stelleHtml(v) { var o=""; for (var i=1;i<=5;i++) o += (i<=v?"★":"☆"); return o; }
    function inizialiDi(nome) { return String(nome||"?").split(" ").map(function(x){return x[0]||"";}).join("").slice(0,2).toUpperCase(); }

    async function caricaSocial() {
      var box = document.getElementById("pane-social-body");
      box.innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8;font-size:13px;">Caricamento...</div>';
      try {
        var r = await fetch(SUPABASE_URL + "/functions/v1/fidelity-social", {
          method: "POST", headers: { "Content-Type": "application/json" },

          var j = await r.json();
          if (!j.success) throw new Error(j.error || "Errore");
          m.remove(); _feedCaricato = false; caricaSocial();

    async function doIscrizione(azienda, cfg) {
      var nome = (document.getElementById("reg-nome").value || "").trim();
      var cognome = (document.getElementById("reg-cognome").value || "").trim();
      var telefono = (document.getElementById("reg-telefono").value || "").trim();
      var email = (document.getElementById("reg-email").value || "").trim();
      var nascita = (document.getElementById("reg-nascita").value || "").trim();
      var privacy = document.getElementById("reg-privacy").checked;
      var msg = document.getElementById("reg-msg");

      if (!nome) { msg.innerHTML = '<span style="color:#dc2626;">Nome obbligatorio</span>'; return; }
      if (!telefono) { msg.innerHTML = '<span style="color:#dc2626;">Telefono obbligatorio</span>'; return; }
      if (!privacy) { msg.innerHTML = '<span style="color:#dc2626;">Accetta la privacy per continuare</span>'; return; }

      var btn = document.getElementById("btn-iscriviti");
      btn.disabled = true; btn.textContent = "Iscrizione in corso...";

      // Iscrizione via fidelity-api (dedupe, tessera, movimento e WA li fa il server)
      var apiRes, d;
      try {
        apiRes = await fetch(FIDELITY_API, { method: "POST", headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ azione: "iscrivi", azienda_id: aziendaId,
            nome: nome, cognome: cognome, telefono: telefono, email: email, data_nascita: nascita }) });
        d = await apiRes.json();
      } catch (e) { d = { success: false, error: "Errore di rete, riprova." }; }

      if (!d.success || !d.qr_token) {
        msg.innerHTML = '<span style="color:#dc2626;">' + esc(d.error || "Errore durante l'iscrizione.") + '</span>';
        btn.disabled = false; btn.textContent = "✅ Iscriviti e applica sconto";
        return;
      }

      // Redirect alla tessera
      window.location.href = "fidelity.html?t=" + d.qr_token + "&a=" + aziendaId + (sedeId ? "&s=" + sedeId : "");
    }

          '</div>' +
          // Lista offerte scorrevole
          '<div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;">' +
          offerte.slice(0,8).map(function(o) {
            var az2 = o.aziende || {};
            var val = o.tipo==="sconto_perc" ? "-"+o.valore+"%" : o.tipo==="sconto_fisso" ? "-€"+Number(o.valore).toFixed(2) : "🎁";
            return '<div style="flex-shrink:0;width:160px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px;">' +
              '<div style="background:var(--brand);color:#fff;border-radius:8px;padding:4px 8px;font-size:12px;font-weight:800;margin-bottom:8px;text-align:center;">' + esc(val) + '</div>' +
              '<div style="font-size:13px;font-weight:700;margin-bottom:2px;">' + esc(o.titolo) + '</div>' +
              '<div style="font-size:11px;color:#64748b;">📍 ' + esc(az2.nome||"") + '</div>' +
              (az2.citta ? '<div style="font-size:11px;color:#94a3b8;">' + esc(az2.citta) + '</div>' : '') +
            '</div>';
          }).join("") +
          '</div>' +
        '</div>';
      }

      html += '<div class="fidelity-footer">Powered by <a href="https://ristoflow-ai.com">Ristoflow.Ai</a></div>';

      root.innerHTML = html;

      // Bind mappa
      var btnPos = document.getElementById("btn-attiva-pos");
      if (btnPos) {
        btnPos.onclick = function() {
          if (!navigator.geolocation) { alert("Posizione non supportata"); return; }
          btnPos.textContent = "⏳ Rilevamento...";
          navigator.geolocation.getCurrentPosition(
            function(pos) {
              var lat = pos.coords.latitude, lng = pos.coords.longitude;
              var box = document.getElementById("mappa-network-box");
              if (!box) return;
              box.innerHTML = '<div id="leaflet-map2" style="width:100%;height:220px;border-radius:14px;overflow:hidden;"></div>' +
                '<a href="https://www.openstreetmap.org/?mlat=' + lat + '&mlon=' + lng + '&zoom=13" target="_blank" style="display:flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:#fff;padding:10px;font-size:13px;font-weight:800;text-decoration:none;margin-top:8px;border-radius:10px;">🧭 Apri in OpenStreetMap</a>';
              var map2 = L.map("leaflet-map2").setView([lat, lng], 13);
              L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                attribution: "© OpenStreetMap", maxZoom: 18
              }).addTo(map2);
              var ic2 = L.divIcon({
                html: '<div style="background:var(--brand);border:3px solid #fff;border-radius:50%;width:16px;height:16px;box-shadow:0 2px 6px rgba(0,0,0,0.3);"></div>',
                iconSize:[16,16],iconAnchor:[8,8],className:""
              });
              L.marker([lat,lng],{icon:ic2}).addTo(map2).bindPopup("<strong>📍 Sei qui</strong>").openPopup();
            },
            function() { if(btnPos) btnPos.textContent = "❌ Posizione non disponibile"; }
          );
        };
      }

      // BIND
      var btnInstall = document.getElementById("btn-install");
      if (btnInstall) {
        btnInstall.onclick = function() {
          if (deferredInstall) {
            deferredInstall.prompt();
            deferredInstall.userChoice.then(function(r) {
              if (r.outcome === "accepted") btnInstall.textContent = "✅ Aggiunta!";
              deferredInstall = null;
            });
          } else {
            // iOS: mostra istruzioni
            alert("Su iPhone: tocca il pulsante Condividi (□↑) in basso e poi 'Aggiungi a schermata Home'.\n\nSu Android: tocca i tre puntini in alto e poi 'Aggiungi a schermata Home'.");
          }
        };
      }

      var btnCondividi = document.getElementById("btn-condividi");
      if (btnCondividi) {
        btnCondividi.onclick = function() {
          if (navigator.share) {
            navigator.share({ title: "La mia tessera " + (azienda.nome||""), url: linkTessera }).catch(function(){});
          } else {
            navigator.clipboard && navigator.clipboard.writeText(linkTessera).then(function() {
              alert("Link copiato!");
            });
          }
        };
      }

      var btnPos = document.getElementById("btn-posizione");
      if (btnPos) {
        btnPos.onclick = function() {
          if (!navigator.geolocation) { alert("Posizione non supportata dal browser"); return; }
          btnPos.textContent = "⏳ Rilevamento...";
          navigator.geolocation.getCurrentPosition(
            function(pos) { caricaMappa(pos.coords.latitude, pos.coords.longitude, offerte); },
            function() { btnPos.textContent = "❌ Posizione non disponibile"; }
          );
        };
      }
    }

    // ── MAPPA NETWORK (Leaflet/OpenStreetMap) ─────────────────────
    var leafletMap = null;

    function caricaMappa(lat, lng, offerte) {
      var box = document.getElementById("mappa-network");
      if (!box) return;

      box.innerHTML = '<div id="leaflet-map" style="width:100%;height:260px;border-radius:14px;overflow:hidden;"></div>' +
        '<a href="https://www.openstreetmap.org/?mlat=' + lat + '&mlon=' + lng + '&zoom=13" target="_blank" ' +
        'style="display:flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:#fff;padding:10px;font-size:13px;font-weight:800;text-decoration:none;margin-top:8px;border-radius:10px;">🧭 Apri in OpenStreetMap</a>';

      // Init Leaflet
      if (leafletMap) { leafletMap.remove(); leafletMap = null; }
      leafletMap = L.map("leaflet-map").setView([lat, lng], 13);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 18
      }).addTo(leafletMap);

      // Marker posizione cliente
      var iconaCliente = L.divIcon({
        html: '<div style="background:var(--brand);border:3px solid #fff;border-radius:50%;width:18px;height:18px;box-shadow:0 2px 8px rgba(0,0,0,0.3);"></div>',
        iconSize: [18, 18], iconAnchor: [9, 9], className: ""
      });
      L.marker([lat, lng], { icon: iconaCliente })
        .addTo(leafletMap)
        .bindPopup("<strong>📍 Sei qui</strong>")
        .openPopup();

      // Marker locali network con geocoding approssimativo per città
      var localiConCoord = offerte.filter(function(o) {
        return o.aziende && (o.aziende.lat || o.aziende.indirizzo);
      });

      // Geocoding per città (approssimativo via Nominatim)
      var localiDaGeocod = offerte.filter(function(o) {
        return o.aziende && o.aziende.citta && !o.aziende.lat;
      }).slice(0, 5);

      localiDaGeocod.forEach(function(o) {
        var az = o.aziende;
        var query = encodeURIComponent((az.indirizzo||"") + " " + (az.citta||"") + " Italy");
        fetch("https://nominatim.openstreetmap.org/search?format=json&q=" + query + "&limit=1", {
          headers: { "User-Agent": "RistoflowApp/1.0" }
        }).then(function(r) { return r.json(); }).then(function(data) {
          if (!data || !data[0]) return;
          var locLat = parseFloat(data[0].lat);
          var locLng = parseFloat(data[0].lon);

          var val = o.tipo === "sconto_perc" ? "-" + o.valore + "%" :
                    o.tipo === "sconto_fisso" ? "-€" + Number(o.valore).toFixed(2) : "🎁";

          var iconaLocale = L.divIcon({
            html: '<div style="background:#f59e0b;color:#fff;border:2px solid #fff;border-radius:10px;padding:2px 6px;font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.25);">' + val + '</div>',
            iconSize: [50, 24], iconAnchor: [25, 12], className: ""
          });

          L.marker([locLat, locLng], { icon: iconaLocale })
            .addTo(leafletMap)
            .bindPopup(
              '<div style="min-width:140px;">' +
              '<strong>' + esc(az.nome||"") + '</strong><br>' +
              '<span style="font-size:12px;color:#64748b;">' + esc(az.indirizzo||"") + '</span><br>' +
              '<span style="background:var(--brand);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;">' + val + '</span>' +
              '</div>'
            );
        }).catch(function(){});
      });
    }

    // ── HELPERS ───────────────────────────────────────────────────
    function getLivello(punti, cfg) {
      if (punti >= (cfg.soglia_oro||1500)) return { nome:"Oro", emoji:"🥇" };
      if (punti >= (cfg.soglia_argento||500)) return { nome:"Argento", emoji:"🥈" };
      return { nome:"Bronzo", emoji:"🥉" };
    }

    function getProssimaSoglia(punti, cfg) {
      if (punti < (cfg.soglia_argento||500)) return cfg.soglia_argento||500;
      if (punti < (cfg.soglia_oro||1500)) return cfg.soglia_oro||1500;
      return null;
    }

    function formatData(ts) {
      if (!ts) return "";
      var d = new Date(ts);
      return d.toLocaleDateString("it-IT", { day:"2-digit", month:"short", year:"numeric" });
    }

    function formatDataBreve(s) {
      if (!s) return "";
      var p = s.split("-");
      return p[2] + "/" + p[1] + "/" + p[0];
    }

    function showError(title, sub) {
      root.innerHTML = '<div class="error-page"><div class="error-icon">😕</div><div class="error-title">' + esc(title) + '</div><div class="error-sub">' + esc(sub) + '</div></div>';
    }

    function esc(v) {
      return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
  })();
  </script>
</body>
</html>
