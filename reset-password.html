<!DOCTYPE html>
<html lang="it">

<head>

  <meta charset="UTF-8" />

  <meta

  />

  <title>Ristoflow • Crea Password</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#f3f4f6;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .card{
      width:100%;
      max-width:420px;
      background:#fff;
      border-radius:20px;
      padding:28px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }

    h1{
      font-size:28px;
      margin-bottom:12px;
      color:#111827;
    }

    p{
      color:#6b7280;
      line-height:1.6;
      margin-bottom:24px;
    }

    input{
      width:100%;
      height:52px;
      border:1px solid #d1d5db;
      border-radius:12px;
      padding:0 16px;
      font-size:16px;
      margin-bottom:16px;
    }

    button{
      width:100%;
      height:52px;
      border:none;
      border-radius:12px;
      background:#0E5A7A;
      color:#fff;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
    }

    button:disabled{
      opacity:.7;
    }

    .msg{
      margin-top:18px;
      text-align:center;
      font-size:14px;
    }

    .success{
      color:#059669;
    }

    .error{
      color:#dc2626;
    }

  </style>

</head>

<body>

  <div class="card">

    <h1>Benvenuto in Ristoflow 👋</h1>

    <p>
      Crea la tua password per accedere al gestionale
      e completare il tuo profilo personale.
    </p>

    <input
      type="password"
      id="password"
      placeholder="Nuova password"
    />

    <input
      type="password"
      id="confirmPassword"
      placeholder="Conferma password"
    />

    <button id="saveBtn">
      Salva Password
    </button>

    <div id="msg" class="msg"></div>

  </div>

  <script>

    const SUPABASE_URL =
      "https://cuhcscpvhypoaplcmtjk.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1aGNzY3B2aHlwb2FwbGNtdGprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4MjY4MjgsImV4cCI6MjA3OTQwMjgyOH0.q9zAs0oh8F1-whtORHBIORF5jIn1NTS3LvSMWleP0a0";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

    const passwordInput =
      document.getElementById("password");

    const confirmInput =
      document.getElementById("confirmPassword");

    const saveBtn =
      document.getElementById("saveBtn");

    const msg =
      document.getElementById("msg");

    /* =========================================
       CREA SESSIONE DAL LINK EMAIL
    ========================================= */

    async function setupRecoverySession() {

      try {

        const hash =
          window.location.hash;

        const params =
          new URLSearchParams(
            hash.substring(1)
          );

        const access_token =
          params.get("access_token");

        const refresh_token =
          params.get("refresh_token");

        if (
          !access_token ||
          !refresh_token
        ) {

          throw new Error(
            "Link non valido o scaduto"
          );

        }

        const {
          error
        } = await supabaseClient.auth.setSession({
          access_token,
          refresh_token
        });

        if (error) {
          throw error;
        }

        console.log(
          "SESSIONE RECOVERY CREATA"
        );

      } catch(err){

        console.error(err);

        msg.className =
          "msg error";

        msg.innerText =
          err.message || "Errore sessione";
      }
    }

    /* =========================================
       SALVA PASSWORD
    ========================================= */

    saveBtn.addEventListener(
      "click",
      async () => {

        try {

          const password =
            passwordInput.value.trim();

          const confirm =
            confirmInput.value.trim();

          if (!password) {

            throw new Error(
              "Inserisci password"
            );

          }

          if (password.length < 6) {

            throw new Error(
              "La password deve avere almeno 6 caratteri"
            );

          }

          if (password !== confirm) {

            throw new Error(
              "Le password non coincidono"
            );

          }

          saveBtn.disabled = true;

          saveBtn.innerText =
            "Salvataggio...";

          const {
            error
          } = await supabaseClient.auth.updateUser({
            password
          });

          if (error) {
            throw error;
          }

          const {
            data: userData,
            error: userError
          } = await supabaseClient.auth.getUser();

          if (userError) {
            throw userError;
          }

          const userId =
            userData?.user?.id;

          if (!userId) {

            throw new Error(
              "Utente non trovato"
            );

          }

          await supabaseClient
            .from("dipendenti")
            .update({
              profilo_completato: false
            })
            .eq("user_id", userId);

          msg.className =
            "msg success";

          msg.innerHTML =
            "Password creata correttamente.<br>Reindirizzamento...";

          /* =========================================
   POPUP INSTALLAZIONE APP
========================================= */

const isIOS =
  /iphone|ipad|ipod/i.test(
    navigator.userAgent
  );

const standalone =
  window.matchMedia(
    "(display-mode: standalone)"
  ).matches;

if (!standalone) {

  document.body.innerHTML = `
  
    <div style="
      min-height:100vh;
      background:#f3f4f6;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      font-family:Arial,sans-serif;
    ">

      <div style="
        width:100%;
        max-width:420px;
        background:white;
        border-radius:24px;
        padding:32px;
        text-align:center;
        box-shadow:0 10px 30px rgba(0,0,0,.08);
      ">

        <div style="
          font-size:54px;
          margin-bottom:16px;
        ">
          📲
        </div>

        <h1 style="
          font-size:28px;
          margin-bottom:16px;
          color:#111827;
        ">
          Installa Ristoflow
        </h1>

        <p style="
          color:#6b7280;
          line-height:1.7;
          margin-bottom:28px;
        ">
          Per un accesso più veloce aggiungi
          Ristoflow alla schermata Home.
        </p>

        ${
          isIOS
          ? `
            <div style="
              text-align:left;
              background:#f9fafb;
              border-radius:16px;
              padding:18px;
              margin-bottom:24px;
              line-height:1.8;
              color:#374151;
            ">
              1. Premi il pulsante <b>Condividi</b><br>
              2. Seleziona <b>Aggiungi a Home</b><br>
              3. Conferma su <b>Aggiungi</b>
            </div>
          `
          : `
            <div style="
              text-align:left;
              background:#f9fafb;
              border-radius:16px;
              padding:18px;
              margin-bottom:24px;
              line-height:1.8;
              color:#374151;
            ">
              1. Premi il menu del browser ⋮<br>
              2. Seleziona <b>Installa App</b><br>
              3. Conferma installazione
            </div>
          `
        }

        <button
          id="continuaBtn"
          style="
            width:100%;
            height:54px;
            border:none;
            border-radius:14px;
            background:#0E5A7A;
            color:white;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
          "
        >
          Continua
        </button>

      </div>

    </div>
  `;

  document
    .getElementById("continuaBtn")
    .onclick = () => {

      window.location.href =
        "https://ristoflow-ai.com/#/completa-profilo";

    };

} else {

  window.location.href =
    "https://ristoflow-ai.com/#/completa-profilo";

}
        } catch(err){

          console.error(err);

          msg.className =
            "msg error";

          msg.innerText =
            err.message || "Errore";

        } finally {

          saveBtn.disabled = false;

          saveBtn.innerText =
            "Salva Password";
        }

      }
    );

    /* =========================================
       AVVIO
    ========================================= */

    setupRecoverySession();

  </script>

</body>
</html>
