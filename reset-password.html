<!DOCTYPE html>
<html lang="it">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Ristoflow • Crea Password</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#f3f4f6;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .card{
      width:100%;
      max-width:420px;
      background:#fff;
      border-radius:20px;
      padding:28px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }

    h1{
      font-size:28px;
      margin-bottom:12px;
      color:#111827;
    }

    p{
      color:#6b7280;
      line-height:1.6;
      margin-bottom:24px;
    }

    input{
      width:100%;
      height:52px;
      border:1px solid #d1d5db;
      border-radius:12px;
      padding:0 16px;
      font-size:16px;
      margin-bottom:16px;
    }

    button{
      width:100%;
      height:52px;
      border:none;
      border-radius:12px;
      background:#0E5A7A;
      color:#fff;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
    }

    button:disabled{
      opacity:.7;
    }

    .msg{
      margin-top:18px;
      text-align:center;
      font-size:14px;
    }

    .success{
      color:#059669;
    }

    .error{
      color:#dc2626;
    }

  </style>

</head>

<body>

  <div class="card">

    <h1>Benvenuto in Ristoflow 👋</h1>

    <p>
      Crea la tua password per accedere al gestionale
      e completare il tuo profilo personale.
    </p>

    <input
      type="password"
      id="password"
      placeholder="Nuova password"
    />

    <input
      type="password"
      id="confirmPassword"
      placeholder="Conferma password"
    />

    <button id="saveBtn">
      Salva Password
    </button>

    <div id="msg" class="msg"></div>

  </div>

  <script>

    const SUPABASE_URL =
      "https://cuhcscpvhypoaplcmtjk.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1aGNzY3B2aHlwb2FwbGNtdGprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4MjY4MjgsImV4cCI6MjA3OTQwMjgyOH0.q9zAs0oh8F1-whtORHBIORF5jIn1NTS3LvSMWleP0a0";

    const supabase =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

    const passwordInput =
      document.getElementById("password");

    const confirmInput =
      document.getElementById("confirmPassword");

    const saveBtn =
      document.getElementById("saveBtn");

    const msg =
      document.getElementById("msg");

    saveBtn.addEventListener("click", async () => {

      try {

        const password =
          passwordInput.value.trim();

        const confirm =
          confirmInput.value.trim();

        if(password.length < 6){

          throw new Error(
            "La password deve avere almeno 6 caratteri"
          );

        }

        if(password !== confirm){

          throw new Error(
            "Le password non coincidono"
          );

        }

        saveBtn.disabled = true;
        saveBtn.innerText = "Salvataggio...";

        const {
          error
        } = await supabase.auth.updateUser({
          password
        });

        if(error) throw error;

        msg.className = "msg success";

        msg.innerHTML =
          "Password creata correttamente.<br>Reindirizzamento...";

        setTimeout(() => {

          window.location.href =
            "/#/login";

        }, 1800);

      } catch(err){

        console.error(err);

        msg.className = "msg error";

        msg.innerText =
          err.message || "Errore";

      } finally {

        saveBtn.disabled = false;
        saveBtn.innerText = "Salva Password";

      }

    });

  </script>

</body>
</html>
