<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎂 Prenota il tuo compleanno</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(160deg,#fdf2f8 0%,#fef3c7 100%); min-height: 100vh; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 18px 16px 40px; }
    .hero { text-align: center; padding: 26px 14px 18px; }
    .hero .cake { font-size: 58px; }
    .hero h1 { font-size: 24px; color: #831843; margin-top: 8px; }
    .hero .sub { font-size: 14.5px; color: #9d174d; margin-top: 8px; line-height: 1.5; }
    .regalo { background: white; border: 2px dashed #f472b6; border-radius: 18px; padding: 16px; text-align: center; margin: 14px 0 20px; box-shadow: 0 10px 26px rgba(190,24,93,.08); }
    .regalo b { color: #be185d; font-size: 16px; }
    .regalo .small { font-size: 12.5px; color: #9d174d; margin-top: 5px; }
    .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 12px 30px rgba(15,23,42,.08); }
    label { display: block; font-size: 12.5px; font-weight: 800; color: #374151; margin: 12px 0 5px; }
    input, textarea, select { width: 100%; border: 1.5px solid #e5e7eb; border-radius: 12px; padding: 12px; font-size: 15px; font-family: inherit; background: #fafafa; }
    input:focus, textarea:focus { outline: none; border-color: #ec4899; background: white; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .coperti { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 4px; }
    .coperti button { width: 44px; height: 44px; border-radius: 50%; border: none; background: #fce7f3; color: #be185d; font-size: 22px; font-weight: 900; cursor: pointer; }
    .coperti .val { font-size: 24px; font-weight: 900; color: #111827; min-width: 40px; text-align: center; }
    .privacy { display: flex; gap: 9px; align-items: flex-start; margin-top: 14px; font-size: 12px; color: #64748b; }
    .privacy input { width: auto; margin-top: 2px; }
    .btn { width: 100%; margin-top: 18px; background: linear-gradient(135deg,#ec4899,#be185d); color: white; border: none; border-radius: 14px; padding: 15px; font-size: 16.5px; font-weight: 900; cursor: pointer; box-shadow: 0 10px 24px rgba(190,24,93,.3); }
    .btn:disabled { opacity: .6; }
    .msg { margin-top: 14px; border-radius: 12px; padding: 12px; font-size: 14px; text-align: center; display: none; }
    .msg.ok { background: #d1fae5; color: #065f46; display: block; }
    .msg.err { background: #fee2e2; color: #991b1b; display: block; }
    .footer { text-align: center; font-size: 11.5px; color: #b45309; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="cake">🎂</div>
      <h1 id="titolo">Festeggia il tuo compleanno da noi!</h1>
      <div class="sub" id="sottotitolo">Un giorno speciale merita una tavola speciale.</div>
    </div>

    <div class="regalo">
      <b>🎁 La torta è il nostro regalo</b>
      <div class="small">Prenota il tuo compleanno: alla torta pensiamo noi.</div>
    </div>

    <div class="card">
      <div class="row">
        <div>
          <label>Nome *</label>
          <input id="nome" placeholder="Mario">
        </div>
        <div>
          <label>Cognome</label>
          <input id="cognome" placeholder="Rossi">
        </div>
      </div>
      <label>Telefono *</label>
      <input id="telefono" type="tel" placeholder="333 1234567">
      <label>Email</label>
      <input id="email" type="email" placeholder="mario@email.it">
      <div class="row">
        <div>
          <label>Data della festa *</label>
          <input id="data" type="date">
        </div>
        <div>
          <label>Orario *</label>
          <input id="ora" type="time" value="20:30">
        </div>
      </div>
      <label>Quanti sarete?</label>
      <div class="coperti">
        <button type="button" id="meno">−</button>
        <div class="val" id="coperti-val">6</div>
        <button type="button" id="piu">+</button>
      </div>
      <label>Note (allergie, richieste speciali...)</label>
      <textarea id="note" rows="2" placeholder="Es. una candelina numero 30 🎈"></textarea>
      <div class="privacy">
        <input type="checkbox" id="privacy">
        <span>Acconsento al trattamento dei dati per gestire la prenotazione (GDPR). *</span>
      </div>
      <button class="btn" id="invia">🎂 Prenota il mio compleanno</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="footer" id="footer-locale"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://cuhcscpvhypoaplcmtjk.supabase.co";
    const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1aGNzY3B2aHlwb2FwbGNtdGprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4MjY4MjgsImV4cCI6MjA3OTQwMjgyOH0.q9zAs0oh8F1-whtORHBIORF5jIn1NTS3LvSMWleP0a0";
    const db = window.supabase.createClient(SUPABASE_URL, ANON_KEY);

    const params = new URLSearchParams(location.search);
    const aziendaId = params.get("a") || params.get("azienda");
    const sedeId = params.get("s") || params.get("sede") || null;

    // Data di default: tra 10 giorni (il messaggio arriva ~10gg prima del compleanno)
    (function () {
      const d = new Date(Date.now() + 10 * 86400000);
      document.getElementById("data").value = d.toISOString().slice(0, 10);
      document.getElementById("data").min = new Date().toISOString().slice(0, 10);
    })();

    // Nome del locale nel titolo
    (async function () {
      try {
        if (sedeId) {
          const { data: s } = await db.from("sedi").select("nome,citta").eq("id", sedeId).maybeSingle();
          if (s?.nome) {
            document.getElementById("titolo").textContent = "Festeggia il tuo compleanno da " + s.nome + "!";
            document.getElementById("footer-locale").textContent = [s.nome, s.citta].filter(Boolean).join(" · ");
          }
        }
      } catch (e) { /* estetico */ }
    })();

    // Stepper coperti
    let coperti = 6;
    document.getElementById("meno").onclick = function () { if (coperti > 1) { coperti--; render(); } };
    document.getElementById("piu").onclick = function () { if (coperti < 120) { coperti++; render(); } };
    function render() { document.getElementById("coperti-val").textContent = coperti; }

    function showMsg(t, err) {
      const m = document.getElementById("msg");
      m.textContent = t; m.className = "msg " + (err ? "err" : "ok");
    }

    document.getElementById("invia").onclick = async function () {
      const btn = this;
      const nome = document.getElementById("nome").value.trim();
      const cognome = document.getElementById("cognome").value.trim();
      const telefono = document.getElementById("telefono").value.trim();
      const email = document.getElementById("email").value.trim();
      const data = document.getElementById("data").value;
      const ora = document.getElementById("ora").value;
      const note = document.getElementById("note").value.trim();
      const privacy = document.getElementById("privacy").checked;

      if (!aziendaId) { showMsg("Link non valido: contatta il ristorante.", true); return; }
      if (!nome || !telefono || !data || !ora) { showMsg("Compila nome, telefono, data e orario.", true); return; }
      if (!privacy) { showMsg("Serve il consenso privacy per prenotare.", true); return; }

      btn.disabled = true; btn.textContent = "Invio in corso...";
      try {
        const { data: pren, error } = await db.from("prenotazioni_tavoli").insert([{
          azienda_id: aziendaId, sede_id: sedeId,
          cliente_nome: (nome + " " + cognome).trim(),
          cliente_telefono: telefono, cliente_email: email || null,
          data: data, ora: ora, coperti: coperti,
          stato: "in_attesa", canale: "online", source: "compleanno",
          occasione: "compleanno", tag: "compleanno",
          note: ("🎂 COMPLEANNO — torta in regalo. " + note).trim()
        }]).select("id, token_pubblico").single();
        if (error) throw error;
        showMsg("🎉 Prenotazione inviata! Ti confermeremo a breve.", false);
        if (pren && pren.token_pubblico) {
          setTimeout(function () { location.href = "/prenotazione.html?token=" + encodeURIComponent(pren.token_pubblico); }, 1200);
        }
      } catch (e) {
        showMsg("Errore: " + (e.message || e), true);
        btn.disabled = false; btn.textContent = "🎂 Prenota il mio compleanno";
      }
    };
  </script>
</body>
</html>
