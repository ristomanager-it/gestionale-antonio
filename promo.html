<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promo</title>
<style>
  :root{
    --font-titoli:'Playfair Display','Cormorant Garamond',Georgia,serif;
    --primario:#0E5A7A;
    --primario-2:#1a8aad;
    --sfondo:#ffffff;
    --testo:#374151;
    --bottone:#0E5A7A;
    --bottone-testo:#ffffff;
    --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;min-height:100vh;}
  .wrap{max-width:480px;margin:0 auto;background:var(--sfondo);min-height:100vh;position:relative;overflow:hidden;}
  .promo-img{width:100%;height:240px;object-fit:cover;display:block;}
  .promo-img-placeholder{width:100%;height:240px;background:linear-gradient(135deg,var(--primario),var(--primario-2));display:flex;align-items:center;justify-content:center;font-size:64px;}
  .box-offerta{margin:16px;background:linear-gradient(135deg,var(--primario),var(--primario-2));border-radius:18px;padding:24px;color:white;text-align:center;}
  .box-offerta .valore{font-size:48px;font-weight:900;line-height:1;}
  .box-offerta .label{font-size:14px;opacity:.85;margin-top:6px;}
  .box-offerta .codice{margin-top:14px;background:rgba(255,255,255,.2);border:1px dashed rgba(255,255,255,.5);border-radius:10px;padding:8px 16px;font-size:15px;font-weight:800;letter-spacing:2px;}
  .box-offerta .scadenza{font-size:11px;opacity:.7;margin-top:8px;}
  .testo-block{padding:16px 20px;color:var(--testo);font-size:14px;line-height:1.7;}
  /* ── Blocchi ricchi (livello sito) ── */
  .hero-block{position:relative;width:100%;min-height:340px;display:flex;align-items:flex-end;overflow:hidden;}
  .hero-block img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,.65) 100%);}
  .hero-content{position:relative;width:100%;padding:28px 22px;text-align:center;color:#fff;}
  .hero-kicker{font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:.9;margin-bottom:10px;}
  .hero-title{font-size:34px;line-height:1.15;font-weight:700;text-shadow:0 2px 14px rgba(0,0,0,.45);margin-bottom:14px;}
  .hero-sub{font-size:14px;opacity:.95;margin-bottom:18px;}
  .hero-btn{display:inline-block;background:var(--bottone);color:var(--bottone-testo);border:none;border-radius:var(--radius);padding:13px 26px;font-size:15px;font-weight:800;cursor:pointer;letter-spacing:.3px;box-shadow:0 6px 22px rgba(0,0,0,.35);}
  .sezione-block{padding:26px 22px 6px;}
  .sezione-title{font-size:24px;line-height:1.2;font-weight:700;color:var(--testo);margin-bottom:10px;}
  .sezione-testo{color:var(--testo);font-size:14px;line-height:1.75;opacity:.92;}
  .galleria-block{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:16px;}
  .galleria-block img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:calc(var(--radius) - 2px);}
  .galleria-block img:first-child{grid-column:1 / -1;aspect-ratio:16/9;}
  .punti-block{display:flex;gap:10px;padding:14px 16px;justify-content:space-between;}
  .punto{flex:1;text-align:center;background:rgba(0,0,0,.035);border-radius:var(--radius);padding:14px 8px;}
  .punto .p-icona{font-size:26px;margin-bottom:6px;}
  .punto .p-testo{font-size:11.5px;font-weight:700;color:var(--testo);line-height:1.35;}
  .urgenza-block{margin:14px 16px;background:var(--testo);color:#fff;border-radius:var(--radius);padding:14px 18px;display:flex;align-items:center;gap:12px;font-size:13.5px;font-weight:700;}
  .urgenza-block .u-icona{font-size:22px;}
  .regolamento-block{margin:14px 16px 20px;border:1px solid rgba(0,0,0,.12);border-radius:var(--radius);overflow:hidden;}
  .regolamento-block summary{padding:13px 16px;font-size:13px;font-weight:700;color:var(--testo);cursor:pointer;background:rgba(0,0,0,.03);list-style:none;display:flex;justify-content:space-between;align-items:center;}
  .regolamento-block summary::after{content:'▾';opacity:.6;}
  .regolamento-block[open] summary::after{content:'▴';}
  .regolamento-block .reg-testo{padding:12px 16px;font-size:12.5px;line-height:1.65;color:var(--testo);opacity:.85;}
  /* ── Tipografia e layout livello sito ── */
  .hero-title,.sezione-title,.box-offerta .valore,.box-offerta .label{font-family:var(--font-titoli);}
  .hero-kicker{font-family:var(--font-titoli);font-style:italic;}
  @media(min-width:768px){
    .wrap{max-width:760px;box-shadow:0 0 60px rgba(0,0,0,.08);}
    .hero-block{min-height:480px;}
    .hero-title{font-size:52px;}
    .hero-sub{font-size:17px;}
    .sezione-title{font-size:32px;}
    .sezione-testo{font-size:16px;}
    .galleria-block{grid-template-columns:repeat(3,1fr);}
    .galleria-block img:first-child{grid-column:1 / -1;}
    .testo-block{font-size:16px;}
  }
  .form-block{margin:16px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:16px;padding:20px;}
  .form-block h3{font-size:15px;font-weight:700;color:#0f172a;margin-bottom:16px;}
  .form-input{width:100%;padding:12px 14px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:14px;outline:none;background:white;margin-bottom:10px;transition:border-color .2s;}
  .form-input:focus{border-color:var(--primario);}
  .form-check{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:#64748b;margin-bottom:10px;cursor:pointer;}
  .form-check input{margin-top:2px;accent-color:var(--primario);}
  .btn-cta{width:100%;background:linear-gradient(135deg,var(--bottone),var(--primario-2));color:var(--bottone-testo);border:none;border-radius:var(--radius);padding:15px;font-size:16px;font-weight:800;cursor:pointer;letter-spacing:.3px;box-shadow:0 4px 20px rgba(0,0,0,.15);}
  .btn-cta:disabled{opacity:.6;cursor:not-allowed;}
  .btn-cta-secondary{width:100%;background:#f1f5f9;color:var(--primario);border:2px solid var(--primario);border-radius:var(--radius);padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;}
  .valutazioni{padding:14px 20px;text-align:center;}
  .stelle{color:#f59e0b;font-size:22px;letter-spacing:2px;}
  .stelle-label{font-size:12px;color:#64748b;margin-top:4px;}
  .accordion{margin:16px;}
  .accordion-head{background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:#374151;}
  .accordion-body{display:none;padding:12px 16px;font-size:12px;color:#64748b;line-height:1.8;border:1px solid #e5e7eb;border-top:none;border-radius:0 0 10px 10px;}
  .giorni-badge{display:inline-block;background:#f0f9ff;border:1px solid #bae6fd;color:var(--primario);border-radius:8px;padding:3px 10px;font-size:11px;font-weight:600;margin:2px;}
  /* Thank you overlay */
  .thankyou{display:none;position:fixed;inset:0;background:white;z-index:999;overflow-y:auto;}
  .thankyou.show{display:block;}
  /* Loader */
  .loader{text-align:center;padding:60px 20px;color:#64748b;}
  .loader-spin{width:36px;height:36px;border:3px solid #e5e7eb;border-top-color:var(--primario);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  /* Errore */
  .error-box{padding:60px 24px;text-align:center;color:#64748b;}
  /* Footer */
  .footer{padding:20px;text-align:center;font-size:11px;color:#94a3b8;border-top:1px solid #f1f5f9;}
  .footer a{color:var(--primario);text-decoration:none;}
</style>
</head>
<body>

<div class="thankyou" id="thankyou-overlay">

</div>

<script>
const SUPABASE_URL = 'https://cuhcscpvhypoaplcmtjk.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1aGNzY3B2aHlwb2FwbGNtdGprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4MjY4MjgsImV4cCI6MjA3OTQwMjgyOH0.q9zAs0oh8F1-whtORHBIORF5jIn1NTS3LvSMWleP0a0';

// ── Ristoflow Analytics ────────────────────────────────────

    }).catch(function(){});

async function api(path, opts={}) {
  const r = await fetch(SUPABASE_URL+'/rest/v1/'+path, {
    headers:{ 'apikey': SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json', ...opts.headers },
    ...opts
  });
  // Tollerante a body vuoto (Prefer: return=minimal → 201 senza body)
  const testo = await r.text();
  let json = null;
  try { json = testo ? JSON.parse(testo) : null; } catch(e) { json = null; }
  return { ok: r.ok, status: r.status, data: json };
}

// ── Coupon univoco ─────────────────────────────────────────────
// Alfabeto senza caratteri ambigui (no 0/O, 1/I/L)
const COUPON_ALFABETO = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function genCouponCode() {
  const arr = new Uint8Array(8);
  crypto.getRandomValues(arr);
  let c = '';
  for (let i = 0; i < 8; i++) c += COUPON_ALFABETO[arr[i] % COUPON_ALFABETO.length];
  return c.slice(0,4) + '-' + c.slice(4); // es. K7QF-3XWM
}
function calcScadenzaCoupon(promo) {
  if (promo.data_scadenza) {
    const d = new Date(promo.data_scadenza);
    d.setHours(23,59,59,999);
    return d.toISOString();
  }
  const d = new Date();
  d.setDate(d.getDate() + (parseInt(promo.validita_giorni)||30));
  return d.toISOString();
}

function esc(v){ return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const params = new URLSearchParams(location.search);
const promoId = params.get('id');
const isTY    = params.get('ty') === '1';
let couponCode = params.get('c') || null; // coupon univoco (generato al submit o passato via link WA)

// ── Pixel Meta ────────────────────────────────────────────────
function firePixel(event, pixelId) {
  if (!pixelId || typeof fbq==='undefined') return;
  fbq('trackSingle', pixelId, event);
}
function injectPixel(pixelId) {
  if (!pixelId) return;
  const s = document.createElement('script');
  s.text = `!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');fbq('init','${pixelId}');fbq('track','PageView');`;
  document.head.appendChild(s);
}

// ── Render blocchi ────────────────────────────────────────────
function renderValore(promo) {
  if (promo.tipo==='sconto_perc') return promo.valore+'%';
  if (promo.tipo==='sconto_euro') return '€'+promo.valore;
  if (promo.tipo==='2x1') return '2×1';
  return promo.tipo==='omaggio' ? '🎁' : (promo.valore||'');
}

function isVideoSrc(url){ return /\.(mp4|mov|webm|quicktime)(\?|$)/i.test(url||''); }
function mediaTag(src, nome){
  if (!src) return `<div class="promo-img-placeholder">🍽</div>`;
  if (isVideoSrc(src)) {
    return `<video class="promo-img" src="${esc(src)}" autoplay muted loop playsinline controls onerror="this.parentNode.replaceChild(Object.assign(document.createElement('div'),{className:'promo-img-placeholder',innerHTML:'🍽'}),this)"></video>`;
  }
  return `<img class="promo-img" src="${esc(src)}" alt="${esc(nome||'')}" onerror="this.parentNode.replaceChild(Object.assign(document.createElement('div'),{className:'promo-img-placeholder',innerHTML:'🍽'}),this)">`;
}

function renderBlock(b, promo, azienda) {
  if (b.tipo==='immagine') {
    return mediaTag(promo.immagine_url, promo.nome);
  }
  if (b.tipo==='testo') {
    const testo = b.contenuto || promo.descrizione || '';
    return testo ? `<div class="testo-block">${esc(testo).replace(/\n/g,'<br>')}</div>` : '';
  }
  if (b.tipo==='box_offerta') {
    return `<div class="box-offerta">
      <div class="valore">${esc(renderValore(promo))}</div>
      <div class="label">${esc(promo.nome)}</div>
      ${promo.codice ? `<div class="codice">${esc(promo.codice)}</div>` : ''}
    </div>`;
  }
  if (b.tipo==='valutazioni') {
    return `<div class="valutazioni">
      <div class="stelle">★★★★★</div>
      <div class="stelle-label">Valutazione media clienti</div>
    </div>`;
  }
  if (b.tipo==='form') {
    return `<div class="form-block" id="form-container">
      <h3>📋 Scarica la tua promo</h3>
      <label style="display:block;font-size:11px;color:#94a3b8;margin:0 0 3px 2px;font-weight:600;">Nome</label>
      <input class="form-input" id="f-nome" type="text" placeholder="Es. Mario" autocomplete="off" autocapitalize="words">
      <label style="display:block;font-size:11px;color:#94a3b8;margin:6px 0 3px 2px;font-weight:600;">Cognome</label>
      <input class="form-input" id="f-cognome" type="text" placeholder="Es. Rossi" autocomplete="off" autocapitalize="words">
      <input class="form-input" id="f-telefono" type="tel" placeholder="Telefono *" autocomplete="tel">
      <input class="form-input" id="f-email" type="email" placeholder="Email *" autocomplete="email">
      ${promo.privacy_richiesta ? `<label class="form-check"><input type="checkbox" id="f-privacy"> <span>Ho letto e accetto la <a href="#" style="color:#0E5A7A;">Privacy Policy</a> *</span></label>` : ''}
      ${promo.consenso_marketing ? `<label class="form-check"><input type="checkbox" id="f-consenso"> <span>Acconsento a ricevere comunicazioni commerciali e promozionali</span></label>` : ''}
      <div id="form-error" style="color:#dc2626;font-size:12px;margin-bottom:8px;display:none;"></div>
      <button class="btn-cta" id="btn-scarica">🎁 Voglio la mia promo!</button>
    </div>`;
  }
  if (b.tipo==='hero') {
    const img = b.contenuto || promo.immagine_url || '';
    const titolo = b.titolo || promo.nome || '';
    const kicker = b.kicker || '';
    const sub = b.sottotitolo || '';
    const btn = b.cta || 'Scopri l\'offerta';
    return `<div class="hero-block">
      ${img ? `<img src="${esc(img)}" alt="${esc(titolo)}">` : ''}
      <div class="hero-overlay"></div>
      <div class="hero-content">
        ${kicker ? `<div class="hero-kicker">${esc(kicker)}</div>` : ''}
        <div class="hero-title">${esc(titolo)}</div>
        ${sub ? `<div class="hero-sub">${esc(sub)}</div>` : ''}
        <button class="hero-btn" onclick="window.scrollTo({top:document.getElementById('form-container')?.offsetTop-20||0,behavior:'smooth'})">${esc(btn)}</button>
      </div>
    </div>`;
  }
  if (b.tipo==='sezione') {
    return `<div class="sezione-block">
      ${b.titolo ? `<div class="sezione-title">${esc(b.titolo)}</div>` : ''}
      ${b.contenuto ? `<div class="sezione-testo">${esc(b.contenuto).replace(/\n/g,'<br>')}</div>` : ''}
    </div>`;
  }
  if (b.tipo==='galleria') {
    const foto = Array.isArray(b.foto) ? b.foto.filter(Boolean) : [];
    if (!foto.length) return '';
    return `<div class="galleria-block">${foto.map(f => `<img src="${esc(f)}" alt="" loading="lazy" onerror="this.remove()">`).join('')}</div>`;
  }
  if (b.tipo==='punti_forza') {
    const punti = Array.isArray(b.punti) ? b.punti.slice(0,4) : [];
    if (!punti.length) return '';
    return `<div class="punti-block">${punti.map(p => `<div class="punto"><div class="p-icona">${esc(p.icona||'⭐')}</div><div class="p-testo">${esc(p.testo||'')}</div></div>`).join('')}</div>`;
  }
  if (b.tipo==='urgenza') {
    let testo = b.contenuto || '';
    if (!testo && promo.data_scadenza) {
      const d = new Date(promo.data_scadenza + 'T23:59:59');
      testo = 'Offerta valida fino al ' + d.toLocaleDateString('it-IT', {day:'numeric', month:'long'});
    }
    if (promo.nr_disponibili) {
      const rimaste = Math.max(0, promo.nr_disponibili - (promo.nr_utilizzate||0));
      if (rimaste > 0) testo += (testo ? ' · ' : '') + 'Solo ' + rimaste + ' disponibili';
    }
    if (!testo) return '';
    return `<div class="urgenza-block"><span class="u-icona">⏳</span><span>${esc(testo)}</span></div>`;
  }
  if (b.tipo==='prenota') {
    // Bottone prenotazione: porta al booking form della promo col coupon del cliente
    let href = b.contenuto || '';
    if (!href) return '';
    if (typeof couponCode === 'string' && couponCode) {
      href += (href.includes('?') ? '&' : '?') + 'coupon=' + encodeURIComponent(couponCode);
    }
    const label = b.label_btn || '🍽 Prenota ora il tuo tavolo';
    return `<div style="padding:8px 16px 16px;"><a href="${esc(href)}" style="display:block;text-align:center;text-decoration:none;background:linear-gradient(135deg,var(--bottone),var(--primario-2));color:var(--bottone-testo);border-radius:var(--radius);padding:16px;font-size:16px;font-weight:800;letter-spacing:.3px;box-shadow:0 4px 20px rgba(0,0,0,.15);">${esc(label)}</a></div>`;
  }
  if (b.tipo==='regolamento') {
    const reg = b.contenuto || promo.regolamento || '';
    if (!reg) return '';
    return `<details class="regolamento-block"><summary>📜 Regolamento della promozione</summary><div class="reg-testo">${esc(reg).replace(/\n/g,'<br>')}</div></details>`;
  }
  if (b.tipo==='cta_button') {
    const label = b.contenuto || 'Scopri di più';
    return `<div style="padding:0 16px 16px;"><button class="btn-cta" onclick="window.scrollTo({top:document.getElementById('form-container')?.offsetTop-20||0,behavior:'smooth'})">${esc(label)}</button></div>`;
  }
  return '';
}

function renderDefaultLayout(promo, azienda) {
  // Layout fisso elegante quando non ci sono blocchi configurati
  return `
    ${mediaTag(promo.immagine_url, promo.nome)}
    <div class="box-offerta">
      <div class="valore">${esc(renderValore(promo))}</div>
      <div class="label">${esc(promo.nome)}</div>
      ${promo.codice ? `<div class="codice">${esc(promo.codice)}</div>` : ''}
    </div>
    ${promo.descrizione ? `<div class="testo-block">${esc(promo.descrizione).replace(/\n/g,'<br>')}</div>` : ''}
    <div class="form-block" id="form-container">
      <h3>📋 Scarica la tua promo</h3>
      <label style="display:block;font-size:11px;color:#94a3b8;margin:0 0 3px 2px;font-weight:600;">Nome</label>
      <input class="form-input" id="f-nome" type="text" placeholder="Es. Mario" autocomplete="off" autocapitalize="words">
      <label style="display:block;font-size:11px;color:#94a3b8;margin:6px 0 3px 2px;font-weight:600;">Cognome</label>
      <input class="form-input" id="f-cognome" type="text" placeholder="Es. Rossi" autocomplete="off" autocapitalize="words">
      <input class="form-input" id="f-telefono" type="tel" placeholder="Telefono *" autocomplete="tel">
      <input class="form-input" id="f-email" type="email" placeholder="Email *" autocomplete="email">
      ${promo.privacy_richiesta ? `<label class="form-check"><input type="checkbox" id="f-privacy"> <span>Ho letto e accetto la <a href="#" style="color:#0E5A7A;">Privacy Policy</a> *</span></label>` : ''}

function buildRegolamentoCompleto(promo) {
  const giorni = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
  const righe = [];

  // Validità temporale
  if (promo.data_scadenza) {
    righe.push('⏰ Valida fino al ' + new Date(promo.data_scadenza).toLocaleDateString('it-IT') + '.');
  } else if (promo.validita_giorni) {
    righe.push('⏰ Valida per ' + promo.validita_giorni + ' giorni dall\'attivazione.');
  }

  // Giorni disponibili
  if (promo.giorni_disponibili?.length) {
    const nomi = promo.giorni_disponibili.map(g => giorni[g-1]).filter(Boolean).join(', ');
    if (nomi) righe.push('📅 Disponibile nei giorni: ' + nomi + '.');
  }

  // Turni
  if (promo.turni?.length) {
    const turni = promo.turni.map(t => t==='pranzo' ? 'pranzo' : 'cena').join(' e ');
    righe.push('🕐 Valida a ' + turni + '.');
  }

  // Minimo persone al tavolo
  if (promo.min_persone && promo.min_persone > 1) {
    righe.push('👥 Valida per un minimo di ' + promo.min_persone + ' persone al tavolo.');
  }

  let out = righe.length ? righe.map(r => esc(r)).join('<br>') : '';

  // Testo regolamento libero
  if (promo.regolamento) {
    if (out) out += '<br><br>';
    out += esc(promo.regolamento).replace(/\n/g,'<br>');
  }

  return out;
}

function generaQRThankyou(promoId) {
  const el = document.getElementById('qr-thankyou');
  if (!el) return;
  // Con coupon: QR = "RFC:CODICE" (scansionabile in cassa). Senza: link landing (retrocompatibile)
  const url = couponCode ? `RFC:${couponCode}` : (location.href.split('?')[0]+'?id='+promoId);
  const load = () => {
    el.innerHTML = '<div style="text-align:center;margin-top:8px;"><div style="font-size:12px;color:#64748b;margin-bottom:8px;">📱 Mostra questo QR al cameriere per riscattare</div><div id="qr-el" style="display:inline-block;background:white;padding:8px;border:1px solid #e5e7eb;border-radius:8px;"></div></div>';
    new QRCode(document.getElementById('qr-el'), { text: url, width:140, height:140 });
  };
  if (window.QRCode) { load(); return; }
  const s = document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  s.onload=load; document.head.appendChild(s);
}

function applicaStilePromo(stile) {
  if (!stile || typeof stile !== 'object') return; // nessuno stile → restano i default brand
  const root = document.documentElement;
  const set = (varName, val) => { if (val) root.style.setProperty(varName, val); };
  set('--primario',       stile.colore_primario);
  set('--primario-2',     stile.colore_primario);  // gradiente monocromo se non c'è un secondario
  set('--sfondo',         stile.colore_sfondo);
  set('--testo',          stile.colore_testo);
  set('--bottone',        stile.colore_bottone || stile.colore_primario);
  set('--bottone-testo',  stile.colore_testo_bottone);
  if (stile.border_radius != null) root.style.setProperty('--radius', stile.border_radius + 'px');
}

async function init() {
  if (!promoId) {
    document.getElementById('loader').innerHTML = '<div class="error-box"><div style="font-size:40px;margin-bottom:12px;">🔍</div><div style="font-size:16px;font-weight:600;">Promo non trovata</div><div style="font-size:13px;margin-top:6px;">Il link non è valido.</div></div>';
    return;
  }

  // Carica promo + azienda
  let promo, azienda, sede, nomeDaComunicare, logoDaComunicare;
  try {
    const pRes = await api(`promo?id=eq.${promoId}&select=*&limit=1`);
    promo = Array.isArray(pRes.data) ? pRes.data[0] : null;
    if (promo?.azienda_id) {
      // Identità (nome_azienda, logo, pixel) — filtro su azienda_id
      const aRes = await api(`azienda_identita?azienda_id=eq.${promo.azienda_id}&select=nome_azienda,logo_url,meta_pixel_id,gtm_id&limit=1`);
      azienda = Array.isArray(aRes.data) && aRes.data[0] ? aRes.data[0] : null;
      // Fallback: se manca il nome, lo prendo dalla tabella aziende
      if (!azienda || !azienda.nome_azienda) {
        try {
          const azRes = await api(`aziende?id=eq.${promo.azienda_id}&select=nome,email&limit=1`);
          const az = Array.isArray(azRes.data) ? azRes.data[0] : null;
          if (az) azienda = { ...(azienda||{}), nome_azienda: azienda?.nome_azienda || az.nome, email: az.email };
        } catch(e) { console.warn('Fallback aziende:', e); }
      }
      // Se la promo è di una SEDE specifica, carico la sede (nome/logo/telefono corretti)
      if (promo.sede_id) {
        try {
          const sRes = await api(`sedi?id=eq.${promo.sede_id}&select=nome,logo_url,telefono&limit=1`);
          sede = Array.isArray(sRes.data) ? sRes.data[0] : null;
        } catch(e) { console.warn('Caricamento sede:', e); }
      }
    }
  } catch(e) { console.error(e); }

  // Nome da comunicare al cliente: sede se presente, altrimenti azienda
  nomeDaComunicare = sede?.nome || azienda?.nome_azienda || 'Il tuo locale';
  logoDaComunicare = sede?.logo_url || azienda?.logo_url || null;

  if (!promo || !promo.attiva) {
    document.getElementById('loader').innerHTML = '<div class="error-box"><div style="font-size:40px;margin-bottom:12px;">⏰</div><div style="font-size:16px;font-weight:600;">Promo non disponibile</div><div style="font-size:13px;margin-top:6px;">Questa promo non è più attiva o è scaduta.</div></div>';
    return;
  }

  // Controlla scadenza data
  if (promo.data_scadenza && new Date(promo.data_scadenza) < new Date()) {
    document.getElementById('loader').innerHTML = '<div class="error-box"><div style="font-size:40px;margin-bottom:12px;">📅</div><div style="font-size:16px;font-weight:600;">Promo scaduta</div></div>';
    return;
  }

  // Applica colori: brand di default, oppure stile specifico della promo se presente
  applicaStilePromo(promo.stile);

  // Inject Pixel
  const pixelId = azienda?.meta_pixel_id || promo.meta_pixel_id;
  if (pixelId) injectPixel(pixelId);

  // Track view con azienda_id reale
  window._rfAzId = promo.azienda_id || null;
  window._rfTrack && window._rfTrack('view', 'promo_landing', { completato: false, valore: promo.nome });

  // GTM
  if (azienda?.gtm_id) {
    const s=document.createElement('script');
    s.text=`(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','${azienda.gtm_id}');`;
    document.head.appendChild(s);
  }

  // Titolo pagina
  document.title = promo.nome + (nomeDaComunicare ? ' — '+nomeDaComunicare : '');

  // Render landing
  const blocks = promo.landing_config?.blocks || [];
  const wrap = document.getElementById('wrap');

  let html = '';
  // Header locale (sede se presente, altrimenti azienda)
  if (nomeDaComunicare || logoDaComunicare) {
    html += `<div style="padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f1f5f9;">
      ${logoDaComunicare ? `<img src="${esc(logoDaComunicare)}" style="height:36px;width:auto;border-radius:6px;" onerror="this.style.display='none'">` : ''}
      ${nomeDaComunicare ? `<div style="font-size:14px;font-weight:700;color:#0f172a;">${esc(nomeDaComunicare)}</div>` : ''}
    </div>`;
  }

  // Blocchi o default
  if (blocks.length) {
    html += blocks.map(b => renderBlock(b, promo, azienda)).join('');
  } else {
    html += renderDefaultLayout(promo, azienda);
  }

  // Regolamento (include validità, giorni e turni — NON mostrati nella landing principale)
  const regolamentoCompleto = buildRegolamentoCompleto(promo);
  if (regolamentoCompleto) {
    html += `<div class="accordion">
      <div class="accordion-head" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='block'?'none':'block'">
        📜 Regolamento e condizioni <span>▸</span>
      </div>
      <div class="accordion-body">${regolamentoCompleto}</div>
    </div>`;
  }

  html += `<div class="footer">Powered by <a href="https://ristoflow-ai.com">Ristoflow.AI</a></div>`;

  wrap.innerHTML = html;

  // Se URL è ?ty=1 O il cliente ha già scaricato da questo dispositivo → thank-you diretta col suo coupon
  let giaScaricato = null;
  try { giaScaricato = JSON.parse(localStorage.getItem('rf_promo_dl_' + promoId) || 'null'); } catch(e) {}
  if (isTY || giaScaricato) {
    if (giaScaricato?.coupon && !couponCode) couponCode = giaScaricato.coupon;
    mostrarThankyou(promo);
    return;
  }

  // ── Form submit ───────────────────────────────────────────
  const btnScarica = document.getElementById('btn-scarica');
  if (!btnScarica) return;

  btnScarica.addEventListener('click', async () => {
    const capitalizza = (s) => (s||'').trim().replace(/\b\p{L}/gu, ch => ch.toUpperCase());
    const nome     = capitalizza(document.getElementById('f-nome')?.value);
    const cognome  = capitalizza(document.getElementById('f-cognome')?.value);
    const nomeSaluto = nome || cognome || 'ciao';  // fallback se nome vuoto
    const telefono = document.getElementById('f-telefono')?.value.trim();
    const email    = document.getElementById('f-email')?.value.trim()||null;
    const privacy  = document.getElementById('f-privacy')?.checked ?? true;
    const consenso = document.getElementById('f-consenso')?.checked ?? false;
    const errEl    = document.getElementById('form-error');

    window._rfTrack && window._rfTrack('click', 'btn_scarica_promo', { step: 'submit_tentativo', valore: promo.nome });

    errEl.style.display='none';
    if (!nome) { errEl.textContent='Inserisci il tuo nome'; errEl.style.display=''; window._rfTrack && window._rfTrack('error', 'validazione_fallita', { valore: 'nome mancante' }); return; }
    if (!cognome) { errEl.textContent='Inserisci il tuo cognome'; errEl.style.display=''; window._rfTrack && window._rfTrack('error', 'validazione_fallita', { valore: 'cognome mancante' }); return; }
    if (!telefono) { errEl.textContent='Inserisci il telefono'; errEl.style.display=''; window._rfTrack && window._rfTrack('error', 'validazione_fallita', { valore: 'telefono mancante' }); return; }
    if (!email) { errEl.textContent='Inserisci la tua email'; errEl.style.display=''; window._rfTrack && window._rfTrack('error', 'validazione_fallita', { valore: 'email mancante' }); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errEl.textContent='Inserisci un\'email valida'; errEl.style.display=''; window._rfTrack && window._rfTrack('error', 'validazione_fallita', { valore: 'email non valida' }); return; }
    if (promo.privacy_richiesta && !privacy) { errEl.textContent='Devi accettare la Privacy Policy'; errEl.style.display=''; window._rfTrack && window._rfTrack('error', 'validazione_fallita', { valore: 'privacy non accettata' }); return; }

    btnScarica.disabled = true;
    btnScarica.textContent = '⏳ Invio in corso...';

    try {
      // 0. Controllo anti-doppione: stesso telefono o email per QUESTA promo?
      try {
        const emailEsc = encodeURIComponent(email);
        const telEsc = encodeURIComponent(telefono);
        const dupRes = await api(`promo_lead?promo_id=eq.${promoId}&or=(telefono.eq.${telEsc},email.eq.${emailEsc})&select=id&limit=1`);
        if (Array.isArray(dupRes.data) && dupRes.data.length > 0) {
          btnScarica.disabled = false;
          btnScarica.textContent = '🎁 Voglio la mia promo!';
          errEl.innerHTML = 'Hai già richiesto questa promozione con questo contatto. 🎁<br>Controlla WhatsApp o la tua email per il coupon.';
          errEl.style.display = '';
          window._rfTrack && window._rfTrack('error', 'gia_scaricata', { valore: promo.nome });
          return;
        }
      } catch(e) { console.warn('Controllo doppione non riuscito, proseguo:', e); }

      // 1. Salva lead con coupon univoco (retry ×3 su collisione codice)
      const scadenzaCoupon = calcScadenzaCoupon(promo);
      let salvato = false;
      for (let tentativo = 0; tentativo < 3 && !salvato; tentativo++) {
        couponCode = genCouponCode();
        const res = await api('promo_lead?select=id', {
          method:'POST',
          headers:{ 'Prefer':'return=minimal' },
          body: JSON.stringify({
            promo_id: promoId,
            azienda_id: promo.azienda_id,
            nome, cognome, telefono, email,
            consenso_marketing: consenso,
            privacy_accettata: privacy,
            user_agent: navigator.userAgent,
            data_scaricamento: new Date().toISOString(),
            codice_coupon: couponCode,
            stato_coupon: 'emesso',
            scadenza_coupon: scadenzaCoupon,
          })
        });
        if (res.ok) { salvato = true; }
        else if (res.data?.code === '23505') { continue; }        // codice duplicato → rigenera
        else { console.error('Lead insert error:', res.status, res.data); break; }
      }
      if (!salvato) couponCode = null; // fallback: flusso vecchio senza coupon

      // 2. Fire pixel
      const evento = promo.meta_pixel_evento_scaricamento || 'Lead';
      firePixel(evento, pixelId);
      if (window.dataLayer) window.dataLayer.push({ event: evento, promo_id: promoId, promo_nome: promo.nome });

      // 3. Invia WA — testo con link promo + coupon
      await inviaPromoWA({ promo, nome: nomeSaluto, telefono, aziendaId: promo.azienda_id, coupon: couponCode, nomeLocale: nomeDaComunicare });

      // 4. Invia email con coupon (email ora obbligatoria)
      if (email) {
        await inviaPromoEmail({ promo, nome: nomeSaluto, cognome, email, coupon: couponCode, azienda, nomeLocale: nomeDaComunicare });
      }

      window._rfTrack && window._rfTrack('submit', 'promo_scaricata', { completato: true, valore: promo.nome, step: 'success', coupon: couponCode });

    } catch(e) { console.error('Submit error:', e); }

    mostrarThankyou(promo);
  });
}

// ── Invio Email promo (usa Edge Function send-email esistente) ──
// Costruisce il testo del regolamento per email/landing: giorni + turni + min persone + validità + testo libero
function buildRegolamentoTesto(promo) {
  const giorniNomi = ['lunedì','martedì','mercoledì','giovedì','venerdì','sabato','domenica'];
  const righe = [];
  if (promo.giorni_disponibili?.length) {
    const nomi = promo.giorni_disponibili.map(g => giorniNomi[g-1]).filter(Boolean).join(', ');
    if (nomi) righe.push('📅 Valida nei giorni: ' + nomi);
  }
  if (promo.turni?.length) {
    righe.push('🕐 Valida a ' + promo.turni.map(t => t==='pranzo'?'pranzo':'cena').join(' e '));
  }
  if (promo.min_persone && promo.min_persone > 1) {
    righe.push('👥 Minimo ' + promo.min_persone + ' persone al tavolo');
  }
  if (promo.data_scadenza) {
    righe.push('⏰ Valida fino al ' + new Date(promo.data_scadenza).toLocaleDateString('it-IT'));
  } else if (promo.validita_giorni) {
    righe.push('⏰ Valida per ' + promo.validita_giorni + ' giorni');
  }
  return righe;
}

async function inviaPromoEmail({ promo, nome, cognome, email, coupon = null, azienda, nomeLocale }) {

    : '';

  const html = `

          <div style="font-size:16px;font-weight:700;margin-top:8px;">${promo.nome}</div>
          ${coupon ? `<div style="margin-top:14px;background:rgba(255,255,255,.2);border:1px dashed rgba(255,255,255,.6);border-radius:10px;padding:9px 14px;font-size:17px;font-weight:800;letter-spacing:2px;">${coupon}</div>` : ''}

          <div style="font-size:13px;color:#64748b;margin-bottom:10px;">📱 Mostra questo QR al nostro staff per usare la promo</div>

      })
    });
  } catch(e) { console.error('Invio email promo fallito:', e); }
}

// ── Invio WhatsApp promo ───────────────────────────────────────
async function inviaPromoWA({ promo, nome, telefono, aziendaId, coupon = null, nomeLocale = null }) {
  // Link thank you personale: mostra coupon + QR riaprendo il link
  const landingUrl = coupon
    ? `${location.origin}${location.pathname}?id=${promoId}&ty=1&c=${coupon}`
    : `${location.origin}${location.pathname}?id=${promoId}`;

  const locale = nomeLocale || 'noi';

  // Componi testo sostituendo variabili
  let testo = promo.messaggio_wa || '';
  if (!testo) {
    // Fallback testo di default
    const valoreLabel = promo.tipo==='sconto_perc' ? promo.valore+'%'
                      : promo.tipo==='sconto_euro' ? '€'+promo.valore
                      : promo.tipo==='2x1' ? '2×1' : '🎁';
    testo = `Ciao ${nome}! 🎁\n\nHai una promo esclusiva da *${locale}*: *${promo.nome}*\n`
          + (valoreLabel ? `Valore: *${valoreLabel}*\n` : '')
          + (coupon ? `Il tuo coupon personale: *${coupon}*\n` : (promo.codice ? `Codice: *${promo.codice}*\n` : ''))
          + `\n👉 Ritrovi coupon e QR qui: ${landingUrl}`;
  } else {
    const scadenza = promo.data_scadenza
      ? new Date(promo.data_scadenza).toLocaleDateString('it-IT')
      : `${promo.validita_giorni||30} giorni`;
    testo = testo
      .replace(/{{nome}}/g, nome)
      .replace(/{{locale}}/g, locale)
      .replace(/{{promo_nome}}/g, promo.nome||'')
      .replace(/{{promo_valore}}/g, promo.valore||'')
      .replace(/{{scadenza}}/g, scadenza)
      .replace(/{{codice}}/g, coupon || promo.codice || '')
      .replace(/{{coupon}}/g, coupon || '')
      .replace(/{{link_promo}}/g, landingUrl);
  }

  const WA_URL = `${SUPABASE_URL}/functions/v1/whatsapp-send-ts`;

  // 3a. Invia messaggio testo
  try {
    await fetch(WA_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_KEY },
      body: JSON.stringify({
        azienda_id: aziendaId,
        numero_dest: telefono,
        testo,
        contesto: 'promo_scaricata',
      })
    });
  } catch(e) { console.error('WA testo error:', e); }

  // 3b. Genera QR e invialo come immagine separata
  // Con coupon: il QR codifica "RFC:CODICE" → è quello che verrà scansionato in cassa
  try {
    const qrPayload = coupon ? `RFC:${coupon}` : landingUrl;
    const qrUrl = await generaECaricaQR(promoId, qrPayload, aziendaId);
    if (qrUrl) {
      await fetch(WA_URL, {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_KEY },
        body: JSON.stringify({
          azienda_id: aziendaId,
          numero_dest: telefono,
          media_url: qrUrl,
          media_type: 'image',
          media_caption: '📱 Mostra questo QR al cameriere per riscattare la tua promo!',
          contesto: 'promo_qr',
        })
      });
    }
  } catch(e) { console.error('WA QR error:', e); }
}

// ── Genera QR → carica su Storage → restituisce URL pubblico ──
async function generaECaricaQR(promoId, landingUrl, aziendaId) {
  return new Promise(resolve => {
    const caricaLib = (cb) => {
      if (window.QRCode) { cb(); return; }
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
      s.onload = cb; s.onerror = () => resolve(null);
      document.head.appendChild(s);
    };

    caricaLib(async () => {
      try {
        // Genera QR in canvas hidden
        const tmp = document.createElement('div');
        tmp.style.cssText = 'position:absolute;left:-9999px;';
        document.body.appendChild(tmp);
        new QRCode(tmp, { text: landingUrl, width: 300, height: 300, correctLevel: QRCode.CorrectLevel.M });

        await new Promise(r => setTimeout(r, 200)); // attendi render

        const canvas = tmp.querySelector('canvas');
        const imgEl  = tmp.querySelector('img');
        document.body.removeChild(tmp);

        let blob;
        if (canvas) {
          blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
        } else if (imgEl?.src?.startsWith('data:')) {
          const arr = imgEl.src.split(',');
          const bstr = atob(arr[1]);
          const u8 = new Uint8Array(bstr.length);
          for (let i=0;i<bstr.length;i++) u8[i]=bstr.charCodeAt(i);
          blob = new Blob([u8], { type:'image/png' });
        }

        if (!blob) { resolve(null); return; }

        // Carica su Supabase Storage
        const fileName = `promo-qr/${aziendaId}/${promoId}-${Date.now()}.png`;
        const uploadRes = await fetch(
          `${SUPABASE_URL}/storage/v1/object/immagini-promo/${fileName}`,
          {
            method: 'POST',
            headers: {
              'Authorization': 'Bearer '+SUPABASE_KEY,
              'Content-Type': 'image/png',
              'x-upsert': 'true',
            },
            body: blob
          }
        );

        if (!uploadRes.ok) { resolve(null); return; }

        const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/immagini-promo/${fileName}`;
        resolve(publicUrl);

      } catch(e) { console.error('QR gen error:', e); resolve(null); }
    });
  });
}

function mostrarThankyou(promo) {
  try { localStorage.setItem('rf_promo_dl_' + promoId, JSON.stringify({ coupon: couponCode || null, ts: Date.now() })); } catch(e) {}
  const overlay = document.getElementById('thankyou-overlay');
  const wrap    = document.getElementById('thankyou-wrap');
  const blocks  = promo.thankyou_config?.blocks || [];

  let html = '';
  if (blocks.length) {
    html = blocks.map(b => renderBlock(b, promo, null)).join('');
    // Box coupon personale sempre visibile anche con blocchi custom
    if (couponCode) {
      html += `<div class="box-offerta" style="margin:16px;">
        <div class="codice">${esc(couponCode)}</div>
        <div style="font-size:11px;opacity:.75;margin-top:6px;">🎟 Il tuo coupon personale — nominale e monouso</div>
      </div>
      <div style="padding:0 16px 24px;" id="qr-thankyou"></div>`;
    }
  } else {
    html = renderThankyouDefault(promo);
  }
  html += `<div class="footer">Powered by <a href="https://ristoflow-ai.com">Ristoflow.AI</a></div>`;

  wrap.innerHTML = html;
  overlay.classList.add('show');
  overlay.scrollTo(0,0);

  // QR nella thank you (default sempre; con blocchi custom solo se c'è coupon)
  if (!blocks.length || couponCode) generaQRThankyou(promoId);

  // Fire pixel thank you / Purchase
  const pixelId = document.querySelector('meta[name="pixel-id"]')?.content;
  firePixel(promo.meta_pixel_evento_uso || 'Purchase', pixelId);
}
