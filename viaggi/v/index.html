<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il viaggio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --carta:#FDFBF7; --inchiostro:#131A24; --rosso:#D0342C;
    --salvia:#5E8B87; --riga:#E3DDD2; --tenue:#5B6672;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--carta);color:var(--inchiostro);
       font:18px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:860px;margin:0 auto;padding:0 18px 90px}
  h1{font-size:40px;line-height:1.05;letter-spacing:-.02em;margin:30px 0 6px}
  h2{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--rosso);
     margin:54px 0 14px;padding-top:20px;border-top:3px solid var(--inchiostro)}
  h3{font-size:23px;margin:0 0 6px;letter-spacing:-.01em}
  p{margin:10px 0}
  .occhiello{font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--salvia);margin:0}
  .sotto{font-size:22px;color:var(--tenue);margin:0 0 18px}
  .numeri{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0}
  .numeri div{flex:1 1 130px;border:2px solid var(--riga);border-radius:10px;padding:14px;background:#fff}
  .numeri b{display:block;font-size:32px;color:var(--rosso);line-height:1}
  .numeri span{font-size:13px;color:var(--tenue);letter-spacing:.06em;text-transform:uppercase}
  #mappa{height:500px;border-radius:12px;border:2px solid var(--riga);margin:10px 0}
  .giorno{display:flex;gap:16px;padding:22px 0;border-bottom:1px solid var(--riga)}
  .giorno .n{color:var(--rosso);font-size:32px;line-height:1;min-width:56px;font-weight:700;font-variant-numeric:tabular-nums}
  .fermo{background:#F1F5F4;border-left:5px solid var(--salvia);padding-left:14px;border-radius:0 8px 8px 0}
  .tag{display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
       background:var(--salvia);color:#fff;padding:3px 9px;border-radius:3px}
  .tag.r{background:var(--rosso)}
  .foto{width:100%;border-radius:10px;margin:12px 0;display:block;background:#F1EDE6;min-height:120px}
  .pasti{margin:12px 0 0;border-top:1px dashed var(--riga);padding-top:10px}
  .pasto{font-size:16px;padding:5px 0;color:var(--tenue)}
  .pasto b{color:var(--inchiostro)}
  table{width:100%;border-collapse:collapse;margin:12px 0;font-size:16px}
  th{text-align:left;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue);
     border-bottom:2px solid var(--inchiostro);padding:8px 6px}
  td{border-bottom:1px solid var(--riga);padding:9px 6px;vertical-align:top}
  .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  label{display:block;font-size:15px;color:var(--tenue);margin:14px 0 4px}
  input,select{width:100%;padding:13px;border:2px solid var(--riga);border-radius:8px;
               font-size:17px;background:#fff;color:var(--inchiostro);font-family:inherit}
  input:focus,select:focus{outline:3px solid var(--salvia);outline-offset:1px;border-color:var(--salvia)}
  .scelta{border:2px solid var(--riga);border-radius:10px;padding:14px;margin:10px 0;background:#fff;cursor:pointer;display:block}
  .scelta.on{border-color:var(--rosso);border-width:3px}
  .scelta h4{margin:0 0 3px;font-size:18px}
  .scelta p{margin:2px 0;font-size:15px;color:var(--tenue)}
  .scelta input{width:auto;margin-right:8px}
  button{background:var(--rosso);color:#fff;border:0;padding:16px 28px;border-radius:8px;
         font-size:18px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:18px}
  button:disabled{opacity:.6;cursor:default}
  .due{display:flex;gap:14px;flex-wrap:wrap}
  .due>div{flex:1 1 160px}
  .msg{margin-top:14px;padding:14px;border-radius:8px;font-size:17px}
  .msg.ok{background:#EAF6EE;border:2px solid #2E8B57;color:#1D5E38}
  .msg.ko{background:#FDECEA;border:2px solid var(--rosso);color:#8E1D17}
  .credito{font-size:13px;color:var(--tenue);margin-top:4px}
  .barra-top{position:sticky;top:0;z-index:900;background:var(--carta);border-bottom:2px solid var(--riga);
             display:flex;justify-content:space-between;align-items:center;padding:12px 18px;
             max-width:860px;margin:0 auto}
  .barra-top a{text-decoration:none;font-size:16px;font-weight:700;color:var(--rosso)}
  .barra-top .su{color:var(--tenue)}
  .pasto-box{border:2px solid var(--riga);border-radius:10px;padding:12px;margin:10px 0;background:#fff}
  .pasto-box.fuori{border-left:6px solid var(--rosso)}
  .pasto-box.camper{border-left:6px solid var(--salvia)}
  .pasto-box.scelta{border-left:6px dashed var(--salvia)}
  .pasto-testa{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue);margin:0 0 4px}
  .pasto-box h4{margin:0 0 4px;font-size:19px}
  .pasto-box p{margin:3px 0;font-size:16px;color:var(--tenue)}
  .piatto-foto{width:100%;max-height:220px;object-fit:cover;border-radius:8px;margin:8px 0;display:block}
  .azioni{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .azioni a{display:inline-block;text-decoration:none;font-size:15px;font-weight:700;
            border:2px solid var(--riga);border-radius:8px;padding:9px 14px;color:var(--inchiostro)}
  .azioni a.mappa{border-color:var(--rosso);color:var(--rosso)}
  .calc{border:2px solid var(--riga);border-radius:12px;padding:18px;background:#fff;margin:14px 0}
  .scelte-n{display:flex;gap:10px;flex-wrap:wrap}
  .n-btn{background:#fff;color:var(--inchiostro);border:2px solid var(--riga);border-radius:8px;
         padding:12px 18px;font-size:17px;font-weight:700;cursor:pointer;margin:0;font-family:inherit}
  .n-btn.on{background:var(--rosso);color:#fff;border-color:var(--rosso)}
  .slide{position:relative;margin:12px 0}
  .slide-pista{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
               -webkit-overflow-scrolling:touch;scrollbar-width:none;border-radius:10px}
  .slide-pista::-webkit-scrollbar{display:none}
  .slide-pista figure{flex:0 0 100%;scroll-snap-align:center;margin:0}
  .slide-pista img{width:100%;height:260px;object-fit:cover;border-radius:10px;display:block;background:#F1EDE6}
  .slide-pista figcaption{font-size:14px;color:var(--tenue);padding:6px 2px}
  .slide-frecce{position:absolute;top:110px;left:0;right:0;display:flex;justify-content:space-between;
                pointer-events:none;padding:0 8px}
  .slide-frecce button{pointer-events:auto;background:rgba(19,26,36,.72);color:#fff;border:0;border-radius:50%;
                       width:44px;height:44px;font-size:20px;margin:0;padding:0;cursor:pointer;line-height:1}
  .slide-punti{display:flex;gap:6px;justify-content:center;margin-top:8px}
  .slide-punti i{width:8px;height:8px;border-radius:50%;background:var(--riga);display:block}
  .slide-punti i.on{background:var(--rosso)}
  @media(max-width:520px){.slide-pista img{height:210px}.slide-frecce{top:85px}}
  @media(max-width:520px){h1{font-size:30px}.sotto{font-size:19px}.giorno{gap:10px}.giorno .n{font-size:24px;min-width:40px}}
</style>
</head>
<body>
<div class="barra-top">
  <a href="../" class="indietro">← Tutti i viaggi</a>
  <a href="#" class="su" id="torna-su">↑ Inizio</a>
</div>
<div class="wrap" id="app"><p style="margin-top:40px;color:#5B6672">Carico il viaggio...</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  var appBox = document.getElementById("app");

  function guasto(testo) {
    if (appBox) appBox.innerHTML = "<h1>Non riesco a caricare</h1><p>" + testo + "</p>"
      + '<p style="font-size:15px;color:#5B6672;">Riprova fra un minuto. Se insiste, avvisaci.</p>';
  }

  if (!window.supabase || typeof window.supabase.createClient !== "function") {
    guasto("La connessione al server non e partita.");
    return;
  }

  var SB_URL = "https://cuhcscpvhypoaplcmtjk.supabase.co";
  var SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1aGNzY3B2aHlwb2FwbGNtdGprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4MjY4MjgsImV4cCI6MjA3OTQwMjgyOH0.q9zAs0oh8F1-whtORHBIORF5jIn1NTS3LvSMWleP0a0";
  var sb = window.supabase.createClient(SB_URL, SB_KEY);

  var params = new URLSearchParams(location.search);
  var slug = params.get("s") || "route66-2027";
  var app = document.getElementById("app");
  var dati = null;

  var COLORI = { guida: "#D0342C", fermi: "#5E8B87", volo: "#131A24" };
  var MOMENTI = { colazione: "Colazione", pranzo: "Pranzo", cena: "Cena" };

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function euro(n) {
    return Number(n || 0).toLocaleString("it-IT", { maximumFractionDigits: 0 }) + " €";
  }
  function dataIt(iso) {
    if (!iso) return "";
    var p = String(iso).slice(0, 10).split("-");
    var mesi = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
    return Number(p[2]) + " " + mesi[Number(p[1]) - 1] + " " + p[0];
  }
  function mesePiu(iso) {
    if (!iso) return "";
    var p = String(iso).slice(0, 10).split("-");
    var mesi = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
    return mesi[Number(p[1]) - 1] + " " + p[0];
  }

  // Foto di repertorio da Wikimedia. Tre tentativi: voce italiana, voce inglese,
  // ricerca per parole chiave. Se non torna niente il riquadro sparisce.
  // Foto di repertorio da Wikimedia. Tre tentativi: voce italiana, voce inglese,
  // ricerca per parole chiave. Ogni tentativo tiene da parte anche il ritaglio
  // piccolo: se la versione ingrandita non esiste, Wikimedia risponde 404 e
  // senza ripiego resterebbe un riquadro vuoto.
  function grande(src) { return src.replace(/\/\d+px-/, "/1280px-"); }

  function sommario(lingua, titolo) {
    return fetch("https://" + lingua + ".wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(titolo))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j) return null;
        if (j.originalimage && j.originalimage.source) {
          return { grande: j.originalimage.source, piccola: j.thumbnail ? j.thumbnail.source : null };
        }
        if (j.thumbnail && j.thumbnail.source) {
          return { grande: grande(j.thumbnail.source), piccola: j.thumbnail.source };
        }
        return null;
      })
      .catch(function () { return null; });
  }

  function cerca(lingua, testo) {
    var u = "https://" + lingua + ".wikipedia.org/w/api.php?action=query&format=json&origin=*"
          + "&generator=search&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=1280"
          + "&gsrsearch=" + encodeURIComponent(testo);
    return fetch(u).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      if (!j || !j.query || !j.query.pages) return null;
      var pg = Object.keys(j.query.pages).map(function (k) { return j.query.pages[k]; })[0];
      if (!pg || !pg.thumbnail || !pg.thumbnail.source) return null;
      return { grande: pg.thumbnail.source, piccola: pg.thumbnail.source };
    }).catch(function () { return null; });
  }

  function mostra(img, esito) {
    if (!esito) { img.remove(); return; }
    img.onerror = function () {
      img.onerror = function () { img.remove(); };
      if (esito.piccola && esito.piccola !== img.src) img.src = esito.piccola;
      else img.remove();
    };
    img.src = esito.grande;
    img.style.minHeight = "0";
  }

  function fotoDaWiki(titolo, img, ripiego) {
    if (!img) return;
    if (!titolo && !ripiego) { img.remove(); return; }
    var chiave = titolo || ripiego;
    sommario("it", chiave)
      .then(function (e) { return e || sommario("en", chiave); })
      .then(function (e) { return e || cerca("it", chiave); })
      .then(function (e) { return e || cerca("en", ripiego || chiave); })
      .then(function (e) { mostra(img, e); });
  }

  // Quanto costa a testa: dipende da quanti si dividono il camper.
  var personeCamper = 4;

  function disegnaCalcolatore() {
    var box = document.getElementById("calcolatore");
    if (!box) return;
    var v = dati.viaggio;
    var b = dati.budget || [];

    function somma(unita, campo) {
      var t = 0;
      b.forEach(function (x) { if (x.unita === unita) t += Number(x[campo] || 0); });
      return t;
    }

    function sommaQ(unita, campo, quando) {
      var t = 0;
      b.forEach(function (x) { if (x.unita === unita && x.quando === quando) t += Number(x[campo] || 0); });
      return t;
    }

    var n = personeCamper;
    var quota = Number(v.quota_camper || 0);

    // Un prezzo solo, non una forbice: si prende il valore alto, che e gia
    // quello prudente. Il minimo resta nel gestionale per i conti interni.
    var primaC = sommaQ("camper", "max", "prima");
    var primaP = sommaQ("persona", "max", "prima");
    var viagC  = sommaQ("camper", "max", "in_viaggio");
    var viagP  = sommaQ("persona", "max", "in_viaggio");

    var primaTesta = primaC / n + primaP;
    var viagTesta  = viagC / n + viagP;
    var tuttoTesta = primaTesta + viagTesta;

    var h = '<div class="calc">';
    h += "<p><b>In quanti dividete il camper?</b></p><div class=\"scelte-n\">";
    [3, 4, 5].forEach(function (k) {
      h += '<button class="n-btn' + (k === n ? " on" : "") + '" data-n="' + k + '">' + k + " persone</button>";
    });
    h += "</div>";

    h += '<div class="numeri" style="margin-top:16px;">'
      + "<div><b>" + euro(primaTesta) + "</b><span>Prima di partire</span></div>"
      + "<div><b>" + euro(viagTesta) + "</b><span>Da spendere lì</span></div>"
      + "<div><b>" + euro(tuttoTesta) + "</b><span>In tutto, a testa</span></div>"
      + "</div>";

    h += '<p class="credito">Il primo numero si paga prima di partire: volo, camper, assicurazione. Il secondo si spende strada facendo: benzina, soste, pedaggi, ingressi. Quello che mangiate non è conteggiato: al supermercato o al ristorante, decidete voi quanto spendere.</p>';

    function blocco(titolo, quando, camperTot, persTot) {
      var t = '<h3 style="font-size:19px;margin:26px 0 2px;">' + titolo + "</h3>";
      t += "<table><tr><th>Voce</th><th class=\"num\">Costo</th></tr>";
      b.forEach(function (x) {
        if (x.quando !== quando) return;
        t += "<tr><td><b>" + esc(x.voce) + "</b>"
           + '<div style="color:#5B6672;font-size:14px;">'
           + (x.unita === "camper" ? "per camper" : "a persona")
           + (x.dettaglio ? " · " + esc(x.dettaglio) : "") + "</div>"
           + '</td><td class="num">' + euro(x.max) + "</td></tr>";
      });
      t += '<tr><td><b>A testa, in ' + n + '</b></td><td class="num"><b>'
         + euro(camperTot / n + persTot) + "</b></td></tr></table>";
      return t;
    }

    h += blocco("Prima di partire", "prima", primaC, primaP);
    h += blocco("Durante il viaggio", "in_viaggio", viagC, viagP);

    h += '<h3 style="font-size:19px;margin:26px 0 2px;">La quota che versate a noi</h3>';
    h += "<p>" + euro(quota) + " a camper, cioè <b>" + euro(quota / n) + "</b> a testa in " + n
       + ". Copre il mezzo per intero: noleggio, coperture, carburante, campeggi, pedaggi. "
       + "Voli, pasti e ingressi li gestite voi.</p>";

    h += "</div>";
    box.innerHTML = h;

    box.querySelectorAll(".n-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        personeCamper = Number(btn.dataset.n);
        disegnaCalcolatore();
      });
    });
  }

  function disegna() {
    var v = dati.viaggio, tappe = dati.tappe || [];
    var km = 0, stati = {};
    tappe.forEach(function (t) { km += Number(t.km || 0); if (t.stato_usa) stati[t.stato_usa] = 1; });

    var h = "";
    h += '<p class="occhiello">Dal ' + esc(dataIt(v.data_inizio)) + " al " + esc(dataIt(v.data_fine)) + "</p>";
    h += "<h1>" + esc(v.titolo) + "</h1>";
    h += '<p class="sotto">' + esc(v.sottotitolo || "") + "</p>";

    h += '<div class="numeri">'
      + "<div><b>" + tappe.length + "</b><span>Giorni</span></div>"
      + "<div><b>" + (v.km_totali || km).toLocaleString("it-IT") + "</b><span>Chilometri</span></div>"
      + "<div><b>" + (v.stati_attraversati || Object.keys(stati).length) + "</b><span>Stati</span></div>"
      + "<div><b>" + (v.notti_hotel || 0) + "</b><span>Notti in hotel</span></div>"
      + "</div>";

    if (v.descrizione) h += "<p>" + esc(v.descrizione) + "</p>";

    h += "<h2>Il percorso</h2><div id=\"mappa\"></div>";
    h += '<p class="credito">Rosso: giornata di guida. Verde: giornata ferma. Nero: volo. Tocca un punto per aprire la tappa.</p>';

    if ((dati.budget || []).length) {
      h += "<h2>Quanto costa</h2>";
      if (v.cosa_include) h += "<p>" + esc(v.cosa_include) + "</p>";
      h += '<div id="calcolatore"></div>';
    }

    if ((dati.mezzi || []).length) {
      // I mezzi sono identici: si descrive il camper una volta sola e si dice quanti sono.
      var gruppi = {};
      dati.mezzi.forEach(function (m) {
        var k = (m.modello || m.nome) + "|" + (m.posti_max || "");
        if (!gruppi[k]) gruppi[k] = { m: m, n: 0, liberi: 0 };
        gruppi[k].n += 1;
        if (m.stato === "libero") gruppi[k].liberi += 1;
      });

      h += "<h2>Il camper</h2>";
      Object.keys(gruppi).forEach(function (k, gi) {
        var g = gruppi[k], m = g.m;
        h += '<div class="calc">';
        h += "<h3>" + esc(m.modello || m.nome) + "</h3>";
        h += "<p>" + (g.n > 1 ? "Ne abbiamo <b>" + g.n + "</b>, identici. " : "")
           + "Fino a <b>" + (m.posti_max || "") + "</b> persone per mezzo"
           + (m.posti_letto ? ", " + m.posti_letto + " posti letto" : "") + ".</p>";
        if (m.note) h += "<p>" + esc(m.note) + "</p>";

        var foto = m.foto || [];
        if (foto.length) {
          h += '<div class="slide"><div class="slide-pista">';
          foto.forEach(function (f) {
            h += "<figure><img src=\"" + esc(f.url) + '" alt="' + esc(f.didascalia || m.modello || "camper") + '">'
               + (f.didascalia ? "<figcaption>" + esc(f.didascalia) + "</figcaption>" : "") + "</figure>";
          });
          h += "</div>";
          if (foto.length > 1) {
            h += '<div class="slide-frecce"><button data-dir="-1" aria-label="Foto precedente">&lsaquo;</button>'
               + '<button data-dir="1" aria-label="Foto successiva">&rsaquo;</button></div>';
            h += '<div class="slide-punti">';
            foto.forEach(function (f, i) { h += "<i" + (i === 0 ? ' class="on"' : "") + "></i>"; });
            h += "</div>";
          }
          h += "</div>";
        }

        h += "<p><b>" + g.liberi + "</b> " + (g.liberi === 1 ? "ancora libero" : "ancora liberi") + ".</p>";
        h += "</div>";
      });
    }

    h += "<h2>Giorno per giorno</h2><div id=\"programma\"></div>";

    if ((dati.scadenze || []).length) {
      h += "<h2>Cosa va prenotato e quando</h2><table><tr><th>Cosa</th><th>Entro</th><th>Fatto</th></tr>";
      dati.scadenze.forEach(function (s) {
        h += "<tr><td><b>" + esc(s.titolo) + "</b>"
           + (s.descrizione ? '<div style="color:#5B6672;font-size:14px;">' + esc(s.descrizione) + "</div>" : "")
           + "</td><td>" + esc(mesePiu(s.mese)) + "</td><td>" + (s.completato ? "Sì" : "—") + "</td></tr>";
      });
      h += "</table>";
    }

    h += modulo(v);
    h += '<h2>&nbsp;</h2><p style="text-align:center;"><a href="../" style="color:var(--rosso);font-weight:700;text-decoration:none;font-size:18px;">&larr; Torna a tutti i viaggi</a></p>';

    app.innerHTML = h;

    disegnaCalcolatore();
    attivaSlide();
    disegnaProgramma(tappe);
    disegnaMappa(tappe);
    agganciaModulo();

    var su = document.getElementById("torna-su");
    if (su) su.addEventListener("click", function (e) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  }

  // Scorrimento a slide: la pista scorre col dito, frecce e punti servono da computer.
  function attivaSlide() {
    document.querySelectorAll(".slide").forEach(function (box) {
      var pista = box.querySelector(".slide-pista");
      var punti = box.querySelectorAll(".slide-punti i");
      if (!pista) return;

      box.querySelectorAll(".slide-frecce button").forEach(function (b) {
        b.addEventListener("click", function () {
          pista.scrollBy({ left: Number(b.dataset.dir) * pista.clientWidth, behavior: "smooth" });
        });
      });

      pista.addEventListener("scroll", function () {
        if (!punti.length) return;
        var i = Math.round(pista.scrollLeft / pista.clientWidth);
        punti.forEach(function (p, k) { p.className = k === i ? "on" : ""; });
      });
    });
  }

  function disegnaProgramma(tappe) {
    var box = document.getElementById("programma");
    if (!box) return;

    tappe.forEach(function (t) {
      var d = document.createElement("div");
      d.className = "giorno" + (t.tipo === "fermi" ? " fermo" : "");
      var testa = '<p class="occhiello">' + esc(dataIt(t.data)) + (t.stato_usa ? " · " + esc(t.stato_usa) : "")
        + (Number(t.km) > 0 ? " · " + t.km + " km" : "")
        + (t.tipo === "fermi" ? ' · <span class="tag">Giornata ferma</span>' : "")
        + (t.tipo === "volo" ? ' · <span class="tag r">Volo</span>' : "") + "</p>";

      var pasti = "";
      (t.pasti || []).forEach(function (p, i) {
        var dove = p.dove === "camper" ? "In camper" : (p.dove === "fuori" ? "Fuori" : "A scelta");
        var idFoto = "pf-" + t.giorno + "-" + i;

        pasti += '<div class="pasto-box ' + p.dove + '">';
        pasti += '<p class="pasto-testa">' + MOMENTI[p.momento] + " · " + dove
              + (p.spesa ? " · circa " + Math.round(Number(p.spesa)) + " $ a testa" : "") + "</p>";

        if (p.locale) {
          pasti += "<h4>" + esc(p.locale) + "</h4>";
          if (p.piatto) pasti += "<p><b>Da prendere:</b> " + esc(p.piatto) + "</p>";
          if (p.foto_piatto_url || p.foto_piatto_wiki)
            pasti += '<img class="piatto-foto" id="' + idFoto + '" alt="' + esc(p.piatto || p.locale) + '">';
          if (p.indirizzo || p.citta)
            pasti += "<p>" + esc([p.indirizzo, p.citta].filter(Boolean).join(", ")) + "</p>";
          if (p.note) pasti += "<p>" + esc(p.note) + "</p>";
          if (p.prenotare) pasti += '<p><span class="tag r">Va prenotato</span></p>';

          pasti += '<div class="azioni">';
          if (p.mappa) pasti += '<a class="mappa" href="' + esc(p.mappa) + '" target="_blank" rel="noopener">Apri sulla mappa</a>';
          if (p.telefono) pasti += '<a href="tel:' + esc(String(p.telefono).replace(/\s/g, "")) + '">Chiama</a>';
          if (p.sito) pasti += '<a href="' + esc(p.sito) + '" target="_blank" rel="noopener">Sito</a>';
          pasti += "</div>";
        } else {
          pasti += "<h4>" + esc(p.ricetta || "Da decidere") + "</h4>";
          if (p.note) pasti += "<p>" + esc(p.note) + "</p>";
        }
        pasti += "</div>";
      });

      d.innerHTML = '<div class="n">' + t.giorno + "</div><div style=\"flex:1;min-width:0;\">"
        + testa + "<h3>" + esc(t.titolo) + "</h3>"
        + '<img class="foto" alt="' + esc(t.titolo) + '">'
        + (t.descrizione ? "<p>" + esc(t.descrizione) + "</p>" : "")
        + (pasti ? '<div class="pasti">' + pasti + "</div>" : "")
        + "</div>";
      box.appendChild(d);

      var img = d.querySelector("img.foto");
      if (t.foto_url) {
        img.onerror = function () { fotoDaWiki(t.foto_wiki, img, t.titolo); };
        img.src = t.foto_url;
      } else {
        fotoDaWiki(t.foto_wiki, img, t.titolo + " Route 66");
      }

      (t.pasti || []).forEach(function (p, i) {
        var el = document.getElementById("pf-" + t.giorno + "-" + i);
        if (!el) return;
        if (p.foto_piatto_url) { el.src = p.foto_piatto_url; return; }
        fotoDaWiki(p.foto_piatto_wiki, el, (p.piatto || "") + " food");
      });
    });
  }

  function disegnaMappa(tappe) {
    var punti = tappe.filter(function (t) { return t.lat && t.lng; });
    var box = document.getElementById("mappa");
    if (!box) return;
    if (!punti.length) { box.remove(); return; }

    var mappa = L.map("mappa", { scrollWheelZoom: false });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap", maxZoom: 18
    }).addTo(mappa);

    var linea = [];
    punti.forEach(function (t) {
      var ll = [Number(t.lat), Number(t.lng)];
      linea.push(ll);
      L.circleMarker(ll, {
        radius: 9, color: "#fff", weight: 2,
        fillColor: COLORI[t.tipo] || "#D0342C", fillOpacity: 1
      }).addTo(mappa).bindPopup(
        "<b>Giorno " + t.giorno + " — " + esc(t.titolo) + "</b><br>"
        + (Number(t.km) > 0 ? t.km + " km<br>" : "")
        + (t.descrizione ? esc(t.descrizione) : "")
      );
    });

    L.polyline(linea, { color: "#D0342C", weight: 3, opacity: .8 }).addTo(mappa);
    mappa.fitBounds(L.latLngBounds(linea), { padding: [30, 30] });
    setTimeout(function () { mappa.invalidateSize(); }, 200);
  }

  function modulo(v) {
    if (!v.adesioni_aperte) {
      return "<h2>Adesioni</h2><p>Le adesioni per questo viaggio sono chiuse.</p>";
    }
    var quota = v.modalita_prezzo === "camper" ? v.quota_camper : v.quota_adulto;
    var testoQuota = v.modalita_prezzo === "camper"
      ? euro(quota) + " a camper, fino a " + v.posti_per_mezzo + " persone"
      : euro(quota) + " a persona";

    var h = "<h2>Vieni con noi</h2>";
    h += "<p><b>" + testoQuota + ".</b> Acconto " + (v.acconto_percentuale || 30) + "%, saldo "
       + (v.saldo_entro_giorni || 30) + " giorni prima della partenza.</p>";
    h += '<div class="due"><div><label for="f-nome">Nome</label><input id="f-nome"></div>'
       + '<div><label for="f-cognome">Cognome</label><input id="f-cognome"></div></div>';
    h += '<label for="f-email">Email</label><input id="f-email" type="email">';
    h += '<label for="f-tel">Telefono</label><input id="f-tel" type="tel">';
    h += '<label for="f-nucleo">Come vi chiamiamo (famiglia, gruppo)</label><input id="f-nucleo">';
    h += '<div class="due"><div><label for="f-adulti">Adulti</label><input id="f-adulti" type="number" min="1" value="2"></div>'
       + '<div><label for="f-bambini">Bambini</label><input id="f-bambini" type="number" min="0" value="0"></div></div>';

    h += "<h3 style=\"margin-top:26px;\">Come preferite pagare</h3>";
    var m = v.modalita_ammesse || ["acconto_saldo"];
    if (m.indexOf("acconto_saldo") >= 0) {
      h += '<label class="scelta on"><input type="radio" name="mod" value="acconto_saldo" checked>'
         + "<h4>Acconto e saldo</h4><p>Una parte ora, il resto prima di partire.</p></label>";
    }
    if (m.indexOf("rate_mensili") >= 0) {
      h += '<label class="scelta"><input type="radio" name="mod" value="rate_mensili">'
         + "<h4>A rate</h4><p>Acconto, poi importi uguali fino alla partenza.</p></label>";
    }
    if (m.indexOf("libero") >= 0) {
      h += '<label class="scelta"><input type="radio" name="mod" value="libero">'
         + "<h4>Mettete da parte quando potete</h4><p>Nessuna scadenza intermedia, solo il termine ultimo.</p></label>";
    }

    h += '<div class="due"><div><label for="f-chipaga">Chi paga</label><select id="f-chipaga">'
       + '<option value="unico">Un solo pagatore</option>'
       + '<option value="pro_capite">Ognuno la sua quota</option></select></div>'
       + '<div><label for="f-cadenza">Ogni quanto</label><select id="f-cadenza">'
       + '<option value="1">Ogni mese</option><option value="2">Ogni due mesi</option>'
       + '<option value="3">Ogni tre mesi</option><option value="6">Ogni sei mesi</option></select></div></div>';

    h += '<button id="f-invia">Invia l\'adesione</button><div id="f-msg"></div>';
    return h;
  }

  function agganciaModulo() {
    var b = document.getElementById("f-invia");
    if (!b) return;

    document.querySelectorAll(".scelta input").forEach(function (r) {
      r.addEventListener("change", function () {
        document.querySelectorAll(".scelta").forEach(function (s) { s.classList.remove("on"); });
        r.closest(".scelta").classList.add("on");
      });
    });

    b.addEventListener("click", function () {
      var msg = document.getElementById("f-msg");
      var sel = document.querySelector(".scelta input:checked");
      var val = function (id) { var e = document.getElementById(id); return e ? e.value : ""; };

      if (!val("f-nome").trim() || !val("f-email").trim()) {
        msg.className = "msg ko"; msg.textContent = "Servono nome ed email.";
        return;
      }

      b.disabled = true; b.textContent = "Invio...";
      msg.className = ""; msg.textContent = "";

      sb.rpc("viaggio_adesione", {
        p_slug: slug, p_nome: val("f-nome"), p_cognome: val("f-cognome"),
        p_email: val("f-email"), p_telefono: val("f-tel"), p_nucleo: val("f-nucleo"),
        p_adulti: Number(val("f-adulti") || 1), p_bambini: Number(val("f-bambini") || 0),
        p_modalita: sel ? sel.value : "acconto_saldo",
        p_chi_paga: val("f-chipaga"), p_cadenza: Number(val("f-cadenza") || 1), p_note: null
      }).then(function (r) {
        b.disabled = false; b.textContent = "Invia l'adesione";
        if (r.error) { msg.className = "msg ko"; msg.textContent = r.error.message; return; }
        var d = r.data || {};
        if (!d.ok) { msg.className = "msg ko"; msg.textContent = d.errore || "Riprova."; return; }
        var link = location.origin + location.pathname.replace(/[^/]*$/, "") + "../p/?t=" + d.link;
        msg.className = "msg ok";
        msg.innerHTML = "Ci siamo. Quota " + euro(d.quota) + " per " + d.persone + " persone.<br>"
          + 'Il vostro piano è qui: <a href="' + link + '">' + link + "</a><br>Salvate questo indirizzo.";
      });
    });
  }

  sb.rpc("viaggio_pubblico", { p_slug: slug }).then(function (r) {
    if (r.error) { guasto(esc(r.error.message)); return; }
    if (!r.data || !r.data.viaggio) {
      app.innerHTML = "<h1>Viaggio non trovato</h1><p>Il link potrebbe essere vecchio, oppure il viaggio non è ancora pubblicato.</p>";
      return;
    }
    dati = r.data;
    document.title = dati.viaggio.titolo;
    try {
      disegna();
    } catch (e) {
      guasto("La pagina non si e disegnata: " + esc(e.message));
    }
  }).catch(function (e) {
    guasto(esc(e && e.message ? e.message : String(e)));
  });
})();
</script>
</body>
</html>
