<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Il browser e GitHub Pages tenevano la pagina vecchia anche dopo il deploy. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Il tuo piano</title>
<style>
  :root{--carta:#FDFBF7;--inchiostro:#131A24;--accento:#12657F; --allarme:#B3261E;--salvia:#5E8B87;--riga:#E3DDD2;--tenue:#5B6672}
  *{box-sizing:border-box}
  body{margin:0;background:var(--carta);color:var(--inchiostro);
       font:18px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:720px;margin:0 auto;padding:0 18px 80px}
  h1{font-size:32px;line-height:1.1;margin:30px 0 4px;letter-spacing:-.02em}
  h2{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--accento);
     margin:44px 0 12px;padding-top:18px;border-top:3px solid var(--inchiostro)}
  .occhiello{font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--salvia);margin:0}
  .numeri{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}
  .numeri div{flex:1 1 130px;border:2px solid var(--riga);border-radius:10px;padding:14px;background:#fff}
  .numeri b{display:block;font-size:28px;line-height:1;color:var(--accento)}
  .numeri span{font-size:13px;color:var(--tenue);text-transform:uppercase;letter-spacing:.06em}
  .barra{height:18px;background:var(--riga);border-radius:9px;overflow:hidden;margin:12px 0}
  .barra i{display:block;height:100%;background:var(--accento)}
  table{width:100%;border-collapse:collapse;font-size:16px;margin:10px 0}
  th{text-align:left;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue);
     border-bottom:2px solid var(--inchiostro);padding:8px 6px}
  td{border-bottom:1px solid var(--riga);padding:10px 6px;vertical-align:top}
  .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
       padding:3px 9px;border-radius:3px;background:var(--salvia);color:#fff}
  .tag.r{background:var(--allarme)}
  .tag.v{background:#2E8B57}
  .nota{background:#fff;border:2px solid var(--riga);border-radius:10px;padding:16px;margin:18px 0;font-size:16px}
  a{color:var(--accento)}
  .barra-top{position:sticky;top:0;z-index:900;background:var(--carta);border-bottom:2px solid var(--riga);
             padding:12px 18px;max-width:720px;margin:0 auto}
  .barra-top a{text-decoration:none;font-size:16px;font-weight:700}
  button{background:var(--accento);color:#fff;border:0;padding:15px 26px;border-radius:8px;
         font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:14px}
  button:disabled{opacity:.6;cursor:default}
  button.chiaro{background:#fff;color:var(--salvia);border:2px solid var(--salvia)}
  input{width:100%;padding:13px;border:2px solid var(--riga);border-radius:8px;
        font-size:17px;font-family:inherit;background:#fff;color:var(--inchiostro);box-sizing:border-box}
  label{display:block;font-size:15px;color:var(--tenue);margin:12px 0 4px}
  .msg{margin-top:12px;padding:13px;border-radius:8px;font-size:16px}
  .msg.ok{background:#EAF6EE;border:2px solid #2E8B57;color:#1D5E38}
  .msg.ko{background:#FDECEA;border:2px solid var(--allarme);color:#8E1D17}
  @media(max-width:520px){h1{font-size:26px}table{font-size:15px}}
</style>
</head>
<body>
<div class="barra-top">
  <a href="../">← Tutti i viaggi</a>
</div>
<div class="wrap" id="app"><p style="margin-top:40px;color:#5B6672">Carico il piano...</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var appBox = document.getElementById("app");

  function guasto(testo) {
    if (appBox) appBox.innerHTML = "<h1>Non riesco a caricare</h1><p>" + testo + "</p>"
      + '<p style="font-size:15px;color:#5B6672;">Riprova fra un minuto. Se insiste, avvisaci.</p>';
  }

  if (!window.supabase || typeof window.supabase.createClient !== "function") {
    guasto("La connessione al server non e partita.");
    return;
  }

  var SB_URL = "https://cuhcscpvhypoaplcmtjk.supabase.co";
  var SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1aGNzY3B2aHlwb2FwbGNtdGprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4MjY4MjgsImV4cCI6MjA3OTQwMjgyOH0.q9zAs0oh8F1-whtORHBIORF5jIn1NTS3LvSMWleP0a0";
  var sb = window.supabase.createClient(SB_URL, SB_KEY);

  var token = new URLSearchParams(location.search).get("t") || "";
  var app = document.getElementById("app");

  var TIPO = { acconto: "Acconto", rata: "Rata", saldo: "Saldo" };
  var STATO = {
    attesa:    '<span class="tag">In attesa</span>',
    pagata:    '<span class="tag v">Pagata</span>',
    scaduta:   '<span class="tag r">Scaduta</span>',
    annullata: "—"
  };
  var MODALITA = {
    acconto_saldo: "acconto e saldo",
    rate_mensili: "a rate",
    libero: "versamenti liberi"
  };

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function euro(n) {
    return Number(n || 0).toLocaleString("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
  }
  function dataIt(iso) {
    if (!iso) return "—";
    var p = String(iso).slice(0, 10).split("-");
    return p[2] + "/" + p[1] + "/" + p[0];
  }
  function oggi() { return new Date().toISOString().slice(0, 10); }

  if (!token) {
    app.innerHTML = "<h1>Link incompleto</h1><p>Apri il collegamento che ti è arrivato per intero.</p>";
    return;
  }

  var esito = new URLSearchParams(location.search).get("pagamento");

  function avviso() {
    if (esito === "ok") {
      return '<div class="msg ok">Pagamento ricevuto, grazie. Se il piano qui sotto non è ancora aggiornato, ricarica fra qualche secondo.</div>';
    }
    if (esito === "annullato") {
      return '<div class="msg ko">Pagamento annullato. Non è stato addebitato nulla.</div>';
    }
    return "";
  }

  function paga(corpo, bottone, box) {
    bottone.disabled = true;
    var testoVecchio = bottone.textContent;
    bottone.textContent = "Un attimo...";
    corpo.token = token;
    corpo.ritorno = location.origin + location.pathname;

    fetch("https://cuhcscpvhypoaplcmtjk.supabase.co/functions/v1/viaggi-paga", {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SB_KEY },
      body: JSON.stringify(corpo)
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.ok && d.url) { location.href = d.url; return; }
      bottone.disabled = false;
      bottone.textContent = testoVecchio;
      box.className = "msg ko";
      box.textContent = (d && d.errore) ? d.errore : "Non riesco ad aprire il pagamento.";
    }).catch(function () {
      bottone.disabled = false;
      bottone.textContent = testoVecchio;
      box.className = "msg ko";
      box.textContent = "Connessione non riuscita.";
    });
  }

  sb.rpc("viaggio_mio_piano", { p_token: token }).then(function (r) {
    if (r.error || !r.data) {
      app.innerHTML = "<h1>Piano non trovato</h1><p>Il link non è più valido. Scrivi agli organizzatori e te ne mandano uno nuovo.</p>";
      return;
    }
    var d = r.data;
    var quota = Number(d.quota || 0);
    var versato = Number(d.versato || 0);
    var residuo = quota - versato;
    var perc = quota > 0 ? Math.min(100, Math.round(versato / quota * 100)) : 0;

    var rate = d.rate || [];
    var prossima = null;
    rate.forEach(function (x) {
      if (x.stato === "attesa" && !prossima) prossima = x;
    });

    var h = avviso();

    // Cosa hanno comprato, non solo quanto devono pagare.
    if (d.viaggio.copertina || d.viaggio.copertina_wiki) {
      h += '<img class="copertina" id="cop" alt="' + esc(d.viaggio.titolo) + '">';
    }
    h += '<p class="occhiello">' + esc(d.viaggio.titolo) + "</p>";
    h += "<h1>" + esc(d.nucleo || d.referente) + "</h1>";
    h += '<p style="color:#5B6672;margin-top:0;">' + d.persone + (d.persone === 1 ? " persona" : " persone")
       + " · " + esc(MODALITA[d.modalita] || d.modalita)
       + (d.chi_paga === "pro_capite" ? " · ognuno la sua quota" : "") + "</p>";

    h += '<div class="numeri">'
      + "<div><b>" + euro(quota) + "</b><span>Quota</span></div>"
      + '<div><b style="color:#2E8B57;">' + euro(versato) + "</b><span>Versato</span></div>"
      + "<div><b>" + euro(residuo) + "</b><span>Residuo</span></div></div>";

    h += '<div class="barra"><i style="width:' + perc + '%"></i></div>';
    h += '<p style="color:#5B6672;font-size:16px;">' + perc + "% della quota."
       + (prossima ? " Prossimo versamento: " + euro(prossima.importo) + " entro il " + dataIt(prossima.scadenza) + "." : " Nessuna scadenza aperta.")
       + "</p>";

    var v = d.viaggio || {};
    h += '<div class="scheda">'
      + "<h2 style=\"margin-top:0;\">Il vostro pacchetto</h2>"
      + '<p class="periodo">' + dataIt(v.dal) + " – " + dataIt(v.al)
      + (v.giorni ? " · " + v.giorni + " giorni" : "") + "</p>"
      + (v.descrizione ? "<p>" + esc(v.descrizione) + "</p>" : "")
      + "</div>";

    var incluso = d.incluso || [];
    if (incluso.length) {
      h += "<h2>Cosa comprende</h2><ul class=\"incluso\">";
      incluso.forEach(function (r) { h += "<li>" + esc(r) + "</li>"; });
      h += "</ul>";
    }

    var confermati = d.confermati || [];
    var daFare = d.da_confermare || [];
    if (confermati.length || daFare.length) {
      h += "<h2>A che punto siamo</h2>";
      confermati.forEach(function (x) {
        h += '<div class="riga fatto"><b>' + esc(x.cosa) + "</b>"
          + '<span class="ok">Confermato'
          + (x.riferimento ? " · " + esc(x.riferimento) : "") + "</span></div>";
      });
      daFare.forEach(function (x) {
        h += '<div class="riga"><b>' + esc(x.cosa) + "</b>"
          + '<span class="attesa">Da confermare</span></div>';
      });
      h += '<p class="nota">Ci occupiamo noi di prenotare tutto. Vi avvisiamo appena '
        + "ogni voce e confermata.</p>";
    }

    var prog = d.programma || [];
    if (prog.length) {
      h += "<h2>Il programma</h2><table><tr><th>Giorno</th><th>Dove</th><th>Si dorme</th></tr>";
      prog.forEach(function (t) {
        h += "<tr><td><b>" + t.giorno + "</b><div style=\"color:#5B6672;font-size:13px;\">"
          + dataIt(t.data) + "</div></td>"
          + "<td>" + esc(t.titolo) + "</td>"
          + "<td>" + esc(t.alloggio || "—") + "</td></tr>";
      });
      h += "</table>";
      h += '<p style="text-align:center;"><a href="../v/?s=' + esc(v.slug)
        + '" style="color:var(--accento);font-weight:700;">Vedi il programma completo →</a></p>';
    }

    if (rate.length) {
      h += "<h2>Il piano</h2><table><tr><th>Voce</th><th>Scadenza</th><th class=\"num\">Importo</th><th>Stato</th></tr>";
      rate.forEach(function (x) {
        var scaduta = x.stato === "attesa" && x.scadenza && x.scadenza < oggi();
        h += "<tr><td><b>" + (TIPO[x.tipo] || x.tipo) + "</b>"
           + (x.intestata ? '<div style="color:#5B6672;font-size:14px;">' + esc(x.intestata) + "</div>" : "")
           + "</td><td>" + dataIt(x.scadenza) + '</td><td class="num">' + euro(x.importo) + "</td><td>"
           + (scaduta ? STATO.scaduta : (STATO[x.stato] || "")) + "</td></tr>";
      });
      h += "</table>";

      if (prossima && prossima.id) {
        h += '<button id="paga-rata">Paga ' + euro(prossima.importo) + "</button>";
        h += '<div id="msg-rata"></div>';
      }
    } else {
      h += "<h2>Il piano</h2><p>Il piano non è ancora stato preparato. Gli organizzatori lo impostano dopo aver confermato il gruppo.</p>";
    }

    if ((d.versamenti || []).length) {
      h += "<h2>Quello che avete versato</h2><table><tr><th>Data</th><th>Come</th><th class=\"num\">Importo</th></tr>";
      d.versamenti.forEach(function (x) {
        h += "<tr><td>" + dataIt(x.data) + "</td><td>" + esc(x.metodo) + '</td><td class="num">' + euro(x.importo) + "</td></tr>";
      });
      h += "</table>";
    }

    if (residuo > 0.01) {
      h += "<h2>Versa quando puoi</h2>";
      h += '<p style="color:#5B6672;font-size:16px;">Mettete da parte quando vi conviene: '
         + "ogni versamento scala dal residuo. Restano " + euro(residuo) + ".</p>";
      h += '<label for="imp-libero">Quanto volete versare</label>';
      h += '<input id="imp-libero" type="number" min="10" step="10" inputmode="decimal" placeholder="100">';
      h += '<button class="chiaro" id="paga-libero">Versa ora</button><div id="msg-libero"></div>';
    }

    h += '<div class="nota">Per cambiare il modo in cui pagate, scrivete agli organizzatori.</div>';
    h += '<p style="font-size:15px;color:#5B6672;">Questo indirizzo è personale: chi ce l\'ha vede il vostro piano. Non giratelo fuori dal gruppo.</p>';

    h += '<div class="salva" id="salva">'
      + '<b>Tenete questa pagina a portata di mano</b>'
      + "<p>E la vostra prenotazione: da qui si paga e si vede a che punto siamo. "
      + 'Il collegamento e anche nella mail che vi abbiamo mandato.</p>'
      + '<div class="salva-come" id="salva-come"></div>'
      + '<button id="salva-chiudi">Ho capito</button>'
      + "</div>";

    app.innerHTML = h;

    // Come si salva cambia da telefono a telefono: si dice quello giusto.
    var boxSalva = document.getElementById("salva");
    if (boxSalva) {
      if (localStorage.getItem("salva-visto") === "1") {
        boxSalva.remove();
      } else {
        var ua = navigator.userAgent || "";
        var come = document.getElementById("salva-come");
        if (come) {
          if (/iPhone|iPad|iPod/i.test(ua)) {
            come.innerHTML = "Toccate <b>Condividi</b> in basso, poi <b>Aggiungi a Home</b>.";
          } else if (/Android/i.test(ua)) {
            come.innerHTML = "Toccate i <b>tre puntini</b> in alto, poi <b>Aggiungi a schermata Home</b>.";
          } else {
            come.innerHTML = "Salvatela nei preferiti con <b>Ctrl+D</b>, o <b>Cmd+D</b> su Mac.";
          }
        }
        var bc = document.getElementById("salva-chiudi");
        if (bc) bc.addEventListener("click", function () {
          try { localStorage.setItem("salva-visto", "1"); } catch (e) {}
          boxSalva.remove();
        });
      }
    }

    var cop = document.getElementById("cop");
    if (cop) {
      if (d.viaggio.copertina) cop.src = d.viaggio.copertina;
      else cop.remove();
    }

    var bRata = document.getElementById("paga-rata");
    if (bRata) bRata.addEventListener("click", function () {
      paga({ rata_id: prossima.id }, bRata, document.getElementById("msg-rata"));
    });

    var bLib = document.getElementById("paga-libero");
    if (bLib) bLib.addEventListener("click", function () {
      var box = document.getElementById("msg-libero");
      var imp = Number((document.getElementById("imp-libero") || {}).value || 0);
      if (!(imp > 0)) { box.className = "msg ko"; box.textContent = "Scrivete un importo."; return; }
      paga({ importo: imp }, bLib, box);
    });

    document.title = (d.nucleo || d.referente) + " — " + d.viaggio.titolo;
  });
})();
</script>
</body>
</html>
