<!doctype html>
<html lang="it">
<head>

<title>La vostra prenotazione · Pranzo di Natale 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Josefin+Sans:wght@400;600&display=swap">

<style>:root.campo{--f-disp:'Bodoni Moda',Georgia,serif;--f-acc:'Great Vibes','Brush Script MT',cursive;--f-body:'Montserrat','Helvetica Neue',Arial,sans-serif}:root.campo .pren .acc{font-style:normal}</style>

</head>
<body class="pren">
<div class="wrap" id="root"><div class="testa"><div class="kicker">🎄 Pranzo di Natale</div><p style="margin-top:18px;color:var(--muto)">Carico la vostra prenotazione…</p></div></div>
<div class="cookie" id="cookie" hidden><span>Usiamo i cookie</span><button type="button" id="ck-no">Rifiuta</button><button type="button" id="ck-si">Accetta</button></div>
<script src="natale-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="natale-tracking.js"></script>
<script>
(function(){
  var URL_ = "https://cuhcscpvhypoaplcmtjk.supabase.co", ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1aGNzY3B2aHlwb2FwbGNtdGprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4MjY4MjgsImV4cCI6MjA3OTQwMjgyOH0.q9zAs0oh8F1-whtORHBIORF5jIn1NTS3LvSMWleP0a0";
  var N = window.NATALE || {};
  var LOCALI = {"4a936e52-a1e3-42fc-843c-e8d15dc86040": {"nome": "Trattoria dell’Aquila", "ind": "Via Lazio 4/b, Orte (VT)", "tel": "0761 402673", "tl": "0761402673", "maps": "https://www.google.com/maps/search/?api=1&query=Trattoria+dell%27Aquila+Via+Lazio+4%2Fb+Orte+VT"}, "c40919bb-78c2-458f-865e-0c9fd02aa0b5": {"nome": "Campo Antico", "ind": "Via Amerina km 5,500, Orte (VT)", "tel": "0761 402380", "tl": "0761402380", "maps": "https://www.google.com/maps/search/?api=1&query=Campo+Antico+Via+Amerina+km+5%2C500+Orte+VT"}};
  var qs = new URLSearchParams(location.search), token = qs.get("t") || "", esitoQ = qs.get("esito");
  var $ = function(id){ return document.getElementById(id); }, root = $("root");
  var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
  var euro = function(n){ return Number(n).toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €"; };
  var supa = null; try { supa = window.supabase.createClient(URL_, ANON); } catch (e) {}
  var p = null, tentativi = 0, timer = null;

  function errore(titolo, testo){ root.innerHTML = '<div class="testa"><div class="kicker">🎄 Pranzo di Natale</div></div><div class="esito ko"><h2>' + esc(titolo) + '</h2><p>' + esc(testo) + '</p></div>'; }
  async function carica(){
    if (!supa || !token) return errore("Prenotazione non trovata", "Il link potrebbe essere incompleto. Chiamaci e la ritroviamo subito.");
    var r = await supa.rpc("prenotazione_pubblica", { p_token: token });
    if (!r.data || !r.data.ok) return errore("Prenotazione non trovata", "Il link potrebbe essere incompleto. Chiamaci e la ritroviamo subito.");
    p = r.data.prenotazione;
    disegna();
    var pagato = p.stato_pagamento === "pagato";
    if (pagato) { var s = false; try { s = localStorage.getItem("rf_acq_" + token) === "1"; } catch (e) {}
      if (!s) { try { localStorage.setItem("rf_acq_" + token, "1"); } catch (e) {} if (window.rfEvento) rfEvento("Purchase", { value: Number(p.acconto_importo || 0), currency: "EUR", content_name: p.tag || "natale-2026", num_items: Number(p.coperti) || 1 }, true); } }
    // appena tornati dal pagamento la conferma puo' metterci qualche secondo ad arrivare
    if (!pagato && esitoQ === "ok" && tentativi++ < 10) setTimeout(carica, 3000);
  }
  function persone(){ var b = Number(p.bambini) || 0, a = Math.max((Number(p.coperti) || 1) - b, 0); return { a: a, b: b }; }
  function totale(){ var x = persone(); return (N.prezzo || 0) * x.a + (N.prezzo_bimbi || 0) * x.b; }
  function disegna(){
    var L = LOCALI[p.sede_id] || LOCALI["4a936e52-a1e3-42fc-843c-e8d15dc86040"], x = persone();
    if (p.sede_id === "c40919bb-78c2-458f-865e-0c9fd02aa0b5") document.documentElement.classList.add("campo");
    var pagato = p.stato_pagamento === "pagato", ora = String(p.ora || "").slice(0, 5);
    var h = '<div class="testa"><div class="kicker">🎄 Pranzo di Natale</div><div class="acc">Venerdì 25 dicembre</div><h1>La vostra prenotazione</h1></div>';
    if (pagato) h += '<div class="esito ok"><h2>✓ Tavolo confermato</h2><p>Abbiamo ricevuto l’acconto. Vi aspettiamo il 25 dicembre: qui sotto trovate tutto.</p></div>';
    else if (esitoQ === "ok") h += '<div class="esito att"><h2>Stiamo confermando il pagamento…</h2><p>Ci vogliono pochi secondi: non chiudete la pagina.</p></div>';
    else h += '<div class="esito ko"><h2>Acconto non ancora pagato</h2><p>Il tavolo non è ancora bloccato. Potete pagare l’acconto qui sotto, oppure chiamarci.</p></div>';
    h += '<div class="card"><h3>Il vostro tavolo</h3>'
      + '<div class="riga"><span>Quando</span><b>Venerdì 25 dicembre 2026<br>ore ' + esc(ora) + '</b></div>'
      + '<div class="riga"><span>Dove</span><b>' + esc(L.nome) + '<br>' + esc(L.ind) + '</b></div>'
      + '<div class="riga"><span>Ospiti</span><b>' + x.a + (x.a === 1 ? " adulto" : " adulti") + (x.b ? " + " + x.b + (x.b === 1 ? " bambino" : " bambini") : "") + '</b></div>'
      + '<div class="riga"><span>A nome di</span><b>' + esc(((p.cliente_nome || "") + " " + (p.cognome || "")).trim()) + '</b></div>'
      + (N.prezzo ? '<div class="riga"><span>Totale del pranzo</span><b>' + euro(totale()) + '</b></div>' : '')
      + (pagato && p.acconto_importo ? '<div class="riga"><span>Acconto pagato</span><b>' + euro(p.acconto_importo) + '</b></div>' + (N.prezzo ? '<div class="riga"><span>Da saldare il 25 dicembre</span><b>' + euro(Math.max(totale() - Number(p.acconto_importo), 0)) + '</b></div>' : '') : '')
      + (p.richieste_speciali || p.note ? '<div class="riga"><span>Segnalazioni</span><b>' + esc(p.richieste_speciali || p.note) + '</b></div>' : '')
      + '</div>';
    if (pagato) h += '<div class="card"><h3>Mancano</h3><div class="conta"><div><b id="cg">–</b><small>giorni</small></div><div><b id="co">–</b><small>ore</small></div><div><b id="cm">–</b><small>minuti</small></div><div><b id="cs">–</b><small>secondi</small></div></div></div>';
    h += '<div class="card"><h3>Cosa fare ora</h3><div class="azioni">'
      + (!pagato ? '<button class="btn" id="paga" type="button">Paga l’acconto</button>' : '')
      + (pagato ? '<button class="btn" id="cal" type="button">Aggiungi al calendario</button>' : '')
      + '<a class="btn" target="_blank" rel="noopener" href="' + esc(L.maps) + '">Come arrivare</a>'
      + '<a class="btn" href="tel:' + esc(L.tl) + '">Chiamaci · ' + esc(L.tel) + '</a></div>'
      + '<p style="margin-top:14px;color:var(--muto);font-size:15px">Per aggiungere ospiti, cambiare l’orario o mandarci allergie, chiamateci: ci pensiamo noi.</p>'
      + (N.disdetta ? '<p style="color:var(--muto);font-size:15px"><b>Disdetta:</b> ' + esc(N.disdetta) + '</p>' : '') + '</div>';
    root.innerHTML = h;
    if ($("paga")) $("paga").onclick = paga;
    if ($("cal")) $("cal").onclick = function(){ calendario(L, ora); };
    if (pagato) conto(ora);
  }
  function conto(ora){
    var fine = new Date("2026-12-25T" + (ora || "12:30") + ":00+01:00").getTime();
    if (timer) clearInterval(timer);
    var giro = function(){ var d = Math.max(fine - Date.now(), 0), s = Math.floor(d / 1000);
      if ($("cg")) { $("cg").textContent = Math.floor(s / 86400); $("co").textContent = Math.floor(s % 86400 / 3600); $("cm").textContent = Math.floor(s % 3600 / 60); $("cs").textContent = s % 60; } };
    giro(); timer = setInterval(giro, 1000);
  }
  async function paga(){
    var b = $("paga"); b.disabled = true; b.textContent = "Un attimo…";
    var acconto = Math.round(totale() * (N.perc || 30));
    if (!acconto) { b.disabled = false; b.textContent = "Paga l’acconto"; return alert("L’importo non è ancora pronto: chiamaci e ti aiutiamo."); }
    var x = persone(), L = LOCALI[p.sede_id] || {};
    try {
      var res = await fetch(URL_ + "/functions/v1/stripe-checkout", { method: "POST", headers: { "Content-Type": "application/json", "apikey": ANON, "Authorization": "Bearer " + ANON },
        body: JSON.stringify({ action: "create_session", azienda_id: p.azienda_id, tipo: "tavolo", riferimento_id: p.id, importo_centesimi: acconto,
          descrizione: "Acconto " + (N.perc || 30) + "% · Pranzo di Natale · " + (L.nome || "") + " · 25/12/2026 · " + x.a + (x.a === 1 ? " adulto" : " adulti") + (x.b ? " + " + x.b + (x.b === 1 ? " bambino" : " bambini") : ""),
          cliente_nome: ((p.cliente_nome || "") + " " + (p.cognome || "")).trim(),
          success_url: location.origin + location.pathname + "?t=" + token + "&esito=ok", cancel_url: location.origin + location.pathname + "?t=" + token + "&esito=annullato",
          metadata: { landing: p.tag || "natale-2026", adulti: String(x.a), bambini: String(x.b) } }) });
      var out = await res.json();
      if (!res.ok || !out.checkout_url) throw new Error(out.error || "checkout");
      location.href = out.checkout_url;
    } catch (e) { b.disabled = false; b.textContent = "Paga l’acconto"; alert("Il pagamento non è partito: riprova o chiamaci."); }
  }
  function calendario(L, ora){
    var ini = "20261225T" + (ora || "12:30").replace(":", "") + "00", h = parseInt((ora || "12:30").slice(0, 2), 10) + 3;
    var fin = "20261225T" + String(Math.min(h, 23)).padStart(2, "0") + (ora || "12:30").slice(3, 5) + "00";
    var ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Ristoflow//Natale//IT","BEGIN:VEVENT","UID:natale-" + token + "@ristoflow-ai.com","DTSTAMP:20261001T000000Z",
      "DTSTART;TZID=Europe/Rome:" + ini, "DTEND;TZID=Europe/Rome:" + fin, "SUMMARY:Pranzo di Natale · " + L.nome, "LOCATION:" + L.nome + ", " + L.ind, "END:VEVENT","END:VCALENDAR"].join("\r\n");
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" })); a.download = "pranzo-di-natale-2026.ics"; document.body.appendChild(a); a.click(); a.remove();
  }
  carica();
})();
</script>
