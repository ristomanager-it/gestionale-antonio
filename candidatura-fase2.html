  mentalita_proprietario: ['non era richiesto','nessuno me lo aveva chiesto','dopo il turno','ho voluto capire','per passione','ho fatto in più'],
  curiosita: ['imparato da solo','volevo capire','per curiosità','ho approfondito','ho ricercato'],

const KW_NEG = {

function scoraRisposta(testo) {
  const t = (testo||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/['']/g,"'");
  const scores = {};
  for (const [k,kws] of Object.entries(KW_POS)) { let p=0; for (const kw of kws) if(t.includes(kw)) p+=2; scores[k]=(scores[k]||0)+p; }
  for (const [k,kws] of Object.entries(KW_NEG)) { for (const kw of kws) if(t.includes(kw)) scores[k]=(scores[k]||0)-2; }
  const parole = testo.trim().split(/\s+/).length;
  for (const k of Object.keys(scores)) { if(parole>80) scores[k]+=2; else if(parole>40) scores[k]+=1; else if(parole<15) scores[k]-=1; scores[k]=Math.max(0,Math.min(10,scores[k])); }
  return scores;
}


// Applica brand dal DB usando il token
async function applyBrand(aziendaId) {
  if (!aziendaId) return;
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/aziende?id=eq.${aziendaId}&select=colore_primario,colore_secondario`, {
      headers: {'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}`}
    });
    const data = await r.json();
    const az = data?.[0];
    if (!az) return;
    const root = document.documentElement;
    if (az.colore_primario)   root.style.setProperty('--c-primary', az.colore_primario);
    if (az.colore_secondario) root.style.setProperty('--c-secondary', az.colore_secondario);
    if (az.colore_primario)   root.style.setProperty('--c-primary-dark', az.colore_primario + 'dd');
    if (az.colore_primario)   root.style.setProperty('--c-primary-light', az.colore_primario + '15');
  } catch(e) {}
}

function sel(btn, gId, hId) {
  document.querySelectorAll('#'+gId+' .scelta-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  document.getElementById(hId).value = btn.dataset.v;
}
function cc(ta, cc) {
  const n = (document.getElementById(ta)?.value.trim()||'').split(/\s+/).filter(Boolean).length;
  document.getElementById(cc).textContent = n + (n===1?' parola':' parole');
}
function nP(id) { return (document.getElementById(id)?.value.trim()||'').split(/\s+/).filter(Boolean).length; }
function err(id, v) { document.getElementById(id)?.classList.toggle('v', v); }

function valida(s) {
  let ok = true;
  if (s===0) {
    const int=document.getElementById('v-interesse')?.value; err('e-interesse',!int); if(!int) ok=false;
    const c1=nP('r-c1'); err('e-c1',c1<20); if(c1<20) ok=false;
    const c2=nP('r-c2'); err('e-c2',c2<15); if(c2<15) ok=false;
    const c3=nP('r-c3'); err('e-c3',c3<15); if(c3<15) ok=false;
  }
  if (s===1) {
    const lav=document.getElementById('v-lavoro')?.value; err('e-lavoro',!lav); if(!lav) ok=false;
    const p1=nP('r-p1'); err('e-p1',p1<15); if(p1<15) ok=false;
    const p2=nP('r-p2'); err('e-p2',p2<20); if(p2<20) ok=false;
  }
  if (s===2) {
    const r1=nP('r-r1'); err('e-r1',r1<15); if(r1<15) ok=false;
    const r2=nP('r-r2'); err('e-r2',r2<20); if(r2<20) ok=false;
    const fr=document.getElementById('v-frase')?.value; err('e-frase',!fr); if(!fr) ok=false;
  }
  if (s===3) {
    const a1=nP('r-a1'); err('e-a1',a1<20); if(a1<20) ok=false;
    const pref=document.getElementById('v-pref')?.value; err('e-pref',!pref); if(!pref) ok=false;
    const a3=nP('r-a3'); err('e-a3',a3<20); if(a3<20) ok=false;
  }
  return ok;
}

function vai(n) {
  document.getElementById('s'+step).classList.remove('attiva');
  step = n;
  document.getElementById('s'+step).classList.add('attiva');
  for(let i=0;i<4;i++){const d=document.getElementById('d'+i);d.className='step-dot';if(i<step)d.classList.add('done');else if(i===step)d.classList.add('on');}
  document.getElementById('slbl').textContent=`Sezione ${step+1} di 4`;
  window.scrollTo({top:0,behavior:'smooth'});
}
function avanti(n) { if(!valida(n)) return; vai(n+1); }

    {domanda_id:'collega_fastidioso',        domanda_testo:'Caratteristica che ti infastidisce in un collega.',                     risposta: g('r-r1')},
    {domanda_id:'critica_utile',             domanda_testo:'La critica più utile ricevuta.',                                        risposta: g('r-r2')},
    {domanda_id:'frase_che_rappresenta',     domanda_testo:'La frase che ti rappresenta.',                                          risposta: g('v-frase')},
    {domanda_id:'successo_definizione',      domanda_testo:'Cosa significa avere successo nel lavoro.',                             risposta: g('r-a1')},
    {domanda_id:'responsabilita_vs_tranq',   domanda_testo:'Preferisci responsabilità o tranquillità.',                             risposta: g('v-pref')+' — '+g('r-a2')},
    {domanda_id:'obiettivo_professionale',   domanda_testo:'Obiettivo professionale più importante.',                               risposta: g('r-a3')},
  ];

  // Calcola punteggi aggiornati
  let scoreAgg = {};
  for (const r of risposte) {
    const s = scoraRisposta(r.risposta);
    for (const [k,v] of Object.entries(s)) scoreAgg[k] = (scoreAgg[k]||0) + v;
  }
  const nR = risposte.length;
  const pesi = {mentalita_proprietario:1.5,curiosita:1,crescita:1,responsabilita:1,mentalita_positiva:1,pressione:1,leadership:1};
  const totP = Object.values(pesi).reduce((a,b)=>a+b,0);
  let sp = 0;
  for (const [k,p] of Object.entries(pesi)) sp += ((scoreAgg[k]||0)/nR) * p;
  const scoreF2 = Math.round((sp/totP)*10*10)/10;

  try {
    // Salva risposte
    const rDB = risposte.map(r => ({ candidatura_id: cand.id, fase: 2, domanda_id: r.domanda_id, domanda_testo: r.domanda_testo, risposta: r.risposta, score_totale_risposta: Object.values(scoraRisposta(r.risposta)).reduce((a,b)=>a+b,0)/7 }));
    await fetch(`${SUPABASE_URL}/rest/v1/candidature_risposte`, { method:'POST', headers:{'apikey':ANON_KEY,'Authorization':`Bearer ${ANON_KEY}`,'Content-Type':'application/json'}, body:JSON.stringify(rDB) });

    // Avanza fase e aggiorna score
    const newScore = ((cand.score_totale||0) + scoreF2) / 2;
    await fetch(`${SUPABASE_URL}/rest/v1/candidature?id=eq.${cand.id}`, { method:'PATCH', headers:{'apikey':ANON_KEY,'Authorization':`Bearer ${ANON_KEY}`,'Content-Type':'application/json'}, body:JSON.stringify({ fase_attuale: 3, fase_label: 'Fase 2 completata', score_totale: Math.round(newScore*10)/10, updated_at: new Date().toISOString() }) });

    // Log fase
    await fetch(`${SUPABASE_URL}/rest/v1/candidature_fasi_log`, { method:'POST', headers:{'apikey':ANON_KEY,'Authorization':`Bearer ${ANON_KEY}`,'Content-Type':'application/json'}, body:JSON.stringify({ candidatura_id: cand.id, fase_da: 2, fase_a: 3, fase_label: 'Fase 2 completata' }) });

    document.getElementById('root').innerHTML = `
      <div class="hero"><div style="font-size:40px;margin-bottom:12px;">🎉</div><div class="hero-titolo">Questionario completato!</div><div class="hero-sub">Grazie ${cand.nome}. Valuteremo le tue risposte con attenzione.</div></div>
      <div class="wrap"><div class="card" style="text-align:center;padding:40px 24px;">
        <div style="font-size:48px;margin-bottom:16px;">✅</div>
        <div style="font-size:18px;font-weight:700;margin-bottom:12px;">Ottimo lavoro!</div>
        <div style="font-size:14px;color:#374151;line-height:1.8;">Abbiamo ricevuto le tue risposte.<br>Ti contatteremo via WhatsApp per i prossimi aggiornamenti.<br><br><strong>Grazie per la tua sincerità.</strong></div>
      </div></div>`;
  } catch(e) {
    const el = document.getElementById('err-invio');
    el.textContent='Errore durante l\'invio. Riprova.'; el.style.display='block';
    btn.disabled=false; btn.textContent='Invia ✅';
  }
}
init();
</script>
</body>
</html>
