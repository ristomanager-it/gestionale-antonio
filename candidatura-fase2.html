<!DOCTYPE html>
<html lang="it">
<head>
  <!-- rf-senza-contatore: pagina privata del candidato, raggiungibile solo dal link personale -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questionario approfondito — Ristoflow</title>
  <style>
    :root {
      --c-primary:   #0E5A7A;
      --c-secondary: #1a8fb5;
      --c-primary-light: #f0f9ff;
      --c-primary-dark:  #0c4f6b;
    }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; color: #0f172a; min-height: 100vh; }
    .hero { background: linear-gradient(135deg, #0E5A7A 0%, #1a8fb5 100%); padding: 40px 24px 32px; text-align: center; color: white; }
    .hero-titolo { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .hero-sub { font-size: 14px; opacity: .85; line-height: 1.5; }
    .wrap { max-width: 640px; margin: 24px auto 48px; padding: 0 16px; }
    .card { background: white; border-radius: 16px; padding: 28px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .sezione-titolo { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 20px; }
    .domanda { background: #f8fafc; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
    .domanda-testo { font-size: 15px; font-weight: 600; color: #0f172a; line-height: 1.5; margin-bottom: 8px; }
    .domanda-hint { font-size: 12px; color: #64748b; margin-bottom: 10px; font-style: italic; }
    .scelta-griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; margin-top: 8px; }
    .scelta-btn { border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 10px 14px; cursor: pointer; font-size: 13px; font-weight: 500; color: #374151; background: white; transition: all .15s; text-align: left; }
    .scelta-btn:hover { border-color: var(--c-primary); color: var(--c-primary); }
    .scelta-btn.sel { border-color: var(--c-primary); background: var(--c-primary); color: white; }
    textarea, input[type="text"] { width: 100%; padding: 10px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 14px; font-family: inherit; outline: none; transition: border .2s; resize: vertical; min-height: 110px; line-height: 1.6; }
    textarea:focus, input:focus { border-color: var(--c-primary); box-shadow: 0 0 0 3px rgba(14,90,122,.1); }
    .char-count { font-size: 11px; color: #94a3b8; text-align: right; margin-top: 3px; }
    .errore { color: #dc2626; font-size: 12px; margin-top: 4px; display: none; }
    .errore.v { display: block; }
    .step-bar { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 20px; }
    .step-dot { width: 9px; height: 9px; border-radius: 50%; background: #e2e8f0; transition: all .3s; }
    .step-dot.on { background: var(--c-primary); transform: scale(1.3); }
    .step-dot.done { background: #25D366; }
    .step-lbl { font-size: 12px; color: #94a3b8; margin-left: 4px; }
    .sezione { display: none; }
    .sezione.attiva { display: block; }
    .btn-nav { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .btn-avanti { background: var(--c-primary); color: white; border: none; border-radius: 12px; padding: 13px 28px; font-size: 15px; font-weight: 700; cursor: pointer; flex: 1; max-width: 200px; }
    .btn-avanti:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-back { background: #f1f5f9; color: #374151; border: none; border-radius: 12px; padding: 13px 20px; font-size: 15px; cursor: pointer; }
    .loading { text-align: center; padding: 60px 20px; color: #64748b; }
    .scadenza-box { background: #fef3c7; border: 1px solid #fde68a; border-radius: 10px; padding: 12px 16px; font-size: 13px; color: #92400e; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    @media(max-width:480px) { .hero { padding: 28px 16px; } .card { padding: 18px; } }
  </style>
</head>
<body>
<div id="root"><div class="loading">⏳ Verifica accesso...</div></div>
<script>
// FASE 2 — "Raccontaci una volta che..."
// Fatti veri, non esame: vale per tutti i ruoli, anche chi non ha esperienza.
// Le domande tecniche di mestiere stanno nel colloquio (le prepara Tony nella relazione finale).
const SUPABASE_URL = 'https://cuhcscpvhypoaplcmtjk.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1aGNzY3B2aHlwb2FwbGNtdGprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4MjY4MjgsImV4cCI6MjA3OTQwMjgyOH0.q9zAs0oh8F1-whtORHBIORF5jIn1NTS3LvSMWleP0a0';
const H = {'apikey':ANON_KEY,'Authorization':`Bearer ${ANON_KEY}`,'Content-Type':'application/json'};
const params = new URLSearchParams(window.location.search);
const TOKEN = params.get('t');
const MIN_PAROLE = 12;
let cand = null, step = 0;

// 8 domande in 4 sezioni da 2
const SEZIONI = [
  { titolo: '👥 Con chi lavori sopra di te', domande: [
    { id:'capo_critica',   titolo:'Il capo',          testo:'Raccontaci una volta che un responsabile, un insegnante o un allenatore ti ha detto qualcosa che non ti è piaciuto. Cosa ti ha detto e cosa hai fatto dopo?' },
    { id:'disaccordo',     titolo:'Il disaccordo',    testo:'Raccontaci una volta che non eri d\'accordo con una decisione presa da altri. Come è andata a finire?' },
  ]},
  { titolo: '🤝 Con chi lavori accanto', domande: [
    { id:'nuovo_arrivato', titolo:'Il nuovo arrivato', testo:'Raccontaci una volta che hai aiutato qualcuno appena arrivato, oppure qualcuno ha aiutato te. Cosa è successo?' },
    { id:'persona_difficile', titolo:'La persona difficile', testo:'Raccontaci una volta che hai dovuto lavorare o stare con qualcuno che non sopportavi. Come avete fatto?' },
  ]},
  { titolo: '✨ Per chi lavori', domande: [
    { id:'persona_contenta', titolo:'La persona contenta', testo:'Raccontaci una volta che qualcuno (un cliente, un ospite, un familiare) è rimasto contento grazie a qualcosa che hai fatto tu. Cosa avevi fatto?' },
    { id:'dettaglio',      titolo:'Il dettaglio',     testo:'Raccontaci una volta che hai notato una cosa che gli altri non vedevano. Cos\'era e cosa hai fatto?' },
  ]},
  { titolo: '💪 Chi sei', domande: [
    { id:'parola_data',    titolo:'La parola data',   testo:'Raccontaci una volta che hai mantenuto un impegno anche se ti costava fatica. Cosa ti ha spinto?' },
    { id:'orgoglio',       titolo:'L\'orgoglio',      testo:'Qual è la cosa che hai fatto di cui vai più fiero? Perché proprio quella?' },
  ]},
];
const NS = SEZIONI.length;

async function applyBrand(aziendaId) {
  if (!aziendaId) return;
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/aziende?id=eq.${aziendaId}&select=colore_primario,colore_secondario`, { headers: H });
    const az = (await r.json())?.[0];
    if (!az) return;
    const root = document.documentElement;
    if (az.colore_primario) { root.style.setProperty('--c-primary', az.colore_primario); root.style.setProperty('--c-primary-dark', az.colore_primario + 'dd'); root.style.setProperty('--c-primary-light', az.colore_primario + '15'); }
    if (az.colore_secondario) root.style.setProperty('--c-secondary', az.colore_secondario);
  } catch(e) {}
}

async function init() {
  const root = document.getElementById('root');
  if (!TOKEN) { root.innerHTML = '<div class="loading">⚠️ Link non valido.</div>'; return; }
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/candidatura_per_token`, { method:'POST', headers:H, body: JSON.stringify({ p_token: TOKEN }) });
  const data = await res.json();
  cand = (data && data.id) ? data : null;
  if (cand?.azienda_id) await applyBrand(cand.azienda_id);
  if (!cand) { root.innerHTML = '<div class="loading">⚠️ Link non trovato. Controlla di aver copiato il link correttamente.</div>'; return; }
  if (cand.fase_attuale >= 3) { root.innerHTML = '<div class="loading">✅ Hai già completato questa fase. Grazie!</div>'; return; }
  renderForm();
}

function esc(s) { return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderForm() {
  const scadStr = cand.scadenza_fase2 ? new Date(cand.scadenza_fase2).toLocaleString('it-IT') : null;
  const dots = SEZIONI.map((_,i) => `<div class="step-dot${i===0?' on':''}" id="d${i}"></div>`).join('');
  const sezioni = SEZIONI.map((s,i) => `
      <div class="sezione card${i===0?' attiva':''}" id="s${i}">
        <div class="sezione-titolo">${s.titolo}</div>
        ${s.domande.map(d => `
        <div class="domanda">
          <div class="domanda-hint">${esc(d.titolo)}</div>
          <div class="domanda-testo">${esc(d.testo)}</div>
          <textarea id="r-${d.id}" oninput="cc('${d.id}')" placeholder="Racconta cosa è successo, cosa hai fatto tu, come è finita..."></textarea>
          <div class="char-count" id="cc-${d.id}">0 parole</div>
          <div class="errore" id="e-${d.id}">Raccontaci un po' di più (almeno ${MIN_PAROLE} parole)</div>
        </div>`).join('')}
        ${i===NS-1 ? '<div id="err-invio" style="color:#dc2626;font-size:13px;margin-bottom:10px;display:none;"></div>' : ''}
        <div class="btn-nav">
          ${i>0 ? `<button class="btn-back" onclick="vai(${i-1})">← Indietro</button>` : ''}
          ${i<NS-1 ? `<button class="btn-avanti" onclick="avanti(${i})">Continua →</button>` : `<button class="btn-avanti" id="btn-invia" onclick="invia()">Invia ✅</button>`}
        </div>
      </div>`).join('');

  document.getElementById('root').innerHTML = `
    <div class="hero">
      <div style="font-size:13px;opacity:.75;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">Fase 2</div>
      <div class="hero-titolo">Ciao ${esc(cand.nome)}! 👋</div>
      
    </div>
    <div class="wrap">
      ${scadStr ? `<div class="scadenza-box">⏰ Hai tempo fino al <strong>${scadStr}</strong> per completare questa fase.</div>` : ''}
      <div class="step-bar">${dots}<span class="step-lbl" id="slbl">Sezione 1 di ${NS}</span></div>
      ${sezioni}
    </div>`;
}

function nP(id) { return (document.getElementById('r-'+id)?.value.trim()||'').split(/\s+/).filter(Boolean).length; }
function cc(id) { const n = nP(id); document.getElementById('cc-'+id).textContent = n + (n===1?' parola':' parole'); }
function valida(s) {
  let ok = true;
  for (const d of SEZIONI[s].domande) { const bad = nP(d.id) < MIN_PAROLE; document.getElementById('e-'+d.id).classList.toggle('v', bad); if (bad) ok = false; }
  return ok;
}
function vai(n) {
  document.getElementById('s'+step).classList.remove('attiva');
  step = n;
  document.getElementById('s'+step).classList.add('attiva');
  for (let i=0;i<NS;i++){ const d=document.getElementById('d'+i); d.className='step-dot'; if(i<step) d.classList.add('done'); else if(i===step) d.classList.add('on'); }
  document.getElementById('slbl').textContent = `Sezione ${step+1} di ${NS}`;
  window.scrollTo({top:0,behavior:'smooth'});
}
function avanti(n) { if (!valida(n)) return; vai(n+1); }

async function invia() {
  if (!valida(NS-1)) return;
  const btn = document.getElementById('btn-invia');
  btn.disabled = true; btn.textContent = 'Invio...';
  const righe = [];
  for (const s of SEZIONI) for (const d of s.domande)
    righe.push({ candidatura_id: cand.id, fase: 2, domanda_id: d.id, domanda_testo: d.testo, risposta: document.getElementById('r-'+d.id).value.trim() });
  try {
    const r1 = await fetch(`${SUPABASE_URL}/rest/v1/candidature_risposte`, { method:'POST', headers:H, body: JSON.stringify(righe) });
    if (!r1.ok) throw new Error('salvataggio risposte ' + r1.status);
    // il punteggio lo tiene Tony: qui non si ricalcola
    await fetch(`${SUPABASE_URL}/rest/v1/rpc/candidatura_completa_fase`, { method:'POST', headers:H, body: JSON.stringify({ p_token: TOKEN, p_fase: 2, p_score: cand.score_totale || 0 }) });
    await fetch(`${SUPABASE_URL}/rest/v1/candidature_fasi_log`, { method:'POST', headers:H, body: JSON.stringify({ candidatura_id: cand.id, fase_da: 2, fase_a: 3, fase_label: 'Fase 2 completata' }) });
    // Tony aggiorna la relazione finale (non blocca il candidato)
    fetch(`${SUPABASE_URL}/functions/v1/candidatura-relazione`, { method:'POST', headers:H, body: JSON.stringify({ candidatura_id: cand.id }), keepalive: true }).catch(()=>{});
    document.getElementById('root').innerHTML = `
      <div class="hero"><div style="font-size:40px;margin-bottom:12px;">🎉</div><div class="hero-titolo">Grazie ${esc(cand.nome)}!</div><div class="hero-sub">Abbiamo ricevuto i tuoi racconti.</div></div>
      <div class="wrap"><div class="card" style="text-align:center;padding:40px 24px;">
        <div style="font-size:48px;margin-bottom:16px;">✅</div>
        <div style="font-size:14px;color:#374151;line-height:1.8;">Li leggeremo con attenzione.<br>Ti scriveremo su WhatsApp per il prossimo passo.</div>
      </div></div>`;
  } catch(e) {
    const el = document.getElementById('err-invio');
    el.textContent = 'Errore durante l\'invio. Riprova.'; el.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Invia ✅';
  }
}
init();
</script>
</body>
</html>
