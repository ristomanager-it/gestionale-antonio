<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La cena di stasera</title>
<meta name="theme-color" content="#24392E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cena">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#24392E; --carta:#FBFAF6; --linea:#E3E0D6;
  --testo:#1F2A24; --tenue:#66706A; --arancio:#D9772B; --ok:#2F6B47; --errore:#A93A2B;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--carta);color:var(--testo);font:16px/1.5 Jost,system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) calc(env(safe-area-inset-bottom,0px) + 96px) env(safe-area-inset-left,0px)}
button,input{font:inherit;color:inherit}
.testa{background:var(--verde);color:#F3EFE4;padding:28px 22px 26px}
.testa .dove{font-size:15px;opacity:.85}
.testa h1{font:600 40px/1.05 Cormorant,Georgia,serif;margin:6px 0 4px}
.testa .quando{font-size:16px;opacity:.9}
.lingua{float:right;background:none;border:1px solid rgba(243,239,228,.4);border-radius:20px;padding:4px 12px;font-size:14px;color:#F3EFE4;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:0 18px}
.avviso{margin:18px 0 0;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid var(--linea);font-size:15px}
h2{font:600 26px/1.15 Cormorant,Georgia,serif;margin:28px 0 10px}
.persone{display:flex;gap:8px;flex-wrap:wrap}
.persona{border:1.5px solid var(--linea);background:#fff;border-radius:24px;padding:9px 16px;font-size:16px;cursor:pointer;display:flex;align-items:center;gap:8px}
.persona[aria-pressed="true"]{border-color:var(--verde);background:var(--verde);color:#fff}
.persona .spunta{width:18px;height:18px;border-radius:50%;background:var(--ok);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.portata{margin-top:22px}
.portata h3{font:600 21px/1.2 Cormorant,Georgia,serif;margin:0 0 8px;color:var(--verde)}
.piatto{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--linea);border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer;font-size:16px}
.piatto .pallino{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid #B9B5A8}
.piatto[aria-checked="true"]{border-color:var(--verde);box-shadow:inset 0 0 0 1px var(--verde)}
.piatto[aria-checked="true"] .pallino{border-color:var(--verde);background:radial-gradient(var(--verde) 45%,transparent 50%)}
.modifica{display:block;margin:-2px 0 10px 14px;padding:10px 12px;border-left:3px solid var(--arancio);background:#FFF6EE;border-radius:0 10px 10px 0;font-size:14px;color:#7A4A1E}
.nota{display:block;width:100%;margin:6px 0 0;border:1.5px solid #E9C9A6;border-radius:10px;padding:10px 12px;font-size:15px;background:#fff}
.nessuno{font-size:14px;color:var(--tenue);background:none;border:0;padding:2px 0;cursor:pointer;text-decoration:underline}
.orari{display:flex;gap:8px;flex-wrap:wrap}
.orario{border:1.5px solid var(--linea);background:#fff;border-radius:10px;padding:10px 14px;font-size:16px;cursor:pointer;min-width:72px}
.orario[aria-checked="true"]{border-color:var(--verde);background:var(--verde);color:#fff}
label.campo{display:block;margin-top:14px;font-size:15px;color:var(--tenue)}
label.campo input{display:block;width:100%;margin-top:6px;border:1.5px solid var(--linea);border-radius:10px;padding:12px;background:#fff;font-size:16px;color:var(--testo)}
.riga2{display:flex;gap:10px}.riga2>label{flex:1}
.barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--linea);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.barra .dentro{max-width:560px;margin:0 auto}
.conferma{width:100%;border:0;border-radius:12px;background:var(--arancio);color:#fff;font-weight:600;font-size:17px;padding:15px;cursor:pointer}
.conferma:disabled{background:#C9C4B6;cursor:default}
.riepilogo{margin-top:22px;background:#fff;border:1px solid var(--linea);border-radius:12px;padding:12px 14px;font-size:15px}
.riepilogo .r{padding:6px 0;border-bottom:1px solid #F0EEE7}.riepilogo .r:last-child{border:0}
.errore{color:var(--errore);font-size:15px;margin:10px 0 0}
.mod{font-size:14px;color:var(--verde);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.salva{margin:26px 0 8px;padding:14px 16px;border-radius:12px;border:1px dashed #B9B5A8;font-size:15px;color:var(--tenue)}
.fatto{text-align:center;padding:30px 6px}
.fatto .icona{font-size:52px}
:focus-visible{outline:3px solid var(--arancio);outline-offset:2px}
.nascosto{display:none !important}
</style>
</head>
<body>
<header class="testa">
  <button class="lingua" id="lingua" type="button">English</button>
  <div class="dove" id="dove">&nbsp;</div>
  <h1 id="titolo">La cena di stasera</h1>
  <div class="quando" id="quando">&nbsp;</div>
</header>
<main id="app"><p class="avviso">Un momento…</p></main>
<div class="barra nascosto" id="barra"><div class="dentro">
  <button class="conferma" id="btn" type="button" disabled>Invia la cena</button>
</div></div>

<script>
// Pagina della cena per gli ospiti in mezza pensione (Hotel Aquila) e per i gruppi che cenano a Campo Antico.
// Legge il menu del giorno (menu "menu-del-giorno", si riempie da solo), nessun prezzo.
// Chi organizza scrive camera o gruppo, nome, cognome, telefono e quante persone; poi ogni persona sceglie
// al massimo un antipasto, un primo e un secondo, con una nota per piatto. Si invia tutto insieme come ordine
// di mezza pensione: arriva il riepilogo su WhatsApp da confermare e, confermato, diventa comanda in sala.
(function(){
var MENU_API = "https://cuhcscpvhypoaplcmtjk.supabase.co/functions/v1/Menu-pubblico-api-index";
var ORDINI_API = "https://cuhcscpvhypoaplcmtjk.supabase.co/functions/v1/Ordini-menu-pubblico-api-index";
var q = new URLSearchParams(location.search);
var SLUG = q.get("menu") || "menu-del-giorno";
var DOVE = { "aquila": "Hotel Aquila", "campo-antico": "Campo Antico", "trattoria": "Trattoria dell'Aquila" };
// ?dove=trattoria: menu business per tutti (preordine, prezzo fisso a persona, si paga al locale).
// Gli altri link sono per la mezza pensione: solo i piatti, nessun prezzo.
var BUSINESS = q.get("dove") === "trattoria";
var dove = DOVE[q.get("dove")] || q.get("dove") || "";
var ORARI = (q.get("orari") || (BUSINESS ? "12:30,13:00,13:30,14:00,19:30,20:00,20:30,21:00" : "19:30,20:00,20:30,21:00,21:30")).split(",");
function euro(n){ return n.toFixed(2).replace(".", ",").replace(",00", "") + " €"; }
var PORTATE = [["Antipasti","antipasto"],["Primi","primo"],["Secondi","secondo"]];

var T = {
  it:{stasera:"La cena di stasera", domani:"La cena di domani", bizTit:"Menu business", inviaBiz:"Invia il preordine", bizSotto:"antipasto, primo, secondo, acqua e caffè", aPersona:"a persona",
      chiBiz:"Chi prenota", chiBizTesto:"Ti mandiamo il riepilogo su WhatsApp da confermare. Paghi al locale.", totale:"Totale", orarioBiz:"A che ora arrivate?",
      chi:"Chi organizza la cena", chiTesto:"Ti mandiamo il riepilogo su WhatsApp da confermare.",
      camera:"Camera o gruppo", nome:"Nome", cognome:"Cognome", tel:"Telefono", persone:"Quante persone", continua:"Continua",
      scegli:"Chi sta scegliendo?", persona:"Persona", nomeOpz:"Nome (facoltativo)", Antipasti:"Antipasto", Primi:"Primo", Secondi:"Secondo",
      senza:"Non lo prendo", nota:"Es. senza pecorino, ben cotta, sugo a parte", modTit:"Vuoi cambiare qualcosa in questo piatto?", orario:"A che ora cenate?", allergie:"Allergie o intolleranze",
      allergiePh:"Per esempio: noci, lattosio", invia:"Invia la cena", inviando:"Un attimo…", max:"Al massimo un antipasto, un primo e un secondo a persona.",
      manca:"Scegli almeno un piatto per ogni persona e l'orario.", menuNo:"Il menu non è ancora pubblicato. Torna più tardi.",
      riep:"Riepilogo", modifica:"Modifica i dati", fattoTit:"Controlla WhatsApp", fattoTesto:"Ti abbiamo mandato il riepilogo: tocca «Confermo» e lo prepariamo per l'orario scelto.",
      fattoNoWa:"Abbiamo ricevuto la cena. Se serve, ti contattiamo noi.", nuova:"Fai un'altra scelta", salvaTit:"Tieni questa pagina a portata di mano",
      salvaIos:"Tocca Condividi e poi «Aggiungi alla schermata Home».", salvaAnd:"Apri il menu ⋮ del browser e tocca «Aggiungi a schermata Home».", nessunPiatto:"nessun piatto"},
  en:{stasera:"Tonight's dinner", domani:"Tomorrow's dinner", bizTit:"Business menu", inviaBiz:"Send pre-order", bizSotto:"starter, first course, main, water and coffee", aPersona:"per person",
      chiBiz:"Who is booking", chiBizTesto:"We will send you the summary on WhatsApp to confirm. You pay at the restaurant.", totale:"Total", orarioBiz:"What time will you arrive?",
      chi:"Who is organising dinner", chiTesto:"We will send you the summary on WhatsApp to confirm.",
      camera:"Room or group", nome:"First name", cognome:"Last name", tel:"Phone", persone:"How many people", continua:"Continue",
      scegli:"Who is choosing?", persona:"Guest", nomeOpz:"Name (optional)", Antipasti:"Starter", Primi:"First course", Secondi:"Main course",
      senza:"I'll skip it", nota:"E.g. no cheese, well done, sauce on the side", modTit:"Want to change anything in this dish?", orario:"What time will you have dinner?", allergie:"Allergies or intolerances",
      allergiePh:"For example: nuts, lactose", invia:"Send dinner", inviando:"One moment…", max:"At most one starter, one first course and one main per person.",
      manca:"Choose at least one dish for each guest and the time.", menuNo:"The menu is not published yet. Please come back later.",
      riep:"Summary", modifica:"Edit details", fattoTit:"Check WhatsApp", fattoTesto:"We sent you the summary: tap «Confermo» and we will prepare it for the chosen time.",
      fattoNoWa:"We received your dinner. We will contact you if needed.", nuova:"Make another choice", salvaTit:"Keep this page at hand",
      salvaIos:"Tap Share, then “Add to Home Screen”.", salvaAnd:"Open the browser menu ⋮ and tap “Add to Home screen”.", nessunPiatto:"no dishes"}
};
var L = "it"; try { L = localStorage.getItem("cena_lingua") || ((navigator.language||"it").slice(0,2)==="it" ? "it" : "en"); } catch(e) {}
function t(k){ return T[L][k] || T.it[k] || k; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

var menu = null, piatti = { Antipasti: [], Primi: [], Secondi: [] };
var CHIAVE = BUSINESS ? "business_org" : "cena_org";
var org = {}; try { org = JSON.parse(localStorage.getItem(CHIAVE) || "{}"); } catch(e) {}
var fase = org.telefono ? "scelta" : "dati";
var ospiti = [], attivo = 0, ora = "", allergie = "", invio = false, esito = null;
var app = document.getElementById("app"), barra = document.getElementById("barra"), btn = document.getElementById("btn");

function preparaOspiti() {
  var n = Math.max(1, Math.min(12, parseInt(org.persone, 10) || 1));
  while (ospiti.length < n) ospiti.push({ nome: ospiti.length === 0 ? (org.nome || "") : "", scelte: {}, note: {} });
  ospiti.length = n;
  if (attivo >= n) attivo = 0;
}
function giornoTesto() {
  var adesso = new Date();
  var oggi = adesso.toLocaleDateString(L === "it" ? "it-IT" : "en-GB", { weekday: "long", day: "numeric", month: "long" });
  var domani = adesso.getHours() >= 22;
  if (domani) { var d = new Date(adesso.getTime() + 86400000); oggi = d.toLocaleDateString(L === "it" ? "it-IT" : "en-GB", { weekday: "long", day: "numeric", month: "long" }); }
  return { domani: domani, testo: oggi, iso: (domani ? new Date(adesso.getTime() + 86400000) : adesso).toISOString().slice(0, 10) };
}

function disegna() {
  document.getElementById("lingua").textContent = L === "it" ? "English" : "Italiano";
  document.documentElement.lang = L;
  var g = giornoTesto();
  document.getElementById("dove").textContent = [dove, (!BUSINESS && org.camera) ? (L === "it" ? "Camera " : "Room ") + org.camera : ""].filter(Boolean).join(" · ") || " ";
  if (BUSINESS) {
    document.getElementById("titolo").textContent = t("bizTit");
    document.getElementById("quando").textContent = (menu && menu.prezzo_fisso_persona ? euro(Number(menu.prezzo_fisso_persona)) + " " + t("aPersona") + " · " : "") + t("bizSotto") + " · " + g.testo;
  } else {
    document.getElementById("titolo").textContent = g.domani ? t("domani") : t("stasera");
    document.getElementById("quando").textContent = g.testo;
  }
  if (esito) return disegnaFatto();
  if (!menu) return;
  var vuoto = !piatti.Antipasti.length && !piatti.Primi.length && !piatti.Secondi.length;
  if (vuoto) { app.innerHTML = '<p class="avviso">' + esc(t("menuNo")) + '</p>' + salvaHtml(); barra.classList.add("nascosto"); return; }
  if (fase === "dati") return disegnaDati();
  disegnaScelta();
}

function disegnaDati() {
  var h = '<h2>' + esc(t(BUSINESS ? "chiBiz" : "chi")) + '</h2><p style="margin:0;color:var(--tenue)">' + esc(t(BUSINESS ? "chiBizTesto" : "chiTesto")) + '</p>';
  h += '<div class="riga2">' + (BUSINESS ? '' : '<label class="campo">' + esc(t("camera")) + ' *<input id="f-camera" value="' + esc(org.camera || "") + '" placeholder="12"></label>') +
       '<label class="campo">' + esc(t("persone")) + ' *<input id="f-persone" type="number" min="1" max="12" value="' + esc(org.persone || (BUSINESS ? 1 : 2)) + '"></label></div>';
  h += '<div class="riga2"><label class="campo">' + esc(t("nome")) + ' *<input id="f-nome" autocomplete="given-name" value="' + esc(org.nome || "") + '"></label>' +
       '<label class="campo">' + esc(t("cognome")) + ' *<input id="f-cognome" autocomplete="family-name" value="' + esc(org.cognome || "") + '"></label></div>';
  h += '<label class="campo">' + esc(t("tel")) + ' *<input id="f-tel" type="tel" autocomplete="tel" value="' + esc(org.telefono || "") + '" placeholder="333 1234567"></label>';
  h += '<p class="errore" id="err"></p>';
  app.innerHTML = h;
  barra.classList.remove("nascosto");
  btn.textContent = t("continua"); btn.disabled = false;
  btn.onclick = function() {
    var v = function(id){ return document.getElementById(id).value.trim(); };
    var o = { camera: BUSINESS ? "-" : v("f-camera"), persone: parseInt(v("f-persone"), 10) || 0, nome: v("f-nome"), cognome: v("f-cognome"), telefono: v("f-tel") };
    if (!o.camera || !o.nome || !o.cognome || o.telefono.replace(/\D/g, "").length < 8 || o.persone < 1) {
      document.getElementById("err").textContent = L === "it" ? "Compila tutti i campi, con un telefono valido." : "Please fill in all fields with a valid phone number.";
      return;
    }
    org = o; try { localStorage.setItem(CHIAVE, JSON.stringify(org)); } catch(e) {}
    fase = "scelta"; preparaOspiti(); disegna(); window.scrollTo(0, 0);
  };
}

function piattiDi(o) { return PORTATE.map(function(p){ return o.scelte[p[0]]; }).filter(Boolean); }

function disegnaScelta() {
  preparaOspiti();
  var o = ospiti[attivo];
  var h = '<p class="avviso">' + esc(org.nome + " " + org.cognome) + ' · ' + esc(org.telefono) + ' · ' + org.persone + ' ' + (L === "it" ? (org.persone == 1 ? "persona" : "persone") : (org.persone == 1 ? "person" : "people")) +
          ' <button class="mod" id="mod" type="button">' + esc(t("modifica")) + '</button></p>';
  if (ospiti.length > 1) {
    h += '<h2>' + esc(t("scegli")) + '</h2><div class="persone">';
    ospiti.forEach(function(x, i) {
      h += '<button class="persona" type="button" data-p="' + i + '" aria-pressed="' + (i === attivo) + '">' +
           (piattiDi(x).length ? '<span class="spunta">✓</span>' : '') + esc(x.nome || (t("persona") + " " + (i + 1))) + '</button>';
    });
    h += '</div>';
    h += '<label class="campo">' + esc(t("nomeOpz")) + '<input id="f-nomep" value="' + esc(o.nome) + '"></label>';
  }
  PORTATE.forEach(function(p) {
    var voci = piatti[p[0]]; if (!voci.length) return;
    h += '<section class="portata"><h3>' + esc(t(p[0])) + '</h3>';
    voci.forEach(function(v) {
      var scelto = !!(o.scelte[p[0]] && o.scelte[p[0]].id === v.id);
      h += '<button class="piatto" type="button" role="radio" data-por="' + p[0] + '" data-id="' + v.id + '" aria-checked="' + scelto + '">' +
           '<span class="pallino"></span><span>' + esc(v.nome) + '</span></button>';
      // la modifica al piatto si scrive subito sotto il piatto scelto
      if (scelto) h += '<label class="modifica"><span>✏️ ' + esc(t("modTit")) + '</span>' +
        '<input class="nota" data-nota="' + p[0] + '" maxlength="120" placeholder="' + esc(t("nota")) + '" value="' + esc(o.note[p[0]] || "") + '"></label>';
    });
    h += '<button class="nessuno" type="button" data-salta="' + p[0] + '">' + esc(t("senza")) + '</button></section>';
  });
  h += '<h2>' + esc(t(BUSINESS ? "orarioBiz" : "orario")) + '</h2><div class="orari">';
  ORARI.forEach(function(x){ h += '<button class="orario" type="button" role="radio" data-ora="' + x + '" aria-checked="' + (ora === x) + '">' + x + '</button>'; });
  h += '</div><label class="campo">' + esc(t("allergie")) + '<input id="f-all" value="' + esc(allergie) + '" placeholder="' + esc(t("allergiePh")) + '"></label>';
  h += '<div class="riepilogo"><b>' + esc(t("riep")) + '</b>' + ospiti.map(function(x, i) {
    var ps = PORTATE.map(function(p){ var s = x.scelte[p[0]]; return s ? s.nome + (x.note[p[0]] ? ' (' + x.note[p[0]] + ')' : '') : null; }).filter(Boolean);
    return '<div class="r"><b>' + esc(x.nome || (t("persona") + " " + (i + 1))) + ':</b> ' + esc(ps.join(", ") || t("nessunPiatto")) + '</div>';
  }).join("") + (BUSINESS && menu.prezzo_fisso_persona ? '<div class="r" style="display:flex;justify-content:space-between;font-weight:600;"><span>' + esc(t("totale")) + ' · ' +
      euro(Number(menu.prezzo_fisso_persona)) + ' × ' + ospiti.length + '</span><span>' + euro(Number(menu.prezzo_fisso_persona) * ospiti.length) + '</span></div>' : '') + '</div>';
  h += '<p class="errore" id="err"></p>' + salvaHtml();
  app.innerHTML = h;
  barra.classList.remove("nascosto");
  btn.textContent = invio ? t("inviando") : t(BUSINESS ? "inviaBiz" : "invia");
  btn.disabled = invio || !pronto();
  btn.onclick = invia;
  collega();
}

function pronto() { return !!ora && ospiti.every(function(x){ return piattiDi(x).length > 0; }); }

function collega() {
  var m = document.getElementById("mod"); if (m) m.onclick = function(){ fase = "dati"; disegna(); };
  app.querySelectorAll("[data-p]").forEach(function(b){ b.onclick = function(){ attivo = +b.dataset.p; disegna(); }; });
  var np = document.getElementById("f-nomep"); if (np) np.oninput = function(){ ospiti[attivo].nome = np.value.slice(0, 40); };
  if (np) np.onchange = disegna;
  app.querySelectorAll("[data-id]").forEach(function(b){
    b.onclick = function(){
      var por = b.dataset.por, v = piatti[por].filter(function(x){ return x.id === b.dataset.id; })[0];
      ospiti[attivo].scelte[por] = v; disegna();
    };
  });
  app.querySelectorAll("[data-salta]").forEach(function(b){
    b.onclick = function(){ delete ospiti[attivo].scelte[b.dataset.salta]; delete ospiti[attivo].note[b.dataset.salta]; disegna(); };
  });
  app.querySelectorAll("[data-nota]").forEach(function(inp){
    inp.oninput = function(){ ospiti[attivo].note[inp.dataset.nota] = inp.value.slice(0, 120); };
    inp.onchange = disegna;
  });
  app.querySelectorAll("[data-ora]").forEach(function(b){ b.onclick = function(){ ora = b.dataset.ora; disegna(); }; });
  var a = document.getElementById("f-all"); if (a) a.oninput = function(){ allergie = a.value; };
}

function invia() {
  var err = document.getElementById("err");
  if (!pronto()) { err.textContent = t("manca"); return; }
  // Al massimo una portata per tipo e per persona: la pagina lo garantisce, il server lo ricontrolla.
  var righe = [];
  ospiti.forEach(function(x, i) {
    var chi = x.nome || (ospiti.length > 1 ? t("persona") + " " + (i + 1) : "");
    PORTATE.forEach(function(p) {
      var s = x.scelte[p[0]]; if (!s) return;
      var nota = [chi ? "per " + chi : "", x.note[p[0]] || ""].filter(Boolean).join(" · ");
      righe.push({ menu_voce_id: s.id, quantita: 1, note: nota });
    });
  });
  invio = true; disegna();
  fetch(ORDINI_API, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({
    azione: "crea_ordine", menu_id: menu.id, tipo_consegna: BUSINESS ? "preordine" : "mezza_pensione",
    cliente_nome: org.nome + " " + org.cognome, cliente_telefono: org.telefono,
    camera: BUSINESS ? "" : (dove ? dove + " · " : "") + org.camera, persone: ospiti.length,
    data_consegna: giornoTesto().iso, orario_consegna: ora, allergie_note: allergie, righe: righe
  }) })
    .then(function(r){ return r.json(); })
    .then(function(j){
      invio = false;
      if (!j.success) { disegna(); document.getElementById("err").textContent = j.error || "Errore"; return; }
      esito = j; disegna(); window.scrollTo(0, 0);
    })
    .catch(function(){ invio = false; disegna(); document.getElementById("err").textContent = L === "it" ? "Connessione assente, riprova." : "No connection, please try again."; });
}

function disegnaFatto() {
  barra.classList.add("nascosto");
  app.innerHTML = '<div class="fatto"><div class="icona">' + (esito.whatsapp_inviato ? "📲" : "✅") + '</div>' +
    '<h2>' + esc(esito.whatsapp_inviato ? t("fattoTit") : "OK") + '</h2><p>' + esc(esito.whatsapp_inviato ? t("fattoTesto") : t("fattoNoWa")) + '</p>' +
    '<button class="conferma" id="nuova" type="button" style="margin-top:14px">' + esc(t("nuova")) + '</button></div>' + salvaHtml();
  document.getElementById("nuova").onclick = function(){ esito = null; ospiti = []; ora = ""; allergie = ""; disegna(); };
}

var standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
function salvaHtml() { return standalone ? "" : '<div class="salva"><b>' + esc(t("salvaTit")) + '</b><br>' + esc(ios ? t("salvaIos") : t("salvaAnd")) + '</div>'; }

document.getElementById("lingua").onclick = function(){ L = L === "it" ? "en" : "it"; try { localStorage.setItem("cena_lingua", L); } catch(e) {} disegna(); };

fetch(MENU_API, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ azione: "carica", slug: SLUG }) })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if (!d.success) { app.innerHTML = '<p class="avviso">' + esc(t("menuNo")) + '</p>'; return; }
    menu = d.menu;
    var cat = {}; (d.categorie || []).forEach(function(c){ cat[c.id] = c.nome; });
    (d.voci || []).forEach(function(v){ var n = cat[v.categoria_id]; if (piatti[n]) piatti[n].push({ id: v.id, nome: v.nome }); });
    if (fase === "scelta") preparaOspiti();
    disegna();
  })
  .catch(function(){ app.innerHTML = '<p class="avviso">' + esc(L === "it" ? "Connessione assente, riprova tra poco." : "No connection, please try again.") + '</p>'; });
disegna();
})();
</script>
