function buildWalls(h){while(wallGroup.children.length)wallGroup.remove(wallGroup.children[0]);walls.forEach(([x1,y1,x2,y2])=>{const len=Math.hypot(x2-x1,y2-y1),g=new THREE.BoxGeometry(len+12,h,12),m=new THREE.Mesh(g,wallMat);m.position.set((x1+x2)/2,h/2,(y1+y2)/2);m.rotation.y=-Math.atan2(y2-y1,x2-x1);m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:0x6d757b,transparent:true,opacity:0.5})));wallGroup.add(m);});}
buildWalls(110);
const hoodGroup=new THREE.Group();scene.add(hoodGroup);
const hoodMat=new THREE.MeshPhongMaterial({color:0xC2C8CD,specular:0xffffff,shininess:70,transparent:true,opacity:0.86});
hoods.forEach(([n,x1,y1,x2,y2])=>{const w=x2-x1,d=y2-y1,sh=new THREE.Group();
 const lower=new THREE.Mesh(new THREE.BoxGeometry(w,30,d),hoodMat);lower.position.y=215;sh.add(lower);lower.add(new THREE.LineSegments(new THREE.EdgesGeometry(lower.geometry),new THREE.LineBasicMaterial({color:0x4a5258})));
 const up=new THREE.Mesh(new THREE.BoxGeometry(w*0.75,20,d*0.75),hoodMat);up.position.y=240;sh.add(up);
 const filt=new THREE.Mesh(new THREE.BoxGeometry(w-10,1,d-10),new THREE.MeshPhongMaterial({color:0x5c656c}));filt.position.y=199.5;sh.add(filt);
 const duct=new THREE.Mesh(new THREE.BoxGeometry(Math.min(35,w*0.3),60,Math.min(35,d*0.3)),hoodMat);duct.position.y=280;sh.add(duct);
 sh.position.set((x1+x2)/2,0,(y1+y2)/2);hoodGroup.add(sh);const l=makeLabel(n,(x1+x2)/2,325,(y1+y2)/2);l.userData.hood=true;});
const doorMat=new THREE.MeshBasicMaterial({color:0xD85A30});

function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
let anim=null;
function goTo(v,instant){const tgt=new THREE.Vector3(...views[v].t),pos=new THREE.Vector3(...views[v].p);
 if(instant||window.matchMedia('(prefers-reduced-motion: reduce)').matches){controls.target.copy(tgt);camera.position.copy(pos);controls.update();return;}
 const t0=controls.target.clone(),p0=camera.position.clone(),start=performance.now();anim=(now)=>{const k=Math.min(1,(now-start)/700),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;controls.target.lerpVectors(t0,tgt,e);camera.position.lerpVectors(p0,pos,e);if(k>=1)anim=null;};}
const hash=(location.hash||'').replace('#','');goTo(views[hash]?hash:'all',true);
document.querySelectorAll('#views button').forEach(b=>{if(views[hash]&&b.dataset.view===hash){document.querySelectorAll('#views button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');}
 b.addEventListener('click',()=>{document.querySelectorAll('#views button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');goTo(b.dataset.view);});});
function toggle(id,fn){const b=document.getElementById(id);b.addEventListener('click',()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));fn(on);});}
toggle('tHoods',on=>{hoodGroup.visible=on;labelGroup.children.forEach(l=>{if(l.userData.hood)l.visible=on;});});
toggle('tLabels',on=>{labelGroup.visible=on;});
toggle('tWalls',on=>{buildWalls(on?300:110);});
toggle('tSf',on=>{if(SF)SF.target=on?1:0;});
function apri(root){if(root.userData.sf){SF.target=SF.target>0.5?0:1;const b=document.getElementById('tSf');b.setAttribute('aria-pressed',String(SF.target===1));return;}
 const o=!root.userData.aperto;root.userData.aperto=o;root.userData.doors.forEach(p=>p.userData.target=o?p.userData.openAng:0);}
window.apriTutto=()=>INTER.forEach(apri);
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};});
renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;const quick=performance.now()-down.t<450;down=null;if(dx*dx+dy*dy>64||!quick)return;
 const r=renderer.domElement.getBoundingClientRect();ptr.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ptr,camera);
 const hit=ray.intersectObjects(INTER,true)[0];if(!hit)return;let o=hit.object;while(o&&!INTER.includes(o))o=o.parent;if(o)apri(o);});
function stepAnim(){ANIM.forEach(p=>{p.rotation.y+=(p.userData.target-p.rotation.y)*0.14;});
 if(SF){SF.t+=(SF.target-SF.t)*0.1;const t=SF.t,a=1.45*(1-t);SF.base.position.x=75*t;SF.pR.position.set(75*t+35,92,0);SF.pL.position.set(75*t-35,92,0);SF.pR.rotation.z=a;SF.pL.rotation.z=-a;}}
function loop(now){requestAnimationFrame(loop);if(anim)anim(now);stepAnim();controls.update();renderer.render(scene,camera);}
requestAnimationFrame(loop);
