<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; color: #0f172a; min-height: 100vh; }

    .hero { background: linear-gradient(135deg, #0E5A7A 0%, #1a8fb5 100%); padding: 48px 24px 40px; text-align: center; color: white; }
    .hero-logo { font-size: 40px; margin-bottom: 12px; }
    .hero-azienda { font-size: 13px; opacity: .75; margin-bottom: 8px; letter-spacing: .5px; text-transform: uppercase; }
    .hero-titolo { font-size: 28px; font-weight: 700; line-height: 1.2; margin-bottom: 12px; }
    .hero-sub { font-size: 16px; opacity: .88; line-height: 1.6; max-width: 520px; margin: 0 auto; }

    .intro-box { max-width: 640px; margin: -20px auto 0; background: white; border-radius: 16px; padding: 28px; box-shadow: 0 4px 24px rgba(0,0,0,.08); position: relative; z-index: 2; }
    .intro-testo { font-size: 15px; line-height: 1.8; color: #374151; font-style: italic; border-left: 3px solid #0E5A7A; padding-left: 16px; }

    .form-wrap { max-width: 640px; margin: 24px auto 48px; padding: 0 16px; }

    .step-bar { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 24px; }
    .step-dot { width: 10px; height: 10px; border-radius: 50%; background: #e2e8f0; transition: all .3s; }
    .step-dot.attivo { background: #0E5A7A; transform: scale(1.3); }
    .step-dot.fatto { background: #25D366; }
    .step-label { font-size: 12px; color: #94a3b8; margin-left: 4px; }

    .sezione { background: white; border-radius: 16px; padding: 28px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); display: none; }
    .sezione.attiva { display: block; }
    .sezione-titolo { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 20px; }

    .campo { margin-bottom: 18px; }
    .campo label { display: block; font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    .campo .hint { font-size: 12px; color: #94a3b8; margin-top: 4px; }

    input[type="text"], input[type="tel"], input[type="email"], select, textarea {
      width: 100%; padding: 11px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px;
      font-size: 15px; font-family: inherit; outline: none; transition: border .2s; background: white; color: #0f172a;
    }
    input:focus, select:focus, textarea:focus { border-color: #0E5A7A; box-shadow: 0 0 0 3px rgba(14,90,122,.1); }
    textarea { resize: vertical; min-height: 120px; line-height: 1.6; }

    .scelta-griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .scelta-btn { border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 10px 12px; cursor: pointer; font-size: 13px; font-weight: 500; color: #374151; background: white; transition: all .15s; text-align: left; }
    .scelta-btn:hover { border-color: #0E5A7A; color: #0E5A7A; background: #f0f9ff; }
    .scelta-btn.selezionato { border-color: #0E5A7A; background: #0E5A7A; color: white; }

    .domanda-aperta { background: #f8fafc; border-radius: 12px; padding: 20px; margin-bottom: 18px; }
    .domanda-testo { font-size: 15px; font-weight: 600; color: #0f172a; line-height: 1.5; margin-bottom: 8px; }
    .domanda-hint { font-size: 12px; color: #64748b; margin-bottom: 10px; font-style: italic; }
    .char-count { font-size: 11px; color: #94a3b8; text-align: right; margin-top: 4px; }

    .btn-nav { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
    .btn-avanti { background: #0E5A7A; color: white; border: none; border-radius: 12px; padding: 14px 28px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all .2s; flex: 1; max-width: 220px; }
    .btn-avanti:hover { background: #0c4f6b; transform: translateY(-1px); }
    .btn-avanti:disabled { background: #94a3b8; transform: none; cursor: not-allowed; }
    .btn-indietro { background: #f1f5f9; color: #374151; border: none; border-radius: 12px; padding: 14px 20px; font-size: 15px; cursor: pointer; }

    .errore { color: #dc2626; font-size: 12px; margin-top: 4px; display: none; }
    .errore.visibile { display: block; }

    .loading { text-align: center; padding: 60px 20px; color: #64748b; font-size: 15px; }

    .esito-wrap { text-align: center; padding: 48px 20px; }
    .esito-icon { font-size: 56px; margin-bottom: 16px; }
    .esito-titolo { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
    .esito-testo { font-size: 15px; color: #374151; line-height: 1.7; max-width: 440px; margin: 0 auto; }

    @media (max-width: 480px) {
      .hero { padding: 36px 20px 32px; }
      .hero-titolo { font-size: 22px; }
      .intro-box, .sezione { padding: 20px; }

  </style>
</head>

<div id="root">
  <div class="loading">⏳ Caricamento...</div>
</div>

<script>
const SUPABASE_URL = 'https://cuhcscpvhypoaplcmtjk.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1aGNzY3B2aHlwb2FwbGNtdGprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM4MjY4MjgsImV4cCI6MjA3OTQwMjgyOH0.q9zAs0oh8F1-whtORHBIORF5jIn1NTS3LvSMWleP0a0';

// ─── LEGGI PARAMS URL ────────────────────────────────────────────────────────
// Supporta: ?a=AZIENDA_ID  oppure  ?a=AZIENDA_ID&r=cuoco
const urlParams  = new URLSearchParams(window.location.search);
const aziendaId  = urlParams.get('a');
const ruoloParam = urlParams.get('r') || '';
const fonte      = urlParams.get('f') || 'pubblico';

let aziendaInfo  = null;
let stepCorrente = 0;
let areaSelezionata = '';

// ─── SCORING ─────────────────────────────────────────────────────────────────
const KW = {
  curiosita: {
    pos: ['imparato da solo','volevo capire','per curiosità','ho approfondito','ho ricercato','fuori dall\'orario','dopo il lavoro','nel tempo libero','ho studiato da solo','mi sono chiesto'],
    neg: ['non mi interessa','non ho tempo','non serve a niente']
  },
  crescita: {
    pos: ['voglio diventare','voglio crescere','sto imparando','sto studiando','non mi accontento','obiettivo','ambizione','tra 5 anni','voglio di più','non voglio fermarmi'],
    neg: ['stabile','tranquillo','non cambiare','non so','non ci ho pensato']
  },
  responsabilita: {
    pos: ['ho sbagliato','errore mio','ho rimediato','mi sono assunto','ho corretto','ho risolto'],
    neg: ['colpa di','per colpa del','non dipendeva da me','nessuno mi aveva detto','è stata colpa loro']
  },
  mentalita_positiva: {
    pos: ['ho trovato il modo','ho proposto','si può fare','invece di lamentarmi','invece di aspettare','ho agito'],
    neg: ['impossibile','non si può','sempre così','non cambierà','inutile']
  },
  pressione: {
    pos: ['ce l\'ho fatta','non mi sono perso','sono rimasto lucido','12 ore','turno lungo','servizio pieno','ho resistito','non ho mollato','stressante ma','duro ma'],
    neg: ['non reggo','mi blocco','troppo stress','ho abbandonato']
  },
  leadership: {
    pos: ['ho aiutato','ho formato','ho organizzato','ho preso l\'iniziativa','senza che nessuno','ho guidato','ho coordinato'],
    neg: ['aspettavo ordini','aspettavo istruzioni']
  },
  mentalita_proprietario: {
    pos: ['non era richiesto ma','nessuno me lo aveva chiesto','non era compito mio ma','dopo il turno','a fine servizio','ho voluto capire','per il puro piacere','ho fatto in più','trattavo come mio'],
    neg: ['aspettavo','nessuno mi diceva','non era compito mio e quindi','finito il turno sono andato','non mi riguardava']
  }
};

// Pesi per indicatore (totale base 100 + bonus/malus)
const PESI = { curiosita: 20, crescita: 20, responsabilita: 15, pressione: 15, mentalita_positiva: 10, leadership: 10, mentalita_proprietario: 10 };

function scoraRisposta(testo) {
  const t = (testo||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/['']/g,"'");
  const scores = {};
  const kwPos = [], kwNeg = [];
  for (const [ind, {pos, neg}] of Object.entries(KW)) {
    let p = 0;
    for (const kw of pos) { if (t.includes(kw)) { p += 2; kwPos.push({indicatore:ind,keyword:kw}); } }
    for (const kw of neg) { if (t.includes(kw)) { p -= 2; kwNeg.push({indicatore:ind,keyword:kw}); } }
    const parole = testo.trim().split(/\s+/).length;
    if (parole > 80) p += 2; else if (parole > 40) p += 1; else if (parole < 15) p -= 1;
    scores[ind] = Math.max(0, Math.min(10, p));
  }
  return { scores, kwPos, kwNeg };
}

function calcolaScoreTotale(tutteRisposte) {
  const agg = Object.fromEntries(Object.keys(KW).map(k => [k, []]));
  for (const r of tutteRisposte) {
    const { scores } = scoraRisposta(r.risposta);
    for (const [k,v] of Object.entries(scores)) agg[k].push(v);
  }
  // Media per indicatore → applica peso
  let totale = 0;
  const perIndicatore = {};
  for (const [k, vals] of Object.entries(agg)) {
    const media = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
    const peso = PESI[k] || 10;
    // Scala: 10/10 = peso pieno, 0/10 = 0
    const contributo = (media / 10) * peso;
    perIndicatore[k] = Math.round(contributo * 10) / 10;
    totale += contributo;
  }
  // Bonus: controlla keyword speciali nelle risposte
  const tuttoTesto = tutteRisposte.map(r=>r.risposta).join(' ').toLowerCase();
  let bonus = 0;
  const bonusKw = ['imparato da solo','ho imparato una nuova','ho risolto un problema che non era','mi interessa capire come funziona tutta','voglio capire come funziona l\'azienda'];
  for (const kw of bonusKw) { if (tuttoTesto.includes(kw)) bonus += 5; }
  bonus = Math.min(25, bonus); // max bonus 25

  // Malus
  let malus = 0;
  const malusKw = { vittimismo: ['colpa degli altri','colpa del capo','colpa dei colleghi','colpa dell\'azienda'], scarico: ['non era mai colpa mia','non è mai colpa mia'], passivo: ['aspetto istruzioni','faccio solo quello che mi dicono'], curiosita_zero: ['non mi interessa imparare','non ho tempo di studiare'] };
  for (const [tipo, kws] of Object.entries(malusKw)) {
    for (const kw of kws) { if (tuttoTesto.includes(kw)) malus += tipo === 'vittimismo' || tipo === 'scarico' ? 15 : 10; }
  }

  const scoreTotale = Math.min(100, Math.max(0, Math.round(totale + bonus - malus)));
  return { scoreTotale, perIndicatore, bonus, malus };
}

function classificazione(score) {
  if (score >= 90) return { label: 'Talento ad alto potenziale', priorita: 'Priorità assoluta', colore: '#15803d' };
  if (score >= 80) return { label: 'Futuro responsabile',        priorita: 'Da approfondire subito', colore: '#0E5A7A' };
  if (score >= 70) return { label: 'Buon profilo',               priorita: 'Colloquio consigliato', colore: '#2563eb' };
  if (score >= 60) return { label: 'Operativo standard',         priorita: 'Valutare in base alle necessità', colore: '#d97706' };
  return              { label: 'Non in linea con la cultura',    priorita: 'Non procedere', colore: '#dc2626' };
}

// ─── CARICA AZIENDA E AVVIA ──────────────────────────────────────────────────
async function init() {
  const root = document.getElementById('root');

  if (!aziendaId) {
    root.innerHTML = `<div class="loading">⚠️ Link non valido.<br><small>Manca il parametro azienda.</small></div>`;
    return;
  }

  // Carica info azienda da Supabase
  const res = await fetch(`${SUPABASE_URL}/rest/v1/aziende?id=eq.${aziendaId}&select=id,nome,logo_url`, {
    headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}` }
  });
  const aziende = await res.json();

  if (!aziende?.length) {
    root.innerHTML = `<div class="loading">⚠️ Azienda non trovata.</div>`;
    return;
  }

  aziendaInfo = aziende[0];
  document.title = `Lavora con noi — ${aziendaInfo.nome}`;

  // Carica ruoli attivi per questa azienda
  const resRuoli = await fetch(`${SUPABASE_URL}/rest/v1/candidature_ruoli?azienda_id=eq.${aziendaId}&attivo=eq.true&order=ordine`, {
    headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}` }
  });
  const ruoli = await resRuoli.json() || [];

  renderForm(ruoli);
}

      <div class="hero-titolo">Scopriamo se siamo fatti<br>per lavorare insieme</div>
      <div class="hero-sub">Non stiamo cercando solo esperienza o titoli. Cerchiamo persone con voglia di crescere, imparare e costruire qualcosa nel tempo.</div>
    </div>

    <!-- INTRO -->
    <div class="intro-box">
      <div class="intro-testo">
        Non esistono risposte giuste o sbagliate.<br>
        Rispondi con sincerità — è quello che conta davvero.
      </div>
    </div>

    <!-- FORM -->
    <div class="form-wrap">
      <div class="step-bar">
        <div class="step-dot attivo" id="dot-0"></div>
        <div class="step-dot" id="dot-1"></div>
        <div class="step-dot" id="dot-2"></div>
        <div class="step-dot" id="dot-3"></div>
        <span class="step-label" id="step-label">Sezione 1 di 4</span>
      </div>

      <!-- STEP 0: Chi sei -->
      <div class="sezione attiva" id="step-0">
        <div class="sezione-titolo">👤 Chi sei — Percorso personale</div>
        <div class="campo"><label>Nome *</label><input type="text" id="f-nome" placeholder="Il tuo nome"><div class="errore" id="err-nome">Campo obbligatorio</div></div>
        <div class="campo"><label>Cognome *</label><input type="text" id="f-cognome" placeholder="Il tuo cognome"><div class="errore" id="err-cognome">Campo obbligatorio</div></div>
        <div class="campo"><label>Telefono * <span style="font-size:11px;font-weight:400;color:#94a3b8;">(riceverai aggiornamenti su WhatsApp)</span></label><input type="tel" id="f-telefono" placeholder="+39 333 1234567"><div class="errore" id="err-telefono">Inserisci un numero valido</div></div>
        <div class="campo"><label>Email</label><input type="email" id="f-email" placeholder="la-tua@email.it"></div>
        <div class="campo"><label>Città</label><input type="text" id="f-citta" placeholder="Es. Milano"></div>
        <div class="campo"><label>Ruolo desiderato *</label><select id="f-ruolo"><option value="">— seleziona —</option>${opzioniRuoli}</select><div class="errore" id="err-ruolo">Seleziona un ruolo</div></div>
        <div class="campo"><label>Esperienze precedenti</label><textarea id="f-esperienze" rows="3" placeholder="Descrivi brevemente le tue esperienze lavorative, anche in settori diversi..."></textarea></div>

        <div class="btn-nav"><button class="btn-avanti" onclick="avanti(0)">Continua →</button></div>

// ─── NAVIGAZIONE ─────────────────────────────────────────────────────────────
function avanti(step) {
  if (!valida(step)) return;
  document.getElementById('step-'+step).classList.remove('attiva');
  stepCorrente = step + 1;
  document.getElementById('step-'+stepCorrente).classList.add('attiva');
  aggProg(stepCorrente);
  window.scrollTo({top:0,behavior:'smooth'});
}
function indietro(step) {
  document.getElementById('step-'+step).classList.remove('attiva');
  stepCorrente = step - 1;
  document.getElementById('step-'+stepCorrente).classList.add('attiva');
  aggProg(stepCorrente);
  window.scrollTo({top:0,behavior:'smooth'});
}
function aggProg(step) {
  for (let i=0;i<4;i++) {
    const d = document.getElementById('dot-'+i);
    d.className = 'step-dot';
    if (i<step) d.classList.add('fatto');
    else if (i===step) d.classList.add('attivo');
  }
  document.getElementById('step-label').textContent = `Sezione ${step+1} di 4`;
}
function sel(btn, grigliaId, hiddenId) {
  document.querySelectorAll('#'+grigliaId+' .scelta-btn').forEach(b=>b.classList.remove('selezionato'));
  btn.classList.add('selezionato');
  document.getElementById(hiddenId).value = btn.dataset.val;
}
function cc(taId, ccId) {
  const t = document.getElementById(taId)?.value.trim();
  const n = t ? t.split(/\s+/).length : 0;
  const el = document.getElementById(ccId);
  if (el) el.textContent = n + (n===1?' parola':' parole');
}
function err(id, vis) { const e=document.getElementById(id); if(e) e.classList.toggle('visibile',vis); }

function nParole(id) {
  const v = document.getElementById(id)?.value.trim();
  return v ? v.split(/\s+/).length : 0;
}

function valida(step) {
  let ok = true;
  if (step===0) {
    const nome=document.getElementById('f-nome')?.value.trim();
    const cog=document.getElementById('f-cognome')?.value.trim();
    const tel=document.getElementById('f-telefono')?.value.trim();
    const ruolo=document.getElementById('f-ruolo')?.value;
    err('err-nome',!nome); err('err-cognome',!cog); err('err-telefono',tel.length<8); err('err-ruolo',!ruolo);
    if(!nome||!cog||tel.length<8||!ruolo) ok=false;
  }
  if (step===1) {
    ['r-1','r-2','r-3','r-4'].forEach((id,i) => { const n=nParole(id); err('err-'+id.replace('-',''),n<20); if(n<20) ok=false; });
    const int=document.getElementById('v-interesse')?.value;
    err('err-interesse',!int); if(!int) ok=false;
  }
  if (step===2) {
    const n5=nParole('r-5'); err('err-r5',n5<20); if(n5<20) ok=false;
    const pr=document.getElementById('v-pressione')?.value;
    err('err-pressione',!pr); if(!pr) ok=false;
    const n6=nParole('r-6'); err('err-r6',n6<15); if(n6<15) ok=false;
    const n7=nParole('r-7'); err('err-r7',n7<20); if(n7<20) ok=false;
    const men=document.getElementById('v-mentalita')?.value;
    err('err-mentalita',!men); if(!men) ok=false;
  }
  if (step===3) {
    const n8=nParole('r-8'); err('err-r8',n8<20); if(n8<20) ok=false;
    const area=document.getElementById('v-area')?.value;
    err('err-area',!area); if(!area) ok=false;
    const n9=nParole('r-9'); err('err-r9',n9<15); if(n9<15) ok=false;
    const n10=nParole('r-10'); err('err-r10',n10<30); if(n10<30) ok=false;
  }
  return ok;
}

// ─── INVIO ───────────────────────────────────────────────────────────────────
async function invia() {
  if (!valida(3)) return;
  const btn = document.getElementById('btn-invia');
  btn.disabled = true; btn.textContent = 'Invio in corso...';

  const risposte = [
    {domanda_id:'problema_intervento',        domanda_testo:'Hai visto un problema e hai deciso di intervenire senza che nessuno te lo chiedesse.',    risposta:document.getElementById('r-1').value.trim()},
    {domanda_id:'apprendimento_autonomo',     domanda_testo:'Cosa hai imparato da solo negli ultimi 12 mesi.',                                          risposta:document.getElementById('r-2').value.trim()},
    {domanda_id:'errore_e_apprendimento',     domanda_testo:'Un errore che hai commesso e cosa hai imparato.',                                           risposta:document.getElementById('r-3').value.trim()},
    {domanda_id:'cosa_difficile_ottenuto',    domanda_testo:'La cosa più difficile che hai ottenuto nella tua vita.',                                    risposta:document.getElementById('r-4').value.trim()},
    {domanda_id:'giorno_impegnativo',         domanda_testo:'Il giorno di lavoro più impegnativo che ricordi.',                                           risposta:document.getElementById('r-5').value.trim()},
    {domanda_id:'collega_dimentica',          domanda_testo:'Se un collega dimentica qualcosa di importante cosa fai.',                                   risposta:document.getElementById('r-6').value.trim()},
    {domanda_id:'lavorato_piu_del_necessario',domanda_testo:'Una situazione in cui hai lavorato più del necessario per imparare.',                        risposta:document.getElementById('r-7').value.trim()},
    {domanda_id:'perche_hospitality',         domanda_testo:'Perché vuoi lavorare in questo settore.',                                                   risposta:document.getElementById('r-8').value.trim()},
    {domanda_id:'dove_tra_5_anni',            domanda_testo:'Dove ti vedi tra 5 anni.',                                                                  risposta:document.getElementById('r-9').value.trim()},
    {domanda_id:'perche_investire_su_te',     domanda_testo:'Perché dovremmo investire su di te.',                                                       risposta:document.getElementById('r-10').value.trim()},
    // Risposte a scelta
    {domanda_id:'interesse_nuovo_lavoro',     domanda_testo:'Quando inizi un nuovo lavoro cosa ti interessa di più.',                                     risposta:document.getElementById('v-interesse').value},
    {domanda_id:'reazione_pressione',         domanda_testo:'Quando il lavoro aumenta improvvisamente come reagisci.',                                    risposta:document.getElementById('v-pressione').value},
    {domanda_id:'istinto_quando_va_male',     domanda_testo:'Quando qualcosa va male qual è il tuo primo istinto.',                                       risposta:document.getElementById('v-mentalita').value},
    {domanda_id:'area_interesse',             domanda_testo:'Area di interesse.',                                                                         risposta:document.getElementById('v-area').value},
  ];

  // Scoring solo sulle risposte aperte (prime 10)
  const { scoreTotale, perIndicatore, bonus, malus } = calcolaScoreTotale(risposte.slice(0,10));

  // Bonus scelte multiple positive
  const pr = document.getElementById('v-pressione').value;
  const men = document.getElementById('v-mentalita').value;
  const int = document.getElementById('v-interesse').value;
  let bonusScelte = 0;
  if (['team','meglio'].includes(pr)) bonusScelte += 5;
  if (['capire','risolvere','prevenire'].includes(men)) bonusScelte += 5;
  if (int === 'azienda') bonusScelte += 5;

  const scoreFinale = Math.min(100, scoreTotale + bonusScelte);
  const cls = classificazione(scoreFinale);

  const candidatura = {
    azienda_id: aziendaId,
    nome: document.getElementById('f-nome').value.trim(),
    cognome: document.getElementById('f-cognome').value.trim(),
    telefono: document.getElementById('f-telefono').value.trim(),
    email: document.getElementById('f-email').value.trim() || null,
    citta: document.getElementById('f-citta').value.trim() || null,
    ruolo_desiderato: document.getElementById('f-ruolo').value,
    area_interesse: document.getElementById('v-area').value,
    score_totale: scoreFinale,
    score_curiosita: perIndicatore.curiosita || 0,
    score_crescita: perIndicatore.crescita || 0,
    score_responsabilita: perIndicatore.responsabilita || 0,
    score_mentalita_positiva: perIndicatore.mentalita_positiva || 0,
    score_pressione: perIndicatore.pressione || 0,
    score_leadership: perIndicatore.leadership || 0,
    score_mentalita_proprietario: perIndicatore.mentalita_proprietario || 0,
    fonte, fase_attuale: 1, fase_label: 'Ricevuta',
  };

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/candidature`, {
      method: 'POST',
      headers: {'apikey':ANON_KEY,'Authorization':`Bearer ${ANON_KEY}`,'Content-Type':'application/json','Prefer':'return=representation'},
      body: JSON.stringify(candidatura)
    });
    if (!res.ok) throw new Error(await res.text());
    const [cand] = await res.json();

    // Salva risposte
    const rDB = risposte.map((r,i) => ({
      candidatura_id: cand.id, fase: 1,
      domanda_id: r.domanda_id, domanda_testo: r.domanda_testo, risposta: r.risposta,
      score_totale_risposta: i < 10 ? (Object.values(scoraRisposta(r.risposta).scores).reduce((a,b)=>a+b,0)/7) : 0
    }));
    await fetch(`${SUPABASE_URL}/rest/v1/candidature_risposte`, {
      method:'POST', headers:{'apikey':ANON_KEY,'Authorization':`Bearer ${ANON_KEY}`,'Content-Type':'application/json'},
      body: JSON.stringify(rDB)
    });

    // Notifica
    fetch(`${SUPABASE_URL}/functions/v1/candidatura-notifica`, {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${ANON_KEY}`},
      body: JSON.stringify({candidatura_id:cand.id, azienda_id:aziendaId, evento:'nuova_candidatura', score:scoreFinale, classificazione:cls.label})
    }).catch(()=>{});

    // Esito
    document.getElementById('root').innerHTML = `
      <div class="hero"><div class="hero-logo">🎉</div><div class="hero-azienda">${aziendaInfo.nome}</div><div class="hero-titolo">Candidatura ricevuta!</div></div>
      <div class="form-wrap">
        <div class="sezione attiva" style="text-align:center;padding:40px 24px;">
          <div style="font-size:48px;margin-bottom:16px;">✅</div>
          <div style="font-size:20px;font-weight:700;margin-bottom:12px;">Grazie ${cand.nome}!</div>
          <div style="font-size:15px;color:#374151;line-height:1.8;max-width:420px;margin:0 auto;">
            Abbiamo ricevuto la tua candidatura e la valuteremo con attenzione.<br><br>
            Se il tuo profilo supera la prima selezione, riceverai un messaggio WhatsApp con le istruzioni per la fase successiva.<br><br>
            <strong>Grazie per la tua sincerità.</strong>
          </div>
        </div>
      </div>`;
  } catch(e) {
    const el = document.getElementById('errore-invio');
    el.textContent = 'Errore durante l\'invio. Riprova.';
    el.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Invia candidatura 🚀';
  }
}

</script>
