<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex">
<title>Prenotate la vostra visita</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--acc:#6e2434;--bg:#f7f3ee;--c:#fff;--t:#2b2420;--m:#7a6e66;--b:#e8dfd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Jost,-apple-system,Arial,sans-serif;font-size:16px;line-height:1.5}
.w{max-width:560px;margin:0 auto;padding:22px 18px 40px}h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:36px;line-height:1.1;margin:6px 0 8px}
.k{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc)}.m{color:var(--m);font-size:14px}.hide{display:none!important}
h2{font-size:15px;font-weight:500;margin:22px 0 10px}.giorni{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.g{flex:0 0 auto;min-width:68px;border:1px solid var(--b);background:var(--c);border-radius:12px;padding:8px 6px;text-align:center;cursor:pointer;scroll-snap-align:start;font:inherit;color:inherit}
.g small{display:block;font-size:12px;color:var(--m);text-transform:capitalize}.g b{display:block;font-size:22px;line-height:1.1}.g.on{background:var(--acc);border-color:var(--acc);color:#fff}.g.on small{color:#fff}
.ore{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.o{border:1px solid var(--b);background:var(--c);border-radius:10px;padding:12px 4px;font:inherit;font-weight:500;cursor:pointer;color:inherit}.o.on{background:var(--acc);border-color:var(--acc);color:#fff}
.f{display:block;margin:10px 0}.f span{display:block;font-size:13px;color:var(--m);margin-bottom:3px}.f input,.f select,.f textarea{width:100%;min-height:46px;border:1px solid var(--b);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;background:var(--c);color:inherit}
.due{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{display:block;width:100%;text-align:center;border:0;border-radius:12px;padding:15px;font:inherit;font-weight:500;font-size:16px;cursor:pointer;text-decoration:none;margin-top:10px}
.btn.p{background:var(--acc);color:#fff}.btn.g2{background:var(--c);color:var(--t);border:1px solid var(--b)}.btn[disabled]{opacity:.5}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px;margin-top:14px}.scelta{font-weight:500}.err{color:#b42318;font-size:14px;margin-top:8px}
</style></head><body><div class="w">
<div id="logo"></div><div class="k" id="kicker">&nbsp;</div><h1 id="titolo">Prenotate la vostra visita</h1>
<p class="m" id="sotto">Scegliete il giorno e l’orario che preferite: vi aspettiamo per farvi vedere tutto di persona.</p>
<div id="fl"><h2>1 · Il giorno</h2><div class="giorni" id="giorni"><span class="m">Carico i giorni liberi…</span></div>
<div id="bOre" class="hide"><h2>2 · L’orario</h2><div class="ore" id="ore"></div></div>
<div id="bDati" class="hide"><h2>3 · I vostri dati</h2><div class="card"><div class="scelta" id="scelta"></div></div>
<label class="f"><span>Nomi</span><input id="nome" autocomplete="name" placeholder="Es. Giulia e Marco"></label>
<div class="due"><label class="f"><span>Telefono (WhatsApp)</span><input id="tel" type="tel" autocomplete="tel"></label><label class="f"><span>Email</span><input id="mail" type="email" autocomplete="email"></label></div>
<div class="due"><label class="f"><span>Per quale evento?</span><select id="tipo"><option>Matrimonio</option><option>Comunione</option><option>Cresima</option><option>Battesimo</option><option>Compleanno</option><option>18 anni</option><option>Laurea</option><option>Cena aziendale</option><option>Altro</option></select></label>
<label class="f"><span>Invitati (circa)</span><input id="inv" type="number" min="1" inputmode="numeric"></label></div>
<label class="f"><span>Data dell’evento (anche indicativa)</span><input id="dev" placeholder="Es. giugno 2027"></label>
<label class="f"><span>Note</span><textarea id="note" rows="2" placeholder="Qualcosa che volete dirci prima della visita"></textarea></label>
<div class="err hide" id="err"></div><button class="btn p" id="prenota">Prenota la visita</button></div></div>
<div id="ok" class="hide"></div>
<p class="m" id="waTxt" style="margin-top:22px"></p></div>
<script>
(function(){var $=function(i){return document.getElementById(i)},qs=new URLSearchParams(location.search),P=qs.get("p")||"",API="https://cuhcscpvhypoaplcmtjk.supabase.co/functions/v1/visite-prenota",G=null,O=null,M={},WA="";
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function api(b){b.p=P;return fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(function(r){return r.json()})}
function dt(g){return new Date(g+"T12:00:00")}
function cap(s){s=String(s||"");return s.charAt(0).toUpperCase()+s.slice(1)}
function lungo(g){return cap(dt(g).toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"}))}
if(qs.get("tipo")){var t=qs.get("tipo");[].forEach.call($("tipo").options,function(o){if(o.text.toLowerCase()===t.toLowerCase())o.selected=true})}
if(!P){$("giorni").innerHTML='<span class="err">Link incompleto.</span>';return}
api({azione:"config"}).then(function(c){
 if(!c.success){$("fl").innerHTML='<div class="card">Le visite online non sono ancora attive.'+(c.whatsapp?' <a href="https://wa.me/'+c.whatsapp+'">Scriveteci su WhatsApp</a>.':'')+'</div>';return}
 M=c.marchio||{};document.documentElement.style.setProperty("--acc",M.colore||"#6e2434");$("kicker").textContent=M.nome||"";$("titolo").textContent=c.titolo||"Prenotate la vostra visita";document.title=$("titolo").textContent+" · "+(M.nome||"");
 if(M.logo)$("logo").innerHTML='<img src="'+esc(M.logo)+'" alt="" style="max-height:52px;max-width:170px;display:block;margin-bottom:8px">';
 WA=M.whatsapp?"https://wa.me/"+M.whatsapp:"";if(WA)$("waTxt").innerHTML='Nessun orario va bene? <a href="'+WA+'" style="color:var(--acc)">Scriveteci su WhatsApp</a> e lo troviamo insieme.';
 if(M.pixel&&!window.fbq){!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version="2.0";n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,"script","https://connect.facebook.net/en_US/fbevents.js");fbq("init",M.pixel);fbq("track","PageView")}
 if(!c.giorni.length){$("giorni").innerHTML='<span class="m">In questo periodo non ci sono orari liberi.</span>';return}
 $("giorni").innerHTML=c.giorni.map(function(g){var d=dt(g);return '<button class="g" data-g="'+g+'"><small>'+d.toLocaleDateString("it-IT",{weekday:"short"})+'</small><b>'+d.getDate()+'</b><small>'+d.toLocaleDateString("it-IT",{month:"short"})+'</small></button>'}).join("")
}).catch(function(){$("giorni").innerHTML='<span class="err">Non riesco a caricare il calendario: riprovate.</span>'});
$("giorni").onclick=function(e){var b=e.target.closest(".g");if(!b)return;[].forEach.call(document.querySelectorAll(".g"),function(x){x.classList.toggle("on",x===b)});G=b.dataset.g;O=null;$("bDati").classList.add("hide");$("bOre").classList.remove("hide");$("ore").innerHTML='<span class="m">…</span>';
 api({azione:"slot",data:G}).then(function(r){$("ore").innerHTML=(r.orari||[]).length?r.orari.map(function(h){return '<button class="o" data-h="'+h+'">'+h+'</button>'}).join(""):'<span class="m">Questo giorno è appena stato preso: sceglietene un altro.</span>';$("bOre").scrollIntoView({behavior:"smooth",block:"start"})})};
$("ore").onclick=function(e){var b=e.target.closest(".o");if(!b)return;[].forEach.call(document.querySelectorAll(".o"),function(x){x.classList.toggle("on",x===b)});O=b.dataset.h;$("scelta").textContent=lungo(G)+" alle "+O;$("bDati").classList.remove("hide");$("bDati").scrollIntoView({behavior:"smooth",block:"start"})};
function ics(g,h){var p=function(n){return(n<10?"0":"")+n},s=new Date(g+"T"+h+":00"),e=new Date(s.getTime()+45*60000),f=function(d){return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"T"+p(d.getHours())+p(d.getMinutes())+"00"};
 return "data:text/calendar;charset=utf-8,"+encodeURIComponent("BEGIN:VCALENDAR\r\nVERSION:2.0\r\nBEGIN:VEVENT\r\nDTSTART:"+f(s)+"\r\nDTEND:"+f(e)+"\r\nSUMMARY:Visita a "+(M.nome||"")+"\r\nEND:VEVENT\r\nEND:VCALENDAR")}
$("prenota").onclick=function(){var n=$("nome").value.trim(),t=$("tel").value.trim(),m=$("mail").value.trim();
 if(!n||(!t&&!/^\S+@\S+\.\S+$/.test(m))){$("err").textContent="Scriveteci i nomi e almeno un telefono o un’email.";$("err").classList.remove("hide");return}
 $("err").classList.add("hide");this.disabled=true;this.textContent="Prenoto…";var me=this;
 api({azione:"prenota",data:G,ora:O,nome:n,telefono:t,email:m,tipo_evento:$("tipo").value,invitati:$("inv").value,data_evento:$("dev").value,note:$("note").value,origine:(qs.get("utm_source")||"")+(qs.get("utm_campaign")?" / "+qs.get("utm_campaign"):"")})
 .then(function(r){if(!r.success){me.disabled=false;me.textContent="Prenota la visita";$("err").textContent=r.error==="occupato"?"Questo orario è appena stato preso: sceglietene un altro.":"Non è andata: riprovate o scriveteci su WhatsApp.";$("err").classList.remove("hide");if(r.error==="occupato")$("giorni").querySelector(".g.on").click();return}
  if(window.fbq)fbq("track","Schedule");$("fl").classList.add("hide");$("ok").classList.remove("hide");
  $("ok").innerHTML='<div class="card"><div class="k">Visita confermata</div><h1 style="font-size:30px">'+esc(cap(r.quando))+'</h1>'+(r.luogo?'<p>📍 '+esc(r.luogo)+'</p>':'')+(m?'<p class="m">Vi abbiamo mandato la conferma per email, con il link per annullare se avete un imprevisto.</p>':'')+'<a class="btn p" href="'+ics(G,O)+'" download="visita.ics">Aggiungi al calendario</a>'+(r.luogo?'<a class="btn g2" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(r.luogo)+'" target="_blank" rel="noopener">Come arrivare</a>':'')+'</div>';window.scrollTo(0,0)})
 .catch(function(){me.disabled=false;me.textContent="Prenota la visita";$("err").textContent="Connessione assente: riprovate.";$("err").classList.remove("hide")})};
})();
</script></body></html>
